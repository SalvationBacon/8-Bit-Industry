// A belt fed only from one side (nothing feeding it from behind) curves.
// 0 = straight; 1 = fed by a belt turning clockwise into it; 3 = anticlockwise. Visual only.
function beltTurn(m){
  const feeds=d=>{
    const x=m.x-D_VEC[d][0], y=m.y-D_VEC[d][1];
    if(x<0||y<0||x>=MAP_W||y>=MAP_H)return false;
    const id=G.map[y][x].mid; if(id===null)return false;
    const n=G.machines[id];
    return !!n&&n.dir===d&&(n.type==='belt'||n.type==='splitter'||n.type==='tunnel');
  };
  if(feeds(m.dir))return 0;
  const a=feeds((m.dir+1)%4), b=feeds((m.dir+3)%4);
  return a===b?0:a?1:3;
}

// Draw the items on one belt-like tile. Moving items interpolate smoothly and may run past the edge into
// the next tile (the simulation hands them over with the leftover move). Items that cannot move on stop
// just short of the edge and queue a quarter tile apart (even spacing across tiles) instead of piling onto one spot.
// mode: 'belt' full tile · 'enter' tunnel mouth (sinks at the centre) · 'exit' rises from the centre
function beltCanTake(tx,ty,dir){
  const[dx,dy]=D_VEC[dir], t=G.map[ty+dy]?.[tx+dx]; if(!t||t.mid===null)return false;
  const nm=G.machines[t.mid]; if(!nm)return false;
  if(nm.type==='chest')return true;
  return (nm.type==='belt'||nm.type==='splitter'||nm.type==='tunnel')&&t.items.length<4;
}
function drawBeltItems(tile,dir,tx,ty,turn,ts,cx,cy,spd,sub,mode){
  const flow=mode==='enter'||beltCanTake(tx,ty,dir);
  const items=[...tile.items].sort((a,b)=>b.prog-a.prog);
  let lim=flow?1+spd:.875;
  const[dx,dy]=D_VEC[dir], mx=tx*ts-cx+ts/2, my=ty*ts-cy+ts/2, sz=ts*.42;
  for(const it of items){
    let p=Math.max(flow?0:.125,Math.min(it.prog+spd*sub,lim));
    if(!flow)lim=p-.25;                  // queued items sit a quarter tile apart, evenly across tile edges
    if(mode==='enter'&&p>=.5)continue;   // gone underground
    if(mode==='exit')p=.5+p*.5;          // surfaces at the centre
    let ox,oy;
    if(p<=1)[ox,oy]=beltItemPos(dir,turn,p);
    else{[ox,oy]=beltItemPos(dir,turn,1);ox+=dx*(p-1);oy+=dy*(p-1);}
    drawItem(ctx,it.id,mx+ox*ts,my+oy*ts,sz);
  }
}

// Port layout per machine type:
// Output side per machine type, inserters may NOT deposit into the output side
const PORTS = {
  miner:           { outputs:[{side:'right',pos:.5}] },
  stone_furnace:   { outputs:[{side:'right',pos:.5}] },
  blast_furnace:   { outputs:[{side:'right',pos:.5}] },
  electric_smelter:{ outputs:[{side:'right',pos:.5}] },
  assembler:       { outputs:[{side:'right',pos:.5}] },
  lab:             { outputs:[{side:'right',pos:.5}] },
  oil_pump:        { outputs:[{side:'right',pos:.5}] },
  cracker:         { outputs:[{side:'right',pos:.5}] },
  refinery:        { outputs:[{side:'right',pos:.5}] },
  evaporator:      { outputs:[{side:'right',pos:.5}] },
  separator:       { outputs:[{side:'right',pos:.5}] },
  rod_press:       { outputs:[{side:'right',pos:.5}] },
  generator:       { outputs:[] },
  burner:          { outputs:[] },
  chest:           { outputs:[{side:'bottom',pos:.5}] },
};

function drawPorts(ctx, type, px, py, pw, ph, ts, dir){
  const layout=PORTS[type]; if(!layout)return;
  const SIDES=['top','right','bottom','left'], DIR_OF={right:0,bottom:1,left:2,top:3};
  const sz=Math.floor(Math.max(8,Math.min(16,ts*.3)));
  for(const p of layout.outputs){
    const side=SIDES[(SIDES.indexOf(p.side)+(dir||0))%4], d=DIR_OF[side], [nx,ny]=D_VEC[d];
    const ex=side==='left'?px:side==='right'?px+pw:px+pw*p.pos;
    const ey=side==='top'?py:side==='bottom'?py+ph:py+ph*p.pos;
    // pixel arrow just inside the output edge, pointing out
    ctx.drawImage(arrowSpr(d,'#f5a623'),Math.floor(ex-nx*sz/2-sz/2),Math.floor(ey-ny*sz/2-sz/2),sz,sz);
  }
}

function draw(){
  if(!ctx||!G)return;
  const W=canvas.width/CANVAS_DPR,H=canvas.height/CANVAS_DPR;
  ctx.setTransform(CANVAS_DPR,0,0,CANVAS_DPR,0,0);
  const {x:cx,y:cy,zoom:z}=G.cam;
  const ts=TILE*z;
  const now=performance.now();
  const at=now/TICK_MS; // smooth animation clock in tick units (game ticks only step 4×/s)
  ctx.imageSmoothingEnabled=false; // pixel sprites stay crisp (resizing the canvas resets this)
  ctx.fillStyle='#090909';
  ctx.fillRect(0,0,W,H);

  const x0=Math.max(0,Math.floor(cx/ts));
  const y0=Math.max(0,Math.floor(cy/ts));
  const x1=Math.min(MAP_W,Math.ceil((cx+W)/ts));
  const y1=Math.min(MAP_H,Math.ceil((cy+H)/ts));

  // Ground: cached chunks, then animated pools on top
  const cs=CHUNK*ts, af=Math.floor(at/3), tss=Math.ceil(ts)+1;
  for(let cy2=Math.floor(y0/CHUNK);cy2*CHUNK<y1;cy2++) for(let cx2=Math.floor(x0/CHUNK);cx2*CHUNK<x1;cx2++){
    const ch=groundChunk(cx2,cy2);
    const ax=Math.floor(cx2*cs-cx), ay=Math.floor(cy2*cs-cy);
    ctx.drawImage(ch.cv,ax,ay,Math.floor((cx2+1)*cs-cx)-ax+1,Math.floor((cy2+1)*cs-cy)-ay+1);
    for(let k=0;k<ch.anim.length;k+=2){
      const tx=ch.anim[k], ty=ch.anim[k+1]; if(tx<x0||tx>=x1||ty<y0||ty>=y1)continue;
      ctx.drawImage(resSpr(G.map[ty][tx].res,(tx*7+ty*13)&3,af),Math.floor(tx*ts-cx),Math.floor(ty*ts-cy),tss,tss);
    }
  }
  const beltQ=[];
  for(let ty=y0;ty<y1;ty++) for(let tx=x0;tx<x1;tx++){
    const px=tx*ts-cx, py=ty*ts-cy;
    const tile=G.map[ty][tx];

    // MineTap active tile highlight, show tap progress as pips
    if(mineTap.active&&mineTap.tx===tx&&mineTap.ty===ty&&ts>8){
      ctx.fillStyle='rgba(245,166,35,.18)'; ctx.fillRect(px,py,ts,ts);
      ctx.strokeStyle='#f5a623'; ctx.lineWidth=2; ctx.strokeRect(px,py,ts,ts);
      // Draw pip dots (4 total, fill taps completed)
      const pipR=Math.max(3,ts*.07); const pipGap=pipR*2.8;
      const totalW=(MINE_TAPS-1)*pipGap; const pipY=py+ts-pipR*2.2;
      for(let i=0;i<MINE_TAPS;i++){
        const pipX=px+ts/2-totalW/2+i*pipGap;
        ctx.fillStyle=i<mineTap.taps?'#f5a623':'rgba(245,166,35,.25)';
        ctx.fillRect(Math.floor(pipX-pipR),Math.floor(pipY-pipR),Math.ceil(pipR*2),Math.ceil(pipR*2));
      }
    }
    // Demolish hover
    if(activeTool==='demolish'&&tile.mid!==null&&hov.x===tx&&hov.y===ty){
      ctx.fillStyle='rgba(229,57,53,.25)'; ctx.fillRect(px,py,ts,ts);
      ctx.strokeStyle='#e53935'; ctx.lineWidth=2; ctx.strokeRect(px,py,ts,ts);
    }

    // Belt tile
    if(tile.mid!==null){
      const m=G.machines[tile.mid];
      if(m&&m.type==='belt'){
        const[dvx,dvy]=D_VEC[m.dir];
        const AMBER='#f5a623';
        const BELT_BG='#252525';
        const RW=Math.max(1.5,ts*.05);
        const inset=RW/2+0.5;
        let turn=0;

        if(TEX_PIXEL){
          // Tread scrolls at the real belt speed
          const bs=(G.research.done.includes('logistics')?.15:.1)*perkMult().belt;
          const fr=Math.floor(at*bs*16)&3;
          turn=beltTurn(m);
          ctx.save(); ctx.translate(px+ts/2,py+ts/2); ctx.rotate(m.dir*Math.PI/2);
          ctx.drawImage(turn?beltCornerSpr(fr,turn):beltSpr(fr),-ts/2,-ts/2,ts+.5,ts+.5); ctx.restore();
        } else {
        // Full dark surface
        ctx.fillStyle=BELT_BG; ctx.fillRect(px,py,ts,ts);
        }

        if(!TEX_PIXEL&&ts>10){
          ctx.save();
          ctx.beginPath(); ctx.rect(px,py,ts,ts); ctx.clip();

          // Direction chevrons
          if(ts>14){
            ctx.strokeStyle='rgba(55,55,55,0.9)'; ctx.lineWidth=Math.max(1,ts*.03);
            const sp=ts*.28;
            for(let ci=0;ci<5;ci++){
              const t2=ci*sp-(sp*0.5);
              const bx=px+ts/2+dvx*t2, by=py+ts/2+dvy*t2;
              const ex2=dvy, hw=ts*.22, wing=ts*.08;
              ctx.beginPath();
              ctx.moveTo(bx+ex2*hw-dvx*wing, by+(-dvx)*hw-dvy*wing);
              ctx.lineTo(bx+dvx*wing*1.5,    by+dvy*wing*1.5);
              ctx.lineTo(bx-ex2*hw-dvx*wing, by-(-dvx)*hw-dvy*wing);
              ctx.stroke();
            }
          }

          // Two subtle edge lines (no amber rails)
          ctx.strokeStyle='rgba(70,70,70,0.8)'; ctx.lineWidth=1; ctx.lineCap='square';
          if(dvx!==0){
            ctx.beginPath();ctx.moveTo(px,py+inset);ctx.lineTo(px+ts,py+inset);ctx.stroke();
            ctx.beginPath();ctx.moveTo(px,py+ts-inset);ctx.lineTo(px+ts,py+ts-inset);ctx.stroke();
          } else {
            ctx.beginPath();ctx.moveTo(px+inset,py);ctx.lineTo(px+inset,py+ts);ctx.stroke();
            ctx.beginPath();ctx.moveTo(px+ts-inset,py);ctx.lineTo(px+ts-inset,py+ts);ctx.stroke();
          }
          ctx.restore();
        }

        if(tile.items.length)beltQ.push([tile,m,tx,ty,turn]);
      }
    }
  }
  // Belt items: drawn after every belt tile so none are clipped at an edge or covered by the next belt
  const bSpd=(G.research.done.includes('logistics')?.15:.1)*perkMult().belt;
  const bSub=Math.min(1,(now-lastTickMs)/tickInterval());
  for(const[tile,m,tx,ty,turn]of beltQ)drawBeltItems(tile,m.dir,tx,ty,turn,ts,cx,cy,bSpd,bSub,'belt');

  // Multi-tile machines
  const drawn=new Set();
  for(const[id,m]of Object.entries(G.machines)){
    if(m.type==='belt'||m.type==='inserter'||m.type==='long_inserter'||m.type==='splitter'||m.type==='tunnel'||m.type==='pipe')continue;
    if(drawn.has(+id))continue; drawn.add(+id);
    const def=MDEFS[m.type];
    const[mw,mh]=machSize(m);
    const px=m.x*ts-cx, py=m.y*ts-cy;
    const pw=mw*ts, ph=mh*ts;
    if(px+pw<0||py+ph<0||px>W||py>H)continue;
    const col=MACH_COL[m.type]||'#666';
    const busy=m.active&&m.recipe&&m.prog>0;
    // Power buildings have their own "running" state, fuelled and active
    const isPowering=(m.type==='generator'||m.type==='burner')&&m.active&&(m.inBuf.coal||0)>0;
    const isStub=def.stub;

    const sprM=TEX_PIXEL&&machineSpr(m.type,Math.floor(now/140),machineWorking(m));
    if(sprM){
      drawMachSpr(ctx,sprM,m.type,m.dir,px,py,pw,ph);
    } else {
    ctx.fillStyle='#141414'; ctx.fillRect(px,py,pw,ph);
    ctx.strokeStyle=busy||isPowering?col:isStub?'#3a2a4a':'#252525';
    ctx.lineWidth=busy||isPowering?2:1; ctx.strokeRect(px+1,py+1,pw-2,ph-2);
    ctx.fillStyle='#0c0c0c'; ctx.fillRect(px+4,py+4,pw-8,ph-8);
    }

    if(busy&&!sprM){
      ctx.fillStyle=col; ctx.globalAlpha=.07+.05*Math.sin(at*.22);
      ctx.fillRect(px+1,py+1,pw-2,ph-2); ctx.globalAlpha=1;
    }
    // Pulsing amber glow for powered generators/burners
    if(isPowering){
      ctx.fillStyle='#ffd600'; ctx.globalAlpha=.06+.04*Math.sin(at*.3);
      ctx.fillRect(px+1,py+1,pw-2,ph-2); ctx.globalAlpha=1;
      // Green pulsing "running" indicator
      if(ts>14){
        ctx.fillStyle='#4caf50'; ctx.globalAlpha=0.8+0.2*Math.sin(at*.4);
        ctx.fillRect(Math.floor(px+pw-12),Math.floor(py+ph-12),8,8);
        ctx.globalAlpha=1;
      }
    }
    // No-fuel indicator for burners/generators, red dot + dim overlay
    const isPowerBldg=(m.type==='generator'||m.type==='burner');
    if(isPowerBldg&&!isPowering&&m.active){
      ctx.fillStyle='rgba(229,57,53,0.08)'; ctx.fillRect(px+1,py+1,pw-2,ph-2);
      if(ts>14){
        // Blinking red dot, no fuel
        const blink=Math.floor(at/4)%2===0;
        ctx.fillStyle=blink?'#e53935':'#8b0000';
        ctx.fillRect(Math.floor(px+pw-12),Math.floor(py+ph-12),8,8);
        // "No fuel" label at high zoom
        if(ts>28){
          ctx.fillStyle='#e53935'; ctx.globalAlpha=0.9;
          ctx.font=`${Math.max(6,Math.floor(ts*.1))}px 'Press Start 2P', monospace`;
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('NO COAL',Math.round(px+pw/2),Math.round(py+ph*.8));
          ctx.globalAlpha=1;
        }
      }
    }
    if(isPowerBldg&&!m.active){
      ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(px+1,py+1,pw-2,ph-2);
    }
    if(isStub){
      ctx.fillStyle='#ab47bc'; ctx.globalAlpha=.04; ctx.fillRect(px+1,py+1,pw-2,ph-2); ctx.globalAlpha=1;
    }

    if(sprM){
      // Current recipe output in a small corner badge
      const rec=m.recipe&&(m.type==='assembler'||m.type==='lab'||m.type==='electric_smelter')&&ts>20?RECIPES[m.recipe]:null;
      if(rec){const bs=Math.max(10,ts*.42);ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(px+3,py+ph-bs-12,bs,bs);drawItem(ctx,Object.keys(rec.out)[0],px+3+bs/2,py+ph-12-bs/2,bs*.85);}
    } else if(ts>10){
      const fs=Math.floor(Math.min(pw,ph)*.35);
      ctx.font=`${fs}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      // For assembler with recipe: push main icon up, recipe icon down
      const hasRecipe=m.recipe&&(m.type==='assembler'||m.type==='lab')&&ts>24;
      const oy=hasRecipe?-ph*.2:(ph>ts*.9?-5*z:0);
      ctx.fillText(def.icon,px+pw/2,py+ph/2+oy);
      // Recipe output icon stacked below main icon
      if(hasRecipe){
        const rec=RECIPES[m.recipe];
        const outIcon=rec?ITEMS[Object.keys(rec.out)[0]]?.icon:null;
        if(outIcon){
          ctx.font=`${Math.floor(Math.min(pw,ph)*.22)}px serif`;
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(outIcon,px+pw/2,py+ph*.7);
        }
      }
    }
    if(m.recipe&&m.active&&ph>ts*.85){
      const rec=RECIPES[m.recipe];
      const pct=rec?Math.min(1,m.prog/(m._dur||rec.time)):0;
      ctx.save();
      ctx.beginPath(); ctx.rect(px+4,py+ph-12,pw-8,7); ctx.clip();
      ctx.fillStyle='#0a0a0a'; ctx.fillRect(px+4,py+ph-12,pw-8,7);
      ctx.fillStyle=col; ctx.globalAlpha=.9; ctx.fillRect(px+4,py+ph-12,(pw-8)*pct,7); ctx.globalAlpha=1;
      ctx.restore();
    }
    // No-recipe warning dot
    if(m.active&&def.recipes.length>0&&!m.recipe){
      ctx.fillStyle='#f5a623'; ctx.fillRect(Math.floor(px+pw-12),Math.floor(py+4),8,8);
    }
    // Output buffer fill indicator
    if(ts>20){
      const bufTotal=Object.values(m.outBuf).reduce((a,b)=>a+b,0);
      if(bufTotal>0){
        const full=bufTotal>=50;
        ctx.fillStyle=full?'#e53935':'#f5a623';
        ctx.globalAlpha=full?1:.8;
        ctx.fillRect(px+4,py+4,Math.min(pw-8,(pw-8)*bufTotal/50),4);
        ctx.globalAlpha=1;
      }
    }
    // Chest: show fill level with bar + count
    if(m.type==='chest'){
      const total=Object.values(m.chestInv).reduce((a,b)=>a+b,0);
      const CAP=200;
      const pct=Math.min(1,total/CAP);
      if(ts>14){
        // Background track
        ctx.fillStyle='#111'; ctx.fillRect(px+4,py+ph-11,pw-8,6);
        // Fill bar, green→amber→red
        const barCol=pct>.8?'#e53935':pct>.5?'#f5a623':'#26c6a0';
        ctx.fillStyle=barCol; ctx.globalAlpha=.9;
        ctx.fillRect(px+4,py+ph-11,Math.max(0,(pw-8)*pct),6);
        ctx.globalAlpha=1;
        // Item count at high zoom
        if(ts>26&&total>0){
          ctx.fillStyle=pct>.8?'#ff8a80':'#ccc';
          ctx.font=`${Math.max(6,Math.floor(ts*.12))}px 'Press Start 2P', monospace`;
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(`${total}/${CAP}`,Math.round(px+pw/2),Math.round(py+ph-14));
        }
      }
    }
    // Fluid storage level / accumulator charge, bar along the bottom
    if(ts>14&&(def.fluidCap||m.type==='accumulator')){
      const pct=m.type==='accumulator'?(m.charge||0)/ACC_CAP:(m._net?pressureOf(m._net)/100:0);
      const barCol=m.type==='accumulator'?'#ffd600':(m.strain>0?'#e53935':FLUID_COL[m.fluid?.type]||'#555');
      ctx.fillStyle='#111'; ctx.fillRect(px+4,py+ph-9,pw-8,5);
      ctx.fillStyle=barCol; ctx.fillRect(px+4,py+ph-9,(pw-8)*pct,5);
    }
    // Fluid machines starved of pressure, blue blinking dot
    if(def.fluidPort&&m.active&&(m._fluidStatus==='lowpressure'||m._fluidStatus==='nopipe')&&ts>14){
      ctx.fillStyle=Math.floor(at/4)%2?'#42a5f5':'#0d3b4a';
      ctx.fillRect(Math.floor(px+pw-12),Math.floor(py+ph-20),8,8);
    }
    // Living machines: vitality bar + stage badge; withered = grey
    if(def.living){
      const st=lifeStage(m);
      if(m.withered){ctx.fillStyle='rgba(60,60,60,.6)';ctx.fillRect(px+1,py+1,pw-2,ph-2);}
      else{ctx.fillStyle='#4caf50';ctx.globalAlpha=.05+.04*Math.sin(at*.15+m.id);ctx.fillRect(px+1,py+1,pw-2,ph-2);ctx.globalAlpha=1;}
      if(ts>14){
        const v=(m.vit||0)/100;
        // Vitality bar sits under the output-buffer strip; recipe progress keeps the bottom edge
        ctx.fillStyle='#111'; ctx.fillRect(px+4,py+10,pw-8,4);
        ctx.fillStyle=v<.25?'#e53935':v>.8?'#f48fb1':'#4caf50'; ctx.fillRect(px+4,py+10,(pw-8)*v,4);
        if(TEX_PIXEL)ctx.drawImage(stageSpr(st.name),px+4,py+16,Math.max(8,ts*.28),Math.max(8,ts*.28));
        else{ctx.font=`${Math.max(8,Math.floor(ts*.24))}px serif`; ctx.textAlign='left'; ctx.textBaseline='top';
        ctx.fillText(st.icon,px+4,py+16);}
      }
    }
    // Singularity: construction ring, then spinning arcs that tighten with sustain
    if(m.type==='singularity'&&ts>4){
      const cxs=pw/2, cys=ph/2, R=Math.min(pw,ph)*.42;
      const built=Object.entries(SING_REQS).reduce((a,[id,n])=>a+Math.min(n,(m.built||{})[id]||0),0)/Object.values(SING_REQS).reduce((a,b)=>a+b,0);
      pixelFx(ctx,px,py,pw,ph,ts,c=>{
        c.lineWidth=ts*.14;
        c.strokeStyle='#2a1a3a'; c.beginPath(); c.arc(cxs,cys,R,0,Math.PI*2); c.stroke();
        c.strokeStyle='#ab47bc'; c.beginPath(); c.arc(cxs,cys,R,-Math.PI/2,-Math.PI/2+Math.PI*2*built); c.stroke();
        if(m.complete){
          const sp=(m.sustain||0)/SING_SUSTAIN, rot=now/400*(1+sp*4);
          for(let k=0;k<3;k++){
            c.strokeStyle=`rgba(179,136,255,${.4+.5*sp})`; c.lineWidth=ts*.08;
            c.beginPath(); c.arc(cxs,cys,R*(.75-k*.2)*(1-sp*.3),rot+k*2.1,rot+k*2.1+Math.PI*.9); c.stroke();
          }
        }
      });
    }
    // Reactor heat bar + SCRAM flash
    if(m.type==='reactor'&&ts>14){
      const h=(m.heat||0)/100;
      ctx.fillStyle='#111'; ctx.fillRect(px+4,py+ph-9,pw-8,5);
      ctx.fillStyle=h>.8?'#e53935':h>.5?'#f5a623':'#26c6a0'; ctx.fillRect(px+4,py+ph-9,(pw-8)*h,5);
      if(m.scram>0){ctx.fillStyle=`rgba(229,57,53,${Math.floor(at/2)%2?.25:.08})`;ctx.fillRect(px+1,py+1,pw-2,ph-2);}
      else if((m.inBuf.lum_rod||0)>0){ctx.fillStyle='#c6ff00';ctx.globalAlpha=.05+.04*Math.sin(at*.3);ctx.fillRect(px+1,py+1,pw-2,ph-2);ctx.globalAlpha=1;}
    }
    // Lumen panels go dark during the dim glow tide
    if(m.type==='lumen_panel'){
      if(glowBright()){ctx.fillStyle='#fff59d';ctx.globalAlpha=.06+.04*Math.sin(at*.2);ctx.fillRect(px+1,py+1,pw-2,ph-2);ctx.globalAlpha=1;}
      else{ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(px+1,py+1,pw-2,ph-2);}
    }
    // Tier badge (T2 = amber, T3 = teal), top-left corner
    if((m.tier||1)>1&&ts>16){
      const u=Math.max(1,Math.round(ts/24)); // whole pixels per badge pixel
      ctx.drawImage(tierSpr(m.tier||1),Math.floor(px+2),Math.floor(py+2),9*u,7*u);
    }
    // Module icons, bottom-right corner, one per installed module
    if(ts>16&&m.modules&&m.modules.length>0){
      const iconSz=Math.max(8,Math.floor(ts*.24));
      m.modules.filter(Boolean).forEach((mod,mi)=>drawItem(ctx,mod,px+pw-2-iconSz/2,py+ph-2-iconSz/2-mi*(iconSz+1),iconSz));
    }
    // Input / output port arrows (only at reasonable zoom)
    if(ts>28) drawPorts(ctx,m.type,px,py,pw,ph,ts,m.dir);
  }

  // Inserters + Long Inserters, drawn as animated arm
  for(const[id,m]of Object.entries(G.machines)){
    if(m.type!=='inserter'&&m.type!=='long_inserter')continue;
    const px=m.x*ts-cx, py=m.y*ts-cy;
    if(px+ts<0||py+ts<0||px>W||py>H)continue;
    const isLong=m.type==='long_inserter';
    const sc=ts/16;
    ctx.save(); ctx.translate(px+ts/2,py+ts/2); ctx.rotate(m.dir*Math.PI/2);
    ctx.drawImage(insBaseSpr(isLong),-ts/2,-ts/2,ts+.5,ts+.5); ctx.restore();

    // Arm, state machine driven
    const[dvx,dvy]=D_VEC[m.dir];
    const destAngle=Math.atan2(dvy,dvx);
    const srcAngle=destAngle+Math.PI;
    const arm=m._arm||(m._arm={state:'idle',stateStart:now,item:null});
    if(arm.stateStart>now)arm.stateStart=now;
    const elapsed=now-arm.stateStart;
    const insEase=t=>t<0.5?2*t*t:(1-Math.pow(-2*t+2,2)/2);
    let curAngle=srcAngle;
    if(arm.state==='grabbing')curAngle=srcAngle+(destAngle-srcAngle)*insEase(Math.min(1,elapsed/insMs(INS_GRAB_MS)));
    else if(arm.state==='depositing'||arm.state==='waiting')curAngle=destAngle;
    else if(arm.state==='returning')curAngle=destAngle+(srcAngle-destAngle)*insEase(Math.min(1,elapsed/insMs(INS_RETURN_MS)));
    const bcx=px+ts/2, bcy=py+ts/2;
    drawInsArm(ctx,isLong,arm.state==='waiting'?2:arm.item?1:0,bcx,bcy,curAngle,sc);
    if(arm.item&&ts>18){
      const reach=(INS_ARM_LEN[m.type]-.5)*sc;
      drawItem(ctx,arm.item,bcx+Math.cos(curAngle)*reach,bcy+Math.sin(curAngle)*reach,ts*.3);
    }
  }

  // Splitters, 1×2, draws a Y-split lane sprite
  function splitterArrow(ctx2,ex,ey,sx,sy,hl){
    const ang=Math.atan2(ey-sy,ex-sx);
    ctx2.beginPath();
    ctx2.moveTo(ex,ey);
    ctx2.lineTo(ex-Math.cos(ang-0.4)*hl,ey-Math.sin(ang-0.4)*hl);
    ctx2.lineTo(ex-Math.cos(ang+0.4)*hl,ey-Math.sin(ang+0.4)*hl);
    ctx2.closePath(); ctx2.fillStyle=MACH_COL.splitter; ctx2.fill();
  }
  for(const[id,m]of Object.entries(G.machines)){
    if(m.type!=='splitter')continue;
    const[mw,mh]=machSize(m);
    const px=m.x*ts-cx, py=m.y*ts-cy;
    const pw=mw*ts, ph=mh*ts;
    if(px+pw<0||py+ph<0||px>W||py>H)continue;
    // Pixel sprite drawn for flow to the right (two tiles stacked), turned to the splitter's direction
    ctx.save(); ctx.translate(px+pw/2,py+ph/2); ctx.rotate(m.dir*Math.PI/2);
    ctx.drawImage(machineSpr('splitter',Math.floor(at/2)&3,true),-ts/2,-ts,ts+.5,ts*2+.5); ctx.restore();
  }

  // Pipes, auto-connect to neighbouring pipes and fluid machines, core tinted by fluid
  for(const m of Object.values(G.machines)){
    if(m.type!=='pipe')continue;
    const px=m.x*ts-cx, py=m.y*ts-cy;
    if(px+ts<0||py+ts<0||px>W||py>H)continue;
    const p=m._net?pressureOf(m._net)/100:0;
    let mask=0;
    D_VEC.forEach(([dx,dy],i)=>{
      const t=G.map[m.y+dy]?.[m.x+dx]; if(!t||t.mid===null)return;
      const nd=MDEFS[G.machines[t.mid]?.type]; if(nd&&(nd.fluidCap||nd.fluidPort))mask|=1<<i;
    });
    const X=Math.floor(px), Y=Math.floor(py), S2=Math.ceil(ts)+1;
    ctx.drawImage(pipeShellSpr(mask,m.strain>0&&Math.floor(at/2)%2),X,Y,S2,S2);
    ctx.globalAlpha=.25+.75*p; ctx.drawImage(pipeCoreSpr(mask,FLUID_COL[m.fluid?.type]||'#555'),X,Y,S2,S2); ctx.globalAlpha=1;
  }
  // Pipe burst flashes
  for(let i=burstFx.length-1;i>=0;i--){
    const b=burstFx[i]; const age=(now-b.t)/700;
    if(age>1){burstFx.splice(i,1);continue;}
    const rr=ts*(.3+age*1.2), bx=b.x*ts-cx+ts/2, by=b.y*ts-cy+ts/2;
    pixelFx(ctx,bx-rr-2,by-rr-2,rr*2+4,rr*2+4,ts,c=>{c.beginPath();c.arc(rr+2,rr+2,rr,0,Math.PI*2);
      c.fillStyle=`rgba(127,219,255,${(1-age)*.5})`;c.fill();c.strokeStyle=`rgba(229,57,53,${1-age})`;c.lineWidth=ts*.08;c.stroke();});
  }

  // Belt tunnels
  for(const[id,m]of Object.entries(G.machines)){
    if(m.type!=='tunnel')continue;
    const px=m.x*ts-cx, py=m.y*ts-cy;
    if(px+ts<0||py+ts<0||px>W||py>H)continue;
    const linked=m.tunnelId!==null&&!!G.machines[m.tunnelId];
    // Pixel portal: swirls while linked, dim and still while waiting for its partner
    if(!linked)ctx.globalAlpha=.55;
    ctx.drawImage(machineSpr('tunnel',linked?Math.floor(at/2)&3:0,linked),Math.floor(px),Math.floor(py),Math.ceil(ts)+1,Math.ceil(ts)+1);
    ctx.globalAlpha=1;
    if(ts>14){
      const as=Math.floor(ts*.34);
      ctx.drawImage(arrowSpr(m.dir,linked?MACH_COL.tunnel:'#666'),Math.floor(px+ts/2-as/2),Math.floor(py+ts/2-as/2),as,as);
    }
  }

  // Items on splitter cells and at tunnel mouths, drawn over their sprites
  for(let ty=y0;ty<y1;ty++) for(let tx=x0;tx<x1;tx++){
    const tile=G.map[ty][tx]; if(!tile.items.length||tile.mid===null)continue;
    const m=G.machines[tile.mid]; if(!m)continue;
    if(m.type==='splitter')drawBeltItems(tile,m.dir,tx,ty,0,ts,cx,cy,bSpd,bSub,'belt');
    else if(m.type==='tunnel'){
      const p=m.tunnelId!==null&&G.machines[m.tunnelId];
      const isExit=p&&((p.x-m.x)*D_VEC[m.dir][0]+(p.y-m.y)*D_VEC[m.dir][1])<0;
      drawBeltItems(tile,m.dir,tx,ty,0,ts,cx,cy,bSpd,bSub,isExit?'exit':'enter');
    }
  }

  // Placement preview
  if(activeTool==='move'&&moveState.active&&hov.x>=0){
    const m=G.machines[moveState.machineId];
    if(m){
      const def=MDEFS[m.type]; const[mw,mh]=machSize(m);
      const px=hov.x*ts-cx, py=hov.y*ts-cy;
      const ok=canPlace(m.type,hov.x,hov.y,m.dir);
      ctx.fillStyle=ok?'rgba(245,166,35,.14)':'rgba(229,57,53,.14)';
      ctx.fillRect(px,py,mw*ts,mh*ts);
      ctx.strokeStyle=ok?'#f5a623':'#e53935';
      ctx.lineWidth=2; ctx.setLineDash([4,4]); ctx.strokeRect(px,py,mw*ts,mh*ts); ctx.setLineDash([]);
      if(ts>10){
        ctx.font=`${Math.floor(Math.min(mw,mh)*ts*.35)}px serif`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.globalAlpha=.5; drawGhostIcon(def,px,py,mw*ts,mh*ts,m.dir); ctx.globalAlpha=1;
      }
    }
  } else if(activeTool!=='select'&&activeTool!=='demolish'&&activeTool!=='move'&&hov.x>=0){
    const def=MDEFS[activeTool];
    if(def){
      const[mw,mh]=machSize(activeTool,placeDir);
      const px=hov.x*ts-cx, py=hov.y*ts-cy;
      const ok=canPlace(activeTool,hov.x,hov.y);
      ctx.fillStyle=ok?'rgba(245,166,35,.14)':'rgba(229,57,53,.14)';
      ctx.fillRect(px,py,mw*ts,mh*ts);
      ctx.globalAlpha=.55; drawGhostIcon(def,px,py,mw*ts,mh*ts,placeDir); ctx.globalAlpha=1;
      ctx.strokeStyle=ok?'#f5a623':'#e53935';
      ctx.lineWidth=2; ctx.strokeRect(px,py,mw*ts,mh*ts);
      // Output port indicators on ghost
      if(ts>20) drawPorts(ctx,activeTool,px,py,mw*ts,mh*ts,ts,placeDir);
      // Direction arrow for directional machines
      const dirMachines=['belt','inserter','tunnel','splitter'];
      if(dirMachines.includes(activeTool)&&ts>12){
        const as=Math.floor(ts*.5);
        ctx.drawImage(arrowSpr(placeDir,ok?'#f5a623':'#e53935'),Math.floor(px+mw*ts/2-as/2),Math.floor(py+mh*ts/2-as/2),as,as);
      }
    }
  }

  // Multi-select selection box
  if(activeTool==='multisel'){
    const ms=multiselState;
    if(ms.mode==='selecting'&&hov.x>=0){
      const px1=Math.min(ms.x1,hov.x)*ts-cx, py1=Math.min(ms.y1,hov.y)*ts-cy;
      const pw=(Math.abs(hov.x-ms.x1)+1)*ts, ph=(Math.abs(hov.y-ms.y1)+1)*ts;
      ctx.fillStyle='rgba(66,165,245,.1)'; ctx.fillRect(px1,py1,pw,ph);
      ctx.strokeStyle='#42a5f5'; ctx.lineWidth=2; ctx.setLineDash([4,4]); ctx.strokeRect(px1,py1,pw,ph); ctx.setLineDash([]);
    } else if(ms.mode==='selected'||ms.mode==='moving'||ms.mode==='pasting'){
      // Highlight selected machines
      for(const id of ms.ids){
        const m=G.machines[id]; if(!m)continue;
        const[mw,mh]=machSize(m);
        const px=m.x*ts-cx, py=m.y*ts-cy;
        ctx.fillStyle='rgba(66,165,245,.15)'; ctx.fillRect(px,py,mw*ts,mh*ts);
        ctx.strokeStyle='#42a5f5'; ctx.lineWidth=2; ctx.setLineDash([3,3]); ctx.strokeRect(px,py,mw*ts,mh*ts); ctx.setLineDash([]);
      }
      // Ghost preview for move destination
      if(ms.mode==='moving'&&hov.x>=0){
        const dx=hov.x-ms.anchorX, dy=hov.y-ms.anchorY;
        for(const id of ms.ids){
          const m=G.machines[id]; if(!m)continue;
          const def=MDEFS[m.type]; const[mw,mh]=machSize(m);
          const px=(m.x+dx)*ts-cx, py=(m.y+dy)*ts-cy;
          ctx.fillStyle='rgba(38,198,160,.12)'; ctx.fillRect(px,py,mw*ts,mh*ts);
          ctx.strokeStyle='#26c6a0'; ctx.lineWidth=1.5; ctx.setLineDash([4,4]); ctx.strokeRect(px,py,mw*ts,mh*ts); ctx.setLineDash([]);
          if(ts>12){
            ctx.font=`${Math.floor(Math.min(mw,mh)*ts*.35)}px serif`;
            ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.globalAlpha=.4; drawGhostIcon(def,px,py,mw*ts,mh*ts,m.dir); ctx.globalAlpha=1;
          }
        }
      }
      // Ghost preview for paste destination
      if(ms.mode==='pasting'&&ms.clipboard.length){
        const gx=ms.pasteAnchor?ms.pasteAnchor.x:hov.x;
        const gy=ms.pasteAnchor?ms.pasteAnchor.y:hov.y;
        if(gx>=0&&gy>=0) for(const e of ms.clipboard){
          const def=MDEFS[e.type]; if(!def)continue;
          const[mw,mh]=machSize(e.type,e.dir);
          const px=(gx+e.rx)*ts-cx, py=(gy+e.ry)*ts-cy;
          const ok=canPlace(e.type,gx+e.rx,gy+e.ry,e.dir||0);
          ctx.fillStyle=ok?'rgba(245,166,35,.12)':'rgba(229,57,53,.12)'; ctx.fillRect(px,py,mw*ts,mh*ts);
          ctx.strokeStyle=ok?'#f5a623':'#e53935'; ctx.lineWidth=1.5; ctx.setLineDash([4,4]); ctx.strokeRect(px,py,mw*ts,mh*ts); ctx.setLineDash([]);
          if(ts>12)drawGhostEntry(e,def,px,py,mw*ts,mh*ts,ts);
        }
      }
    }
  }
  if(activeTool==='blueprint'){
    const bp=blueprintState;
    if(bp.mode==='selecting'){
      const px1=Math.min(bp.x1,hov.x)*ts-cx, py1=Math.min(bp.y1,hov.y)*ts-cy;
      const pw=(Math.abs(hov.x-bp.x1)+1)*ts, ph=(Math.abs(hov.y-bp.y1)+1)*ts;
      ctx.fillStyle='rgba(38,198,160,.1)'; ctx.fillRect(px1,py1,pw,ph);
      ctx.strokeStyle='#26c6a0'; ctx.lineWidth=2; ctx.setLineDash([4,4]); ctx.strokeRect(px1,py1,pw,ph); ctx.setLineDash([]);
    } else if(bp.mode==='holding'&&hov.x>=0){
      for(const e of bp.data){
        const def=MDEFS[e.type]; if(!def)continue;
        const[mw,mh]=machSize(e.type,e.dir);
        const px=( hov.x+e.rx)*ts-cx, py=(hov.y+e.ry)*ts-cy;
        ctx.fillStyle='rgba(38,198,160,.12)'; ctx.fillRect(px,py,mw*ts,mh*ts);
        ctx.strokeStyle='#26c6a0'; ctx.lineWidth=1; ctx.setLineDash([3,3]); ctx.strokeRect(px,py,mw*ts,mh*ts); ctx.setLineDash([]);
        if(ts>14)drawGhostEntry(e,def,px,py,mw*ts,mh*ts,ts);
      }
    }
  }

  // Tap ripples
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i]; const age=(now-r.t)/380;
    if(age>1){ripples.splice(i,1);continue;}
    const rr=Math.max(1,age*30), u=Math.max(2,Math.round(ts/16)); // square pixel ripple
    ctx.strokeStyle=`rgba(245,166,35,${(1-age)*.8})`; ctx.lineWidth=u; ctx.strokeRect(Math.round(r.px-rr),Math.round(r.py-rr),Math.round(rr*2),Math.round(rr*2));
  }

  // Big Bang white-out
  if(bigBangAt&&now-bigBangAt<2500){
    ctx.fillStyle=`rgba(255,255,255,${1-(now-bigBangAt)/2500})`; ctx.fillRect(0,0,W,H);
  }
  // Smog overlay, Zone 2 only, scales with G.smog 0-100
  if(G&&zoneHas('smog')&&(G.smog||0)>0){
    const smogAlpha=Math.min(0.55,(G.smog/100)*0.55);
    ctx.fillStyle=`rgba(40,30,0,${smogAlpha})`;
    ctx.fillRect(0,0,W,H);
    // Smog particles for visual texture at high levels
    if(G.smog>30&&ts>8){
      const seed=Math.floor(now/800);
      const rng2=(s=>()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;})(seed);
      const count=Math.floor(G.smog/10);
      ctx.fillStyle='rgba(80,60,0,0.12)';
      for(let i=0;i<count;i++){
        const bx=rng2()*W, by=rng2()*H;
        const br=4+rng2()*12;
        ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill();
      }
    }
  }
}

const ripples=[];

// ═══════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════
let activeTool='select';
let placeDir=D_RIGHT;
const LOGISTICS_TOOLS=new Set(['belt','inserter','tunnel','splitter','chest']);
let hov={x:-1,y:-1};
let drag={on:false,sx:0,sy:0,cx:0,cy:0,moved:false};
let pinch={on:false,d:0,mx:0,my:0,vel:0,lastT:0};
let touchT=0;
// mineTap: 4 taps = 1 ore. Active while resInfo mine popup is open.
let mineTap={active:false,resId:null,tx:0,ty:0,taps:0};
const MINE_TAPS=4; // taps per ore
let moveState={active:false,machineId:null,origX:0,origY:0};
// Blueprint tool state
let blueprintState={mode:'idle',x1:0,y1:0,x2:0,y2:0,data:[]};
let multiselState={mode:'idle',x1:0,y1:0,x2:0,y2:0,ids:[],clipboard:[]};

function wrapRect(){return document.getElementById('wrap').getBoundingClientRect()}
function scrToTile(sx,sy){const ts=TILE*G.cam.zoom;return{x:Math.floor((sx+G.cam.x)/ts),y:Math.floor((sy+G.cam.y)/ts)}}

function zoomAt(sx,sy,f){
  const oz=G.cam.zoom; G.cam.zoom=Math.max(.25,Math.min(4,oz*f));
  const wx=(sx+G.cam.x)/oz, wy=(sy+G.cam.y)/oz;
  G.cam.x=wx*G.cam.zoom-sx; G.cam.y=wy*G.cam.zoom-sy; clampCam();
}
function clampCam(){
  const ts=TILE*G.cam.zoom;
  const mx=MAP_W*ts-canvas.clientWidth, my=MAP_H*ts-canvas.clientHeight;
  G.cam.x=Math.max(0,Math.min(mx||0,G.cam.x));
  G.cam.y=Math.max(0,Math.min(my||0,G.cam.y));
}

let inputReady=false;
function setupInput(){
  if(inputReady)return; // startGame runs on every new game / load; listeners must attach once
  inputReady=true;
  const el=document.getElementById('wrap');
  let lastTouch=0;
  const isTouch=()=>Date.now()-lastTouch<500;

  el.addEventListener('mousedown', e=>{if(!isTouch())onDown(e.clientX,e.clientY);});
  el.addEventListener('mousemove', e=>{if(!isTouch())onMov(e.clientX,e.clientY);});
  el.addEventListener('mouseup',   e=>{if(!isTouch())onUp(e.clientX,e.clientY);});
  el.addEventListener('wheel',     e=>{e.preventDefault();const r=wrapRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY>0?.88:1.14);},{passive:false});
  el.addEventListener('touchstart',e=>{e.preventDefault();lastTouch=Date.now();onTouchStart(e);},{passive:false});
  el.addEventListener('touchmove', e=>{e.preventDefault();lastTouch=Date.now();onTouchMove(e); },{passive:false});
  el.addEventListener('touchend',  e=>{e.preventDefault();lastTouch=Date.now();onTouchEnd(e);  },{passive:false});
  document.addEventListener('contextmenu',e=>e.preventDefault());
}

function onDown(cx,cy){
  drag={on:true,sx:cx,sy:cy,cx:G.cam.x,cy:G.cam.y,moved:false};
  closeResInfo();
}
function onMov(cx,cy){
  const r=wrapRect(); hov=scrToTile(cx-r.left,cy-r.top);
  if(!drag.on)return;
  const dx=cx-drag.sx,dy=cy-drag.sy;
  if(Math.abs(dx)>8||Math.abs(dy)>8){drag.moved=true;}
  G.cam.x=drag.cx-dx; G.cam.y=drag.cy-dy; clampCam();
}
function onUp(cx,cy){
  if(!drag.on)return; drag.on=false;
  if(!drag.moved){const r=wrapRect();handleTap(scrToTile(cx-r.left,cy-r.top),false);}
}

function tdist(t){const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy)}
function onTouchStart(e){
  touchT=Date.now();
  if(e.touches.length===1){
    const t=e.touches[0];
    drag={on:true,sx:t.clientX,sy:t.clientY,cx:G.cam.x,cy:G.cam.y,moved:false};
    pinch.on=false;
  }
  else if(e.touches.length===2){drag.on=false;pinch={on:true,d:tdist(e.touches)};}
}
function onTouchMove(e){
  if(e.touches.length===1&&drag.on){
    const t=e.touches[0]; const dx=t.clientX-drag.sx,dy=t.clientY-drag.sy;
    if(Math.abs(dx)>8||Math.abs(dy)>8){drag.moved=true;}
    G.cam.x=drag.cx-dx; G.cam.y=drag.cy-dy; clampCam();
    const r=wrapRect(); hov=scrToTile(t.clientX-r.left,t.clientY-r.top);
  } else if(e.touches.length===2&&pinch.on){
    const nd=tdist(e.touches); const r=wrapRect();
    const mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;
    const my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
    const now2=performance.now();
    const dt=now2-pinch.lastT; const ratio=nd/pinch.d;
    pinch.vel=dt>0?(ratio-1)/dt*1000:0; // zoom rate per second
    pinch.mx=mx; pinch.my=my; pinch.lastT=now2;
    zoomAt(mx,my,ratio); pinch.d=nd; drag.moved=true;
  }
}
function onTouchEnd(e){
  // Pinch momentum, ease out zoom velocity
  if(pinch.on&&Math.abs(pinch.vel)>0.08){
    let vel=pinch.vel;
    const mx=pinch.mx, my=pinch.my;
    const decay=()=>{
      if(Math.abs(vel)<0.004)return;
      zoomAt(mx,my,1+vel*0.016);
      vel*=0.82;
      requestAnimationFrame(decay);
    };
    requestAnimationFrame(decay);
  }
  if(e.changedTouches.length===1&&!drag.moved){
    const t=e.changedTouches[0]; const r=wrapRect();
    handleTap(scrToTile(t.clientX-r.left,t.clientY-r.top),Date.now()-touchT>400);
  }
  drag.on=false; pinch.on=false;
}

// ═══════════════════════════════════════════════════
//  TAP HANDLER
// ═══════════════════════════════════════════════════
function handleTap(tile,isLong){
  const{x,y}=tile;
  if(x<0||y<0||x>=MAP_W||y>=MAP_H)return;
  const t=G.map[y][x];
  hov={x,y}; // touch taps never fire mousemove, so the build ghost must follow the tap itself

  if(activeTool==='demolish'){
    if(t.mid!==null)tryRemove(x,y);
    return;
  }
  // Long press inspects (it used to demolish, far too easy to trigger by accident on a phone)
  if(isLong&&t.mid!==null&&activeTool==='select'){selectMachineById(t.mid);return;}
  // No activeTool==='mine', mining is now triggered via resInfo popup button
  if(activeTool==='rotate'){
    if(t.mid!==null){
      const m=G.machines[t.mid];
      if(m){
        rotateM(m.id);
        sfx('place');
        if(openPanel==='machine'&&inspectId===m.id)renderMachPanel();
      }
    } else {
      toast('Tap a machine to rotate it','wrn');
    }
    return;
  }
  if(activeTool==='select'){
    if(t.mid!==null){openMachinePanel(G.machines[t.mid]);return;}
    if(t.type===T_RESOURCE){openResInfo(t.res,x,y);return;}
    return;
  }
  if(activeTool==='move'){
    if(!moveState.active){
      // First tap, pick up machine
      if(t.mid===null){toast('Tap a machine to pick it up','wrn');return;}
      const m=G.machines[t.mid];
      if(!m)return;
      // Store original position for restore on cancel
      moveState={active:true,machineId:m.id,origX:m.x,origY:m.y};
      // Clear its map tiles so canPlace works correctly on destination
      const def=MDEFS[m.type]; const[mw,mh]=machSize(m);
      for(let dy=0;dy<mh;dy++)for(let dx=0;dx<mw;dx++)
        G.map[m.y+dy][m.x+dx].mid=null;
      toast(`${def.name} picked up. Tap to place`,'ok'); sfx('place');
      if(openPanel==='machine')closePanel('machine');
    } else {
      // Second tap, place at new location
      const m=G.machines[moveState.machineId];
      if(!m){moveState={active:false,machineId:null,origX:0,origY:0};return;}
      const def=MDEFS[m.type];
      const[mw,mh]=machSize(m);

      if(!canPlace(m.type,x,y,m.dir)){
        // Can't place here, keep machine held, let player try another spot
        toast('Cannot place here','bad'); sfx('error'); return;
      }

      // Place at new location
      undoRec({op:'pos',list:[{id:m.id,x:moveState.origX,y:moveState.origY,dir:m.dir}]});
      m.x=x; m.y=y;
      refreshMineRes(m);
      for(let dy=0;dy<mh;dy++)for(let dx=0;dx<mw;dx++)
        G.map[y+dy][x+dx].mid=m.id;
      moveState={active:false,machineId:null,origX:0,origY:0};
      saveGame(); sfx('place');
      toast(`${def.name} moved`,'ok');
    }
    return;
  }
  if(activeTool==='multisel'){
    const ms=multiselState;
    if(ms.mode==='idle'){
      ms.x1=x; ms.y1=y; ms.x2=x; ms.y2=y; ms.mode='selecting';
      toast('Tap second corner to select area','ok');
    } else if(ms.mode==='selecting'){
      ms.x2=x; ms.y2=y;
      const minX=Math.min(ms.x1,ms.x2),maxX=Math.max(ms.x1,ms.x2);
      const minY=Math.min(ms.y1,ms.y2),maxY=Math.max(ms.y1,ms.y2);
      const ids=new Set();
      for(let ty=minY;ty<=maxY;ty++) for(let tx=minX;tx<=maxX;tx++){
        const mid=G.map[ty][tx].mid;
        if(mid!==null) ids.add(mid);
      }
      ms.ids=[...ids]; ms.mode='selected';
      if(!ms.ids.length){toast('No machines in selection','wrn');ms.mode='idle';return;}
      toast(`${ms.ids.length} machine${ms.ids.length>1?'s':''} selected`,'ok');
      const bar=document.getElementById('multiselBar');
      const cnt=document.getElementById('multiselCount');
      if(bar){bar.classList.remove('hidden');}
      if(cnt){cnt.textContent=ms.ids.length+' machine'+(ms.ids.length>1?'s':'')+' selected';}
    } else if(ms.mode==='moving'){
      const dx=x-ms.anchorX, dy=y-ms.anchorY;
      if(dx===0&&dy===0){ms.mode='selected';return;}
      const movingSet=new Set(ms.ids);
      const canMove=ms.ids.every(id=>{
        const m=G.machines[id]; if(!m)return true;
        const[mw,mh]=machSize(m);
        for(let ty2=0;ty2<mh;ty2++) for(let tx2=0;tx2<mw;tx2++){
          const nx=m.x+dx+tx2, ny=m.y+dy+ty2;
          if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H)return false;
          const occ=G.map[ny][nx].mid;
          if(occ!==null&&!movingSet.has(occ))return false;
          if(!terrainOk(m.type,G.map[ny][nx]))return false;
        }
        return true;
      });
      if(!canMove){toast('Cannot place here: tiles occupied','bad');sfx('error');return;}
      undoRec({op:'pos',list:ms.ids.map(id=>G.machines[id]).filter(Boolean).map(posSnap)});
      // Clear old tiles first
      for(const id of ms.ids){
        const m=G.machines[id]; if(!m)continue;
        const[mw,mh]=machSize(m);
        for(let ty2=0;ty2<mh;ty2++) for(let tx2=0;tx2<mw;tx2++)
          G.map[m.y+ty2][m.x+tx2].mid=null;
      }
      // Place at new position
      for(const id of ms.ids){
        const m=G.machines[id]; if(!m)continue;
        m.x+=dx; m.y+=dy;
        refreshMineRes(m);
        const[mw,mh]=machSize(m);
        for(let ty2=0;ty2<mh;ty2++) for(let tx2=0;tx2<mw;tx2++)
          G.map[m.y+ty2][m.x+tx2].mid=m.id;
      }
      ms.mode='selected';
      const btn=document.getElementById('multiselMoveBtn');
      if(btn){btn.style.background='transparent';btn.textContent='✥ MOVE';}
      saveGame(); sfx('place');
      toast(`Moved ${ms.ids.length} machine${ms.ids.length>1?'s':''}`, 'ok');
    } else if(ms.mode==='pasting'){
      // Tap locks the paste anchor to this tile position
      ms.pasteAnchor={x,y};
      toast('Position set. Hit ✓ PLACE to confirm','ok');
    }
    return;
  }
  if(activeTool==='blueprint'){
    const bp=blueprintState;
    if(bp.mode==='idle'){
      // First tap, set selection start
      bp.x1=x; bp.y1=y; bp.x2=x; bp.y2=y; bp.mode='selecting';
      toast('Tap second corner to capture area','ok');
    } else if(bp.mode==='selecting'){
      // Second tap, capture region then prompt to save
      bp.x2=x; bp.y2=y;
      const minX=Math.min(bp.x1,bp.x2), maxX=Math.max(bp.x1,bp.x2);
      const minY=Math.min(bp.y1,bp.y2), maxY=Math.max(bp.y1,bp.y2);
      const captured=[];
      const seen=new Set();
      for(let ty=minY;ty<=maxY;ty++) for(let tx=minX;tx<=maxX;tx++){
        const mid=G.map[ty][tx].mid;
        if(mid===null||seen.has(mid))continue;
        seen.add(mid);
        const m=G.machines[mid];
        captured.push({type:m.type,rx:m.x-minX,ry:m.y-minY,dir:m.dir,recipe:m.recipe,tier:m.tier||1});
      }
      if(!captured.length){toast('No machines in selection','wrn');bp.mode='idle';return;}
      bp.data=captured; bp.mode='idle';
      // Show save dialog with cost summary
      const defaultName=`Blueprint ${(G.blueprints||[]).length+1}`;
      showModal('💾 SAVE BLUEPRINT',
        `<div style="font-size:var(--f6);color:var(--text2);margin-bottom:8px">${captured.length} machine${captured.length!==1?'s':''} captured.</div>
         <input id="bpNameInput" type="text" value="${defaultName}" maxlength="24" style="width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:var(--font);font-size:var(--f6);padding:8px;margin-bottom:10px">
         <div style="font-size:var(--f5);color:var(--text3);line-height:1.9">Material cost per paste:<br><span style="color:var(--amber)">${blueprintCostStr(captured)}</span></div>`,
        `<button class="btn btn-teal btn-sm" onclick="saveBlueprintFromModal()">SAVE</button>
         <button class="btn btn-sm" onclick="closeModal();blueprintState.data=[]">DISCARD</button>`
      );
      setTimeout(()=>{const i=document.getElementById('bpNameInput');if(i){i.focus();i.select();}},100);
    } else if(bp.mode==='holding'){
      // Tap just repositions the ghost, confirm button does the actual place
      // (ghost already follows hov in draw(), so nothing needed here)
    }
    return;
  }
  // Tapping a bare resource tile with any non-building tool opens mine popup
  const noMachineTools=['select','demolish','rotate','move','multisel','blueprint'];
  if(t.type===T_RESOURCE&&t.mid===null&&noMachineTools.includes(activeTool)){
    openResInfo(t.res,x,y); return;
  }
  // Tapping an occupied tile while in build mode opens the machine panel instead of trying to place
  const def=MDEFS[activeTool];
  if(t.mid!==null&&def&&!noMachineTools.includes(activeTool)){
    openMachinePanel(G.machines[t.mid]); return;
  }
  // In build mode, tapping empty canvas just repositions the ghost (draw() follows hov)
  // Placement requires the ✓ PLACE button in buildHUD
  if(def&&!noMachineTools.includes(activeTool)) return;
  // No other action for unrecognised tool/tile combo
}

// ═══════════════════════════════════════════════════
//  PLACEMENT
// ═══════════════════════════════════════════════════
// Returns effective [w,h] for a machine given its direction.
// Splitter base size is [1,2]. For D_DOWN/D_UP the flow is vertical so
// the two cells stack horizontally → swap to [2,1].
function machSize(typeOrM, dir){
  const type = typeof typeOrM==='string' ? typeOrM : typeOrM.type;
  const d = dir !== undefined ? dir : (typeof typeOrM==='object' ? (typeOrM.dir||0) : 0);
  const[mw,mh]=MDEFS[type].size;
  // Every non-square machine (Splitter, Scrubber) lies on its side when facing down or up
  if(mw!==mh&&(d===D_DOWN||d===D_UP)) return [mh,mw];
  return [mw,mh];
}

// Machines that may sit on resource tiles (logistics only)
const ON_RESOURCE_OK=new Set(['belt','inserter','long_inserter','chest','splitter','tunnel','pipe']);

// Refuse a pipe/tank that would join networks holding different fluids
function fluidsWouldMix(type,tx,ty,d){
  if(!MDEFS[type].fluidCap)return false;
  const[w,h]=machSize(type,d);
  const types=new Set();
  for(const nb of machineNeighbors({type,x:tx,y:ty,dir:d}))
    if(MDEFS[nb.type].fluidCap&&nb._net?.type)types.add(nb._net.type);
  if(types.size>1){if(!fluidsWouldMix._warned){fluidsWouldMix._warned=true;toast('Fluids would mix','wrn');setTimeout(()=>fluidsWouldMix._warned=false,2000);}return true;}
  return false;
}

// Terrain rule for one tile of a machine (occupancy checked separately)
function terrainOk(type,tile){
  if(type==='miner')return tile.type===T_RESOURCE&&!FLUID_RES[tile.res];
  if(type==='oil_pump')return tile.res==='oil';
  if(MDEFS[type].pumps)return tile.res===MDEFS[type].pumps;
  return ON_RESOURCE_OK.has(type)||tile.type!==T_RESOURCE;
}
// After a machine lands on new tiles, re-read what it extracts
function refreshMineRes(m){
  const d=MDEFS[m.type], r=G.map[m.y][m.x].res;
  if(m.type==='miner')m.mineRes=r&&!FLUID_RES[r]?r:null;
  else if(m.type==='oil_pump')m.mineRes=r==='oil'?'oil':null;
  else if(d.pumps)m.mineRes=r===d.pumps?d.pumps:null;
}
// Link a tunnel to the nearest free tunnel facing the same way, ahead or behind, within 5 tiles.
// Returns the distance linked, or 0. (Placing the exit before the entrance used to never link.)
function linkTunnel(m){
  if(m.type!=='tunnel'||m.tunnelId!==null)return 0;
  const[dvx,dvy]=D_VEC[m.dir];
  for(let dist=1;dist<=5;dist++)for(const sgn of[1,-1]){
    const lx=m.x+dvx*dist*sgn, ly=m.y+dvy*dist*sgn;
    if(lx<0||ly<0||lx>=MAP_W||ly>=MAP_H)continue;
    const mid=G.map[ly][lx].mid; if(mid===null)continue;
    const lm=G.machines[mid];
    if(lm&&lm.id!==m.id&&lm.type==='tunnel'&&lm.tunnelId===null&&lm.dir===m.dir){m.tunnelId=lm.id;lm.tunnelId=m.id;return dist;}
  }
  return 0;
}
function unlinkTunnel(m){
  if(m.type!=='tunnel'||m.tunnelId===null)return;
  const partner=G.machines[m.tunnelId]; if(partner)partner.tunnelId=null;
  m.tunnelId=null;
}
// ═══ UNDO ═══
// Build actions record how to reverse themselves. One entry can hold several ops
// (multi-select demolish, move, rotate, paste). Ops:
//   place  {id,src,tier}  undone by demolishing; the refund goes back where the cost came from
//   remove {snap}    undone by rebuilding (pays machineWorth again; contents stay in inventory)
//   pos    {list}    undone by putting machines back where and how they faced
// The stack lives outside G: it is per session and clears on load and zone change.
const UNDO_MAX=30;
let undoStack=[], undoGroup=null, undoBusy=false;
function undoRec(op){if(undoBusy)return; if(undoGroup)undoGroup.push(op); else pushUndo([op]);}
function undoBegin(){if(!undoBusy)undoGroup=[];}
function undoEnd(){const g=undoGroup;undoGroup=null;if(g&&g.length)pushUndo(g);}
function pushUndo(ops){undoStack.push(ops);if(undoStack.length>UNDO_MAX)undoStack.shift();updateUndoBtn();}
function clearUndo(){undoStack=[];undoGroup=null;updateUndoBtn();}
function posSnap(m){return{id:m.id,x:m.x,y:m.y,dir:m.dir};}
// Undo lives in the EDIT tab; its card shows how many steps are left
function updateUndoBtn(){if(activeTab==='tools')buildDrawer();}
// Put machines at recorded positions/directions, all or nothing
function relocate(list){
  const ms=list.map(e=>G.machines[e.id]).filter(Boolean);
  const before=ms.map(posSnap);
  const clear=()=>{for(const m of ms){const[w,h]=machSize(m);for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++)G.map[m.y+dy][m.x+dx].mid=null;}};
  const claim=()=>{for(const m of ms){const[w,h]=machSize(m);for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++)G.map[m.y+dy][m.x+dx].mid=m.id;}};
  clear();
  for(const m of ms){const e=list.find(q=>q.id===m.id); m.x=e.x; m.y=e.y; m.dir=e.dir;}
  const fits=ms.every(m=>{
    const[w,h]=machSize(m);
    for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++){
      const x=m.x+dx,y=m.y+dy;
      if(x<0||y<0||x>=MAP_W||y>=MAP_H||G.map[y][x].mid!==null||!terrainOk(m.type,G.map[y][x]))return false;
    }
    return true;
  });
  if(!fits){for(const m of ms){const b=before.find(q=>q.id===m.id);m.x=b.x;m.y=b.y;m.dir=b.dir;}claim();return false;}
  claim();
  for(const m of ms){refreshMineRes(m);unlinkTunnel(m);}
  for(const m of ms)linkTunnel(m);
  return true;
}
function undoLast(){
  const ops=undoStack[undoStack.length-1];
  if(!ops){toast('Nothing to undo','wrn');return;}
  // Rebuilds must fit and be affordable before anything changes
  const rebuilds=ops.filter(o=>o.op==='remove');
  if(rebuilds.length){
    if(!rebuilds.every(o=>canPlace(o.snap.type,o.snap.x,o.snap.y,o.snap.dir))){toast('Cannot undo: something is built there now','bad');sfx('error');return;}
    if(!G.devFreeBuild){
      const need={};
      for(const o of rebuilds)addCost(need,machineWorth(o.snap.type,o.snap.tier,o.snap.modules));
      const miss=Object.entries(need).find(([k,n])=>(G.inv[k]||0)<n);
      if(miss){toast(`Cannot undo: need ${miss[1]}× ${ITEMS[miss[0]]?.name||miss[0]}`,'bad');sfx('error');return;}
    }
  }
  undoBusy=true;
  try{
    for(let i=ops.length-1;i>=0;i--){
      const o=ops[i];
      if(o.op==='pos'){
        if(!relocate(o.list)){toast('Cannot undo: the old spot is taken','bad');sfx('error');return;}
      } else if(o.op==='place'){
        const m=G.machines[o.id]; if(!m)continue;
        const type=m.type; tryRemove(m.x,m.y,true);
        if(o.src!=='inv'){ // it was never paid for in materials: take back what demolish refunded for it
          for(const[k,n]of Object.entries(machineWorth(type,o.tier)))G.inv[k]=Math.max(0,(G.inv[k]||0)-n);
          if(o.src==='crafted')G.crafted[type]=(G.crafted[type]||0)+1;
        }
      } else if(o.op==='remove'){
        const sn=o.snap;
        if(!G.devFreeBuild)for(const[k,n]of Object.entries(machineWorth(sn.type,sn.tier,sn.modules)))G.inv[k]-=n;
        const m=stampMachine(sn,sn.x,sn.y);
        if(m){m.modules=[...(sn.modules||[])]; G.stats.placed--;}
      }
    }
  } finally {undoBusy=false;}
  undoStack.pop(); updateUndoBtn();
  updateHUD(); saveGame(); sfx('remove');
  G.stats.undos=(G.stats.undos||0)+1;
  toast('↶ Undone','ok');
}

// Can a copied layout (blueprint / clipboard) be stamped with its origin at x,y?
function stampFits(data,x,y){
  return data.every(e=>MDEFS[e.type]&&canPlace(e.type,x+e.rx,y+e.ry,e.dir));
}
// Create one machine from a layout entry: tiles, extraction, tunnels, stats
function stampMachine(e,x,y){
  const def=MDEFS[e.type]; if(!def||def.stub)return null;
  const m=mkMachine(e.type,x,y,e.dir);
  if(e.recipe!==undefined)m.recipe=e.recipe;
  m.tier=e.tier||1;
  G.machines[m.id]=m;
  const[mw,mh]=machSize(m);
  for(let dy=0;dy<mh;dy++)for(let dx=0;dx<mw;dx++)G.map[y+dy][x+dx].mid=m.id;
  refreshMineRes(m); linkTunnel(m);
  G.stats.placed++;
  undoRec({op:'place',id:m.id,src:G.devFreeBuild?'free':'inv',tier:m.tier});
  return m;
}

function canPlace(type,tx,ty,dir){
  if(!MDEFS[type])return false;
  const d=(dir!==undefined)?dir:placeDir;
  const[mw,mh]=machSize(type,d);
  for(let dy=0;dy<mh;dy++)for(let dx=0;dx<mw;dx++){
    const nx=tx+dx,ny=ty+dy;
    if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H)return false;
    if(G.map[ny][nx].mid!==null)return false;
    if(!terrainOk(type,G.map[ny][nx]))return false;
  }
  return !fluidsWouldMix(type,tx,ty,d);
}

function tryPlace(type,tx,ty){
  const def=MDEFS[type]; if(!def)return;
  if(def.stub){toast(`[FUTURE] ${def.name} is not active yet`,'wrn');hudSelect();return;}
  if(def.unlock&&!G.research.done.includes(def.unlock)){
    toast(`Requires: ${TECHS[def.unlock]?.name||def.unlock}`,'wrn'); sfx('error'); hudSelect(); return;
  }
  if(!canPlace(type,tx,ty)){toast('Cannot place here','bad'); sfx('error'); hudSelect(); return;}

  // Power warning, confirm if this machine will exceed available power
  if(def.power>0&&!G.devFreeBuild){
    const pwrFree=G.power.out-G.power.in;
    if(def.power>pwrFree&&G.power.out>0){
      const free=Math.max(0,Math.round(pwrFree));
      showModal('⚡ POWER WARNING',
        `<div style="font-size:var(--f7);color:var(--amber);margin-bottom:10px">Not enough power!</div>
         <div style="font-size:var(--f6);color:var(--text2);line-height:2.2">
           ${def.name} needs <span style="color:var(--amber)">${def.power}kW</span><br>
           Available: <span style="color:${free>0?'var(--green)':'var(--red)'}">${free}kW free</span><br>
           <span style="color:var(--text3)">Machines will slow or stop until you add more power.</span>
         </div>`,
        `<button class="btn btn-sm" onclick="closeModal();completePlacement('${type}',${tx},${ty})">PLACE ANYWAY</button>
         <button class="btn btn-sm btn-red" onclick="closeModal()">CANCEL</button>`
      );
      return; // defer, completePlacement will finish if confirmed
    }
  }

  // Check crafted pool first, then materials (skip cost if dev free build)
  const crafted=(G.crafted[type]||0)>0;
  if(G.devFreeBuild){
    // free placement, no cost deducted
  } else if(crafted){
    G.crafted[type]--;
  } else {
    for(const[item,need]of Object.entries(def.cost)){
      if((G.inv[item]||0)<need){toast(`Need ${need}× ${ITEMS[item]?.name||item}`,'wrn'); sfx('error'); flashDrawerItem(); hudSelect(); return;}
    }
    for(const[item,need]of Object.entries(def.cost)) G.inv[item]-=need;
  }

  const m=mkMachine(type,tx,ty,placeDir);
  undoRec({op:'place',id:m.id,src:G.devFreeBuild?'free':crafted?'crafted':'inv'});
  if(type==='miner')m.mineRes=G.map[ty][tx].res;
  if(type==='oil_pump')m.mineRes='oil';
  if(def.pumps)m.mineRes=def.pumps;
  G.machines[m.id]=m;

  const[mw,mh]=machSize(m);
  for(let dy=0;dy<mh;dy++)for(let dx=0;dx<mw;dx++)
    G.map[ty+dy][tx+dx].mid=m.id;
  const tl=linkTunnel(m); if(tl)toast(`Tunnel linked! (${tl} tiles)`,'ok');

  G.stats.placed++; updateHUD(); saveGame(); sfx('place');
  toast(`Placed ${def.name}`,'ok');
  document.getElementById('toolTip').classList.add('hidden');
  if(!LOGISTICS_TOOLS.has(type)) hudSelect();
}

function completePlacement(type,tx,ty){
  // Called after player confirms power warning, skip power check and place
  const def=MDEFS[type]; if(!def)return;
  if(!canPlace(type,tx,ty)){toast('Cannot place here','bad');sfx('error');hudSelect();return;}
  const crafted=(G.crafted[type]||0)>0;
  if(G.devFreeBuild){
    // free
  } else if(crafted){
    G.crafted[type]--;
  } else {
    for(const[item,need]of Object.entries(def.cost)){
      if((G.inv[item]||0)<need){toast(`Need ${need}× ${ITEMS[item]?.name||item}`,'wrn');sfx('error');flashDrawerItem();hudSelect();return;}
    }
    for(const[item,need]of Object.entries(def.cost)) G.inv[item]-=need;
  }
  const m=mkMachine(type,tx,ty,placeDir);
  undoRec({op:'place',id:m.id,src:G.devFreeBuild?'free':crafted?'crafted':'inv'});
  if(type==='miner')m.mineRes=G.map[ty][tx].res;
  if(type==='oil_pump')m.mineRes='oil';
  if(def.pumps)m.mineRes=def.pumps;
  G.machines[m.id]=m;
  const[mw,mh]=machSize(m);
  for(let dy=0;dy<mh;dy++)for(let dx=0;dx<mw;dx++) G.map[ty+dy][tx+dx].mid=m.id;
  const tl=linkTunnel(m); if(tl)toast(`Tunnel linked! (${tl} tiles)`,'ok');
  G.stats.placed++; updateHUD(); saveGame(); sfx('place');
  toast(`Placed ${def.name}`,'ok');
  document.getElementById('toolTip').classList.add('hidden');
  if(!LOGISTICS_TOOLS.has(type)) hudSelect();
}
function tryRemove(tx,ty,quiet){
  const mid=G.map[ty][tx].mid; if(mid===null)return;
  const m=G.machines[mid]; if(!m)return;
  const def=MDEFS[m.type];
  undoRec({op:'remove',snap:{type:m.type,x:m.x,y:m.y,dir:m.dir,recipe:m.recipe,tier:m.tier||1,modules:[...(m.modules||[])]}});
  const[mw,mh]=machSize(m);
  unlinkTunnel(m);
  for(let dy=0;dy<mh;dy++)for(let dx=0;dx<mw;dx++){
    const t=G.map[m.y+dy][m.x+dx];
    t.mid=null;
    for(const it of t.items)G.inv[it.id]=(G.inv[it.id]||0)+1; // items riding the belt come back
    t.items=[];
  }
  if(m._arm?.item)G.inv[m._arm.item]=(G.inv[m._arm.item]||0)+1;
  // Full refund: build cost, upgrade steps and installed modules
  addCost(G.inv,machineWorth(m.type,m.tier,m.modules));
  // Return input buffer to inventory
  for(const[item,n]of Object.entries(m.inBuf))
    if(n>0)G.inv[item]=(G.inv[item]||0)+n;
  // Return output buffer to inventory
  for(const[item,n]of Object.entries(m.outBuf))
    if(n>0)G.inv[item]=(G.inv[item]||0)+n;
  // Return chest inventory
  for(const[item,n]of Object.entries(m.chestInv))
    if(n>0)G.inv[item]=(G.inv[item]||0)+n;
  delete G.machines[mid];
  if(openPanel==='machine')closePanel('machine');
  if(quiet)return;
  updateHUD(); saveGame(); sfx('remove');
  toast(`Removed ${def.name}`,'ok');
}

// ═══════════════════════════════════════════════════
//  SIMULATION
// ═══════════════════════════════════════════════════
let tickId=null;
// Ticks run on a timer at the sim speed. Above ~16x the interval would drop
// under a frame, so each interval runs several ticks instead.
let lastUiMs=0, lastSaveMs=0;
let uiPress=false;
document.addEventListener('pointerdown',()=>{uiPress=true;},true);
for(const ev of['pointerup','pointercancel'])document.addEventListener(ev,()=>setTimeout(()=>{uiPress=false;},150),true);
const DEV_SPEEDS=[1,2,5,10,25,50];
function startTick(){
  if(tickId)clearInterval(tickId);
  const spd=G?.devTickSpeed||1;
  const interval=Math.max(16,TICK_MS/spd), perInterval=spd*interval/TICK_MS;
  let acc=0;
  tickId=setInterval(()=>{acc+=perInterval;let n=Math.min(8,Math.floor(acc));acc-=n;while(n-->0)gameTick();},interval);
}

function gameTick(){
  lastTickMs=performance.now();
  G.tick++;
  G.power.out=0; G.power.in=0;

  // Pre-pass: accumulate total power demand across ALL consumer machines
  const pm0=perkMult();
  for(const m of Object.values(G.machines)){
    if(!m.active||m.withered)continue;
    const def=MDEFS[m.type]; if(!def||def.power<=0)continue;
    if(m.type==='stone_furnace'||m.type==='blast_furnace')continue;
    const mods=m.modules||[];
    const modEff=mods.some(x=>x==='eff_module')?0.7:1;
    G.power.in+=def.power*pm0.power*modEff;
  }
  const sing=G.zone===5&&singularity();
  if(sing&&sing.complete&&!G.bigBang)G.power.in+=SING_POWER;

  buildFluidNets();
  // Pass 1: generators (negative power), establish power supply
  for(const m of Object.values(G.machines)){
    if(MDEFS[m.type]?.power<0)runMachine(m);
  }
  runAccumulators();
  // Pass 2: all other machines, powerRatio() now correct
  for(const m of Object.values(G.machines)){
    if(!(MDEFS[m.type]?.power<0))runMachine(m);
  }
  runBelts();
  settleFluidNets();
  tickLiving();

  // Smog tick, natural decay + clamp
  if(zoneHas('smog')){
    if(G.smog===undefined)G.smog=0;
    G.smog=Math.max(0,Math.min(100,G.smog-0.1));
  }

  if(G.tick%4===0){checkAchievements();tickTutorial();}
  // UI refresh is throttled by real time so fast dev speeds don't drown the browser in DOM work
  const nowMs=performance.now();
  // Skipped while a finger/button is down: rebuilding a panel mid-tap swaps the
  // button under the finger and the tap is silently lost
  if(!uiPress&&nowMs-lastUiMs>=220){lastUiMs=nowMs;updateHUD();refreshOpenPanel();buildToolbar();updateRocketBtn();if(MDEFS[activeTool])updateBuildHUD();}
  if(G.tick%120===0&&nowMs-lastSaveMs>=8000){lastSaveMs=nowMs;saveGame();}
}

function powerRatio(){
  if(G.power.out===0&&G.power.in===0)return 1; // nothing placed yet, free run
  if(G.power.out===0)return 0;                  // no generators at all
  if(G.power.in===0)return 1;                   // generators but no consumers
  if(G.power.out<G.power.in)return 0;           // hard cutoff, supply < demand
  return 1;                                      // supply meets demand
}

// Perk multipliers, reads G.perks.spent and returns composite modifiers
function perkMult(){
  const s=G.perks?.spent||{}, o=PRESTIGE.owned;
  return {
    // Tiers stack: I +10%, II +25% more, III +15% more; Stardust upgrades multiply on top
    yield: (s.yield3?1.50 : s.yield2?1.35 : s.yield1?1.10 : 1)*(o.cosmic_yield?1.15:1),
    speed: (s.speed3?1.35 : s.speed2?1.20 : s.speed1?1.10 : 1)*(o.cosmic_speed?1.15:1),
    belt:  s.belt2?1.40 : s.belt1?1.20 : 1,
    power: (s.power2?0.70 : s.power1?0.85 : 1)*(o.cosmic_power?0.8:1), // multiplier on power draw
  };
}

// Items-per-minute tracking, call once per completed output
// Stores timestamps of last 60 completions per machine in a ring buffer
const RATE_WINDOW_MS = 60000; // 1 minute window
function recordOutput(m, count){
  if(!m._times) m._times=[];
  const now=Date.now();
  m._times.push({t:now,n:count});
  m._times=m._times.filter(e=>now-e.t<RATE_WINDOW_MS);
  // Track total mined for achievements (miners and oil pumps only)
  if(m.type==='miner'||m.type==='oil_pump'){
    if(G&&G.stats) G.stats.mined=(G.stats.mined||0)+count;
  }
}
function itemsPerMin(m){
  if(!m._times||!m._times.length)return 0;
  const now=Date.now();
  const recent=m._times.filter(e=>now-e.t<RATE_WINDOW_MS);
  if(!recent.length)return 0;
  const total=recent.reduce((a,e)=>a+e.n,0);
  // Scale to full minute based on window actually elapsed
  const windowMs=Math.min(RATE_WINDOW_MS, now-recent[0].t+TICK_MS);
  return Math.round(total/(windowMs/60000));
}

function runMachine(m){
  const def=MDEFS[m.type]; if(!m.active)return;
  // Modules: compute bonuses
  const mods=m.modules||[];
  const modSpeed=1+mods.filter(x=>x==='speed_module').length*0.25;
  const modYield=1+mods.filter(x=>x==='prod_module').length*0.25;
  const modEff=mods.some(x=>x==='eff_module')?0.7:1;
  // NOTE: G.power.in is pre-calculated in gameTick pre-pass, do NOT add here

  if(m.type==='generator'){
    const hasFuel=(m.inBuf.coal||0)>0;
    if(hasFuel){
      G.power.out+=Math.abs(def.power);
      const hasPowerConsumers=Object.values(G.machines).some(mm=>mm.active&&MDEFS[mm.type]?.power>0);
      if(G.tick%16===0&&hasPowerConsumers) m.inBuf.coal--;
    }
    return;
  }
  if(m.type==='burner'){
    // 1 coal per 6s, so one coal Miner (1 coal per 2s) keeps three Burners running
    const hasFuel=(m.inBuf.coal||0)>0;
    if(hasFuel){
      G.power.out+=Math.abs(def.power);
      const hasPowerConsumers=Object.values(G.machines).some(mm=>mm.active&&MDEFS[mm.type]?.power>0);
      if(G.tick%BURNER_COAL_TICKS===0&&hasPowerConsumers) m.inBuf.coal--;
    }
    return;
  }
  if(m.type==='combustion_gen'){
    // Burns 1 refined_fuel every 8s, only when consumers exist
    const hasFuel=(m.inBuf.refined_fuel||0)>0;
    if(hasFuel){
      G.power.out+=Math.abs(def.power);
      const hasPowerConsumers=Object.values(G.machines).some(mm=>mm.active&&MDEFS[mm.type]?.power>0&&mm.type!=='combustion_gen'&&mm.type!=='burner'&&mm.type!=='generator');
      if(G.tick%32===0&&hasPowerConsumers) m.inBuf.refined_fuel--;
    }
    return;
  }
  if(m.type==='oil_pump'){
    // Auto-mines oil from deposit below, like miner but produces smog
    if(!m.mineRes||m.mineRes!=='oil')return;
    const ratio=powerRatio(); if(ratio===0)return;
    m.prog++;
    const tierMult=m.tier===3?2:m.tier===2?1.5:1;
    const rate=Math.max(2,Math.floor(8/(ratio*tierMult)));
    if(m.prog>=rate){
      const bufTotal=Object.values(m.outBuf).reduce((a,b)=>a+b,0);
      if(bufTotal>=50)return;
      m.prog=0;
      m.outBuf.crude_oil=(m.outBuf.crude_oil||0)+1;
      m.produced++;
      recordOutput(m,1);
      // Generate smog
      if(zoneHas('smog')){G.smog=Math.min(100,(G.smog||0)+0.5*(G.perks?.spent?.smog1?0.7:1));}
    }
    return;
  }
  if(m.type==='lumen_panel'){
    if(glowBright())G.power.out+=Math.abs(def.power);
    return;
  }
  if(m.type==='reactor'){runReactor(m,def);return;}
  if(m.type==='singularity'){runSingularity(m);return;}
  if(m.type==='heat_sink')return;
  if(def.living&&m.withered)return;
  if(def.pumps){runPump(m,def);return;}
  if(def.fluidCap||m.type==='accumulator')return; // pipes, tanks, valves: handled by settleFluidNets
  if(m.type==='scrubber'){
    // Burns refined_fuel to remove smog, every 4 ticks
    if(!zoneHas('smog')||G.tick%4!==0)return;
    if(powerRatio()===0)return;
    const hasFuel=(m.inBuf.refined_fuel||0)>0;
    if(hasFuel&&(G.smog||0)>0){
      G.smog=Math.max(0,(G.smog||0)-SCRUBBER_SMOG);
      if(G.tick%32===0) m.inBuf.refined_fuel--;
    }
    return;
  }
  if(m.type==='miner'){
    if(!m.mineRes)return;
    const ratio=powerRatio();
    if(ratio===0)return;
    m.prog++;
    const pm=perkMult();
    const tierMult=m.tier===3?2:m.tier===2?1.5:1;
    // Smog reduces efficiency in Zone 2
    const smogMult=zoneHas('smog')?Math.max(0.1,(100-(G.smog||0))/100):1;
    const resMult=m.mineRes==='radiant_dust'?0.5:1; // radiant vents yield slowly
    const rate=Math.max(2,Math.floor(8/(ratio*pm.speed*tierMult*modSpeed*smogMult*resMult)));
    if(m.prog>=rate){
      const bufTotal=Object.values(m.outBuf).reduce((a,b)=>a+b,0);
      if(bufTotal>=50)return;
      m.prog=0;
      const n=Math.random()<((pm.yield*tierMult*modYield)-1)?2:1;
      m.outBuf[m.mineRes]=(m.outBuf[m.mineRes]||0)+n;
      m.produced+=n;
      recordOutput(m,n);
    }
    return;
  }
  if(m.type==='chest'||m.type==='belt'||m.type==='splitter'||m.type==='tunnel'||m.type==='inserter'||m.type==='long_inserter'||m.type==='burner')return;

  if(!m.recipe)return;
  const rec=RECIPES[m.recipe]; if(!rec)return;
  if((rec.unlock&&!G.research.done.includes(rec.unlock))||!zoneRecipeOk(m.recipe)){m.recipe=null;m.prog=0;return;}
  const pm=perkMult();
  const powerImmune=(m.type==='stone_furnace'||m.type==='blast_furnace');
  const ratio=powerImmune?1:powerRatio();
  if(ratio===0)return;
  const tierMult=m.tier===3?2:m.tier===2?1.5:1;
  // Smog reduces efficiency in Zone 2 for all powered machines
  const smogEff=zoneHas('smog')?Math.max(0.1,(100-(G.smog||0))/100):1;
  const lifeMult=def.living?lifeStage(m).mult:1;
  const speedMult=ratio*pm.speed*tierMult*modSpeed*smogEff*lifeMult;

  if(m.prog===0){
    if(canFill(m,rec)&&fluidReady(m,rec)){consumeInputs(m,rec);consumeFluid(m,rec);m.prog=1;}
  } else {
    m.prog++;
    m._dur=Math.ceil(rec.time/Math.max(.01,speedMult));
    if(m.prog>=m._dur){
      // Stall if output buffer full
      const bufTotal=Object.values(m.outBuf).reduce((a,b)=>a+b,0);
      if(bufTotal>=50)return;
      m.prog=0;
      for(const[item,n]of Object.entries(rec.out)){
        // prod module: chance of bonus output
        const bonus=modYield>1&&Math.random()<(modYield-1)?1:0;
        const total=n+bonus;
        m.outBuf[item]=(m.outBuf[item]||0)+total;
        m.produced+=total;
        recordOutput(m,total);
      }
    }
  }
}

function canFill(m,rec){
  for(const[item,need]of Object.entries(rec.in)){
    if((m.inBuf[item]||0)<need)return false;
  }
  return true;
}

function consumeInputs(m,rec){
  for(const[item,need]of Object.entries(rec.in)){
    m.inBuf[item]=(m.inBuf[item]||0)-need;
  }
}

// ═══════════════════════════════════════════════════
//  FLUIDS & PRESSURE
//  Pipes/tanks/valves (fluidCap) join into networks each tick. A network holds
//  one fluid; pressure = amount / capacity. Pumps push in, fluidPort machines
//  draw out at recipe start. ≥90% with inflow builds strain → a pipe bursts.
// ═══════════════════════════════════════════════════
const LOW_PRESSURE=20, OVER_PRESSURE=90, RELIEF_AT=80, BURST_STRAIN=80, VALVE_VENT=0.75;
function burstStrain(){return BURST_STRAIN*(G.perks?.spent?.pressure1?1.5:1);}
const FLUID_RES={oil:'🛢️ NEEDS OIL PUMP',brine:'💧 NEEDS BRINE PUMP',enzymes:'🧪 NEEDS ENZYME PUMP'};
let FLUID_NETS=[];
let burstFx=[];

function machineNeighbors(m){
  const[w,h]=machSize(m); const out=new Set();
  for(let dy=-1;dy<=h;dy++)for(let dx=-1;dx<=w;dx++){
    if((dx===-1||dx===w)&&(dy===-1||dy===h))continue; // orthogonal only
    if(dx>=0&&dx<w&&dy>=0&&dy<h)continue;
    const tx=m.x+dx,ty=m.y+dy;
    if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)continue;
    const mid=G.map[ty][tx].mid; if(mid!==null&&G.machines[mid])out.add(G.machines[mid]);
  }
  return [...out];
}
function pressureOf(net){return net&&net.cap>0?Math.min(100,net.amt/net.cap*100):0;}

function buildFluidNets(){
  FLUID_NETS=[];
  const seen=new Set();
  for(const m of Object.values(G.machines)){ if(MDEFS[m.type]?.fluidPort)m._nets=[]; }
  for(const start of Object.values(G.machines)){
    if(!MDEFS[start.type]?.fluidCap||seen.has(start.id))continue;
    const net={members:[],ports:new Set(),cap:0,amt:0,type:null,strain:0,inflow:0};
    const queue=[start]; seen.add(start.id);
    while(queue.length){
      const cur=queue.pop();
      net.members.push(cur); cur._net=net;
      net.cap+=MDEFS[cur.type].fluidCap;
      if(cur.fluid&&cur.fluid.amt>0){net.amt+=cur.fluid.amt; net.type=net.type||cur.fluid.type;}
      net.strain=Math.max(net.strain,cur.strain||0);
      for(const nb of machineNeighbors(cur)){
        const nd=MDEFS[nb.type];
        if(nd.fluidCap&&!seen.has(nb.id)){seen.add(nb.id);queue.push(nb);}
        else if(nd.fluidPort&&!net.ports.has(nb)){net.ports.add(nb);nb._nets.push(net);}
      }
    }
    FLUID_NETS.push(net);
  }
}

// Network a machine can use for a given fluid (or an empty one for pumps)
function portNet(m,fluid,allowEmpty){
  return (m._nets||[]).find(n=>n.type===fluid||(allowEmpty&&!n.type))||null;
}

function runPump(m,def){
  if(m.mineRes!==def.pumps){m._fluidStatus='nodeposit';return;}
  if(powerRatio()===0){m._fluidStatus='nopower';return;}
  if(++m.prog<2)return;
  m.prog=0;
  const net=portNet(m,def.pumps,true);
  if(!net){m._fluidStatus='nopipe';return;}
  m._fluidStatus='ok';
  net.type=def.pumps;
  net.amt=Math.min(net.cap,net.amt+(m.tier===3?2:m.tier===2?1.5:1));
  net.inflow++;
  m.produced++; recordOutput(m,1);
}

function fluidReady(m,rec){
  if(!rec.fluid){m._fluidStatus=null;return true;}
  const minP=Math.max(LOW_PRESSURE,rec.minPressure||0);
  for(const[f,n]of Object.entries(rec.fluid)){
    const net=portNet(m,f,false);
    if(!net){m._fluidStatus='nopipe';return false;}
    if(pressureOf(net)<minP||net.amt<n){m._fluidStatus='lowpressure';return false;}
  }
  m._fluidStatus='ok';
  return true;
}
function consumeFluid(m,rec){
  for(const[f,n]of Object.entries(rec.fluid||{})){
    const net=portNet(m,f,false); if(net)net.amt=Math.max(0,net.amt-n);
  }
}

function settleFluidNets(){
  for(const net of FLUID_NETS){
    if(!net.members.length)continue;
    const valves=net.members.filter(m=>m.type==='relief_valve'&&m.active).length;
    if(valves&&pressureOf(net)>RELIEF_AT)
      net.amt=Math.max(net.cap*RELIEF_AT/100,net.amt-valves*VALVE_VENT);
    // Strain builds while pumps push into an over-pressured network (pumps push every
    // other tick, so +2 per push ≈ +1/tick), holds between pushes, eases off below 90%
    if(pressureOf(net)>=OVER_PRESSURE){if(net.inflow>0)net.strain+=2;}
    else net.strain=Math.max(0,net.strain-2);
    if(net.strain>=burstStrain())burstPipe(net);
    if(net.amt<0.01){net.amt=0;net.type=null;}
    for(const m of net.members){
      m.fluid={type:net.type,amt:net.cap?net.amt*MDEFS[m.type].fluidCap/net.cap:0};
      m.strain=net.strain;
    }
  }
}

// Over-pressure: one pipe in the network is destroyed and half the fluid is lost
function burstPipe(net){
  const pipes=net.members.filter(m=>m.type==='pipe');
  net.strain=0; net.amt*=0.5;
  if(!pipes.length)return;
  const p=pipes[Math.floor(Math.random()*pipes.length)];
  G.map[p.y][p.x].mid=null;
  delete G.machines[p.id];
  net.members.splice(net.members.indexOf(p),1);
  net.cap-=MDEFS.pipe.fluidCap;
  net.amt=Math.min(net.amt,net.cap);
  G.stats.bursts=(G.stats.bursts||0)+1;
  burstFx.push({x:p.x,y:p.y,t:performance.now()});
  if(inspectId===p.id&&openPanel==='machine')closePanel('machine');
  toast('💥 PIPE BURST! Over-pressure','bad'); sfx('error');
}

// Highest-pressure network, for the HUD
function worstNet(){
  let worst=null;
  for(const n of FLUID_NETS)if(n.type&&(!worst||n.strain>worst.strain||(n.strain===worst.strain&&pressureOf(n)>pressureOf(worst))))worst=n;
  return worst;
}

// ═══════════════════════════════════════════════════
//  LIVING MACHINES (Zone 4)
//  Vitality 0-100 decays every tick. A machine eats 1 Nutrient Paste from its
//  input buffer every FEED_EVERY ticks while below 100. Stage sets speed:
//  Sprout <30 ×0.5 · Mature ×1 · Bloom >80 ×1.5. At 0 it withers and stops
//  until replanted (5 biomass).
// ═══════════════════════════════════════════════════
const VIT_START=40, VIT_DECAY=0.06, FEED_EVERY=20, FEED_GAIN=12, REPLANT_COST=5;
function lifeStage(m){
  if(m.withered)return {name:'Withered',icon:'🥀',mult:0};
  const v=m.vit||0;
  if(v<30)return {name:'Sprout',icon:'🌱',mult:0.5};
  if(v>80)return {name:'Bloom',icon:'🌸',mult:1.5};
  return {name:'Mature',icon:'🌿',mult:1};
}
function tickLiving(){
  const decay=VIT_DECAY*(G.perks?.spent?.vital1?0.75:1);
  for(const m of Object.values(G.machines)){
    if(!MDEFS[m.type]?.living||m.withered)continue;
    if(m.vit===undefined)m.vit=VIT_START;
    m.vit=Math.max(0,m.vit-decay);
    if(m.vit<100&&G.tick%FEED_EVERY===0&&(m.inBuf.nutrient||0)>0){
      m.inBuf.nutrient--; m.vit=Math.min(100,m.vit+FEED_GAIN);
    }
    if(m.vit<=0){
      m.withered=true; G.stats.withered=(G.stats.withered||0)+1;
      toast(`🥀 ${MDEFS[m.type].name} withered. Replant it`,'bad');
    }
  }
}
function replantMachine(id){
  const m=G.machines[id]; if(!m||!m.withered)return;
  if((G.inv.biomass||0)<REPLANT_COST){toast(`Need ${REPLANT_COST}× Biomass`,'wrn');sfx('error');return;}
  G.inv.biomass-=REPLANT_COST; m.withered=false; m.vit=VIT_START; m.prog=0;
  sfx('craft'); toast(`🌱 ${MDEFS[m.type].name} replanted`,'ok'); renderMachPanel();
}
function feedMachine(id){
  const m=G.machines[id]; if(!m)return;
  if((G.inv.nutrient||0)<1){toast('No Nutrient Paste in inventory','wrn');sfx('error');return;}
  G.inv.nutrient--; m.inBuf.nutrient=(m.inBuf.nutrient||0)+1;
  sfx('craft'); renderMachPanel();
}

// ── Nuclear reactor + heat ──
// Running adds heat; passive cooling + each adjacent Heat Sink removes it.
// At 100 the reactor SCRAMs: offline for REACTOR_SCRAM ticks while it cools.
const REACTOR_HEAT=0.5, REACTOR_COOL=0.1, SINK_COOL=0.2, REACTOR_SCRAM=240, ROD_TICKS=240;
function runReactor(m,def){
  const sinks=machineNeighbors(m).filter(n=>n.type==='heat_sink').length;
  m.heat=Math.max(0,(m.heat||0)-REACTOR_COOL-sinks*SINK_COOL);
  if(m.scram>0){m.scram--;return;}
  if((m.inBuf.lum_rod||0)<=0)return;
  G.power.out+=Math.abs(def.power);
  m.heat+=REACTOR_HEAT*(G.perks?.spent?.cool1?0.8:1);
  m.burn=(m.burn||0)+1;
  if(m.burn>=ROD_TICKS){m.burn=0;m.inBuf.lum_rod--;}
  if(m.heat>=100){
    m.heat=100; m.scram=REACTOR_SCRAM; G.stats.scrams=(G.stats.scrams||0)+1;
    toast('☢️ REACTOR SCRAM! Overheated, add Heat Sinks','bad'); sfx('error');
  }
}

// ═══════════════════════════════════════════════════
//  THE SINGULARITY (Zone 5)
//  Inserters (any side) or the panel feed components into it. Once complete it
//  draws SING_POWER; holding full power for SING_SUSTAIN ticks → Big Bang.
// ═══════════════════════════════════════════════════
const SING_REQS={grav_lens:10,stellar_casing:20,void_engine:10,quantum_mind:10};
const SING_POWER=5000, SING_SUSTAIN=240;
function singularity(){return Object.values(G.machines).find(m=>m.type==='singularity')||null;}
function runSingularity(m){
  if(!m.built)m.built={};
  for(const[id,need]of Object.entries(SING_REQS)){
    const have=m.built[id]||0, inb=m.inBuf[id]||0;
    if(inb>0&&have<need){const take=Math.min(inb,need-have);m.built[id]=have+take;m.inBuf[id]-=take;}
  }
  m.complete=Object.entries(SING_REQS).every(([id,n])=>(m.built[id]||0)>=n);
  if(!m.complete||G.bigBang)return;
  m.sustain=(powerRatio()===1&&G.power.out>=G.power.in)?(m.sustain||0)+1:0;
  if(m.sustain>=SING_SUSTAIN)triggerBigBang();
}
function depositToSingularity(){
  const m=singularity(); if(!m)return;
  if(!m.built)m.built={};
  let moved=0;
  for(const[id,need]of Object.entries(SING_REQS)){
    const take=Math.min(G.inv[id]||0,need-(m.built[id]||0));
    if(take>0){G.inv[id]-=take;m.built[id]=(m.built[id]||0)+take;moved+=take;}
  }
  toast(moved?`Deposited ${moved} components`:'No components to deposit',moved?'ok':'wrn');
  sfx(moved?'craft':'error'); refreshOpenPanel();
}
function singularityStatusHtml(compact){

// ── Glow tide (Zone 3 light cycle) ──
const GLOW_CYCLE=960, GLOW_BRIGHT=720; // ticks: 180s bright, 60s dim
function glowBright(){return (G.tick%GLOW_CYCLE)<GLOW_BRIGHT;}
function glowSecsLeft(){
  const t=G.tick%GLOW_CYCLE;
