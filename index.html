<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="8-BIT INDUSTRY">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>8-BIT INDUSTRY</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0d0d0d;
  --bg2:     #111;
  --bg3:     #1a1a1a;
  --panel:   #0f0f0f;
  --border:  #222;
  --border2: #333;
  --amber:   #f5a623;
  --amberDim:#7a5010;
  --teal:    #26c6a0;
  --tealDim: #0d4a3a;
  --green:   #4caf50;
  --red:     #e53935;
  --blue:    #42a5f5;
  --purple:  #ab47bc;
  --text:    #e8e8e8;
  --text2:   #999;
  --text3:   #555;
  --font:    'Press Start 2P', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--f8);user-select:none;-webkit-tap-highlight-color:transparent}

/* ── TYPE SCALE + LAYOUT VARIABLES ──
   Inline styles use var(--f3..--f10). --ct/--cb/--cl/--cr are the map's edges,
   set by layoutOverlays() so floating controls never cover the drawer or tab bar. */
:root{
  --f3:6px;--f4:6px;--f5:7px;--f6:8px;--f7:9px;--f8:10px;--f9:11px;--f10:12px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --hud-h:48px;--tab-h:62px;--ct:48px;--cb:62px;--cl:0px;--cr:0px;
}
@media(max-width:700px),(pointer:coarse){
  :root{--f3:7px;--f4:7px;--f5:8px;--f6:9px;--f7:10px;--f8:11px;--f9:12px;--f10:13px;--hud-h:52px;--tab-h:74px}
}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px)}
.screen{position:fixed;inset:0}
.hidden{display:none!important}

/* ── TITLE ── */
#sTitle{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg)}
.title-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 50% 35% at 50% 55%,rgba(245,166,35,.07) 0%,transparent 70%)}
#titleMute{position:absolute;top:calc(10px + var(--sat,0px));right:calc(10px + var(--sar,0px));z-index:2;width:44px;height:44px;font-size:20px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);border-radius:50%;cursor:pointer}
#titleSoundHint{position:absolute;top:calc(20px + var(--sat,0px));right:calc(62px + var(--sar,0px));z-index:2;font-size:var(--f4);color:var(--amber);background:rgba(0,0,0,.55);padding:6px 8px;border:1px solid rgba(245,166,35,.35);pointer-events:none;animation:flicker 2.4s infinite}
#titleCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#titleCaption{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sab,0px));white-space:nowrap;padding:6px 10px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.08);font-size:var(--f5);color:var(--amber);letter-spacing:3px;text-shadow:2px 2px 0 #000;pointer-events:none;transition:opacity .3s}
#titleCaption:empty{display:none}
.title-card{position:relative;text-align:center;padding:20px 18px 14px;width:min(92vw,380px);max-height:calc(100% - 70px);overflow-y:auto;background:rgba(10,10,10,.62);border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 4px rgba(0,0,0,.35),0 10px 40px rgba(0,0,0,.6);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.title-card .logo{margin-bottom:22px}.title-card .logo-icon{margin-bottom:8px}
.title-card .tagline{line-height:2.2;margin-bottom:22px}.title-card .v-num{margin-top:16px;line-height:1.9}
@media (orientation:landscape) and (max-height:600px){.title-card{padding:12px 16px 10px}.title-card .logo{margin-bottom:10px}.title-card .tagline{margin-bottom:12px}.title-card .v-num{margin-top:10px}.title-card .logo-icon{display:none}#titleCaption{bottom:6px}}
.logo{position:relative;text-align:center;margin-bottom:44px}
.logo-8{display:block;font-size:clamp(22px,8vw,36px);color:var(--amber);letter-spacing:6px;text-shadow:0 0 24px rgba(245,166,35,.5),3px 3px 0 #000;animation:flicker 5s infinite}
.logo-rest{display:block;font-size:clamp(9px,3vw,13px);color:var(--text);letter-spacing:10px;margin-top:8px;text-shadow:2px 2px 0 #000}
@keyframes flicker{0%,91%,95%,100%{opacity:1}92%,94%{opacity:.65}}
.logo-icon{font-size:36px;display:block;margin-bottom:14px;animation:bob 2.2s ease-in-out infinite}
.logo-icon .uico{width:56px;height:56px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,.4)}50%{box-shadow:0 0 0 6px rgba(245,166,35,0)}}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
.tagline{color:var(--text3);font-size:var(--f5);letter-spacing:4px;margin-bottom:44px}
.btn{font-family:var(--font);font-size:var(--f8);padding:12px 28px;cursor:pointer;background:transparent;color:var(--amber);border:2px solid var(--amber);letter-spacing:1px;transition:all .1s}
.btn::before{content:'▶ '}
.btn:hover,.btn:active{background:var(--amber);color:#000;box-shadow:0 0 18px rgba(245,166,35,.45)}
.btn-sm{font-size:var(--f6);padding:9px 18px}
.btn-teal{color:var(--teal);border-color:var(--teal)}
.btn-teal::before{content:'▶ '}
.btn-teal:hover,.btn-teal:active{background:var(--teal);color:#000}
.btn-red{color:var(--red);border-color:var(--red)}
.btn-red:hover,.btn-red:active{background:var(--red);color:#000}
.v-num{color:var(--text3);font-size:var(--f5);margin-top:28px}

/* ── GAME SHELL ── */
#sGame{display:flex;flex-direction:column}

/* HUD */
#hud{flex-shrink:0;height:calc(var(--hud-h) + var(--sat));padding-top:var(--sat)!important;padding-left:max(4px,var(--sal))!important;padding-right:max(4px,var(--sar))!important;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 4px;gap:4px;z-index:100;overflow:hidden}
.hud-logo{color:var(--amber);font-size:var(--f7);padding-right:6px;border-right:1px solid var(--border);white-space:nowrap;flex-shrink:0}
#hudZones{display:flex;gap:2px;padding-right:6px;border-right:1px solid var(--border);flex-shrink:0}
.zone-tab{font-family:var(--font);font-size:var(--f5);padding:4px 6px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:not-allowed;white-space:nowrap}
.zone-tab.active{border-color:var(--amber);color:var(--amber);cursor:default}
.zone-tab.locked{opacity:.35}
#hudRes{display:flex;gap:4px;align-items:center;padding:0 4px;flex-shrink:0}
.hres{display:flex;align-items:center;gap:3px;white-space:nowrap}
.hres-icon{font-size:14px;line-height:1}
.hres-val{color:var(--amber);font-size:var(--f8);min-width:32px}
/* Slim HUD icon buttons */
.hbtn{min-height:40px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-family:var(--font);font-size:15px;padding:5px 0;cursor:pointer;transition:all .1s;border-radius:3px;flex-shrink:0;width:36px;text-align:center}
.hbtn:hover{border-color:var(--amber);color:var(--amber)}
.hbtn.on{border-color:var(--amber);color:var(--amber);background:rgba(245,166,35,.08)}

/* CANVAS */
#wrap{flex:1;position:relative;overflow:hidden;background:#090909;cursor:crosshair}
#canvas{position:absolute;top:0;left:0;cursor:crosshair;touch-action:none}

/* ── TAB BAR (replaces old toolbar) ── */
#tabBar{flex-shrink:0;height:calc(var(--tab-h) + var(--sab));padding-bottom:var(--sab);padding-left:var(--sal);padding-right:var(--sar);background:var(--panel);border-top:2px solid var(--border2);display:flex;z-index:100}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-family:var(--font);font-size:var(--f5);color:#c8c8c8;border:none;background:transparent;border-top:2px solid transparent;cursor:pointer;padding:6px 2px;transition:all .12s;letter-spacing:.5px}
.tab-btn .tab-icon{font-size:22px;line-height:1;height:26px;display:flex;align-items:center}
.uico{image-rendering:pixelated;display:inline-block;vertical-align:middle}
.toast .uico,.toast .ico,#tutText .uico{width:16px;height:16px;vertical-align:-3px}
img.pxe{width:max(16px,1.5em);height:max(16px,1.5em);vertical-align:-.3em}
.tab-icon .uico{width:26px;height:26px}
.ph-x .uico,.hbtn .uico{width:16px;height:16px}
button .uico{vertical-align:-3px}
.mt-ic .uico{width:32px;height:32px}
.hres-icon .uico{width:16px;height:16px}
.btn .uico,.ditem .di .uico{width:24px;height:24px}
.btn .uico{width:16px;height:16px;margin:-4px 4px 0 0}
#titleMute .uico{width:24px;height:24px}
.tab-btn:hover{color:var(--text2);background:var(--bg3)}
.tab-btn.active{color:var(--amber);border-top-color:var(--amber);background:rgba(245,166,35,.06)}
.tab-btn.active .tab-icon{filter:none}

/* ── DRAWER (slides up above tab bar when a tab is active) ── */
#tabDrawer{flex-shrink:0;background:var(--panel);border-top:1px solid var(--border2);overflow:hidden;max-height:0;transition:max-height .18s ease;z-index:99}
#tabDrawer.open{max-height:200px}
/* Category sub-tabs inside drawer */
#drawerCats{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
#drawerCats::-webkit-scrollbar{display:none}
.dcat-btn{font-family:var(--font);font-size:var(--f5);padding:9px 12px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--text3);cursor:pointer;white-space:nowrap;flex-shrink:0;letter-spacing:.5px}
.dcat-btn.active{color:var(--amber);border-bottom-color:var(--amber)}
/* Items row inside drawer */
#drawerItems{display:flex;gap:4px;padding:5px 8px;overflow-x:auto;scrollbar-width:none;align-items:center}
#drawerItems::-webkit-scrollbar{display:none}
.ditem{min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 8px;cursor:pointer;border:1px solid var(--border);min-width:52px;font-family:var(--font);background:transparent;flex-shrink:0;transition:all .1s}
.ditem:hover{border-color:var(--border2);background:var(--bg3)}
.ditem.sel{border-color:var(--amber);background:rgba(245,166,35,.08)}
.ditem.locked{opacity:.3;cursor:not-allowed}
.ditem.off{opacity:.4}
.ditem.unaffordable{opacity:.8}
.ditem.unaffordable .di{opacity:.55}
.ditem .di{font-size:24px;line-height:1}
.ditem .dn{font-size:var(--f5);color:var(--text);white-space:nowrap}
.ditem.sel .dn{color:var(--amber)}

/* ── SIDE PANEL (Inventory, Machine, Rocket etc, infrequent reference panels) ── */
.spanel{position:fixed;top:calc(var(--hud-h) + var(--sat));right:0;bottom:calc(var(--tab-h) + var(--sab));width:min(400px,100vw);padding-right:var(--sar);background:#111;border-left:2px solid var(--border2);z-index:200;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .18s}
.spanel.open{transform:translateX(0)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:2px solid var(--border2);flex-shrink:0;background:#0f0f0f}
.ph-title{color:var(--amber);font-size:var(--f8);display:flex;align-items:center;gap:8px}
.ph-title .uico,#mTitle .uico{width:20px;height:20px}
.pbody::-webkit-scrollbar{width:3px}
.pbody::-webkit-scrollbar-thumb{background:var(--border2)}

/* TOASTS */
#toasts{position:fixed;bottom:calc(var(--cb) + 78px);left:calc((var(--cl) + 100vw - var(--cr)) / 2);transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column-reverse;gap:5px;align-items:center;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--border2);padding:7px 14px;font-size:var(--f6);white-space:nowrap;animation:tin .15s ease-out,tout .25s ease-in 1.75s forwards}
.toast.ok{border-color:var(--teal);color:var(--teal)}
.toast.bad{border-color:var(--red);color:var(--red)}
.toast.wrn{border-color:var(--amber);color:var(--amber)}

/* MODAL */
#mOverlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:500;display:flex;align-items:center;justify-content:center}
.modal{background:var(--panel);border:2px solid var(--border2);width:min(440px,94vw);max-height:calc(100dvh - var(--sat) - var(--sab) - 24px);display:flex;flex-direction:column}
.mh{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-bottom:1px solid var(--border)}
.mh-title{color:var(--amber);font-size:var(--f8);display:flex;align-items:center;gap:8px}
.mb{padding:14px;overflow-y:auto;flex:1;line-height:1.8}
.mf{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* MISC */
.sec-label{font-size:var(--f6);color:var(--teal);letter-spacing:2px;margin-bottom:7px;display:block}
.irow{display:flex;justify-content:space-between;font-size:var(--f6);margin-bottom:6px}
.irow .lbl{color:var(--text2)}
.prog-wrap{height:6px;background:var(--bg);border:1px solid var(--border2);margin:4px 0}
.prog-fill{height:100%;background:var(--teal);transition:width .1s}
.prog-fill.amber{background:var(--amber)}
.prog-fill.green{background:var(--green)}
.card{border:1px solid var(--border2);background:var(--bg3);padding:10px;margin-bottom:9px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.inv-item{border:1px solid var(--border2);background:var(--bg3);padding:6px 3px;display:flex;flex-direction:column;align-items:center;gap:2px}
.inv-item .ii{font-size:18px}
.inv-item .iv{font-size:var(--f6);color:var(--amber)}
.inv-item .in{font-size:var(--f5);color:var(--text2);text-align:center;line-height:1.4}
.craft-row{display:flex;align-items:center;justify-content:space-between;padding:8px;border:1px solid var(--border2);background:var(--bg3);margin-bottom:5px}
.mini-btn{min-height:34px;font-family:var(--font);font-size:var(--f5);padding:6px 10px;border:1px solid var(--border2);background:transparent;cursor:pointer}
.mini-btn.amber{border-color:var(--amber);color:var(--amber)}
.mini-btn.amber:hover{background:rgba(245,166,35,.1)}
.mini-btn.dim{color:var(--text3);cursor:not-allowed}
.mini-btn.teal{border-color:var(--teal);color:var(--teal)}
.mini-btn.teal:hover{background:rgba(38,198,160,.1)}
.mini-btn.red{border-color:var(--red);color:var(--red)}
.mini-btn.red:hover{background:rgba(229,57,53,.1)}
.bk-area{width:100%;height:110px;resize:vertical;background:var(--bg);color:var(--teal);border:1px solid var(--border2);font-family:monospace;font-size:11px;padding:6px;word-break:break-all;margin-bottom:8px}
.full-btn{min-height:44px;width:100%;font-family:var(--font);font-size:var(--f6);padding:10px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;margin-bottom:5px;text-align:left}
.full-btn.amber{border-color:var(--amber);color:var(--amber)}
.full-btn.amber:hover{background:rgba(245,166,35,.08)}
.full-btn.teal{border-color:var(--teal);color:var(--teal)}
.full-btn.teal:hover{background:rgba(38,198,160,.08)}
.full-btn.launch{border:2px solid var(--amber);color:var(--amber);font-size:var(--f7);padding:12px;text-align:center;animation:pulse 1.2s infinite}
.tech-card{border:1px solid var(--border);background:var(--bg3);padding:9px;margin-bottom:6px;transition:border-color .15s}
.tech-card.done{border-color:var(--teal)}
.tech-card.avail{border-color:var(--amberDim)}
.tech-card.locked{opacity:.4}
.rocket-part{display:flex;align-items:center;justify-content:space-between;padding:9px;border:1px solid var(--border);background:var(--bg3);margin-bottom:5px}
.rocket-part.done{border-color:var(--teal)}
.stat-machine{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border:1px solid var(--border);background:var(--bg3);margin-bottom:3px;font-size:var(--f5)}
.stat-machine.stalled{border-color:var(--red)}
.stat-machine.starved{border-color:var(--amber)}
.stat-machine.norecipe{border-color:var(--text3)}
.stat-machine.ok{border-color:var(--border)}
select.game-sel{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:var(--f5);padding:7px;margin-bottom:8px;cursor:pointer}
select.game-sel:focus{outline:none;border-color:var(--amber)}

/* Multisel bar buttons, mobile-friendly tap targets */
.msel-btn{font-family:var(--font);font-size:var(--f6);padding:10px 12px;border:1px solid var(--border2);background:transparent;cursor:pointer;white-space:nowrap;min-height:40px}
.msel-btn.teal{border-color:var(--teal);color:var(--teal)}
.msel-btn.blue{border-color:#42a5f5;color:#42a5f5}
.msel-btn.amber{border-color:var(--amber);color:var(--amber)}
.msel-btn.red{border-color:var(--red);color:var(--red)}
.msel-btn.dim{border-color:var(--border2);color:var(--text2)}

/* ── NEW SHELL: zone chip, tab badges, bottom sheets, menu grid ── */
.hud-zone{font-family:var(--font);font-size:var(--f6);color:var(--amber);background:rgba(245,166,35,.08);border:1px solid var(--amberDim);padding:8px 10px;min-height:36px;cursor:pointer;white-space:nowrap;flex-shrink:1;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
#hudRes{flex:1;min-width:0;overflow:hidden}
.hbtn-speed{width:auto!important;padding:0 8px!important;font-size:var(--f6)!important;color:var(--purple)!important;border-color:var(--purple)!important}
.hbtn-speed.on{background:rgba(171,71,188,.18)!important}
.tab-btn{position:relative;min-width:0}
/* While a sheet or panel is open the tutorial shrinks to its pill, so the map stays visible */
body.sheet-open #tutHint{right:auto;padding:6px 8px}
body.sheet-open #tutText,body.sheet-open .tut-skip{display:none}
body.sheet-open #tutMini{display:block}
.tab-badge:empty{display:none}
.tab-badge{position:absolute;top:6px;right:calc(50% - 22px);min-width:14px;height:14px;line-height:14px;font-size:var(--f4);background:var(--red);color:#fff;border-radius:7px;padding:0 3px}
.dc{font-size:var(--f4);color:var(--text3);white-space:nowrap;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 5px;max-width:120px}
.cc{display:inline-flex;align-items:center;gap:2px;font-size:var(--f4);white-space:nowrap}
.cc.ok{color:var(--teal)} .cc.bad{color:#ff6b6b}
.cc .pxi,.cc img{width:14px;height:14px}
#invStrip{position:fixed;top:var(--ct);left:var(--cl);right:var(--cr);height:34px;display:flex;align-items:center;gap:4px;padding:0 6px;overflow-x:auto;scrollbar-width:none;background:rgba(10,10,10,.88);border-bottom:1px solid var(--border2);z-index:140;cursor:pointer}
#invStrip::-webkit-scrollbar{display:none}
.is-chip{display:inline-flex;align-items:center;gap:3px;padding:3px 6px;border:1px solid transparent;background:var(--bg3);flex-shrink:0;font-size:var(--f5);color:var(--text)}
.is-chip b{font-weight:normal}
.is-chip.need{border-color:var(--teal)} .is-chip.short{border-color:var(--red);color:#ff8a8a}
.is-chip .pxi,.is-chip img{width:16px;height:16px}
.is-empty{font-size:var(--f4);color:var(--text3);white-space:nowrap}
#buildCost{flex-basis:100%;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;align-items:center;font-size:var(--f5);color:var(--text);pointer-events:none}
#buildCost .bc-info{pointer-events:auto;font-family:var(--font);font-size:var(--f5);width:24px;height:24px;min-width:0;min-height:0;border-radius:0;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;padding:0;flex-shrink:0;line-height:1;box-shadow:inset -2px -2px 0 rgba(0,0,0,.45)}
#buildCost .bc-info.on{border-color:var(--amber);color:var(--amber);background:rgba(245,166,35,.12);box-shadow:inset 2px 2px 0 rgba(0,0,0,.45)}
#buildCost .cc .uico{width:12px;height:12px}
#buildCost .bc-in{background:rgba(13,13,13,.92);border:1px solid var(--border2);padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.dc.lock{display:block}
.dc img.ico{width:11px!important;height:11px!important}
.dc.bad{color:var(--red)}
.dc.lock{color:var(--text3)}
.menu-zone{padding:10px;border:1px solid var(--border2);background:var(--bg3);margin-bottom:10px}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.menu-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:78px;padding:10px 4px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:var(--font);cursor:pointer}
.menu-tile:active{border-color:var(--amber);background:rgba(245,166,35,.08)}
.mt-ic{font-size:24px;line-height:1}
.mt-lb{font-size:var(--f5);color:var(--text2)}
.mt-badge{position:absolute;top:4px;right:4px;font-size:var(--f4);color:var(--amber);border:1px solid var(--amberDim);padding:1px 4px;background:var(--bg)}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:4px;margin-bottom:12px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.stat-cell{padding:8px;background:var(--bg3);border:1px solid var(--border)}
.stat-cell .k{font-size:var(--f4);color:var(--text3);margin-bottom:4px}
.stat-cell .v{font-size:var(--f6);color:var(--amber)}
.goal-head{border:1px solid var(--amberDim);background:rgba(245,166,35,.06);padding:10px;margin-bottom:12px}
.gh-zone{font-size:var(--f7);color:var(--amber);margin-bottom:6px}
.gh-text{font-size:var(--f6);color:var(--text2);line-height:2}
/* Portrait phones: every panel is a bottom sheet so the map stays visible above */
@media not ((orientation:landscape) and (max-height:600px)){
  .spanel{top:auto;left:0;right:0;width:auto;height:min(64vh,calc(100% - var(--hud-h) - var(--sat) - var(--tab-h) - var(--sab) - 40px));
    border-left:none;border-top:3px solid var(--border2);transform:translateY(calc(100% + var(--tab-h) + var(--sab)))}
  .spanel.open{transform:translateY(0);box-shadow:0 -10px 30px rgba(0,0,0,.6)} /* shadow only when open: a closed sheet sits under the tab bar and darkened it */
  .spanel .ph::before{content:'';position:absolute;left:50%;top:5px;width:40px;height:4px;margin-left:-20px;background:var(--border2)}
  .spanel .ph{position:relative;padding-top:14px}
}
/* ── FLOATING CONTROLS (outside #wrap so the canvas never eats their taps) ── */
#buildHUD{position:fixed;left:var(--cl);right:var(--cr);bottom:calc(var(--cb) + 10px);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;z-index:600;pointer-events:none;padding:0 12px}
#buildHUD button{pointer-events:all;font-family:var(--font);font-size:var(--f8);border-radius:4px;min-height:48px;min-width:84px;padding:12px 16px;cursor:pointer;background:rgba(13,13,13,.95)}
#buildRotateBtn{border:2px solid var(--amber);color:var(--amber)}
#buildConfirmBtn{border:2px solid var(--teal);color:var(--teal)}
#buildCancelBtn{border:1px solid var(--border2);color:var(--text2)}
#ghostBar{position:fixed;left:var(--cl);right:var(--cr);bottom:var(--cb);background:rgba(15,15,15,.97);border-top:2px solid var(--amber);padding:8px 12px;display:flex;align-items:center;gap:8px;z-index:600}
#ghostBar button{font-family:var(--font);font-size:var(--f7);padding:12px 18px;cursor:pointer;min-height:44px}
#ghostBar{flex-wrap:wrap}
#ghostBar .gb-t{padding:8px;min-width:44px;border:1px solid var(--border2);background:var(--bg3);box-shadow:inset -2px -2px 0 rgba(0,0,0,.45)}
#ghostBar .gb-t:active{border-color:var(--amber)}
#ghostBar .gb-t .uico{width:22px;height:22px}
#multiselBar{position:fixed;top:var(--ct);left:var(--cl);right:var(--cr);background:rgba(15,15,15,.97);border-bottom:2px solid #42a5f5;padding:6px 10px;z-index:600}
/* Tutorial: a floating card over the top of the map, collapsible to a pill */
#tutHint{position:fixed;top:calc(var(--ct) + 40px);left:calc(var(--cl) + 8px);right:calc(var(--cr) + 8px);max-width:560px;margin:0 auto;z-index:150;
  background:rgba(22,15,4,.95);border:1px solid var(--amber);box-shadow:0 4px 18px rgba(0,0,0,.6);padding:8px 10px;display:flex;gap:8px;align-items:flex-start}
#tutText{font-size:var(--f6);color:var(--amber);line-height:1.9;flex:1}
#tutMini{display:none;font-size:var(--f6);color:var(--amber);flex:1}
#tutHint.collapsed{right:auto;padding:6px 8px}
#tutHint.collapsed #tutText{display:none}
#tutHint.collapsed #tutMini{display:block}
.tut-btn{font-family:var(--font);font-size:var(--f5);padding:8px 10px;min-height:34px;border:1px solid var(--amberDim);background:transparent;color:var(--text2);cursor:pointer;flex-shrink:0}
#tutHint.collapsed .tut-skip{display:none}
.inv-chip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;background:var(--bg3);border:1px solid var(--border);text-align:center}
.inv-chip .n{font-size:var(--f4);color:var(--text3);line-height:1.4}

/* ── LANDSCAPE PHONES: tab bar becomes a left rail, drawer a side column ── */
@media (orientation:landscape) and (max-height:600px){
  :root{--hud-h:42px;--tab-h:0px}
  #sGame{display:grid;grid-template-columns:calc(76px + var(--sal)) auto minmax(0,1fr);grid-template-rows:calc(var(--hud-h) + var(--sat)) minmax(0,1fr)}
  #hud{grid-column:2/4;grid-row:1;padding-left:6px!important}
  #hudZones{display:none}
  #tabBar{grid-column:1;grid-row:1/3;flex-direction:column;height:auto;padding:calc(var(--sat) + 4px) 0 var(--sab) var(--sal);border-top:none;border-right:2px solid var(--border2)}
  .tab-btn{border-top:none;border-left:3px solid transparent}
  .tab-btn.active{border-left-color:var(--amber);border-top-color:transparent}
  #tabDrawer{grid-column:2;grid-row:2;max-height:none;width:0;transition:width .18s ease;border-top:none;border-right:1px solid var(--border2);display:flex;flex-direction:column}
  #tabDrawer.open{max-height:none;width:min(240px,32vw)}
  #drawerCats{flex-wrap:wrap;flex-shrink:0}
  #drawerItems{display:grid;grid-template-columns:repeat(2,1fr);overflow-y:auto;overflow-x:hidden;align-content:start;padding:6px}
  .ditem{min-width:0}
  #wrap{grid-column:3;grid-row:2}
  .spanel{top:calc(var(--hud-h) + var(--sat));bottom:0;width:min(440px,50vw);padding-bottom:var(--sab)}
  #resInfo{left:auto;width:min(360px,48vw)}
  #toasts{bottom:calc(var(--cb) + 16px)}
  .modal{width:min(520px,80vw)}
  #toolTip .tt-recipes,#toolTip .tt-desc{display:none}
}
/* Narrow portrait: drop the logo and zone tabs to give the HUD room */
@media (max-width:420px) and (orientation:portrait){#hudZones{display:none}.hud-logo{display:none}}
img.ico{width:1.7em;height:1.7em;image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle;display:inline-block}
.di img.ico{width:26px;height:26px}
.ii img.ico{width:22px;height:22px}
#resInfoIcon img.ico{width:30px;height:30px}
.tut-step{display:inline-block;color:var(--bg);background:var(--amber);padding:1px 4px;margin-right:6px;font-size:.9em}
.ach-cat{display:flex;justify-content:space-between;width:100%;font-family:var(--font);font-size:var(--f5);color:var(--text2);letter-spacing:1px;background:var(--bg3);border:1px solid var(--border2);padding:10px 8px;margin:6px 0 4px;cursor:pointer;text-align:left}
.ach-cat.full{color:var(--teal);border-color:var(--tealDim)}
.ach-row{display:flex;align-items:center;gap:8px;padding:7px;border:1px solid var(--border);background:var(--bg3);margin-bottom:3px}
.ach-row.done{border-color:var(--teal)}
.ach-ic{width:22px;flex-shrink:0;text-align:center;color:var(--text3)} .ach-ic img{width:20px;height:20px}
.ach-dim{opacity:.3;filter:grayscale(1)}
.ach-nm{font-size:var(--f5);color:var(--text2)} .ach-row.done .ach-nm{color:var(--teal)}
.ach-ds{font-size:var(--f4);color:var(--text3);margin-top:2px;line-height:1.6}
.rates{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.rate-h{font-size:var(--f5);letter-spacing:1px;margin-top:4px}.rate-h.ok{color:var(--teal)}.rate-h.use{color:var(--amber)}
.rate-row{display:flex;align-items:center;gap:6px;font-size:var(--f6);color:var(--text)}
.rate-row .ico{width:18px;height:18px}.rate-n{color:var(--text);min-width:34px;text-align:right}.rate-u{color:var(--text3)}.rate-name{color:var(--text2)}
.rate-note{font-size:var(--f4);color:var(--text3);line-height:1.8}
.tut-tally{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;color:var(--text2)}
.tut-tally .ok{color:var(--teal)}
.tut-go{font-family:var(--font);font-size:1em;margin-top:5px;padding:6px 12px;border:1px solid var(--amber);background:rgba(245,166,35,.15);color:var(--amber);cursor:pointer;display:block}

/* Panel close button, bigger hit area */
.ph-x{background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;padding:8px 12px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.ph-x:hover{color:var(--red)}

/* pbody zoom, clip overflow so content doesn't bleed */
.pbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;font-size:var(--f6);line-height:1.9}
#toolTip{
  position:absolute; bottom:118px; left:8px; /* clear of the cost bar and PLACE row */
  width:min(240px,60vw); max-height:45%; overflow:hidden;
  background:rgba(10,10,10,.93);
  border:1px solid var(--border2);
  padding:10px;
  pointer-events:none;
  z-index:90;
  transition:opacity .12s;
}
#toolTip.hidden{display:none}
.tt-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.tt-icon{font-size:18px;line-height:1;flex-shrink:0}
.tt-name{color:var(--amber);font-size:var(--f7)}
.tt-desc{font-size:var(--f5);color:var(--text2);line-height:1.9;margin-bottom:6px}
.tt-cost{font-size:var(--f5);color:var(--text3);margin-bottom:6px}
.tt-cost span{color:var(--amber)}
.tt-recipes{border-top:1px solid var(--border);padding-top:6px}
.tt-rlabel{font-size:var(--f4);color:var(--text3);letter-spacing:1px;margin-bottom:4px}
.tt-recipe{font-size:var(--f5);color:var(--text2);margin-bottom:4px;line-height:1.7;padding:4px;border:1px solid var(--border);background:var(--bg3)}
.tt-recipe .tt-rin{color:var(--blue)}
.tt-recipe .tt-rout{color:var(--amber)}
.tt-recipe .tt-rtime{color:var(--text3)}
#resInfo{
  position:fixed;left:var(--cl);right:var(--cr);bottom:var(--cb);
  z-index:300;transform:translateY(20px);
  opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;
}
#resInfo:not(.hidden){opacity:1;transform:translateY(0);pointer-events:all;}
#resInfoInner{
  background:var(--panel);border-top:1px solid var(--border2);
  box-shadow:0 -4px 24px rgba(0,0,0,.6);
  padding:10px 14px 12px;
}
#mineTapBtn{
  width:100%;margin-top:8px;
  padding:18px 12px;
  background:rgba(245,166,35,.08);
  border:2px solid var(--amber);
  color:var(--amber);
  font-family:var(--font);font-size:var(--f8);
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:background .1s;
  -webkit-tap-highlight-color:transparent;
}
#mineTapBtn:active{background:rgba(245,166,35,.22);}
#mineTapBtn.disabled{border-color:var(--border2);color:var(--text3);background:transparent;pointer-events:none;}
#minePips{display:flex;gap:8px;justify-content:center;}
.mine-pip{width:12px;height:12px;border-radius:50%;background:rgba(245,166,35,.2);border:1px solid var(--amberDim);transition:background .1s,border-color .1s;}
.mine-pip.filled{background:var(--amber);border-color:var(--amber);}
</style>
</head>
<body>

<!-- ══ TITLE ══ -->
<div id="sTitle" class="screen">
  <canvas id="titleCanvas"></canvas>
  <button id="titleMute" onclick="toggleTitleMusic()" title="Music">🔊</button>
  <div id="titleSoundHint">TAP FOR SOUND</div>
  <div class="title-glow"></div>
  <div id="titleCaption"></div>
  <div class="title-card">
    <span class="logo-icon" data-ui="factory"></span>
    <div class="logo">
      <span class="logo-8">8-BIT</span>
      <span class="logo-rest">INDUSTRY</span>
    </div>
    <p class="tagline">START WITH NOTHING · AUTOMATE EVERYTHING · LAUNCH</p>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:320px;margin:0 auto">
      <div id="titleSlots" style="width:100%"></div>
      <button class="btn" onclick="newGame()" style="width:100%">NEW GAME</button>
      <button class="btn" id="titleStardust" onclick="openStardustShop()" style="width:100%;display:none"><span data-ui="stardust"></span>STARDUST</button>
      <div style="display:flex;gap:8px;width:100%">
        <button class="btn btn-sm" id="titleInstall" onclick="installApp()" style="flex:1;display:none"><span data-ui="install"></span>INSTALL</button>
        <button class="btn btn-sm" onclick="openBackup()" style="flex:1"><span data-ui="backup"></span>BACKUP</button>
      </div>
    </div>
    <p class="v-num">v1.9.9 · 5 ZONES · IRONFIELD → THE SINGULARITY</p>
  </div>
</div>

<!-- ══ GAME ══ -->
<div id="sGame" class="screen hidden">
  <div id="hud">
    <button id="hudZone" class="hud-zone" onclick="switchTab('goal')" title="Zone goal">Z1 IRONFIELD</button>
    <div id="hudRes"></div>
    <button class="hbtn hbtn-speed" id="btnSpeed" onclick="cycleDevSpeed()" style="display:none">⏩×1</button>
    <button class="hbtn" onclick="openBigMenu()" title="Menu">☰</button>
  </div>
  <div id="wrap"><canvas id="canvas"></canvas>
    <div id="toolTip" class="hidden"></div>
  </div>
  <!-- Build mode controls, fixed, outside canvas touch zone, same pattern as ghostBar -->
  <div id="invStrip" onclick="showPanel('inv')" title="Inventory"></div>
  <div id="buildHUD" class="hidden">
    <div id="buildCost"></div>
    <button id="buildRotateBtn" onclick="cycleDir()" style="display:none">↻ →</button>
    <button id="buildConfirmBtn" onclick="confirmPlace()" style="display:none">✓ PLACE</button>
    <button id="buildCancelBtn" onclick="cancelBuild()">✕ CANCEL</button>
  </div>
  <div id="tutHint" class="hidden">
    <span id="tutText"></span>
    <span id="tutMini" onclick="toggleTutCollapse()"></span>
    <button class="tut-btn" id="tutToggle" onclick="toggleTutCollapse()" title="Minimise">▾</button>
    <button class="tut-btn tut-skip" onclick="skipTutorial()">SKIP</button>
  </div>
  <!-- Tab drawer, slides up above tab bar -->
  <div id="tabDrawer">
    <div id="drawerCats"></div>
    <div id="drawerItems"></div>
  </div>
  <!-- Tab bar, always visible, replaces old toolbar -->
  <div id="tabBar">
    <button class="tab-btn" id="tab-build"    onclick="switchTab('build')"><span class="tab-icon" data-ui="build"></span>BUILD</button>
    <button class="tab-btn" id="tab-tools"    onclick="switchTab('tools')"><span class="tab-icon" data-ui="edit"></span>EDIT</button>
    <button class="tab-btn" id="tab-craft"    onclick="switchTab('craft')"><span class="tab-icon" data-ui="craft"></span>CRAFT</button>
    <button class="tab-btn" id="tab-research" onclick="switchTab('research')"><span class="tab-icon" data-ui="research"></span>RESEARCH<span class="tab-badge" id="badge-research"></span></button>
    <button class="tab-btn" id="tab-goal"     onclick="switchTab('goal')"><span class="tab-icon" data-ui="goal"></span>GOAL<span class="tab-badge" id="badge-goal"></span></button>
  </div>
</div>

<!-- Multi-select action bar, fixed, outside canvas touch zone -->
<div id="multiselBar" class="hidden">
  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
    <span style="font-size:var(--f7);color:#42a5f5;flex:1;min-width:60px" id="multiselCount">0 selected</span>
    <button onclick="multiselStartMove()"  class="msel-btn teal"  id="multiselMoveBtn">✥ MOVE</button>
    <button onclick="multiselRotate()"     class="msel-btn blue"             >↻ ROTATE</button>
    <button onclick="multiselCopy()"       class="msel-btn amber" id="multiselCopyBtn">📋 COPY</button>
    <button onclick="multiselDemolish()"   class="msel-btn red"              >💥 DEMO</button>
    <button onclick="multiselClear()"      class="msel-btn dim"              >✕ CLEAR</button>
  </div>
</div>

<!-- Ghost paste confirm bar, shown during blueprint holding and multisel pasting -->
<div id="ghostBar" class="hidden">
 <span style="font-size:var(--f6);color:var(--amber);flex:1 1 100%" id="ghostBarLabel">Tap map to position, then confirm</span>
  <button class="gb-t" onclick="transformGhost('rot')" title="Rotate the whole layout"><span data-ui="rotate"></span></button>
  <button class="gb-t" onclick="transformGhost('h')" title="Flip left and right"><span data-ui="fliph"></span></button>
  <button class="gb-t" onclick="transformGhost('v')" title="Flip up and down"><span data-ui="flipv"></span></button>
  <button onclick="ghostConfirm()" style="border:2px solid var(--amber);background:rgba(245,166,35,.15);color:var(--amber);min-width:80px">✓ PLACE</button>
  <button onclick="ghostCancel()" style="border:1px solid var(--border2);background:transparent;color:var(--text2)">✗ CANCEL</button>
</div>

<!-- ══ PANELS ══ -->
<div id="pCraft" class="spanel">
  <div class="ph"><span class="ph-title"><span data-ui="craft"></span>HAND CRAFT</span><button class="ph-x" onclick="togglePanel('craft')">✕</button></div>
  <div class="pbody" id="pCraftBody"></div>
</div>

<div id="pInv" class="spanel">
  <div class="ph"><span class="ph-title"><span data-ui="inventory"></span>INVENTORY</span><button class="ph-x" onclick="togglePanel('inv')">✕</button></div>
  <div class="pbody" id="pInvBody"></div>
</div>

<div id="pResearch" class="spanel">
  <div class="ph"><span class="ph-title"><span data-ui="research"></span>RESEARCH</span><button class="ph-x" onclick="togglePanel('research')">✕</button></div>
  <div class="pbody" id="pResBody"></div>
</div>

<div id="pRocket" class="spanel">
  <div class="ph"><span class="ph-title" id="pRocketTitle"><span data-ui="goal"></span>GOAL</span><button class="ph-x" onclick="togglePanel('rocket')">✕</button></div>
  <div class="pbody" id="pRocketBody"></div>
</div>

<div id="pMachine" class="spanel">
  <div class="ph"><span class="ph-title" id="pMachTitle"><span data-ui="settings"></span>MACHINE</span><button class="ph-x" onclick="togglePanel('machine')">✕</button></div>
  <div class="pbody" id="pMachBody"></div>
</div>

<div id="pDev" class="spanel" style="border-color:var(--purple)">
  <div class="ph" style="border-color:var(--purple)">
    <span class="ph-title" style="color:var(--purple)"><span data-ui="dev"></span>DEV MODE</span>
    <button class="ph-x" onclick="togglePanel('dev')">✕</button>
  </div>
  <div class="pbody" id="pDevBody"></div>
</div>

<div id="pPerks" class="spanel">
  <div class="ph"><span class="ph-title"><span data-ui="perks"></span>PERKS</span><button class="ph-x" onclick="togglePanel('perks')">✕</button></div>
  <div class="pbody" id="pPerksBody"></div>
</div>

<div id="pStats" class="spanel">
  <div class="ph"><span class="ph-title"><span data-ui="stats"></span>STATISTICS</span><button class="ph-x" onclick="togglePanel('stats')">✕</button></div>
  <div class="pbody" id="pStatsBody"></div>
</div>

<div id="pAchieve" class="spanel">
  <div class="ph"><span class="ph-title"><span data-ui="achievements"></span>ACHIEVEMENTS</span><button class="ph-x" onclick="togglePanel('achieve')">✕</button></div>
  <div class="pbody" id="pAchieveBody"></div>
</div>

<div id="pRecipes" class="spanel">
  <div class="ph"><span class="ph-title"><span data-ui="recipes"></span>RECIPE BOOK</span><button class="ph-x" onclick="togglePanel('recipes')">✕</button></div>
  <div class="pbody" id="pRecipesBody"></div>
</div>

<div id="pBlueprint" class="spanel">
  <div class="ph"><span class="ph-title"><span data-ui="blueprints"></span>BLUEPRINTS</span><button class="ph-x" onclick="togglePanel('blueprint')">✕</button></div>
  <div class="pbody" id="pBlueprintBody"></div>
</div>

// ═══════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════

// Smog removed per scrubber every 4 ticks, one scrubber cancels ~3 oil pumps (each +0.5 per 8 ticks)
const SCRUBBER_SMOG = 0.75;

const T_FLOOR    = 0;
const T_RESOURCE = 1;

const D_RIGHT = 0;
const D_DOWN  = 1;
const D_LEFT  = 2;
const D_UP    = 3;
const D_VEC   = [[1,0],[0,1],[-1,0],[0,-1]];
const D_ARR   = ['→','↓','←','↑'];

// ═══════════════════════════════════════════════════
//  SOUND ENGINE  (Web Audio, no files needed)
// ═══════════════════════════════════════════════════
let _ac = null;
function ac() {
  if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
  return _ac;
}

// Short vibrations matched to the sound effects (Android; iPhone browsers have no vibration API)
const HAPTICS={tap:8,place:14,remove:[16,30,16],craft:12,research:[20,40,30],launch:[60,40,140],error:[30,40,30]};
function haptic(type){
  if(PREFS.haptics===false||!navigator.vibrate)return;
  const pat=HAPTICS[type]; if(pat)try{navigator.vibrate(pat);}catch(e){}
}
function sfx(type) {
  haptic(type);
  if (!G || !G.sfx) return;
  try {
    const ctx = ac();
    const g = ctx.createGain();
    g.connect(ctx.destination);
    const o = ctx.createOscillator();
    o.connect(g);
    const now = ctx.currentTime;
    const cfg = {
      tap:    {f:440, f2:660, t:.06, v:.08, wave:'square'},
      place:  {f:330, f2:440, t:.1,  v:.1,  wave:'square'},
      remove: {f:220, f2:110, t:.12, v:.08, wave:'sawtooth'},
      craft:  {f:523, f2:784, t:.15, v:.1,  wave:'square'},
      research:{f:659,f2:988, t:.2,  v:.1,  wave:'square'},
      launch: {f:220, f2:880, t:.6,  v:.15, wave:'sawtooth'},
      error:  {f:180, f2:120, t:.1,  v:.06, wave:'sawtooth'},
    }[type] || {f:440,f2:440,t:.08,v:.05,wave:'square'};
    o.type = cfg.wave;
    o.frequency.setValueAtTime(cfg.f, now);
    o.frequency.exponentialRampToValueAtTime(cfg.f2, now + cfg.t);
    g.gain.setValueAtTime(cfg.v, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + cfg.t);
    o.start(now); o.stop(now + cfg.t);
  } catch(e) {}
}

// ═══════════════════════════════════════════════════
//  MUSIC ENGINE  (Factory Pulse, 2m10s structured track)
// ═══════════════════════════════════════════════════
let _music={nodes:[],gain:null,running:false,loopId:null};

const _MNOTE=0.3;  // seconds per 16th-note slot
const _MBAR=8*_MNOTE; // 8 slots per bar
const _MEL_VOL=0.022;  // melody volume (softened)
const _BASS_VOL=0.030; // bass volume

// Pentatonic in C across 2 octaves: C3 E3 G3 A3 C4 E4 G4 A4 C5
const _MP=[130.81,164.81,196.00,220.00,261.63,329.63,392.00,440.00,523.25];

const _MSECTIONS=[
  {bars:8,  style:'intro'},
  {bars:16, style:'A'},
  {bars:16, style:'C'},
  {bars:8,  style:'D'},
  {bars:12, style:'E'},
  {bars:16, style:'C'},
  {bars:8,  style:'outro'},
];

const _MPAT={
  intro:[[4,null,null,null,5,null,null,null],[null,null,3,null,null,null,4,null]],
  A:    [[4,null,5,null,4,null,3,null],[4,5,null,3,4,null,5,null]],
  B:    [[4,null,5,null,6,null,5,null],[5,null,4,null,3,null,4,null]],
  C:    [[4,5,4,3,4,5,6,5],[5,4,5,6,5,4,3,4]],
  D:    [[null,null,null,null,null,null,null,null]],
  E:    [[4,null,5,null,4,null,6,null],[5,null,4,null,5,null,3,null]],
  outro:[[4,null,null,null,3,null,null,null],[null,null,2,null,null,null,null,null]],
};
const _MBASS={
  intro:[0,null,null,null,0,null,null,null],
  A:    [0,null,null,null,2,null,null,null],
  B:    [0,null,2,null,0,null,2,null],
  C:    [0,null,2,null,3,null,2,null],
  D:    [0,null,null,0,null,null,0,null],
  E:    [0,null,null,null,2,null,null,null],
  outro:[0,null,null,null,null,null,null,null],
};

function _buildMusicSchedule(){
  const sched=[];
  let t=0;
  for(const sec of _MSECTIONS){
    const pat=_MPAT[sec.style];
    const bass=_MBASS[sec.style];
    const isIntro=sec.style==='intro', isOutro=sec.style==='outro';
    for(let bar=0;bar<sec.bars;bar++){
      const p=pat[bar%pat.length];
      const fadeVol=isIntro?Math.min(1,bar/4):isOutro?Math.max(0.05,1-(bar/sec.bars)):1;
      for(let n=0;n<8;n++){
        const nt=t+n*_MNOTE;
        if(p[n]!==null){
          const v=_MEL_VOL*(sec.style==='C'||sec.style==='E'?1.2:1)*fadeVol;
          sched.push({t:nt,f:_MP[p[n]],d:_MNOTE*0.75,v,w:'square'});
        }
        if(bass[n]!==null&&(!isIntro&&!isOutro||bar>1)){
          sched.push({t:nt,f:_MP[bass[n]]*0.5,d:_MNOTE*1.6,v:_BASS_VOL*fadeVol,w:'triangle'});
        }
        if(sec.style==='C'&&n%2===0){
          sched.push({t:nt,f:880,d:0.04,v:0.01,w:'square'});
        }
      }
      t+=_MBAR;
    }
  }
  return sched;
}

const _MSCHED=_buildMusicSchedule();
const _MTOTAL=_MSCHED.length?_MSCHED[_MSCHED.length-1].t+1:130;

function musicStart(){
  if(_music.running)return;
  try{
    const ctx=ac();
    const mg=ctx.createGain();
    mg.gain.setValueAtTime(G&&G.musicVol!==undefined?G.musicVol:0.7,ctx.currentTime);
    mg.connect(ctx.destination);
    _music.gain=mg;
    _music.running=true;
    _scheduleTrack(ctx.currentTime);
  }catch(e){}
}

function _scheduleTrack(startTime){
  if(!_music.running)return;
  const ctx=ac();
  _music.nodes=[];
  for(const n of _MSCHED){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=n.w;
    o.frequency.setValueAtTime(n.f,startTime+n.t);
    g.gain.setValueAtTime(n.v,startTime+n.t);
    g.gain.exponentialRampToValueAtTime(0.001,startTime+n.t+n.d);
    o.connect(g); g.connect(_music.gain);
    o.start(startTime+n.t);
    o.stop(startTime+n.t+n.d+0.05);
    _music.nodes.push(o);
  }
  // Loop: reschedule just before track ends
  const loopDelay=(_MTOTAL-0.5)*1000;
  _music.loopId=setTimeout(()=>{
    if(_music.running) _scheduleTrack(ac().currentTime+0.1);
  },loopDelay);
}

function musicStop(){
  _music.running=false;
  if(_music.loopId){clearTimeout(_music.loopId);_music.loopId=null;}
  for(const n of _music.nodes){try{n.stop();}catch(e){}}
  _music.nodes=[];
  if(_music.gain){
    try{
      _music.gain.gain.exponentialRampToValueAtTime(0.001,ac().currentTime+0.4);
      setTimeout(()=>{try{_music.gain.disconnect();}catch(e){}},500);
    }catch(e){}
    _music.gain=null;
  }
}

function toggleMusic(){
  G.music=!G.music; saveGame();
  PREFS.music=G.music; savePrefs(); // the title screen follows your last choice
  if(G.music) musicStart(); else musicStop();
  openSettings();
}

function setMusicVol(v){
  G.musicVol=parseFloat(v);
  if(_music.gain){
    try{_music.gain.gain.setValueAtTime(G.musicVol,ac().currentTime);}catch(e){}
  }
  saveGame();
  // Update slider display without reopening modal
  const sl=document.getElementById('musicVolSlider');
  if(sl)sl.value=G.musicVol;
  const lbl=document.getElementById('musicVolLabel');
  if(lbl)lbl.textContent=Math.round(G.musicVol*100)+'%';
}
// Title screen music: browsers only allow audio after a tap, so it starts on the first one
function onTitle(){const t=document.getElementById('sTitle');return !!t&&!t.classList.contains('hidden');}
function titleMusic(){if(PREFS.music!==false&&!_music.running)musicStart();updateTitleMute();}
// Browsers only let audio start on a user activation, and the start of a touch (pointerdown) is not one:
// a context created then stays 'suspended' for good (silent music and sound effects). Tap release, click
// and key press do count, so resume there. Phones also suspend audio when the app is switched away, and
// this wakes it again on the next tap.
function unlockAudio(e){
  try{if(_ac&&_ac.state!=='running')_ac.resume().then(updateTitleMute).catch(()=>{});}catch(err){}
  // a first tap on the speaker button is left to that button (it used to start the music, then mute it)
  if(e&&e.target&&e.target.closest&&e.target.closest('#titleMute'))return;
  if(onTitle()&&!_music.running&&PREFS.music!==false)titleMusic();
}
// Play the title music straight away where the browser allows it (Chrome does for apps installed to the
// home screen); otherwise the first tap starts it and the speaker shows TAP FOR SOUND until then
function tryTitleAutoplay(){
  if(PREFS.music===false)return;
  try{const c=ac(); c.resume().then(()=>{if(c.state==='running'&&onTitle())titleMusic();updateTitleMute();}).catch(()=>{});}catch(e){}
  updateTitleMute();
}
for(const ev of['pointerup','touchend','click','keydown'])document.addEventListener(ev,unlockAudio,{capture:true,passive:true});
function toggleTitleMusic(){
  try{if(_ac&&_ac.state!=='running')_ac.resume().catch(()=>{});}catch(e){}
  // Music on but not actually playing (blocked or stopped): this tap starts it rather than muting
  if(PREFS.music!==false&&!_music.running){musicStart();updateTitleMute();return;}
  PREFS.music=PREFS.music===false; savePrefs();
  if(PREFS.music)musicStart(); else musicStop();
  updateTitleMute();
}
function updateTitleMute(){
  const b=document.getElementById('titleMute');if(b)b.innerHTML=uiIcon(PREFS.music===false?'mute':'sound');
  const h=document.getElementById('titleSoundHint');
  if(h)h.classList.toggle('hidden',PREFS.music===false||(!!_ac&&_ac.state==='running'&&_music.running));
}
function toggleSfxMenu(){
  G.sfx=!G.sfx; saveGame();
  openSettings();
}

// Visibility change, pause/resume music
// and save, so swiping the app away never loses the last 30 seconds
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    musicStop();
    if(G&&tickId)saveGame();
  } else {
    try{if(_ac&&_ac.state!=='running')_ac.resume().catch(()=>{});}catch(e){}
    if(onTitle())titleMusic();
    else if(G&&G.music&&_music&&!_music.running) musicStart();
  }
});

// Zone-only recipes: a hand craft with zone:n, or a machine recipe named zN_… Each is available in
// its own zone and in Zone 5, which brings every chain together (Void Theory needs all the notes).
function recipeZone(id){const h=HAND_CRAFTS.find(c=>c.id===id);if(h)return h.zone||0;const m=/^z(\d)_/.exec(id);return m?+m[1]:0;}
function zoneRecipeOk(id){const z=recipeZone(id);return !z||z===G.zone||G.zone===5;}

function buildMap() {
  const map = [];
  for (let y=0;y<MAP_H;y++){
    map[y]=[];
    for(let x=0;x<MAP_W;x++)
      map[y][x]={type:T_FLOOR,res:null,mid:null,items:[]};
  }
  // Procedural generation: guaranteed deposits near centre, randomised positions each game
  const rng=(seed=>{let s=seed;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;}})(Date.now()^0xdeadbeef);
  const ri=(lo,hi)=>lo+Math.floor(rng()*(hi-lo+1));
  const safe=(x,y,w,h)=>{
    for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++){
      const tx=x+dx,ty=y+dy;
      if(tx<2||ty<2||tx+1>=MAP_W||ty+1>=MAP_H)return false;
      if(map[ty][tx].type===T_RESOURCE)return false;
    }
    return true;
  };
  const place=(res,w,h)=>{
    for(let attempt=0;attempt<200;attempt++){
      const x=ri(10,MAP_W-w-10),y=ri(10,MAP_H-h-10);
      if(safe(x,y,w,h)){
        for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++)
          map[y+dy][x+dx]={type:T_RESOURCE,res,mid:null,items:[]};
        return true;
      }
    }
    return false;
  };
  // Guaranteed deposits, enough of each type to complete the game
  // Iron: 4 patches (most needed), Copper: 3, Coal: 4 (fuel + propellant), Stone: 3
  const guaranteed=[
    // Iron ore, most critical, 4 large patches
    {res:'iron_ore',   w:ri(6,8), h:ri(5,6)},
    {res:'iron_ore',   w:ri(5,7), h:ri(4,5)},
    {res:'iron_ore',   w:ri(5,6), h:ri(4,5)},
    {res:'iron_ore',   w:ri(4,5), h:ri(3,4)},
    // Copper ore, 3 patches
    {res:'copper_ore', w:ri(5,7), h:ri(4,5)},
    {res:'copper_ore', w:ri(5,6), h:ri(3,5)},
    {res:'copper_ore', w:ri(4,5), h:ri(3,4)},
    // Coal, 4 patches (fuel for burners, furnaces, propellant)
    {res:'coal',       w:ri(5,7), h:ri(4,5)},
    {res:'coal',       w:ri(5,6), h:ri(3,5)},
    {res:'coal',       w:ri(4,5), h:ri(3,4)},
    {res:'coal',       w:ri(3,5), h:ri(3,4)},
    // Stone, 3 patches
    {res:'stone',      w:ri(5,6), h:ri(4,5)},
    {res:'stone',      w:ri(4,5), h:ri(3,4)},
    {res:'stone',      w:ri(3,4), h:ri(3,3)},
  ];
  for(const d of guaranteed) place(d.res,d.w,d.h);
  return map;
}

  const rng=(seed=>{let s=seed;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;}})(Date.now()^salt);
  const ri=(lo,hi)=>lo+Math.floor(rng()*(hi-lo+1));
  const safe=(x,y,dw,dh)=>{
    for(let dy=-1;dy<=dh;dy++)for(let dx=-1;dx<=dw;dx++){
      const tx=x+dx,ty=y+dy;
      if(tx<2||ty<2||tx+1>=w||ty+1>=h)return false;
      if(map[ty][tx].type===T_RESOURCE)return false;
    }
    return true;
  };
  for(const[res,w0,w1,h0,h1]of deposits){
    const dw=ri(w0,w1), dh=ri(h0,h1);
    for(let attempt=0;attempt<200;attempt++){
      const x=ri(8,w-dw-8), y=ri(8,h-dh-8);
      if(!safe(x,y,dw,dh)||(accept&&!accept(x,y,dw,dh)))continue;
      for(let dy=0;dy<dh;dy++)for(let dx=0;dx<dw;dx++)
        map[y+dy][x+dx]={type:T_RESOURCE,res,mid:null,items:[]};
      break;
    }
  }
  return map;
}

// ═══════════════════════════════════════════════════
//  PIXEL SPRITES
//  Every texture is drawn procedurally, pixel by pixel, into a tiny offscreen
//  canvas (16px per tile, 12px per item), cached by key, then scaled up with
//  smoothing off. No image files.
// ═══════════════════════════════════════════════════
const TEX_PIXEL=true; // pixel art is the only style; emoji remain only where no sprite exists (tools, techs)
const SPR={}, SPR_URL={};

function hash2(x,y,s){
  let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041))|0;
  h=Math.imul(h^(h>>>13),1274126177);
  return ((h^(h>>>16))>>>0)/4294967296;
}
// f>0 mixes toward white, f<0 toward black
function shade(hex,f){
  const n=parseInt(hex.slice(1),16), t=f<0?0:255, a=Math.abs(f);
  const c=v=>Math.round(v+(t-v)*a);
  return '#'+((1<<24)|(c(n>>16)<<16)|(c(n>>8&255)<<8)|c(n&255)).toString(16).slice(1);
}
function mkSpr(key,w,h,fn){
  if(SPR[key])return SPR[key];
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  const P=(x,y,col)=>{if(x<0||y<0||x>=w||y>=h)return;g.fillStyle=col;g.fillRect(x|0,y|0,1,1);};
  const R=(x,y,ww,hh,col)=>{g.fillStyle=col;g.fillRect(x|0,y|0,ww|0,hh|0);};
  const C=(cx,cy,r,col)=>{for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*.6)P(cx+x,cy+y,col);};
  const O=(cx,cy,r,col)=>{for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){const d=x*x+y*y;if(d<=r*r+r*.6&&d>=(r-1)*(r-1)+(r-1)*.6)P(cx+x,cy+y,col);}};
  const L=(x0,y0,x1,y1,col)=>{x0|=0;y0|=0;x1|=0;y1|=0;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
    for(;;){P(x0,y0,col);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}};
  fn({g,P,R,C,O,L,w,h});
  return SPR[key]=c;
}
function sprURL(key,canvas){return SPR_URL[key]||(SPR_URL[key]=canvas.toDataURL());}

const GROUND={
  1:{base:'#2a2019',a:'#33271d',b:'#211913',speck:'#4d3828'},   // rust earth
  2:{base:'#1f1d1b',a:'#282522',b:'#171514',speck:'#3d301c'},   // ash and slag

function groundSpr(zone,v){
  return mkSpr(`g${zone}:${v}`,16,16,({P,R})=>{
    const p=GROUND[zone]||GROUND[1];
    R(0,0,16,16,p.base);
    for(let y=0;y<16;y++)for(let x=0;x<16;x++){
      const n=hash2(x,y,v*31+zone);
      if(n<.16)P(x,y,p.a); else if(n>.9)P(x,y,p.b);
      if(n>.988)P(x,y,p.speck);
    }
    // soft tile seam so the grid still reads
    R(0,15,16,1,shade(p.base,-.25)); R(15,0,1,16,shade(p.base,-.25));
  });
}

const ORE_ART={
  iron_ore:  {rock:'#6a7486',hi:'#c4d0e2',dk:'#262a31',fleck:'#9aa8bc'},
  copper_ore:{rock:'#8c4c28',hi:'#e09050',dk:'#4a2614',fleck:'#3d9a72'},

function resSpr(res,v,f){
  const animated=['oil','brine','enzymes','luminite','radiant_dust'].includes(res);
  const fr=animated?f%4:0;
  return mkSpr(`r:${res}:${v}:${fr}`,16,16,({P,R,C})=>{
    const H=(x,y,s=0)=>hash2(x,y,v*17+s);
    const pool=(deep,mid,lite)=>{
      R(0,0,16,16,mid);
      for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(H(x,y,3)<.12)P(x,y,deep);
      // little "~" wave crests that drift sideways frame to frame
      for(let k=0;k<3;k++){
        const ox=(Math.floor(H(k,v,8)*16)+fr*2)%16, oy=2+k*5+Math.floor(H(k,v,9)*2);
        P(ox,oy,lite);P((ox+1)%16,oy-1,lite);P((ox+2)%16,oy-1,lite);P((ox+3)%16,oy,shade(lite,-.3));
      }
    };
    if(ORE_ART[res]){
      const a=ORE_ART[res];
      R(0,0,16,16,a.dk);
      for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(H(x,y)<.25)P(x,y,shade(a.dk,.08));
      for(let k=0;k<6;k++){
        const cx=2+Math.floor(H(k,1,5)*12), cy=2+Math.floor(H(k,2,5)*12), r=1+Math.floor(H(k,3,5)*2);
        C(cx,cy,r,a.rock); P(cx-1,cy-1,a.hi); if(r>1)P(cx-r+1,cy-1,a.hi); P(cx+1,cy+r-1,a.dk);
        if(a.fleck&&H(k,4,5)>.5)P(cx,cy,a.fleck);
      }
    } else if(res==='quartz'||res==='luminite'){
      const lum=res==='luminite';
      const body=lum?'#2aa08e':'#9db0e8', hi=lum?(fr%2?'#b8fff0':'#6affd0'):'#eef3ff', dk=lum?'#145a50':'#5a6aa8';
      R(0,0,16,16,lum?'#0f1f22':'#1a1c2a');
      for(let k=0;k<4;k++){
        const bx=1+Math.floor(H(k,1,7)*12), h=4+Math.floor(H(k,2,7)*6), by=15-Math.floor(H(k,3,7)*4);
        for(let i=0;i<h;i++){P(bx,by-i,body);P(bx+1,by-i,i<h-1?dk:body);}
        P(bx,by-h,hi); P(bx,by-h+1,hi);
      }
    } else if(res==='radiant_dust'){
      R(0,0,16,16,'#3a3416');
      for(let y=0;y<16;y++)for(let x=0;x<16;x++){const n=H(x,y);if(n<.3)P(x,y,'#4f4720');
        if(n>.95&&((x+y+fr)%3===0))P(x,y,'#fff27a');}
    } else if(res==='biomass'){
      R(0,0,16,16,'#13291a');
      for(let k=0;k<7;k++){const x=Math.floor(H(k,1,4)*14)+1,y=Math.floor(H(k,2,4)*14)+1;
        P(x,y,'#3f9a3f');P(x+1,y,'#5fcf55');P(x,y+1,'#2e7a2e');P(x-1,y+1,'#2e7a2e');}
    } else if(res==='spores'){
      R(0,0,16,16,'#1e1424');
      for(let k=0;k<4;k++){const x=Math.floor(H(k,1,6)*12)+2,y=Math.floor(H(k,2,6)*10)+4;
        P(x,y+1,'#d8c8b0');P(x,y+2,'#d8c8b0');R(x-1,y-1,3,2,'#9a4ab0');P(x,y-1,'#e090f0');}
    } else if(res==='oil'){
      pool('#050403','#100c08','#5a4a8a');
      P((3+fr*3+v)%16,(9+v)%16,'#3a7a6a'); // oily rainbow glint
    } else if(res==='brine'){
      pool('#09364d','#0e4a66','#7fdbff');
    } else if(res==='enzymes'){
      pool('#3e520a','#5a7410','#c6ff00');
      C(4+((fr*3+v)%8),6+(v%5),1,'#9ad21a');
    } else {
      R(0,0,16,16,RES_COL[res]||'#333');
    }
  });
}

// Which machines show animated frames, and when they count as working
function machineWorking(m){
  const def=MDEFS[m.type];
  if(!m.active)return false;
  if(m.type==='generator'||m.type==='burner')return (m.inBuf.coal||0)>0;
  if(m.type==='combustion_gen')return (m.inBuf.refined_fuel||0)>0;
  if(m.type==='reactor')return (m.inBuf.lum_rod||0)>0&&!(m.scram>0);
  if(m.type==='lumen_panel')return glowBright();
  if(m.type==='miner'||m.type==='oil_pump'||def.pumps)return !!m.mineRes&&powerRatio()>0;
  if(m.type==='scrubber')return (m.inBuf.refined_fuel||0)>0&&(G.smog||0)>0;
  if(m.type==='fluid_tank')return (m.fluid?.amt||0)>0.5;
  if(m.type==='relief_valve')return !!m._net&&pressureOf(m._net)>RELIEF_AT;
  if(m.type==='accumulator')return (m.charge||0)>1;
  if(m.type==='chest')return Object.values(m.chestInv).some(v=>v>0);
  if(m.type==='heat_sink')return machineNeighbors(m).some(n=>n.type==='reactor'&&machineWorking(n));
  if(def.living&&m.withered)return false;
  return m.prog>0;
}
function machineSpr(type,frame,on){
  const art=MACHINE_ART[type]; if(!art)return null;
  const[w,h]=MDEFS[type].size, sw=type==='singularity'?80:w*16, sh=type==='singularity'?80:h*16;
  const fr=on?frame%4:0;
  return mkSpr(`m:${type}:${fr}:${on?1:0}`,sw,sh,a=>art(a,fr,on));
}
// Belt tread: drawn facing right, rotated at draw time; 4 frames scroll the ridges
function beltSpr(fr){
  return mkSpr(`belt:${fr}`,16,16,({R,P})=>{
    R(0,0,16,16,'#1a1a1a'); R(0,2,16,12,'#2b2b2b');
    for(let x=0;x<16;x++){if((x+fr)%4===0)R(x,3,1,10,'#3c3c3c');}

    for(let x=2;x<16;x+=8){P(x+fr*2%8,1,'#f5a623');}

// Belt corner, drawn for a belt facing right. turn 1: fed from the top; turn 3: fed from the bottom.
// Each pixel takes the straight tread's colour by its radius (across the belt) and angle (along it),
// so rails, ridges and the amber studs line up with the straight belts on both sides.
function beltCornerSpr(fr,turn){
  return mkSpr(`beltc:${turn}:${fr}`,16,16,({P})=>{
    const cy=turn===1?0:16;
    for(let y=0;y<16;y++)for(let x=0;x<16;x++){
      const dx=x+.5-16, dy=y+.5-cy, r=Math.hypot(dx,dy); if(r>=16)continue;
      const ang=Math.atan2(dy,dx);
      const along=Math.floor((turn===1?Math.PI-ang:ang+Math.PI)/(Math.PI/2)*16);
      const yv=turn===1?Math.floor(r):15-Math.floor(r);
      let c='#2b2b2b';
      if(yv===0||yv===15)c='#0e0e0e';
      else if(yv===1)c=((along-2-fr*2)%8+8)%8===0?'#f5a623':'#5a5a5a';
      else if(yv===14)c='#5a5a5a';
      else if(yv>=3&&yv<=12&&(along+fr)%4===0)c='#3c3c3c';
      P(x,y,c);
    }
  });
}
// Where an item sits on a belt tile at progress p (0 entering, 1 leaving), in tiles from the centre
function beltItemPos(dir,turn,p){
  let u=p-.5,v=0;
  if(turn){const s=turn===1?-1:1, a=Math.PI+s*p*Math.PI/2; u=.5+.5*Math.cos(a); v=s*.5+.5*Math.sin(a);}
  return [[u,v],[-v,u],[-u,-v],[v,-u]][dir];
}

// Draw an item on the canvas centred at (x,y), size sz

function insBaseSpr(long){
  return mkSpr(`insb:${long?1:0}`,16,16,({R,P,C,O})=>{

const INS_ARM_LEN={inserter:8,long_inserter:14};
function insArmSpr(long,state){ // state 0 empty, 1 holding, 2 blocked
  const L=long?INS_ARM_LEN.long_inserter:INS_ARM_LEN.inserter;
  return mkSpr(`insa:${long?1:0}:${state}`,L+2,5,({R,P})=>{
    const c=long?['#26c6a0','#b8fff0','#127a64']:['#f5a623','#ffd27a','#a86c08'];
    R(1,1,L-2,3,c[0]); R(1,1,L-2,1,c[1]); R(1,3,L-2,1,c[2]);

    const claw=state===2?'#e53935':'#b0b0b0';

// Every item's and machine's old emoji icon maps to its sprite too, so any leftover text emoji has a pixel twin
const noVS=e=>e.replace(/\uFE0F/g,'');
let EMOJI_RE=null, EMOJI_N=null;
function emojiTable(){
  if(EMOJI_RE)return;
  EMOJI_N={};
  for(const[k,v]of Object.entries(EMOJI_PIX))EMOJI_N[noVS(k)]=v;
  for(const tbl of[ITEMS,MDEFS])for(const[id,d]of Object.entries(tbl)){const e=d.icon&&noVS(d.icon);if(e&&!EMOJI_N[e]&&anySpr(id))EMOJI_N[e]=id;}
  const keys=Object.keys(EMOJI_N).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\uFE0F?');

    for(const x of[3,5,7])M('miner',x,4); for(const x of[3,5,7])M('miner',x,6);

    for(let x=12;x<30;x+=3){M('inserter',x,7,3);M('stone_furnace',x,6);}
    for(const x of[3,5])M('miner',x,12); B([[2,14],[11,14],[11,9]],['coal']);

function drawTitle(t){
  const cv=TITLE.canvas, g=TITLE.ctx, S=TITLE.scene; if(!cv||!S)return;
  const dpr=Math.min(2,window.devicePixelRatio||1)*PREFS.res;
  const cw=cv.clientWidth, ch=cv.clientHeight;
  if(cv.width!==Math.round(cw*dpr)||cv.height!==Math.round(ch*dpr)){cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);}
  g.setTransform(dpr,0,0,dpr,0,0); g.imageSmoothingEnabled=false;
  const el=t-TITLE.t0, k=el/TITLE_SCENE_MS;
  // tile size: the scene always fills the screen height with a little room to pan
  const ts=Math.max(24,Math.ceil(ch/(S.h-2)));
  const worldW=S.w*ts, worldH=S.h*ts;
  const span=Math.max(0,worldW-cw);
  const camX=span*Math.min(1,S.cam0+.4*(S.dir>0?k:1-k));
  const camY=Math.max(0,(worldH-ch)/2+Math.sin(k*Math.PI)*ts*.6);
  g.fillStyle='#0d0d0d'; g.fillRect(0,0,cw,ch);
  g.drawImage(S.ground,-camX,-camY,worldW,worldH);
  const fr=Math.floor(t/140)&3;
  // animated deposits on top of the cached ground
  for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){
    const r=S.res[y][x]; if(!r||!ANIM_RES.has(r))continue;
    const px=x*ts-camX, py=y*ts-camY; if(px<-ts||py<-ts||px>cw||py>ch)continue;
    g.drawImage(resSpr(r,(x*7+y*13)&3,Math.floor(t/750)),Math.floor(px),Math.floor(py),Math.ceil(ts)+1,Math.ceil(ts)+1);
  }
  for(const p of S.pipes)g.drawImage(machineSpr('pipe',fr,true),Math.floor(p.x*ts-camX),Math.floor(p.y*ts-camY),Math.ceil(ts),Math.ceil(ts));
  // belts and the items riding them
  for(const b of S.belts){
    for(const c of b.path){
      const px=c.x*ts-camX+ts/2, py=c.y*ts-camY+ts/2;
      g.save(); g.translate(px,py); g.rotate(c.dir*Math.PI/2);
      const bf=Math.floor(t/1000*b.speed*8)&3;
      g.drawImage(c.turn?beltCornerSpr(bf,c.turn):beltSpr(bf),-ts/2,-ts/2,ts+.5,ts+.5); g.restore();
    }
    const L=b.path.length, off=(t/1000*b.speed)%0.5;
    for(let s=off,i=0;s<L-1;s+=0.5,i++){
      const c=b.path[Math.floor(s)], [ox,oy]=beltItemPos(c.dir,c.turn||0,s-Math.floor(s));
      drawItem(g,b.items[(i+Math.floor(t/1000*b.speed*2))%b.items.length],c.x*ts-camX+ts/2+ox*ts,c.y*ts-camY+ts/2+oy*ts,ts*.42);
    }
  }
  // machines, always working
  for(const m of S.mach){
    const[w,h]=MDEFS[m.type].size, px=m.x*ts-camX, py=m.y*ts-camY;
    if(px>cw||py>ch||px+w*ts<0||py+h*ts<0)continue;
    const spr=machineSpr(m.type,(fr+m.ph)&3,true);
    if(m.type==='inserter'){g.save();g.translate(px+ts/2,py+ts/2);g.rotate((m.dir+1)*Math.PI/2);g.drawImage(spr,-ts/2,-ts/2,ts,ts);g.restore();continue;}
    g.drawImage(spr,Math.floor(px),Math.floor(py),Math.ceil(w*ts),Math.ceil(h*ts));
    if(m.type==='singularity'){
      const W2=w*ts, cx=W2/2, cy=h*ts/2, R=W2*.42, sp=(Math.sin(t/1600)+1)/2, rot=t/400*(1+sp*3);
      pixelFx(g,px,py,W2,h*ts,ts,c=>{
        c.lineWidth=ts*.14; c.strokeStyle='#ab47bc'; c.beginPath(); c.arc(cx,cy,R,0,Math.PI*2); c.stroke();
        for(let q=0;q<3;q++){c.strokeStyle=`rgba(179,136,255,${.4+.5*sp})`;c.lineWidth=ts*.08;c.beginPath();c.arc(cx,cy,R*(.75-q*.2)*(1-sp*.3),rot+q*2.1,rot+q*2.1+Math.PI*.9);c.stroke();}
      });
    }
  }
  // zone atmosphere
  if(S.fx===2){g.fillStyle='rgba(40,30,0,.16)';g.fillRect(0,0,cw,ch);
    for(let i=0;i<14;i++){const x=((i*173+t*.012*(1+i%3))%(cw+120))-60,y=(i*97)%ch;g.fillStyle='rgba(90,70,20,.10)';g.beginPath();g.arc(x,y,30+(i%4)*14,0,Math.PI*2);g.fill();}}
  if(S.fx===3){g.fillStyle='rgba(0,10,20,.25)';g.fillRect(0,0,cw,ch);}
  if(S.fx===3||S.fx===4||S.fx===5){
    const col=S.fx===3?'127,219,255':S.fx===4?'198,255,0':'200,160,255';
    for(let i=0;i<26;i++){const x=(i*211+Math.sin(t/1700+i)*40+cw)%cw, y=(i*137+t*.008*(i%5+1))%ch;
      g.fillStyle=`rgba(${col},${.25+.35*((Math.sin(t/500+i)+1)/2)})`;g.fillRect(Math.floor(x),Math.floor(ch-y),2,2);}
  }
  // vignette so the menu stays readable, then the scene crossfade
  const vg=g.createRadialGradient(cw/2,ch*.45,Math.min(cw,ch)*.2,cw/2,ch*.45,Math.max(cw,ch)*.75);
  vg.addColorStop(0,'rgba(0,0,0,.25)'); vg.addColorStop(1,'rgba(0,0,0,.85)');
  g.fillStyle=vg; g.fillRect(0,0,cw,ch);
  const fade=el<TITLE_FADE_MS?1-el/TITLE_FADE_MS:el>TITLE_SCENE_MS-TITLE_FADE_MS?(el-(TITLE_SCENE_MS-TITLE_FADE_MS))/TITLE_FADE_MS:0;
  if(fade>0){g.fillStyle=`rgba(0,0,0,${Math.min(1,fade)})`;g.fillRect(0,0,cw,ch);}
  const cap=document.getElementById('titleCaption'); if(cap)cap.style.opacity=String(Math.max(0,1-fade*1.5));
}

// ── Ground chunk cache ──
// Floor and still deposits never change after the map is built, so they are drawn
// once into 16×16-tile canvases (16px per tile) and blitted as a few big images per
// frame instead of thousands of tiles. Only animated pools are drawn per tile.
const CHUNK=16;
const ANIM_RES=new Set(['oil','brine','enzymes','luminite','radiant_dust']);
const chunkCache={key:'',map:null,c:new Map()};
function invalidateChunks(){chunkCache.c.clear();chunkCache.key='';}
function groundChunk(cx,cy){
  const key=`${G.zone}:${MAP_W}x${MAP_H}`;
  if(chunkCache.map!==G.map||chunkCache.key!==key){chunkCache.c.clear();chunkCache.map=G.map;chunkCache.key=key;}
  const id=cy*1000+cx;
  let ch=chunkCache.c.get(id);
  if(ch)return ch;
  const cv=document.createElement('canvas'); cv.width=cv.height=CHUNK*16;
  const g=cv.getContext('2d'), anim=[];
  for(let y=0;y<CHUNK;y++)for(let x=0;x<CHUNK;x++){
    const tx=cx*CHUNK+x, ty=cy*CHUNK+y; if(tx>=MAP_W||ty>=MAP_H)continue;
    const tile=G.map[ty][tx], v=(tx*7+ty*13)&3, res=tile.type===T_RESOURCE?tile.res:null;
    g.drawImage(res?resSpr(res,v,0):groundSpr(G.zone,v),x*16,y*16);
    if(res&&ANIM_RES.has(res))anim.push(tx,ty);
  }
  ch={cv,anim};
  chunkCache.c.set(id,ch);
  return ch;
}
