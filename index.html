  {id:'perk_first',cat:'Mastery',px:'ui:perks',name:'Perk Up',desc:'Buy your first perk'},
  {id:'perks_6',cat:'Mastery',px:'ui:perks',name:'Specialist',desc:'Own 6 perks'},
  {id:'stardust_buy',cat:'Mastery',px:'ui:stardust',name:'Starry Eyed',desc:'Buy a Stardust upgrade'},
  {id:'theme_set',cat:'Mastery',px:'ui:picture',name:'Fresh Coat',desc:'Wear a Stardust theme'},
];
// Awards panel order; the zone you're in opens by default
const ACH_CATS=['Getting Started','Ironfield','The Scar','The Deep','The Bloom','The Singularity','Logistics','Power','Engineering','Mastery'];

// Big Bang reward: 10 + 1 per 2 achievements earned this run, capped at the old maximum (47 achievements
// paid up to +23), so the many new achievements don't let one Big Bang buy out the Stardust shop
const ACH_DUST_MAX=23;
function achDust(){
  const ids=new Set(ACHIEVEMENTS.map(a=>a.id)), n=(G.achievements||[]).filter(id=>ids.has(id)).length;
  return 10+Math.min(ACH_DUST_MAX,Math.floor(n/2));
}
function checkAchievements(){
  if(!G.achievements)G.achievements=[];
  const earned=new Set(G.achievements);
  const machines=Object.values(G.machines);
  const totalOre=(G.inv.iron_ore||0)+(G.inv.copper_ore||0)+(G.inv.coal||0)+(G.inv.stone||0)+G.stats.taps;

  const cnt={}; for(const m of machines)cnt[m.type]=(cnt[m.type]||0)+1;
  const inv=k=>G.inv[k]||0, done=t=>G.research.done.includes(t), z=G.zone;
  const zoneDone=n=>zoneTechs(n).every(([id])=>done(id));
  const living=machines.filter(m=>MDEFS[m.type]?.living&&!m.withered);
  const runningReactors=machines.filter(m=>m.type==='reactor'&&(m.inBuf.lum_rod||0)>0&&!(m.scram>0));
  const produced=machines.reduce((a,m)=>a+(m.produced||0),0);
  const furnaces=(cnt.stone_furnace||0)+(cnt.blast_furnace||0)+(cnt.electric_smelter||0);
  const sing=machines.find(m=>m.type==='singularity');
  const singFrac=sing?Object.entries(SING_REQS).reduce((a,[id,n])=>a+Math.min(n,(sing.built||{})[id]||0),0)/Object.values(SING_REQS).reduce((a,b)=>a+b,0):0;
  const launchedFrom=n=>G.stats.launched===true&&z===n;
  const checks={
    // getting started
    first_ore:    ()=>(G.stats.mined||0)>=1,
    first_machine:()=>G.stats.placed>=1,
    first_power:  ()=>G.power.out>0,
    first_miner:  ()=>cnt.miner>0,
    first_notes:  ()=>inv('sci_red')>=1,
    hand_25:      ()=>(G.stats.crafts||0)>=25,
    // ironfield
    ore_100:      ()=>(G.stats.mined||0)>=100,
    ore_1000:     ()=>(G.stats.mined||0)>=1000,
    miners_5:     ()=>machines.filter(m=>m.type==='miner'&&m.active).length>=5,
    miners_15:    ()=>machines.filter(m=>m.type==='miner'&&m.active).length>=15,
    iron_500:     ()=>inv('iron_plate')>=500,
    copper_100:   ()=>inv('copper_plate')>=100,
    gears_100:    ()=>inv('iron_gear')>=100,
    first_circuit:()=>inv('circuit')>=1,
    circuits_50:  ()=>inv('circuit')>=50,
    first_steel:  ()=>inv('steel_plate')>=1,
    steel_100:    ()=>inv('steel_plate')>=100,
    furnaces_10:  ()=>furnaces>=10,
    assemblers_5: ()=>(cnt.assembler||0)>=5,
    labs_3:       ()=>(cnt.lab||0)>=3,
    first_diagrams:()=>inv('sci_green')>=1,
    first_schematic:()=>inv('sci_blue')>=1,
    automation:   ()=>done('automation'),
    logistics_research:()=>done('logistics'),
    z1_research:  ()=>zoneDone(1),
    first_steel_r:()=>inv('steel_plate')>=1,
    rocket_part:  ()=>ROCKET_PARTS.some(p=>inv(p.id)>=1),
    launch:       ()=>G.stats.launched===true,
    z1_fast:      ()=>launchedFrom(1)&&G.tick<=45*60*4,
    // the scar
    first_oil:    ()=>cnt.oil_pump>0,
    oil_6:        ()=>(cnt.oil_pump||0)>=6,
    first_crack:  ()=>inv('raw_fuel')>=1,
    plastic_50:   ()=>inv('plastic')>=50,
    refined_50:   ()=>inv('refined_fuel')>=50,
    first_scrubber:()=>cnt.scrubber>0,
    combustion_3: ()=>(cnt.combustion_gen||0)>=3,
    smog_75:      ()=>zoneHas('smog')&&(G.smog||0)>=75,
    smog_clear:   ()=>zoneHas('smog')&&(cnt.oil_pump||0)>=4&&(G.smog||0)<10&&G.tick>2400,
    scar_notes_50:()=>inv('sci_scar')>=50,
    scar_research:()=>zoneDone(2),
    scar_escape:  ()=>!!G.perks?.awarded?.[2],
    // the deep
    first_pipe:   ()=>cnt.pipe>0,
    first_brine:  ()=>cnt.brine_pump>0,
    first_tank:   ()=>cnt.fluid_tank>0,
    pipes_50:     ()=>(cnt.pipe||0)>=50,
    first_valve:  ()=>cnt.relief_valve>0,
    pressure_90:  ()=>{const n=zoneHas('pressure')&&worstNet();return !!n&&pressureOf(n)>=90;},
    first_burst:  ()=>(G.stats.bursts||0)>0,
    first_lumen:  ()=>cnt.lumen_panel>0,
    lumen_6:      ()=>(cnt.lumen_panel||0)>=6,
    acc_full:     ()=>machines.some(m=>m.type==='accumulator'&&(m.charge||0)>=ACC_CAP),
    night_power:  ()=>zoneHas('glow')&&!glowBright()&&G.power.in>=20&&powerRatio()===1&&(cnt.accumulator||0)>0,
    silicon_50:   ()=>inv('silicon')>=50,
    first_rod:    ()=>inv('fuel_rod')>=1,
    rods_10:      ()=>inv('fuel_rod')>=10,
    deep_research:()=>zoneDone(3),
    deep_escape:  ()=>!!G.perks?.awarded?.[3],
    steady_escape:()=>launchedFrom(3)&&!(G.stats.bursts>0),
    // the bloom
    first_enzyme: ()=>cnt.enzyme_pump>0,
    first_living: ()=>machines.some(m=>MDEFS[m.type]?.living),
    living_5:     ()=>living.length>=5,
    living_10:    ()=>living.length>=10,
    full_bloom:   ()=>living.some(m=>(m.vit||0)>80),
    bloom_3:      ()=>living.filter(m=>(m.vit||0)>80).length>=3,
    paste_50:     ()=>inv('nutrient')>=50,
    first_wither: ()=>(G.stats.withered||0)>0,
    reactor_on:   ()=>runningReactors.length>=1,
    reactor_2:    ()=>runningReactors.length>=2,
    reactor_hot:  ()=>runningReactors.some(m=>(m.heat||0)>90),
    first_scram:  ()=>(G.stats.scrams||0)>0,
    power_mw:     ()=>G.power.out>=1000,
    hyperfuel_6:  ()=>inv('hyperfuel')>=6,
    bloom_research:()=>zoneDone(4),
    bloom_escape: ()=>!!G.perks?.awarded?.[4],
    green_escape: ()=>launchedFrom(4)&&!(G.stats.withered>0),
    cool_escape:  ()=>launchedFrom(4)&&!(G.stats.scrams>0),
    // the singularity
    void_walker:  ()=>z===5,
    expand_1:     ()=>done('expansion_1'),
    expand_2:     ()=>done('expansion_2'),
    void_10:      ()=>inv('sci_void')>=10,
    components_all:()=>Object.keys(SING_REQS).every(id=>inv(id)>=1),
    sing_placed:  ()=>!!sing,
    sing_half:    ()=>singFrac>.5,
    power_5mw:    ()=>G.power.out>=5000,
    sing_built:   ()=>!!sing&&sing.complete,
    big_bang:     ()=>!!G.bigBang,
    bangs_2:      ()=>(PRESTIGE.bangs||0)>=2,
    bangs_5:      ()=>(PRESTIGE.bangs||0)>=5,
    // logistics
    first_belt:   ()=>cnt.belt>0,
    belts_50:     ()=>(cnt.belt||0)>=50,
    belts_200:    ()=>(cnt.belt||0)>=200,
    first_insert: ()=>cnt.inserter>0,
    inserters_20: ()=>(cnt.inserter||0)+(cnt.long_inserter||0)>=20,
    long_ins:     ()=>cnt.long_inserter>0,
    first_chest:  ()=>cnt.chest>0,
    chest_full:   ()=>machines.some(m=>m.type==='chest'&&Object.values(m.chestInv).reduce((a,b)=>a+b,0)>=200),
    first_splitter:()=>cnt.splitter>0,
    splitters_5:  ()=>(cnt.splitter||0)>=5,
    first_tunnel: ()=>cnt.tunnel>0,
    tunnels_3:    ()=>machines.filter(m=>m.type==='tunnel'&&m.tunnelId!==null).length>=6,
    shared_output:()=>Object.values(INS_TAKERS).some(a=>a.length>=2),
    // power
    first_generator:()=>cnt.generator>0,
    burners_3:    ()=>machines.filter(m=>m.type==='burner'&&(m.inBuf.coal||0)>0).length>=3,
    generators_4: ()=>(cnt.generator||0)>=4,
    power_60:     ()=>G.power.out>=60,
    power_120:    ()=>G.power.out>=120,
    power_240:    ()=>G.power.out>=240,
    power_500:    ()=>G.power.out>=500,
    brownout:     ()=>G.power.out>0&&G.power.in>G.power.out,
    // engineering
    machines_10:  ()=>machines.length>=10,
    machines_25:  ()=>machines.length>=25,
    machines_50:  ()=>machines.length>=50,
    machines_100: ()=>machines.length>=100,
    first_upgrade:()=>machines.some(m=>(m.tier||1)>=2),
    t2_5:         ()=>machines.filter(m=>(m.tier||1)>=2).length>=5,
    t3:           ()=>machines.some(m=>(m.tier||1)>=3),
    first_module: ()=>machines.some(m=>(m.modules||[]).filter(Boolean).length>0),
    modules_5:    ()=>machines.reduce((a,m)=>a+(m.modules||[]).filter(Boolean).length,0)>=5,
    first_blueprint:()=>(G.blueprints||[]).length>=1,
    blueprints_4: ()=>(G.blueprints||[]).length>=4,
    first_paste:  ()=>(G.stats.pastes||0)>=1,
    first_flip:   ()=>(G.stats.flips||0)>=1,
    first_undo:   ()=>(G.stats.undos||0)>=1,
    prod_1000:    ()=>produced>=1000,
    prod_10000:   ()=>produced>=10000,
    hand_250:     ()=>(G.stats.crafts||0)>=250,
    // mastery
    all_research: ()=>Object.keys(TECHS).every(id=>done(id)),
    milestones_all:()=>z<5&&(ZONE_MILESTONES[z]||[]).every(ms=>ms.done()),
    perk_first:   ()=>Object.keys(G.perks?.spent||{}).length>=1,
    perks_6:      ()=>Object.keys(G.perks?.spent||{}).length>=6,
    stardust_buy: ()=>Object.keys(PRESTIGE.owned||{}).some(k=>!k.startsWith('theme_')),
    theme_set:    ()=>(PRESTIGE.theme||'default')!=='default',
  };

  let anyNew=false;
  for(const[id,fn]of Object.entries(checks)){
    if(!earned.has(id)&&fn()){
      G.achievements.push(id);
      earned.add(id);
      anyNew=true;
      const ach=ACHIEVEMENTS.find(a=>a.id===id);
      if(ach){
        // Achievement toast, styled differently from normal toasts
        const c=document.getElementById('toasts');
        const el=document.createElement('div');
        el.className='toast';
        el.style.cssText='border-color:#f5a623;color:#f5a623;background:#1a1400;min-width:160px;text-align:center';
        el.innerHTML=`${achIcon(ach)} ${ach.name}<br><span style="font-size:var(--f4);color:#999">${ach.desc}</span>`;
        c.appendChild(el); trimToasts();
        setTimeout(()=>el.remove(),3500);
        sfx('research');
      }
    }
  }
  if(anyNew)saveGame();
}

let achOpen=null; // categories open in the Awards panel (starts with the current zone's)
function toggleAchCat(i){achOpen.has(i)?achOpen.delete(i):achOpen.add(i);renderAchievePanel();}
function renderAchievePanel(){
  const el=document.getElementById('pAchieveBody'); if(!el)return;
  const earned=new Set(G.achievements||[]);
  const total=ACHIEVEMENTS.length, count=ACHIEVEMENTS.filter(a=>earned.has(a.id)).length;
  if(!achOpen)achOpen=new Set([ACH_CATS.indexOf(['','Ironfield','The Scar','The Deep','The Bloom','The Singularity'][G.zone])]);
  let html=`<div class="card" style="margin-bottom:10px">
    <div style="font-size:var(--f5);color:var(--text3);margin-bottom:4px">PROGRESS</div>
    <div style="font-size:var(--f9);color:var(--amber)">${count} / ${total}</div>
    <div class="prog-wrap" style="margin-top:5px"><div class="prog-fill amber" style="width:${Math.round(count/total*100)}%"></div></div>
    <div style="font-size:var(--f4);color:var(--text3);margin-top:6px;line-height:1.8">Big Bang bonus so far: +${achDust()-10} Stardust</div>
  </div>`;
  ACH_CATS.forEach((cat,i)=>{
    const list=ACHIEVEMENTS.filter(a=>a.cat===cat); if(!list.length)return;
    const got=list.filter(a=>earned.has(a.id)).length, open=achOpen.has(i), full=got===list.length;
    html+=`<button class="ach-cat${full?' full':''}" onclick="toggleAchCat(${i})"><span>${open?'▾':'▸'} ${cat.toUpperCase()}</span><span>${got}/${list.length}</span></button>`;
    if(!open)return;
    for(const a of list){
      const done=earned.has(a.id), hide=!done&&a.secret;
      html+=`<div class="ach-row${done?' done':''}">
        <span class="ach-ic">${done?achIcon(a):hide?'?':`<span class="ach-dim">${achIcon(a)}</span>`}</span>
        <div style="flex:1"><div class="ach-nm">${hide?'???':a.name}</div><div class="ach-ds">${hide?'Secret: keep playing':a.desc}</div></div>
        ${done?'<span style="color:var(--teal);font-size:var(--f9)">✓</span>':''}
      </div>`;
    }
  });
  setHtml(el,html);
}

// ── Recipe Book (v2.0.17) ──
// Every recipe this zone can run (machines and hand crafts), how raw resources are mined or pumped,
// a search box, and an item page: what makes it, what uses it, and its other uses (fuel, food, machine
// costs, research, the launch). Tapping an item icon in any panel opens its page (showRecipeFor).
let rbQuery='', rbFocus=null, rbOpen=new Set(), rbBack=null, rbHist=[], rbRes={map:null,w:0,set:null};
const RB_PUMPED={oil:['crude_oil','oil_pump'],brine:['brine','brine_pump'],enzymes:['enzymes','enzyme_pump']};
function rbName(id){return ITEMS[id]?.name||MDEFS[id]?.name||id;}
function rbChip(id,n,suffix){return `<span class="rb-chip">${n!=null?`<b>${fmt(n)}</b>`:''}${iconHtml(id)}${rbName(id)}${suffix||''}</span>`;}
function rbResHere(){ // deposit types on this map (cached until the map changes)
  if(rbRes.map!==G.map||rbRes.w!==MAP_W){const set=new Set(); for(const row of G.map)for(const t of row)if(t.res)set.add(t.res); rbRes={map:G.map,w:MAP_W,set};}
  return rbRes.set;
}
function rbRecipes(){ // every recipe usable in this zone, machines then hand crafts
  const list=Object.entries(RECIPES).filter(([id])=>zoneRecipeOk(id)).map(([id,r])=>({id,name:r.name,machine:r.machine,secs:r.time/4,in:r.in,out:r.out,fluid:r.fluid,minPressure:r.minPressure,unlock:r.unlock}));
  for(const h of HAND_CRAFTS)if(zoneRecipeOk(h.id))list.push({id:'hand:'+h.id,name:h.name,machine:'hand',clicks:h.clicks,in:h.in,out:h.out,unlock:h.unlock});
  return list;
}
function rbLock(r){
  const done=G.research.done;
  if(r.unlock&&!done.includes(r.unlock))return TECHS[r.unlock]?.name||r.unlock;
  const mu=r.machine!=='hand'&&MDEFS[r.machine]?.unlock;
  if(mu&&!done.includes(mu))return TECHS[mu]?.name||mu;
  return null;
}
function rbCard(r){
  const lock=rbLock(r), hand=r.machine==='hand';
  const ins=Object.entries(r.in||{}).map(([k,v])=>rbChip(k,v)).join('');
  const fl=Object.entries(r.fluid||{}).map(([k,v])=>rbChip(k,v,' (piped)')).join('');
  const outs=Object.entries(r.out).map(([k,v])=>rbChip(k,v)).join('');
  const meta=hand?`Hand craft: ${r.clicks} taps in the CRAFT tab`
    :`${fmtRate(r.secs)}s per craft at T1 · makes ${Object.entries(r.out).map(([k,v])=>`${fmtRate(v*60/r.secs)} ${rbName(k)}`).join(', ')} a minute${r.minPressure?` · needs ${r.minPressure}%+ pipe pressure`:''}`;
  return `<div class="rb-card${lock?' locked':''}">
    <div class="rb-head">${hand?uiIcon('craft'):iconHtml(r.machine)}<span>${r.name}</span><span class="w">${hand?'Hand':MDEFS[r.machine]?.name||r.machine}</span></div>
    <div class="rb-row">${ins}${fl}${ins||fl?' → ':''}${outs}</div>
    <div class="rb-meta">${meta}</div>
    ${lock?`<div class="rb-lock">🔒 Needs research: ${lock}</div>`:''}
  </div>`;
}
function rbSources(id){ // ways to get an item that are not recipes: mining and pumping
  const out=[], here=rbResHere();
  for(const[res,[item,pump]]of Object.entries(RB_PUMPED))if(item===id&&here.has(res))
    out.push(`${iconHtml(pump)} <b>${MDEFS[pump].name}</b> on a ${res} pool: 60 a minute at T1${res==='oil'?'':', into a pipe network'}`);
  if(here.has(id)&&!RB_PUMPED[id])
    out.push(`${iconHtml('miner')} <b>Miner</b> on a ${rbName(id)} deposit: ${id==='radiant_dust'?'30':'60'} a minute at T1. You can also tap the deposit to mine by hand.`);
  return out;
}
function rbOtherUses(id){ // uses outside recipes
  const out=[];
  const fuel={coal:['burner','generator','stone_furnace','blast_furnace'],refined_fuel:['combustion_gen','scrubber'],lum_rod:['reactor'],nutrient:Object.keys(MDEFS).filter(t=>MDEFS[t].living)}[id];
  if(fuel){const ok=fuel.filter(t=>DRAWER_DEFS.build.some(c=>c.items.some(i=>i.id===t&&(!i.zones||i.zones.includes(G.zone)))));
    if(ok.length)out.push(`${id==='nutrient'?'Food for':'Fuel for'} ${ok.map(t=>rbChip(t)).join('')}`);}
  if(id==='gasket')out.push(`Keeps ${rbChip('relief_valve')} venting: 1 per ${VALVE_SEAL} units vented`);
  const builds=Object.keys(MDEFS).filter(t=>MDEFS[t].cost?.[id]&&drawerCats('build').some(c=>c.items.some(i=>i.id===t)));
  if(builds.length)out.push(`Builds ${builds.map(t=>rbChip(t,MDEFS[t].cost[id])).join('')}`);
  const techs=Object.entries(TECHS).filter(([tid,t])=>t.cost?.[id]&&!G.research.done.includes(tid));
  if(techs.length)out.push(`Research: ${techs.map(([,t])=>`${t.name} (${fmt(t.cost[id])})`).join(', ')}`);
  const launch=rocketReqs().find(r=>r.id===id);
  if(launch)out.push(`Launch: ${fmt(launch.need)} needed (you have ${fmt(launch.have)})`);
  if(G.zone===5&&SING_REQS[id])out.push(`The Singularity needs ${SING_REQS[id]}`);
  return out;
}
function rbFocusHtml(id){
  const recs=rbRecipes(), made=recs.filter(r=>r.out[id]), used=recs.filter(r=>r.in?.[id]||r.fluid?.[id]);
  const it=ITEMS[id], md=MDEFS[id];
  let html=`<div class="rb-big">${iconHtml(id)}<div><div style="font-size:var(--f8);color:var(--amber)">${rbName(id)}</div>${it?.desc?`<div style="font-size:var(--f5);color:var(--text2);line-height:1.8;margin-top:4px">${it.desc}</div>`:''}</div></div>`;
  if(md&&!it){ // a machine: what it costs, and what it makes
    const lock=md.unlock&&!G.research.done.includes(md.unlock);
    html+=`<span class="sec-label">BUILD COST</span><div class="rb-row" style="margin-bottom:6px">${Object.entries(md.cost||{}).map(([k,v])=>rbChip(k,v)).join('')}</div>
      <div class="rb-meta" style="margin-bottom:8px">${md.power>0?`Uses ${md.power} kW`:md.power<0?`Makes ${-md.power} kW`:'Needs no power'}${md.desc?` · ${md.desc}`:''}</div>
      ${lock?`<div class="rb-lock" style="margin-bottom:8px">🔒 Needs research: ${TECHS[md.unlock]?.name||md.unlock}</div>`:''}`;
    const runs=recs.filter(r=>r.machine===id);
    if(runs.length)html+=`<span class="sec-label">RECIPES</span>${runs.map(rbCard).join('')}`;
    const src=Object.entries(RB_PUMPED).find(([,[,p]])=>p===id);
    if(src)html+=`<div class="rb-meta">Pumps ${rbName(src[1][0])} from a ${src[0]} pool.</div>`;
    if(id==='miner')html+=`<div class="rb-meta">Mines the deposit it stands on: ${[...rbResHere()].filter(r=>!RB_PUMPED[r]).map(r=>rbChip(r)).join('')}</div>`;
    return html;
  }
  const src=rbSources(id);
  html+=`<span class="sec-label">HOW TO GET IT</span>`;
  if(!src.length&&!made.length)html+=`<div class="rb-meta" style="margin-bottom:8px">Not available in this zone.</div>`;
  for(const l of src)html+=`<div class="rb-card"><div class="rb-row">${l}</div></div>`;
  html+=made.map(rbCard).join('');
  const other=rbOtherUses(id);
  if(used.length||other.length){
    html+=`<span class="sec-label" style="margin-top:10px">WHAT USES IT</span>`;
    for(const l of other)html+=`<div class="rb-card"><div class="rb-row">${l}</div></div>`;
    html+=used.map(rbCard).join('');
  }
  return html;
}
function rbMatches(q){ // items and machines whose name contains q, best first
  q=q.toLowerCase();
  const recs=rbRecipes(), here=rbResHere();
  const known=new Set(); for(const r of recs){for(const k of Object.keys(r.out))known.add(k);for(const k of Object.keys(r.in||{}))known.add(k);for(const k of Object.keys(r.fluid||{}))known.add(k);}
  for(const r of here)known.add(RB_PUMPED[r]?RB_PUMPED[r][0]:r);
  for(const c of drawerCats('build'))for(const i of c.items)known.add(i.id);
  const ids=[...known].filter(id=>rbName(id).toLowerCase().includes(q));
  return ids.sort((a,b)=>(rbName(b).toLowerCase().startsWith(q)-rbName(a).toLowerCase().startsWith(q))||rbName(a).localeCompare(rbName(b))).slice(0,20);
}
function renderRecipesPanel(){
  const el=document.getElementById('pRecipesBody'); if(!el)return;
  let html='';
  if(rbFocus){
    const back=rbHist.length||rbBack?`<button class="mini-btn teal" onclick="rbGoBack()">← BACK</button>`:'';
    html+=`<div style="display:flex;gap:6px;margin-bottom:10px">${back}<button class="mini-btn amber" onclick="rbFocus=null;rbBack=null;rbHist=[];renderRecipesPanel()">${rbQuery?'RESULTS':'ALL RECIPES'}</button></div>`+rbFocusHtml(rbFocus);
  } else if(rbQuery){
    const m=rbMatches(rbQuery), recs=rbRecipes();
    if(!m.length)html=`<div style="font-size:var(--f6);color:var(--text3);text-align:center;padding:16px;line-height:2">Nothing called "${rbQuery.replace(/[<>&"]/g,'')}" in this zone.</div>`;
    if(m.length===1)html=rbFocusHtml(m[0]); // one match: straight to its page
    else for(const id of m){
      const made=recs.filter(r=>r.out[id]), src=rbSources(id);
      const how=MDEFS[id]&&!ITEMS[id]?'Machine':made.length?made.slice(0,2).map(r=>r.machine==='hand'?'Hand':MDEFS[r.machine]?.name).filter((v,i,a)=>a.indexOf(v)===i).join(', '):src.length?'Mined or pumped':'';
      html+=`<div class="rb-match" onclick="showRecipeFor('${id}',true)">${iconHtml(id)}<span>${rbName(id)}</span><span class="w">${how}</span></div>`;
    }
  } else {
    const recs=rbRecipes();
    html+=`<div style="font-size:var(--f5);color:var(--text3);line-height:1.8;margin-bottom:6px">Search above, or tap any item icon in a menu to see how it is made.</div>`;
    const sec=(key,icon,label,body,n)=>{const open=rbOpen.has(key);
      return `<div class="rb-sec" onclick="rbToggle('${key}')">${icon}<span>${label}</span><span class="n">${n} ${open?'▾':'▸'}</span></div>${open?body:''}`;};
    const res=[...rbResHere()].map(r=>RB_PUMPED[r]?RB_PUMPED[r][0]:r);
    html+=sec('mine',iconHtml('miner'),'MINING & PUMPS',res.map(id=>`<div class="rb-card"><div class="rb-row">${rbSources(id).join('<br>')||rbChip(id)}</div></div>`).join(''),res.length);
    const hand=recs.filter(r=>r.machine==='hand');
    if(hand.length)html+=sec('hand',uiIcon('craft'),'HAND CRAFT',hand.map(rbCard).join(''),hand.length);
    const order=[...new Set(DRAWER_DEFS.build.flatMap(c=>c.items.map(i=>i.id)))];
    for(const mid of order){
      const list=recs.filter(r=>r.machine===mid); if(!list.length)continue;
      html+=sec(mid,iconHtml(mid),MDEFS[mid].name.toUpperCase(),list.map(rbCard).join(''),list.length);
    }
  }
  setHtml(el,html);
}
function rbToggle(k){if(rbOpen.has(k))rbOpen.delete(k);else rbOpen.add(k);renderRecipesPanel();}
function recipeSearch(v,clear){
  rbQuery=String(v||'').trim(); rbFocus=null; rbBack=null; rbHist=[];

// Open the Recipe Book on one item or machine. From another panel, BACK returns to it.
function showRecipeFor(id,fromBook){
  if(!ITEMS[id]&&!MDEFS[id])return;
  if(openPanel!=='recipes'){rbBack=openPanel?{panel:openPanel,inspect:inspectId}:null; rbHist=[];}
  else if(rbFocus&&rbFocus!==id)rbHist.push(rbFocus); // browsing from item to item: BACK walks back through them
  rbFocus=id;
  if(openPanel!=='recipes')showPanel('recipes'); else renderRecipesPanel();
  const b=document.getElementById('pRecipesBody'); if(b)b.scrollTop=0;

function rbGoBack(){
  if(rbHist.length){rbFocus=rbHist.pop();renderRecipesPanel();return;}
  const bk=rbBack; rbBack=null; rbFocus=null; if(!bk){renderRecipesPanel();return;}
  if(bk.panel==='machine'&&G.machines[bk.inspect])openMachinePanel(G.machines[bk.inspect]); else showPanel(bk.panel);
}
// Tap an item icon anywhere in a panel or popup to open its recipe page. Icons inside buttons and
// cards that already do something on tap are left alone.
document.addEventListener('click',e=>{

  if(ic.closest('button,[onclick],.ditem,#invStrip,#hud,#tabBar,#tabDrawer,input,#sTitle'))return;
  if(!ic.closest('.spanel,#mOverlay,#tutHint,#toolTip'))return;
  if(ic.closest('#mOverlay'))closeModal();
  showRecipeFor(ic.dataset.i);
});

function tutStep(){return G.zone===1?(G.tutorial?G.tutorial.step:-1):(G.zoneTut===undefined?-1:G.zoneTut);}
function setTutStep(n){if(G.zone===1){if(!G.tutorial)G.tutorial={step:0};G.tutorial.step=n;}else G.zoneTut=n;}

function tickTutorial(){
  const tut=TUTORIALS[G.zone]; let i=tutStep();
  if(!tut||i<0)return;
  const start=i;
  while(i<tut.steps.length&&!tut.steps[i].final&&tut.steps[i].done())i++;
  if(i!==start){setTutStep(i);sfx('craft');}
  if(i>=tut.steps.length){finishTutorial();return;}
  showTutHint(tut.steps[i],i,tut.steps.length);
}

function finishTutorial(){
  const tut=TUTORIALS[G.zone];
  setTutStep(-1); hideTutHint();
  if(G.zone===1)completeTutorial();
  else if(tut)toast(tut.done,'ok');
}
function restartTutorial(){
  setTutStep(0); closeModal(); tickTutorial();
  toast('Tutorial restarted','ok');
}

// [[id]] → icon for that item or machine
function richText(t){return pixEmoji(t.replace(/\[\[(\w+)\]\]/g,(m0,id)=>iconHtml(id)));}
function tutTallyHtml(step){
  if(!step.tally)return '';
  const rows=typeof step.tally==='function'?step.tally()
    :step.tally.map(([id,need])=>({id,label:ITEMS[id]?.name||id,have:G.inv[id]||0,need}));
  return `<div class="tut-tally">${rows.map(r=>{
    const have=Math.min(r.need,r.have), ok=have>=r.need;
    return `<span class="${ok?'ok':''}">${iconHtml(r.id)} ${have}/${r.need}${ok?' ✓':''}</span>`;}).join('')}</div>`;
}

// A step that asks you to place a machine shows what it costs against what you hold
function tutCostHtml(step){
  if(!/place|build/i.test(step.text))return '';
  const id=(step.text.match(/\[\[(\w+)\]\]/g)||[]).map(t=>t.slice(2,-2)).find(k=>MDEFS[k]&&!MDEFS[k].stub);
  return id?`<div class="tut-tally">${MDEFS[id].name}: ${costChips(MDEFS[id].cost,id)}</div>`:'';
}
function completeTutorial(){
  if(!G.tutorial)return;
  G.tutorial.step=-1;
  hideTutHint();
  showModal('🚀 TUTORIAL COMPLETE',
    `<div style="font-size:var(--f8);color:var(--amber);margin-bottom:12px;text-align:center">The Factory Must Grow</div>
     <div style="font-size:var(--f6);color:var(--text2);line-height:2.4;margin-bottom:10px">
       You've learned the basics of 8-BIT INDUSTRY.<br><br>
       Your goal: build a <span style="color:var(--amber)">🚀 Rocket</span> and see what awaits in this universe.<br><br>
       <span style="color:var(--text3)">Research new technologies, automate everything, and expand your factory until launch day.</span>
     </div>`,
    `<button class="btn btn-sm" onclick="closeModal();sfx('research')">THE FACTORY MUST GROW ▶</button>`
  );
  sfx('research');
}
function showTutHint(step,i,n){
  const el=document.getElementById('tutHint');
  const tx=document.getElementById('tutText');
  if(!el||!tx)return;
  setHtml(tx,`<span class="tut-step">STEP ${i+1}/${n}</span>${richText(step.text)}${tutTallyHtml(step)||tutCostHtml(step)}`
    +(step.final?`<button class="tut-go" onclick="finishTutorial()">GOT IT ▶</button>`:''));
  const mini=document.getElementById('tutMini'); if(mini)mini.innerHTML=`${uiIcon('recipes')} STEP ${i+1}/${n}`;
  el.classList.toggle('collapsed',tutCollapsed);
  el.classList.remove('hidden');
}
let tutCollapsed=false;
function toggleTutCollapse(){
  tutCollapsed=!tutCollapsed;
  document.getElementById('tutHint')?.classList.toggle('collapsed',tutCollapsed);
  const t=document.getElementById('tutToggle'); if(t)t.textContent=tutCollapsed?'▸':'▾';
}
function hideTutHint(){
  document.getElementById('tutHint')?.classList.add('hidden');
}
function skipTutorial(){
  setTutStep(-1);
  hideTutHint();
  toast('Tutorial skipped. Restart it any time from ☰ Settings','ok');
}

function buyPerk(id,cost){
  const def=PERK_DEFS.find(p=>p.id===id);
  if(def?.after&&!G.perks.awarded?.[def.after]){toast(`Unlocks after Zone ${def.after} launch`,'wrn');return;}
  if((G.perks.points||0)<cost){toast('Not enough perk points','wrn');return;}
  G.perks.points-=cost;
  if(!G.perks.spent)G.perks.spent={};
  G.perks.spent[id]=true;
  saveGame(); sfx('research');
  toast(`Perk unlocked: ${PERK_DEFS.find(p=>p.id===id)?.name||id}`,'ok');
  renderPerksPanel();
}

function toast(msg,type=''){
  const c=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className=`toast ${type}`; el.innerHTML=pixEmoji(escHtml(msg));
  c.appendChild(el); setTimeout(()=>el.remove(),2100);
  trimToasts();
}
// Keep at most 3 toasts on screen; oldest go first
function trimToasts(){
  const c=document.getElementById('toasts');
  while(c&&c.children.length>3)c.firstElementChild.remove();
}
const TITLE_UI={'🛟':'backup','🚀':'goal','🔒':'devlock','📲':'install','📥':'saves','📤':'saves','💾':'saves','💥':'demolish','✨':'stardust','⚡':'power','⚙️':'settings'};
function showModal(title,body,foot){
  if(G)closeResInfo();
  // A leading emoji in a modal title becomes its pixel icon
  const lead=Object.keys(TITLE_UI).find(e=>title.startsWith(e+' '));
  const mt=document.getElementById('mTitle');
  if(lead){mt.innerHTML=uiIcon(TITLE_UI[lead])+' ';mt.appendChild(document.createTextNode(title.slice(lead.length+1)));}
  else mt.textContent=title;
  document.getElementById('mBody').innerHTML=pixEmoji(body);
  document.getElementById('mFoot').innerHTML=pixEmoji(foot||'');
  document.getElementById('mOverlay').classList.remove('hidden');
}
function closeModal(){document.getElementById('mOverlay').classList.add('hidden')}

// Tab badges: research you can afford now, and a launch that is ready
function updateRocketBtn(){
  const goal=document.getElementById('badge-goal'), res=document.getElementById('badge-research');
  if(goal)goal.textContent=(G.stats.launched&&nextZone())||(rocketUnlocked()&&rocketReady()&&!G.stats.launched)?'!':'';

}

// ═══ BACKUPS ═══
// A backup code holds the autosave, the three slots and the Stardust profile:
// gzipped where the browser can (CompressionStream), then base64.
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
const zipBytes=(u8,Stream)=>new Response(new Blob([u8]).stream().pipeThrough(new Stream('gzip'))).arrayBuffer().then(b=>new Uint8Array(b));
async function makeBackupCode(){
  if(G&&tickId)saveGame();
  const data={v:1,at:Date.now(),save:localStorage.getItem(SAVE_KEY),prestige:localStorage.getItem(PRESTIGE_KEY),
    slots:[1,2,3].map(n=>localStorage.getItem(`ebi_save_slot${n}`))};
  const bytes=new TextEncoder().encode(JSON.stringify(data));
  if(window.CompressionStream)return 'EBI1.'+b64(await zipBytes(bytes,CompressionStream));
  return 'EBI0.'+b64(bytes);
}
async function readBackupCode(code){
  const m=String(code||'').replace(/\s+/g,'').match(/^EBI([01])\.([A-Za-z0-9+/=]+)$/);
  if(!m)throw new Error('That is not an 8-Bit Industry backup code');
  let bytes=unb64(m[2]);
  if(m[1]==='1'){
    if(!window.DecompressionStream)throw new Error('This browser cannot read compressed backups');
    bytes=await zipBytes(bytes,DecompressionStream);
  }
  const d=JSON.parse(new TextDecoder().decode(bytes));
  if(!d||d.v!==1||!(d.save||d.prestige||(d.slots||[]).some(Boolean)))throw new Error('The backup is empty');
  for(const raw of[d.save,d.prestige,...(d.slots||[])])if(raw)JSON.parse(raw);
  return d;
}
let backupCode='';
async function openBackup(){
  let prot='';
  try{prot=navigator.storage?.persisted?(await navigator.storage.persisted())?'✓ This browser has agreed to keep your data.':'This browser may clear your data if space runs low or the site goes unused.':'';}catch(e){}
  const close=G?backToMenu:`<button class="btn btn-sm" onclick="closeModal()">CLOSE</button>`;
  showModal('🛟 BACKUP',`<div style="font-size:var(--f5);color:var(--text2);line-height:2;margin-bottom:10px">
      Your progress lives only in this browser. Clearing site data deletes it, and so can a phone tidying its storage.
      Keep a backup code somewhere safe: it holds your game, your save slots and your Stardust.
      ${prot?`<br><span style="color:var(--text3)">${prot}</span>`:''}</div>
    <button class="full-btn" onclick="exportBackup()">📤 EXPORT BACKUP</button>
    <button class="full-btn" onclick="importBackupUI()">📥 IMPORT BACKUP</button>`,close);
}
async function exportBackup(){
  try{backupCode=await makeBackupCode();}catch(e){showModal('🛟 BACKUP','Could not make a backup: '+e.message,`<button class="btn btn-sm" onclick="openBackup()">◀ BACK</button>`);return;}
  showModal('📤 EXPORT BACKUP',`<div style="font-size:var(--f5);color:var(--text2);line-height:2;margin-bottom:8px">Copy this code into a note or message to yourself, or save it as a file. ${Math.ceil(backupCode.length/1024)} KB.</div>
    <textarea id="bkCode" class="bk-area" readonly>${backupCode}</textarea>`,
    `<button class="btn btn-sm" onclick="openBackup()">◀</button>
     <button class="btn btn-sm" onclick="copyBackup()">📋 COPY</button>
     <button class="btn btn-sm btn-teal" onclick="downloadBackup()">⬇ FILE</button>`);
}
async function copyBackup(){
  let ok=false;
  try{await navigator.clipboard.writeText(backupCode);ok=true;}catch(e){
    const t=document.getElementById('bkCode'); if(t){t.select();try{ok=document.execCommand('copy');}catch(e2){}}
  }
  const b=[...document.querySelectorAll('#mFoot button')].find(x=>x.textContent.includes('COPY'));
  if(b)b.textContent=ok?'✓ COPIED':'SELECT + COPY';
}
function downloadBackup(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([backupCode],{type:'text/plain'}));
  a.download=`8bit-industry-backup-${new Date().toISOString().slice(0,10)}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function importBackupUI(msg){
  showModal('📥 IMPORT BACKUP',`<div style="font-size:var(--f5);color:var(--text2);line-height:2;margin-bottom:8px">Paste a backup code, or load a backup file. This replaces the game, slots and Stardust on this device.</div>

    <textarea id="bkIn" class="bk-area" placeholder="EBI1.…"></textarea>

    `<button class="btn btn-sm" onclick="openBackup()">◀</button>

function readBackupFile(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  f.text().then(t=>{const a=document.getElementById('bkIn');if(a)a.value=t.trim();});
}
async function importBackup(){
  const code=document.getElementById('bkIn')?.value||'';
  let d;
  try{d=await readBackupCode(code);}catch(e){importBackupUI(e.message||'That code could not be read');return;}
  const when=d.at?new Date(d.at).toLocaleString('en',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'?';
  let zone='';try{zone=d.save?` · Zone ${JSON.parse(d.save).zone||1}`:'';}catch(e){}
  window._pendingBackup=d;
  showModal('📥 REPLACE PROGRESS?',`<div style="font-size:var(--f6);color:var(--text2);line-height:2.2">Backup from <span style="color:var(--amber)">${when}</span>${zone}.<br>Everything on this device is replaced by it. This cannot be undone.</div>`,
    `<button class="btn btn-sm" onclick="importBackupUI()">CANCEL</button>
     <button class="btn btn-sm btn-red" onclick="applyBackup()">REPLACE</button>`);
}
function applyBackup(){
  const d=window._pendingBackup; if(!d)return;
  noSave=true; if(tickId){clearInterval(tickId);tickId=null;}
  const put=(k,v)=>{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k);};
  put(SAVE_KEY,d.save); put(PRESTIGE_KEY,d.prestige);
  (d.slots||[]).forEach((v,i)=>put(`ebi_save_slot${i+1}`,v));
  location.reload();
}

let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;updateInstallBtn();});
window.addEventListener('appinstalled',()=>{installEvt=null;updateInstallBtn();});
function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function canInstall(){return !isStandalone()&&(!!installEvt||isIOS());}
function updateInstallBtn(){const b=document.getElementById('titleInstall');if(b)b.style.display=canInstall()?'':'none';}
async function installApp(){
  if(installEvt){
    const e=installEvt; installEvt=null;
    try{e.prompt();await e.userChoice;}catch(err){}
    updateInstallBtn(); return;
  }
  const close=G?backToMenu:`<button class="btn btn-sm" onclick="closeModal()">GOT IT</button>`;
  showModal('📲 INSTALL',`<div style="font-size:var(--f6);color:var(--text2);line-height:2.4">

    then <span style="color:var(--amber)">Add to Home Screen</span>.<br><br>
    The game then opens full screen like an app, works offline, and iOS is much less likely to clear its saves.</div>`,close);
}

function saveToSlot(s){
  try{
    G._savedAt=Date.now();
    localStorage.setItem(`ebi_save_slot${s}`,serializeG());
    toast(`Saved to slot ${s}`,'ok'); sfx('craft');
    openBigMenu('saves');
  }catch(e){toast('Save failed','bad');}
}

function loadFromSlot(s){
  const raw=localStorage.getItem(`ebi_save_slot${s}`);
  if(!raw){toast('Slot empty','wrn');return;}
  try{
    G=JSON.parse(raw);
    if(!G.crafted)G.crafted={};
    if(!G.perks)G.perks={points:0,spent:{},awarded:{}};
    if(!G.achievements)G.achievements=[];
    if(!G.tutorial)G.tutorial={step:0};
    if(!G.blueprints)G.blueprints=[];
    if(!G.zone)G.zone=1;
    migrateSave();
    G.power={out:0,in:0};
    closeModal(); if(openPanel)closePanel(openPanel);
    startGame(false);
    toast(`Loaded slot ${s}`,'ok');
    backfillLaunchPerks();
  }catch(e){toast('Load failed','bad');}
}

function deleteSlot(s){
  localStorage.removeItem(`ebi_save_slot${s}`);

    if(!G.research.done.includes(id))G.research.done.push(id);
  buildToolbar(); renderDevPanel();
  toast('All techs unlocked','ok');
}

function devGive(item,amt){
  G.inv[item]=(G.inv[item]||0)+amt;
  updateHUD();
  toast(`+${amt} ${ITEMS[item]?.name||item}`,'ok');
}

function devGiveAll(){
  for(const[item,amt]of Object.entries(DEV_GIVE_AMOUNTS))
    G.inv[item]=(G.inv[item]||0)+500;
  updateHUD(); toast('All resources +500','ok');
}

function devCompleteRocket(){
  if(!G.research.done.includes('rocket_tech'))G.research.done.push('rocket_tech');
  for(const p of ROCKET_PARTS) G.inv[p.id]=(G.inv[p.id]||0)+p.need;
  buildToolbar(); updateHUD();
  toast('Rocket components given','ok');
}

function devCompleteZone(){
  // Research every tech in this zone (and Zone 1's, which they build on)
  for(const[id,t]of Object.entries(TECHS))
    if(((t.zone||1)===G.zone||!t.zone)&&!G.research.done.includes(id))G.research.done.push(id);
  for(const r of rocketReqs()) G.inv[r.id]=(G.inv[r.id]||0)+r.need;
  if(zoneDef().onDevComplete)zoneDef().onDevComplete();
  buildToolbar(); updateHUD(); updateRocketBtn();
  toast(`Zone ${G.zone} techs + launch parts given`,'ok');
}

function devReset(){
  showModal('RESET SAVE?',
    '<div style="font-size:var(--f6);color:var(--red)">This will wipe everything and start a new game.</div>',
    `<button class="btn btn-sm btn-red" onclick="noSave=true;localStorage.removeItem('${SAVE_KEY}');location.reload()">RESET</button>
     <button class="btn btn-sm" onclick="closeModal()">CANCEL</button>`
  );
}
function buildTitleSlots(){
  const el=document.getElementById('titleSlots'); if(!el)return;
  const slots=[];

  // Autosave slot
  const auto=localStorage.getItem(SAVE_KEY);
  if(auto){
    try{
      const d=JSON.parse(auto);
      const ts=d._savedAt?new Date(d._savedAt).toLocaleString('en',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
      const launched=d.stats?.launched?'🚀 ':'';
      const research=d.research?.done?.length||0;
      slots.push({label:'AUTO',info:`${launched}Taps ${d.stats?.taps||0} · Research ${research}/${Object.keys(TECHS).length}`,time:ts,load:'continueGame()',del:`localStorage.removeItem('${SAVE_KEY}');buildTitleSlots()`});
    }catch(e){}
  }

  // Manual slots
  for(let s=1;s<=3;s++){
    const raw=localStorage.getItem(`ebi_save_slot${s}`);
    if(raw){
      try{
        const d=JSON.parse(raw);
        const ts=d._savedAt?new Date(d._savedAt).toLocaleString('en',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
        const launched=d.stats?.launched?'🚀 ':'';
        const research=d.research?.done?.length||0;
        slots.push({label:`S${s}`,info:`${launched}Taps ${d.stats?.taps||0} · Research ${research}/${Object.keys(TECHS).length}`,time:ts,load:`loadFromSlot(${s})`,del:`deleteSlotTitle(${s})`});
      }catch(e){}
    }
  }

  if(!slots.length){el.innerHTML='';return;}

  let html='';
  for(const slot of slots){
    html+=`<div style="display:flex;align-items:center;gap:6px;padding:8px 10px;margin-bottom:6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:6px">
      <span style="font-size:var(--f7);color:var(--amber);min-width:32px;font-family:var(--font)">${slot.label}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:var(--f6);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${slot.info}</div>
        <div style="font-size:var(--f5);color:var(--text3)">${slot.time}</div>
      </div>
      <button class="btn btn-teal btn-sm" style="font-size:var(--f5);padding:4px 8px" onclick="${slot.load}">LOAD</button>
      <button class="btn btn-sm" style="font-size:var(--f5);padding:4px 6px;color:var(--text3)" onclick="${slot.del}">✕</button>
    </div>`;
  }
  el.innerHTML=html;
}

function deleteSlotTitle(s){
  localStorage.removeItem(`ebi_save_slot${s}`);
  buildTitleSlots();
}
function quitToTitle(){
  musicStop();
  saveGame(); closeModal();
  clearInterval(tickId); cancelAnimationFrame(rafId);
  rafId=null; tickId=null;
  document.getElementById('sGame').classList.add('hidden');
  document.getElementById('sTitle').classList.remove('hidden');
  buildTitleSlots(); startTitleScene();
  setTimeout(()=>{if(onTitle())titleMusic();},600); // after the game track fades out
}

// ═══════════════════════════════════════════════════
//  SAVE / LOAD
// ═══════════════════════════════════════════════════
// Transient per-tick links (fluid networks are circular) never go into saves
const TRANSIENT_KEYS=new Set(['_net','_nets','_fluidStatus','_served','_serveN']);
function serializeG(){return JSON.stringify(G,(k,v)=>TRANSIENT_KEYS.has(k)?undefined:k==='map'&&v===G.map?packMap(v):v);}
// Saves store the map as one character per tile (a full Zone 5 map was ~1MB as
// objects, enough to hit phone storage limits). Machine tiles are rebuilt on load.
function packMap(map){
  const codes=[], idx={}; let res='';
  const items=[];
  for(let y=0;y<map.length;y++)for(let x=0;x<map[y].length;x++){
    const t=map[y][x];
    if(t.res){if(idx[t.res]===undefined){idx[t.res]=codes.length;codes.push(t.res);}res+=String.fromCharCode(65+idx[t.res]);}
    else res+='.';
    if(t.items&&t.items.length)items.push([x,y,t.items]);
  }
  return {packed:1,w:map[0].length,h:map.length,codes,res,items};
}
function unpackMap(pk,machines){
  const map=[];
  for(let y=0;y<pk.h;y++){map[y]=[];for(let x=0;x<pk.w;x++){
    const c=pk.res[y*pk.w+x], r=c&&c!=='.'?pk.codes[c.charCodeAt(0)-65]:null;
    map[y][x]={type:r?T_RESOURCE:T_FLOOR,res:r,mid:null,items:[]};
  }}
  for(const[x,y,its]of pk.items)if(map[y]?.[x])map[y][x].items=its;
  for(const m of Object.values(machines)){
    const[w,h]=machSize(m);
    for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++)if(map[m.y+dy]?.[m.x+dx])map[m.y+dy][m.x+dx].mid=m.id;
  }
  return map;
}

// Key renames between versions, called by both load paths
// Inserter arms time their swings with performance.now(), which restarts near zero on every page
// load. Saved timestamps from the last session sat far in the future, so arms spun and never finished
// a swing. On load: an arm holding an item finishes the swing and delivers it; an empty arm goes idle.
function resetArmClocks(){
  const now=performance.now();
  for(const m of Object.values(G.machines||{})){
    if(m.lastTransferMs)m.lastTransferMs=0;
    if(!m._arm)continue;
    if(m._arm.item)m._arm={state:'depositing',stateStart:now-insMs(INS_DEPOSIT_MS,m),item:m._arm.item};
    else delete m._arm;
  }
}
function migrateSave(){
  resetArmClocks();
  if(G.map&&G.map.packed)G.map=unpackMap(G.map,G.machines||{});
  if(G.map&&G.floorY===undefined){G.floorY=G.map.length;addFactoryFloor(G.map);G._newFloor=true;} // saves from before v2.0.0
  trimFactoryFloor();
  tidyBeltItems();
  for(const m of Object.values(G.machines||{}))if(m.type==='relief_valve'&&m.seal===undefined){m.seal=VALVE_SEAL;m.inBuf.gasket=Math.max(m.inBuf.gasket||0,4);G._gaskets=true;}
  if(G.zoneTut===undefined&&G.tutorialZ2!==undefined)G.zoneTut=G.tutorialZ2;
  delete G.tutorialZ2;
}

// noSave is set while a reset or a backup import reloads the page,
// so the save-on-hide can't write the old game back over it
let noSave=false;
function saveGame(){
  if(noSave||!G)return;
  try{localStorage.setItem(SAVE_KEY,serializeG());}catch(e){}
}
window.addEventListener('pagehide',()=>{if(G&&tickId)saveGame();});
function continueGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw){newGame();return;}
    G=JSON.parse(raw);
    if(!G||!G.ver){newGame();return;}
    if(!G.crafted)G.crafted={};
    if(!G.perks)G.perks={points:0,spent:{},awarded:{}};
    if(!G.achievements)G.achievements=[];
    if(!G.tutorial)G.tutorial={step:0};
    if(!G.blueprints)G.blueprints=[];
    if(!G.zone)G.zone=1;
    if(G.smog===undefined)G.smog=0;
    migrateSave();
    G.power={out:0,in:0};
    startGame(false);
  }catch(e){newGame();return;}
  backfillLaunchPerks();
}

// ═══════════════════════════════════════════════════
//  GAME INIT
// ═══════════════════════════════════════════════════
function newGame(){
  G=defaultState();
  applyPrestigeStart();
  startGame(true);
}

function startGame(isNew){
  stopTitleScene(); clearUndo();
  if(G._newFloor){delete G._newFloor;setTimeout(()=>toast('New: the Factory Floor! Scroll down past the ore fields for open ground','ok'),1500);}
  if(G._gaskets){delete G._gaskets;setTimeout(()=>toast('New: Relief Valves wear out Gaskets. Yours have 4 spares each: tap a valve to see','wrn'),2600);}
  if(G._tidied){const n=G._tidied;delete G._tidied;setTimeout(()=>toast(`Belts respaced: ${fmt(n)} items went to your inventory`,'ok'),2200);}
  syncMapSize();
  document.getElementById('sTitle').classList.add('hidden');
  document.getElementById('sGame').classList.remove('hidden');
  document.getElementById('wrap').getBoundingClientRect(); // force layout before canvas sizing
  initCanvas(); setupInput();
  activeTab=null; document.getElementById('tabDrawer').classList.remove('open');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  setTool('select'); updateSelectBtn(); updateBuildHUD(); updateSpeedBtn();
  G.power.out=0; G.power.in=0;
  const _pm=perkMult();
  for(const m of Object.values(G.machines)){
    if(!m.active)continue;
    if(m.type==='generator'||m.type==='burner'){
      if((m.inBuf.coal||0)>0) G.power.out+=Math.abs(MDEFS[m.type].power);
    } else if(m.type==='combustion_gen'){
      if((m.inBuf.refined_fuel||0)>0) G.power.out+=Math.abs(MDEFS[m.type].power);
    } else if(m.type!=='stone_furnace'&&m.type!=='blast_furnace'){
      const def=MDEFS[m.type];
      if(def&&def.power>0){
        const modEff=(m.modules||[]).some(x=>x==='eff_module')?0.7:1;
        G.power.in+=def.power*_pm.power*modEff;
      }
    }
  }
  updateZoneTabs();
  updateHUD(); updateRocketBtn();
  startTick(); startRender();
  if(G.music!==false) musicStart(); else musicStop(); // the title track carries straight on
  // Defer cam to next frame so canvas has final dimensions
  requestAnimationFrame(()=>{
    sizeCanvas();
    const ts=TILE*(G.cam.zoom||1);
    G.cam.x=Math.max(0,26*ts-canvas.clientWidth/2+ts*3);
    G.cam.y=Math.max(0,24*ts-canvas.clientHeight/2+ts*2);
    clampCam();
  });
  if(isNew){
    if(G.zone===1){G.tutorial={step:0};G.zoneTut=undefined;}
    const zd=zoneDef();
    setTimeout(()=>showModal(zd.arrivalTitle,
      `<div style="font-size:var(--f6);color:var(--text2);line-height:2.4">${zd.arrivalHtml}${FLOOR_NOTE}</div>`,
      `<button class="btn btn-teal btn-sm" onclick="closeModal()">${zd.arrivalBtn}</button>`
    ),700);
  }
}

  applyTheme();

  buildTitleSlots(); startTitleScene(); updateInstallBtn(); tryTitleAutoplay();
  // Ask the browser not to evict our saves (granted automatically once installed on most browsers)
  try{navigator.storage?.persist?.().catch(()=>{});}catch(e){}
  document.addEventListener('contextmenu',e=>e.preventDefault());
});
