function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}

// ── Rates per minute for the machine panel ──
// Worked out from the same numbers the simulation uses: power, perks, tier, modules, smog and
// life stage. A machine stopped for lack of power shows its full-speed rates instead.
const TICKS_PER_MIN=60000/TICK_MS;
function machineRates(m){
  const def=MDEFS[m.type], R={out:{},in:{},notes:[]}; if(!def)return R;
  const per=t=>TICKS_PER_MIN/Math.max(1,t);
  const mods=m.modules||[];
  const modSpeed=1+mods.filter(x=>x==='speed_module').length*0.25;
  const modYield=1+mods.filter(x=>x==='prod_module').length*0.25;
  const tierMult=MACHINE_TIER_SPEED[m.tier||1]||1;
  const pm=perkMult();
  // Rates are shown at full speed so they hold still; smog's slowdown (it changes every tick) gets its own line
  const smogNow=zoneHas('smog')?Math.max(0.1,(100-(G.smog||0))/100):1, smog=1;
  const immune=m.type==='stone_furnace'||m.type==='blast_furnace';
  let ratio=immune?1:powerRatio();
  if(ratio===0){ratio=1;if(def.power>0)R.notes.push('No power right now: these are full-speed rates');}
  if(m.type==='burner'){
    R.in.coal=per(BURNER_COAL_TICKS);
    const miner=per(MINE_TICKS);
    R.notes.push(`One coal Miner (${fmtRate(miner)}/min) feeds ${Math.floor(miner/R.in.coal)} Burners`);
    R.notes.push('Only burns while something is using power');
  } else if(m.type==='generator'){R.in.coal=per(16);R.notes.push('Only burns while something is using power');}
  else if(m.type==='combustion_gen'){R.in.refined_fuel=per(32);R.notes.push('Only burns while something is using power');}
  else if(m.type==='relief_valve')R.notes.push(`Vents up to ${VALVE_VENT*TICKS_PER_MIN}/min above ${RELIEF_AT}% pressure, wearing out 1 Gasket per ${VALVE_SEAL} vented (1 a minute flat out)`);
  else if(m.type==='scrubber'){R.in.refined_fuel=per(SCRUBBER_FUEL_TICKS);R.notes.push(`Clears ${SCRUBBER_SMOG_MIN} smog/min while it has fuel, power and smog to clean`);}
  else if(m.type==='reactor'){R.in.lum_rod=per(ROD_TICKS);}
  else if(m.type==='miner'){
    if(!m.mineRes)R.notes.push('Place it on a deposit to mine');
    else{
      const resMult=m.mineRes==='radiant_dust'?0.5:1;
      R.out[m.mineRes]=per(MINE_TICKS)*ratio*pm.speed*(MINER_TIER_SPEED[m.tier||1]||1)*modSpeed*smog*resMult*(1+Math.min(1,Math.max(0,pm.yield*modYield-1)));
    }
  } else if(m.type==='oil_pump'){
    if(m.mineRes==='oil')R.out.crude_oil=per(MINE_TICKS)*ratio*(MINER_TIER_SPEED[m.tier||1]||1);
    else R.notes.push('Place it on an oil deposit');
  } else if(def.pumps){
    if(m.mineRes===def.pumps)R.out[def.pumps]=per(2)*tierMult;
    else R.notes.push('Place it on its pool');
  } else if(BELT_TYPES.includes(m.type)){
    R.notes.push(`Carries up to ${fmtRate(beltBaseSpeed()*beltTierMult(m)*BELT_CAP*TICKS_PER_MIN)} items/min (${fmtRate(beltBaseSpeed()*beltTierMult(m)*TICKS_PER_MIN/60)} tiles/s)`);
  } else if(m.type==='inserter'||m.type==='long_inserter'){
    R.notes.push(`Moves up to ${fmtRate(60000*(INS_TIER_SPEED[m.tier||1]||1)/(INS_GRAB_MS+INS_DEPOSIT_MS+INS_RETURN_MS))} items/min`);
  } else if(m.recipe&&RECIPES[m.recipe]){
    const rec=RECIPES[m.recipe];
    const life=def.living?lifeStage(m).mult:1;
    const c=per(Math.ceil(rec.time/Math.max(.01,ratio*pm.speed*tierMult*modSpeed*smog*life)));
    for(const[k,n]of Object.entries(rec.in))R.in[k]=(R.in[k]||0)+n*c;
    for(const[k,n]of Object.entries(rec.fluid||{}))R.in[k]=(R.in[k]||0)+n*c;
    for(const[k,n]of Object.entries(rec.out))R.out[k]=(n+(modYield-1))*c; // a Productivity Module adds a chance of +1
  } else if(def.recipes.length){R.notes.push('Pick a recipe to see its rates');}
  const tk=Math.max(0,...Object.entries(INS_TAKERS).filter(([k])=>k==m.id||k.startsWith(m.id+':')).map(([,v])=>v.length));
  if(tk>1)R.notes.push(`Output shared by ${tk} inserters, taking turns`);
  if(zoneHas('smog')&&SMOG_PER[m.type])R.notes.push(`Makes ${fmtRate(machineSmog(m))} smog/min while working`);
  if(smogNow<1&&!immune&&m.type!=='scrubber'&&(Object.keys(R.out).length||m.type==='miner'))R.notes.push(`Smog is slowing it to ${Math.round(smogNow*100)}% right now`);
  if(def.living&&!m.withered){R.in.nutrient=(R.in.nutrient||0)+per(FEED_EVERY);R.notes.push('Nutrient Paste is eaten only while vitality is under 100%');}
  return R;
}
// Which inserter can carry a rate on its own (60 · 120 · 270 per minute), for the per-minute rows
function armHint(v){
  if(v<=60+1e-6)return 'T1 arm'; if(v<=120+1e-6)return 'T2 arm'; if(v<=270+1e-6)return 'T3 arm';
  return `${Math.ceil(v/270-1e-6)} T3 arms`;
}
// A machine's per-minute rates for any recipe at its own tier (same maths as the panel)
function recipeRates(m,rid){const old=m.recipe; m.recipe=rid; const R=machineRates(m); m.recipe=old; return R;}
// How long one T1 Lab takes to make a tech's science, in minutes (the slowest pack sets it)
function labMinutes(cost){
  let t=0;
  for(const[k,n]of Object.entries(cost)){const rid=Object.keys(RECIPES).find(id=>RECIPES[id].machine==='lab'&&RECIPES[id].out[k]); if(rid)t+=n/(RECIPES[rid].out[k]*TICKS_PER_MIN/RECIPES[rid].time);}
  return t;
}
function fmtRate(n){return n>=10?String(Math.round(n)):n>=1?n.toFixed(1).replace(/\.0$/,''):n.toFixed(2).replace(/0$/,'');}
function ratesHtml(m){
  const R=machineRates(m);
  const fluid=k=>k==='brine'||k==='enzymes';
  const row=(k,v)=>`<div class="rate-row">${iconHtml(k)}<span class="rate-n">${fmtRate(v)}</span><span class="rate-u">${fluid(k)?'units':''}/min</span><span class="rate-name">${ITEMS[k]?.name||k}</span>${fluid(k)?'':`<span class="rate-arm">${armHint(v)}</span>`}</div>`;
  const outs=Object.entries(R.out), ins=Object.entries(R.in);
  if(!outs.length&&!ins.length&&!R.notes.length)return '';
  let h=`<span class="sec-label" style="margin-top:10px">PER MINUTE</span><div class="rates">`;
  // two-output machines: say which arrow each item leaves by
  const SIDES=['top','right','bottom','left'], sideOf={};
  (PORTS[m.type]?.outputs||[]).forEach((p,i)=>{const it=portItems(m,i); if(it)sideOf[it]=SIDES[(SIDES.indexOf(p.side)+(m.dir||0))%4];});
  if(outs.length)h+=`<div class="rate-h ok">MAKES</div>`+outs.map(([k,v])=>row(k,v).replace('<span class="rate-arm">',sideOf[k]?`<span class="rate-arm" style="color:var(--amber)">${sideOf[k].toUpperCase()} ARROW</span><span class="rate-arm">`:'<span class="rate-arm">')).join('');
  if(ins.length)h+=`<div class="rate-h use">USES</div>`+ins.map(([k,v])=>row(k,v)).join('');
  h+=R.notes.map(n=>`<div class="rate-note">${n}</div>`).join('');
  return h+`</div>`;
}

      html+=`<div class="inv-chip" onclick="showRecipeFor('${id}')">${iconHtml(id)}<span style="font-size:var(--f6);color:var(--amber)">${fmt(G.inv[id])}</span><span class="n">${it.name}</span></div>`;

  else html+=`<div style="font-size:var(--f4);color:var(--text3);margin-top:8px">Tap an item to see how it is made and what uses it.</div>`;

}

// ── Hand Craft Panel ───────────────────────────────
function renderCraftPanel(){
  const el=document.getElementById('pCraftBody'); if(!el)return;
  const cs=G.craftState||{recipeId:null,clicks:0};
  const active=cs.recipeId?HAND_CRAFTS.find(r=>r.id===cs.recipeId):null;

  let html=`<div style="font-size:var(--f5);color:var(--text3);line-height:2;margin-bottom:10px;padding:7px;border:1px solid var(--border);background:var(--bg3)">
    Process raw materials by hand.<br>Click the hammer to craft.
  </div>`;

  // Active crafting session, hammer button front and centre
  if(active){
    const pct=Math.round(cs.clicks/active.clicks*100);
    const remaining=active.clicks-cs.clicks;
    const outStr=Object.entries(active.out).map(([k,v])=>`${v}× ${ITEMS[k]?.name||k}`).join(', ');
    html+=`<div id="craftActive" style="border:1px solid var(--amber);background:var(--bg3);padding:12px;margin-bottom:10px;text-align:center">
      <div style="font-size:var(--f7);color:var(--amber);margin-bottom:6px">${iconHtml(active.id)} ${active.name}</div>
      <div style="font-size:var(--f5);color:var(--text3);margin-bottom:8px">→ ${outStr}</div>
      <div style="height:8px;background:var(--bg);border:1px solid var(--border);margin-bottom:6px">
        <div style="height:100%;background:var(--amber);width:${pct}%;transition:width .1s"></div>
      </div>
      <div style="font-size:var(--f5);color:var(--text3);margin-bottom:10px">${cs.clicks} / ${active.clicks} clicks &nbsp;·&nbsp; ${remaining} to go</div>
      <button id="hammerBtn" onclick="hammerClick()" style="
        font-size:28px;background:var(--bg);border:2px solid var(--amber);
        padding:10px 24px;cursor:pointer;display:block;width:100%;
        transition:transform .05s;font-family:serif;line-height:1
      ">🔨</button>
      <button onclick="cancelCraft()" style="margin-top:8px;font-family:var(--font);font-size:var(--f5);padding:5px 10px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;width:100%">CANCEL</button>
    </div>`;
  }

  // Recipe list, active recipe floats to top, then unlocked, then locked
  html+=`<span class="sec-label">RECIPES</span>`;
  const sortedCrafts=HAND_CRAFTS.filter(r=>zoneRecipeOk(r.id)).sort((a,b)=>{
    if(a.id===cs.recipeId) return -1;
    if(b.id===cs.recipeId) return 1;
    return 0;
  });
  for(const r of sortedCrafts){
    const isUnlocked=!r.unlock||G.research.done.includes(r.unlock);
    if(!isUnlocked){
      // Show locked recipe as a dim hint
      const techName=r.unlock?TECHS[r.unlock]?.name||r.unlock:'';
      html+=`<div style="border:1px solid var(--border);background:var(--bg3);padding:8px;margin-bottom:5px;opacity:.3">
        <div style="font-size:var(--f6);color:var(--text3)">${iconHtml(r.id)} ${r.name} <span style="font-size:var(--f4)">🔒 Requires ${techName}</span></div>
      </div>`;
      continue;
    }
    const isActive=cs.recipeId===r.id;
    const canAfford=Object.entries(r.in).every(([k,v])=>(G.inv[k]||0)>=v);
    const inStr=Object.entries(r.in).map(([k,v])=>{
      const have=G.inv[k]||0;
      const col=have>=v?'var(--green)':'var(--red)';
      return `${v}× ${ITEMS[k]?.name||k} <span style="color:${col}">(${have})</span>`;
    }).join(' + ');
    const outStr=Object.entries(r.out).map(([k,v])=>{
      const have=G.inv[k]||0;
      return `${v}× ${ITEMS[k]?.name||k} <span style="color:var(--text3)">[${have}]</span>`;
    }).join(', ');
    html+=`<div style="border:1px solid ${isActive?'var(--amber)':canAfford?'var(--border2)':'var(--border)'};background:var(--bg3);padding:8px;margin-bottom:5px;opacity:${canAfford||isActive?1:.45}">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:var(--f6);color:${isActive?'var(--amber)':'var(--text)'};margin-bottom:3px">${iconHtml(r.id)} ${r.name}</div>
          <div style="font-size:var(--f5);color:var(--blue);margin-bottom:2px">${inStr}</div>
          <div style="font-size:var(--f5);color:var(--text3)">→ ${outStr} &nbsp;·&nbsp; ${r.clicks} clicks</div>
        </div>
        ${!isActive?`<button class="mini-btn ${canAfford?'amber':'dim'}" onclick="startCraft('${r.id}')" ${canAfford?'':'disabled'}>START</button>`:'<span style="font-size:var(--f6);color:var(--amber)">▶ active</span>'}
      </div>
    </div>`;
  }
  setHtml(el,html);
}

function startCraft(id){
  const r=HAND_CRAFTS.find(h=>h.id===id); if(!r||!zoneRecipeOk(id))return;
  // Just check affordability for visual feedback, don't deduct yet
  if(!G.devFreeCraft){
    const canAfford=Object.entries(r.in).every(([k,v])=>(G.inv[k]||0)>=v);
    if(!canAfford){
      for(const[item,need]of Object.entries(r.in)){
        if((G.inv[item]||0)<need){toast(`Need ${need}× ${ITEMS[item]?.name||item}`,'wrn');sfx('error');return;}
      }
    }
  }
  G.craftState={recipeId:id, clicks:0};
  updateHUD(); renderCraftPanel(); sfx('tap');
}

function hammerClick(){
  const cs=G.craftState; if(!cs||!cs.recipeId)return;
  const r=HAND_CRAFTS.find(h=>h.id===cs.recipeId); if(!r)return;

  cs.clicks++;
  sfx('tap');

  // Animate the hammer button
  const btn=document.getElementById('hammerBtn');
  if(btn){
    btn.style.transform='scale(.88) rotate(-12deg)';
    setTimeout(()=>{if(btn)btn.style.transform='scale(1) rotate(0deg)';},80);
  }

  if(cs.clicks>=r.clicks){
    // Final click, check materials are still available, then deduct and give output
    if(!G.devFreeCraft){
      const canAfford=Object.entries(r.in).every(([k,v])=>(G.inv[k]||0)>=v);
      if(!canAfford){
        G.craftState={recipeId:null,clicks:0};
        toast('Not enough materials. Craft cancelled','bad'); sfx('error');
        updateHUD(); renderCraftPanel(); return;
      }
      for(const[item,need]of Object.entries(r.in)) G.inv[item]-=need;
    }
    for(const[item,n]of Object.entries(r.out)) G.inv[item]=(G.inv[item]||0)+n;
    G.stats.crafts=(G.stats.crafts||0)+1;
    const outStr=Object.entries(r.out).map(([k,v])=>`${v}× ${ITEMS[k]?.name||k}`).join(', ');
    sfx('craft'); toast(`Crafted: ${outStr}`,'ok');
    updateHUD();
    // Auto-repeat: start next batch if still affordable
    const canRepeat=G.devFreeCraft||Object.entries(r.in).every(([k,v])=>(G.inv[k]||0)>=v);
    if(canRepeat){
      cs.clicks=0;
    } else {
      G.craftState={recipeId:null,clicks:0};
    }
  }
  renderCraftPanel();
}

function cancelCraft(){
  // No refund needed, materials were never deducted until completion
  G.craftState={recipeId:null,clicks:0};
  updateHUD(); renderCraftPanel();
  toast('Crafting cancelled','ok');
}


// ── Machine Inspector ──────────────────────────────
function openMachinePanel(m){
  if(!m)return;
  inspectId=m.id;
  document.getElementById('pMachTitle').innerHTML=`${iconHtml(m.type)} ${MDEFS[m.type].name}`;
  renderMachPanel();
  togglePanel('machine');
}

function renderMachPanel(){
  const el=document.getElementById('pMachBody'); if(!el||inspectId===null)return;
  const m=G.machines[inspectId]; if(!m){closePanel('machine');return;}
  const def=MDEFS[m.type];
  const rec=m.recipe?RECIPES[m.recipe]:null;
  const ratio=powerRatio();
  const pm2=perkMult();
  const speedMult=ratio*(m.type==='stone_furnace'?1:pm2.speed);
  const dur=m._dur||(rec?rec.time:1);
  const subTick=Math.min(1,(performance.now()-lastTickMs)/tickInterval());
  const smoothProg=rec&&m.prog>0?Math.min(dur,m.prog+subTick):m.prog;
  const pct=rec?Math.min(100,Math.round(smoothProg/dur*100)):0;

  let html=`<div class="card">`;
  const noPower=ratio===0&&def.power>0; // powered machine with no power
  const minerStatus = m.type==='miner'
    ? (noPower ? `<span style="color:var(--red)">⚡ No power</span>`
      : m.mineRes ? `<span style="color:var(--green)">▶ Mining ${ITEMS[m.mineRes]?.name||m.mineRes}</span>`
      : `<span style="color:var(--red)">✗ Not on deposit</span>`)
    : null;
  const noRecipeTypes=['belt','splitter','tunnel','inserter','generator','burner','miner'];
  const recipeStatus = !m.active
    ? `<span style="color:var(--text3)">⏸ Paused</span>`
    : noPower
    ? `<span style="color:var(--red)">⚡ No power</span>`
    : m.recipe ? `<span style="color:var(--green)">▶ ${m.type==='lab'?'Researching':'Running'}: ${RECIPES[m.recipe]?.name||''}</span>`
    : `<span style="color:var(--amber)">⚠ No recipe</span>`;
  const chestCap=m.type==='chest'?`<span style="color:var(--amber)">${Object.values(m.chestInv).reduce((a,b)=>a+b,0)}/200 stored</span>`:null;
  const statusVal = chestCap || minerStatus
    || (noRecipeTypes.includes(m.type)||!def.recipes.length
      ? (m.active ? `<span style="color:var(--green)">▶ Active</span>` : `<span style="color:var(--text3)">⏸ Paused</span>`)
      : (m.active ? recipeStatus : `<span style="color:var(--text3)">⏸ Paused</span>`));
  html+=irow('Status', statusVal);
  if(def.power>0)html+=irow('Power',`${Math.round(def.power)}kW`);
  if(def.power<0)html+=irow('Generating',`${Math.abs(def.power)}kW`);
  html+=irow('Total produced',fmt(m.produced));
  html+=ratesHtml(m);
  if((m.tier||1)>1) html+=irow('Tier',`<span style="color:${(m.tier||1)>=3?'var(--teal)':'var(--amber)'}">T${m.tier||1} (${tierBonus(m.type,m.tier||1)})</span>`);
  if(Object.keys(machineRates(m).out).length){ // measured over the last minute, next to the expected PER MINUTE figures
    const rate=itemsPerMin(m);
    const rateCol=rate===0?'var(--text3)':rate<2?'var(--amber)':'var(--green)';
    html+=irow('Actual output',`<span style="color:${rateCol}">${rate}/min</span>`);
  }
  // Show active perk bonuses
  const pm=perkMult();
  if(pm.speed>1||pm.yield>1){
    const bonuses=[];
    if(pm.speed>1)bonuses.push(`+${Math.round((pm.speed-1)*100)}% speed`);
    if(pm.yield>1)bonuses.push(`+${Math.round((pm.yield-1)*100)}% yield`);
    html+=irow('Perks',`<span style="color:var(--teal)">${bonuses.join(', ')}</span>`);
  }
  html+=fluidPanelRows(m,def,rec);
  if(m.type==='chest'){
    const tot=Object.values(m.chestInv).reduce((a,b)=>a+b,0);
    html+=irow('Stored',`${tot}/200`);
    if(tot>0){
      html+=`<div style="border-top:1px solid var(--border);margin:6px 0 4px"></div>`;
      html+=`<button class="full-btn amber" onclick="chestCollectAll(${m.id})" style="margin-bottom:6px">↑ COLLECT ALL</button>`;
      const stored=Object.entries(m.chestInv).filter(([,v])=>v>0);
      html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:4px">`;
      for(const[k,v]of stored){
        html+=`<div style="border:1px solid var(--border);background:var(--bg);padding:5px;display:flex;align-items:center;justify-content:space-between;cursor:pointer" onclick="chestTakeOne('${k}',${m.id})">
          <span>${iconHtml(k)}</span>
          <span style="font-size:var(--f5);color:var(--amber)">${v}</span>
          <span style="font-size:var(--f4);color:var(--teal)">TAKE</span>
        </div>`;
      }
      html+=`</div>`;
    } else {
      html+=`<div style="font-size:var(--f5);color:var(--text3);margin-top:4px">Empty</div>`;
    }
  }
  if(rec){
    html+=`<div style="font-size:var(--f5);color:var(--text3);margin:6px 0 2px">Progress</div>
    <div class="prog-wrap"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div style="font-size:var(--f5);color:var(--text3)">${pct}%</div>`;
  }
  const inItems=Object.entries(m.inBuf).filter(([,v])=>v>0);
  const outItems=Object.entries(m.outBuf).filter(([,v])=>v>0);
  const bufTotal=Object.values(m.outBuf).reduce((a,b)=>a+b,0);

  if(outItems.length||inItems.length){
    html+=`<div style="height:1px;background:var(--border);margin:8px 0"></div>`;
  }
  if(outItems.length){
    const bufFull=bufTotal>=50;
    html+=`<div style="font-size:var(--f5);color:${bufFull?'var(--red)':'var(--amber)'};margin-bottom:4px">
      ▲ Output${bufFull?' (FULL, stalled)':''}: ${outItems.map(([k,v])=>`${v}× ${ITEMS[k]?.name||k}`).join(', ')}
    </div>`;
    html+=`<button class="full-btn amber" onclick="emptyOutput(${m.id})" style="margin-bottom:6px">↑ EMPTY TO INVENTORY</button>`;
  } else if(def.recipes.length||m.type==='miner'){
    html+=`<div style="font-size:var(--f5);color:var(--text3);margin-bottom:6px">Output: empty</div>`;
  }
  if(inItems.length){
    html+=`<div style="font-size:var(--f5);color:var(--blue);margin-bottom:4px">▼ Input buffer: ${inItems.map(([k,v])=>`${v}× ${ITEMS[k]?.name||k}`).join(', ')}</div>`;
    html+=`<button class="full-btn" style="font-size:var(--f5);border-color:var(--blue);color:var(--blue)" onclick="ejectBuf(${m.id})">↩ RETURN INPUTS TO INVENTORY</button>`;
  }
  // Feed coal manually for generators/burners/furnaces
  if((m.type==='generator'||m.type==='burner'||m.type==='stone_furnace'||m.type==='blast_furnace')){
    const coalInInv=G.inv.coal||0;
    const coalInBuf=m.inBuf.coal||0;
    const isFurnace=(m.type==='stone_furnace'||m.type==='blast_furnace');
    html+=`<div style="margin-top:6px">
      ${irow('Coal in buffer',`<span style="color:${coalInBuf>0?'var(--green)':'var(--red)'}">${coalInBuf}</span>`)}
      ${isFurnace?`<div style="font-size:var(--f4);color:var(--text3);margin-bottom:4px">Coal is consumed as fuel per recipe. Can also be belt-fed.</div>`:''}
      <div style="display:flex;gap:4px;margin-top:4px">
        <button class="mini-btn ${coalInInv>=1?'amber':'dim'}" style="flex:1" onclick="feedCoal(${m.id},1)" ${coalInInv>=1?'':'disabled'}>+1 Coal</button>
        <button class="mini-btn ${coalInInv>=10?'amber':'dim'}" style="flex:1" onclick="feedCoal(${m.id},10)" ${coalInInv>=10?'':'disabled'}>+10 Coal</button>
      </div>
      <div style="font-size:var(--f4);color:var(--text3);margin-top:3px">Inventory: ${coalInInv} coal</div>
    </div>`;
  }
  html+=`</div>`;

  // Recipe picker, selected recipe shown at top with material requirements
  if(def.recipes.length){
    // If a recipe is selected, show it prominently at the top
    if(m.recipe){
      const rec=RECIPES[m.recipe];
      if(rec){
        const inBufItems=Object.entries(m.inBuf).filter(([,v])=>v>0);
        html+=`<div style="border:2px solid var(--amber);background:rgba(245,166,35,.06);padding:9px;margin-bottom:8px">
          <div style="font-size:var(--f6);color:var(--amber);margin-bottom:6px">▶ ${rec.name}</div>
          <div style="font-size:var(--f5);color:var(--text3);margin-bottom:4px">Required inputs:</div>
          <div style="margin-bottom:4px">`;
        for(const[item,need]of Object.entries(rec.in)){
          const inBuf=m.inBuf[item]||0;
          const col=inBuf>=need?'var(--green)':'var(--amber)';
          html+=`<div style="font-size:var(--f5);margin-bottom:2px;color:${col}">${iconHtml(item)} ${ITEMS[item]?.name||item}: ${inBuf}/${need} in buffer</div>`;
        }
        html+=`</div></div>`;
      }
    }
    html+=`<span class="sec-label">RECIPE</span>
    <div style="margin-bottom:8px">
      <div onclick="setRecipe(${m.id},'')" style="padding:6px 8px;margin-bottom:3px;border:1px solid ${!m.recipe?'var(--amber)':'var(--border)'};background:${!m.recipe?'rgba(245,166,35,.08)':'var(--bg3)'};cursor:pointer;font-size:var(--f5);color:${!m.recipe?'var(--amber)':'var(--text3)'}">- none -</div>`;
    for(const rid of def.recipes){
      const r=RECIPES[rid]; if(!r||!zoneRecipeOk(rid))continue;
      const recUnlocked=!r.unlock||G.research.done.includes(r.unlock);
      if(!recUnlocked){
        const reqName=TECHS[r.unlock]?.name||r.unlock;
        html+=`<div style="padding:6px 8px;margin-bottom:3px;border:1px solid var(--border);background:var(--bg3);opacity:0.4;cursor:not-allowed">
          <div style="font-size:var(--f6);color:var(--text3)">🔒 ${r.name}, requires ${reqName}</div>
        </div>`;
        continue;
      }
      // per minute at this machine's tier, so recipes compare at a glance
      const RR=recipeRates(m,rid), pm=(o)=>Object.entries(o).map(([k,v])=>`${iconHtml(k)}${fmtRate(v)} ${ITEMS[k]?.name||k}`).join(' + ');
      const sel=m.recipe===rid;
      html+=`<div onclick="setRecipe(${m.id},'${rid}')" style="padding:6px 8px;margin-bottom:3px;border:1px solid ${sel?'var(--amber)':'var(--border)'};background:${sel?'rgba(245,166,35,.08)':'var(--bg3)'};cursor:pointer">
        <div style="font-size:var(--f6);color:${sel?'var(--amber)':'var(--text)'};margin-bottom:2px">${r.name}${sel?' ✓':''} <span style="color:var(--text3);font-size:var(--f4)">PER MIN</span></div>
        <div class="rp-rates"><span class="rin">${pm(RR.in)||'nothing'}</span><br><span style="color:var(--text3)">→</span> <span class="rout">${pm(RR.out)}</span></div>
      </div>`;
    }
    html+=`</div>`;
  }

  // Action buttons, move, rotate, demolish
  const canRotate=(m.type==='belt'||m.type==='inserter'||m.type==='long_inserter'||m.type==='tunnel'||m.type==='splitter');
  const rotBtn2=canRotate?`<button class="full-btn teal" style="flex:1" onclick="rotateM(${m.id})">&#x21BB; ${D_ARR[m.dir]}</button>`:'';
  html+=`<div style="display:flex;gap:4px;margin-bottom:5px">
    <button class="full-btn teal" style="flex:1" onclick="moveSingleMachine(${m.id})">✥ MOVE</button>
    ${rotBtn2}
  </div>
  <button class="full-btn red" onclick="tryRemove(${m.x},${m.y});togglePanel('machine')" style="margin-bottom:5px">&#x1F4A5; DEMOLISH</button>`;

  // Module slots (T2 = 1 slot, T3 = 2 slots)
  const MODULE_DEFS={
    speed_module:{name:'Speed Module', icon:'🔵', desc:'+25% speed'},
    prod_module: {name:'Prod. Module', icon:'🟢', desc:'+25% yield'},
    eff_module:  {name:'Eff. Module',  icon:'🔴', desc:'-30% power'},
  };
  if(MODULE_TYPES.includes(m.type)){
    const tier=m.tier||1;
    const slots=tier-1; // T1=0, T2=1, T3=2
    if(slots>0){
      if(!m.modules)m.modules=[];
      html+=`<div style="border:1px solid var(--border);background:var(--bg3);padding:7px;margin-top:6px">
        <span class="sec-label">MODULE SLOTS (${m.modules.length}/${slots})</span>`;
      for(let si=0;si<slots;si++){
        const installed=m.modules[si];
        if(installed){
          const md=MODULE_DEFS[installed];
          html+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;padding:4px;border:1px solid var(--tealDim);background:rgba(38,198,160,.05)">
            <span style="font-size:var(--f5);color:var(--teal)">${iconHtml(installed)} ${md?.name||installed}, ${md?.desc||''}</span>
            <button class="mini-btn red" style="font-size:var(--f4)" onclick="removeModule(${m.id},${si})">✕</button>
          </div>`;
        } else {
          html+=`<div style="font-size:var(--f5);color:var(--text3);margin-bottom:4px;padding:4px;border:1px dashed var(--border)">Empty slot, install a module:</div>
          <div style="display:flex;gap:3px;margin-bottom:4px">`;
          for(const[modId,md]of Object.entries(MODULE_DEFS)){
            const have=G.inv[modId]||0;
            html+=`<button class="mini-btn ${have>0?'teal':'dim'}" style="flex:1;font-size:var(--f4)" onclick="installModule(${m.id},${si},'${modId}')" ${have>0?'':'disabled'}>${iconHtml(modId)} ${md.name}<br><span style="color:var(--text3)">${have} avail</span></button>`;
          }
          html+=`</div>`;
        }
      }
      html+=`</div>`;
    }
  }

  // Tier upgrade
  if(TIER_TYPES.includes(m.type)){
    const tier=m.tier||1;
    if(tier<3){
      const nextTier=tier+1;
      const cost=tierCost(m.type,nextTier), locked=tierLocked(m.type);
      const canAfford=!locked&&Object.entries(cost).every(([k,v])=>(G.inv[k]||0)>=v);
      const costStr=Object.entries(cost).map(([k,v])=>{
        const have=G.inv[k]||0;
        const col=have>=v?'var(--green)':'var(--red)';
        return `${v}× ${ITEMS[k]?.name||k} <span style="color:${col}">(${have})</span>`;
      }).join(', ');
      html+=`<div style="border:1px solid var(--border);background:var(--bg3);padding:7px;margin-top:6px">
        <div style="font-size:var(--f5);color:var(--text3);margin-bottom:3px">UPGRADE TO T${nextTier}: ${tierBonus(m.type,nextTier)}</div>${(()=>{ // what this machine would make at the next tier
          const R=machineRates(m), sp=t=>(isInserter(m.type)?INS_TIER_SPEED:BELT_TYPES.includes(m.type)?BELT_TIER_SPEED:MACHINE_TIER_SPEED)[t]||1, f=sp(nextTier)/sp(tier);
          const outs=Object.entries(R.out); if(!outs.length)return '';
          return `<div style="font-size:var(--f5);color:var(--green);margin-bottom:3px">T${nextTier} makes ${outs.map(([k,v])=>`${iconHtml(k)}${fmtRate(v*f)}/min`).join(' + ')} (now ${outs.map(([k,v])=>fmtRate(v)).join(' + ')})</div>`;})()}
        <div style="font-size:var(--f4);color:var(--text3);margin-bottom:5px">${locked?`<span style="color:var(--red)">Needs ${locked} research</span>`:costStr}</div>
        <button class="mini-btn ${canAfford?'teal':'dim'}" onclick="upgradeMachine(${m.id})" ${canAfford?'':'disabled'}>⬆ UPGRADE</button>
      </div>`;
    } else {
      html+=`<div style="font-size:var(--f5);color:var(--teal);padding:5px;border:1px solid var(--tealDim);margin-top:6px;text-align:center">T3 MAX TIER ✓</div>`;
    }
  }

  // Controls
  html+=`<div style="display:flex;gap:6px;margin-top:6px">
    <button class="mini-btn" style="flex:1;color:var(--text2);border-color:var(--border2)" onclick="toggleM(${m.id})">${m.active?'PAUSE':'RESUME'}</button>
  </div>`; // DEMOLISH (with the MOVE row above) is the only remove button

  setHtml(el,html);
}

// Pipe network, pump, accumulator and lumen details for the machine panel
function fluidPanelRows(m,def,rec){
  let html='';
  const netRows=net=>{
    const p=Math.round(pressureOf(net));
    const col=net.strain>0?'var(--red)':p>=RELIEF_AT?'var(--amber)':p<LOW_PRESSURE?'var(--blue)':'var(--teal)';
    return irow('Fluid',net.type?`${iconHtml(net.type)} ${ITEMS[net.type]?.name||net.type}`:'Empty')
      +irow('Network',`${Math.round(net.amt)}/${net.cap} · ${net.members.length} parts`)
      +irow('Pressure',`<span style="color:${col}">${p}%${net.strain>0?` ⚠ strain ${Math.round(net.strain/burstStrain()*100)}%`:''}</span>`)
      +`<div class="prog-wrap" style="margin:4px 0 6px;position:relative"><div class="prog-fill" style="width:${p}%;background:${col}"></div></div>`;
  };
  if(def.fluidCap&&m._net)html+=netRows(m._net);
  const status={nopipe:'<span style="color:var(--red)">✗ Not connected to a pipe</span>',
    lowpressure:'<span style="color:var(--blue)">💧 Low pressure</span>',
    nodeposit:'<span style="color:var(--red)">✗ Not on a deposit</span>',
    nopower:'<span style="color:var(--red)">⚡ No power</span>',
    ok:'<span style="color:var(--green)">✓ Flowing</span>'};
  if(def.fluidPort){
    if(m._fluidStatus)html+=irow('Flow',status[m._fluidStatus]||'');
    if(rec?.fluid)html+=irow('Needs',Object.entries(rec.fluid).map(([f,n])=>`${n}× ${ITEMS[f]?.name}`).join(', ')+(rec.minPressure?` @ ${rec.minPressure}%+`:''));
    const net=(m._nets||[])[0]; if(net)html+=netRows(net);
  }
  if(def.living){
    const st=lifeStage(m);
    const v=Math.round(m.vit||0);
    html+=irow('Vitality',`<span style="color:${m.withered?'var(--text3)':v<25?'var(--red)':'var(--green)'}">${st.icon} ${st.name} · ${v}% · ×${st.mult} speed</span>`);
    html+=irow('Food',`🥣 ${m.inBuf.nutrient||0} paste in buffer`);
    html+=m.withered
      ?`<button class="full-btn amber" style="margin:4px 0" onclick="replantMachine(${m.id})">🌱 REPLANT (${REPLANT_COST} biomass)</button>`
      :`<button class="full-btn teal" style="margin:4px 0" onclick="feedMachine(${m.id})">🥣 FEED 1 PASTE (have ${G.inv.nutrient||0})</button>`;
  }
  if(m.type==='reactor'){
    const sinks=machineNeighbors(m).filter(n=>n.type==='heat_sink').length;
    html+=irow('Heat',`<span style="color:${(m.heat||0)>80?'var(--red)':'var(--teal)'}">${Math.round(m.heat||0)}%${m.scram>0?`, SCRAM ${Math.ceil(m.scram*TICK_MS/1000)}s`:''}</span>`);
    html+=irow('Cooling',`${sinks} heat sink${sinks!==1?'s':''} (${sinks>=2?'stable':'needs '+(2-sinks)+' more'})`);
    html+=irow('Fuel',`🔦 ${m.inBuf.lum_rod||0} rods · 1 rod / ${ROD_TICKS*TICK_MS/1000}s`);
  }
  if(m.type==='relief_valve'){
    const seal=m.seal===undefined?VALVE_SEAL:m.seal, jam=valveJammed(m), hot=m._net&&pressureOf(m._net)>RELIEF_AT;
    html+=irow('Gasket',jam?`<span style="color:var(--red)">✗ Worn out: valve jammed shut</span>`:`<span style="color:${seal<15?'var(--amber)':'var(--teal)'}">${Math.round(seal/VALVE_SEAL*100)}% left</span>`);
    html+=irow('Spares',`${iconHtml('gasket')} ${m.inBuf.gasket||0} / ${MDEFS.relief_valve.bufCap}`);
    html+=irow('Venting',jam?(hot?'<span style="color:var(--red)">Needed, but jammed</span>':'Jammed'):hot?'<span style="color:var(--amber)">Yes, up to 60/min</span>':'No (below 80%)');
    html+=`<button class="full-btn teal" style="margin:4px 0" onclick="loadGaskets(${m.id})">LOAD GASKETS (have ${G.inv.gasket||0})</button>
      <div style="font-size:var(--f4);color:var(--text3);line-height:1.8">Each Gasket seals 60 units of venting. An inserter can keep it stocked.</div>`;
  }
  if(m.type==='accumulator')html+=irow('Charge',`${Math.round((m.charge||0)/ACC_CAP*100)}% (${Math.round(m.charge||0)}/${ACC_CAP} kJ)`);
  if(m.type==='lumen_panel')html+=irow('Glow tide',glowBright()?`<span style="color:var(--amber)">☀️ Bright, ${glowSecsLeft()}s left</span>`:`<span style="color:var(--text3)">🌑 Dim, ${glowSecsLeft()}s left</span>`);
  return html;
}

function irow(lbl,val){return `<div class="irow"><span class="lbl">${lbl}</span><span>${val}</span></div>`}
function setRecipe(id,rid){const m=G.machines[id];if(!m)return;if(rid&&!zoneRecipeOk(rid))return;m.recipe=rid||null;m.prog=0;renderMachPanel();}
function toggleM(id){const m=G.machines[id];if(!m)return;m.active=!m.active;renderMachPanel();}
function rotateM(id){
  const m=G.machines[id];if(!m)return;
  const was=posSnap(m);
  unlinkTunnel(m); // re-linked below in the new direction
  // A non-square machine changes footprint when it turns: free its tiles, check the new ones, claim them
  const[ow,oh]=machSize(m), nd=(m.dir+1)%4, [nw,nh]=machSize(m.type,nd);
  if(ow!==nw||oh!==nh){
    const cells=(w,h)=>{const c=[];for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++)c.push([m.x+dx,m.y+dy]);return c;};
    for(const[x,y]of cells(ow,oh))G.map[y][x].mid=null;
    const fits=cells(nw,nh).every(([x,y])=>x>=0&&y>=0&&x<MAP_W&&y<MAP_H&&G.map[y][x].mid===null&&terrainOk(m.type,G.map[y][x]));
    if(!fits){
      for(const[x,y]of cells(ow,oh))G.map[y][x].mid=m.id;
      toast(`No room to rotate the ${MDEFS[m.type].name}`,'wrn'); sfx('error'); return;
    }
    m.dir=nd; for(const[x,y]of cells(nw,nh))G.map[y][x].mid=m.id;
    undoRec({op:'pos',list:[was]});
    renderMachPanel(); saveGame();
    toast(`${MDEFS[m.type].name}: ${D_ARR[m.dir]}`,'ok'); sfx('place'); return;
  }
  m.dir=(m.dir+1)%4;
  undoRec({op:'pos',list:[was]});
  if(m.type==='tunnel'){const tl=linkTunnel(m); if(tl)toast(`Tunnel linked! (${tl} tiles)`,'ok');}
  renderMachPanel();
  saveGame();
  toast(`Direction: ${D_ARR[m.dir]}`,'ok');
}

// Tier upgrade costs, paid per step (T1→T2, then T2→T3). Inserters are cheap: you upgrade lots of them.
const TIER_COSTS={
  2:{iron_plate:10,iron_gear:5,circuit:2},
  3:{steel_plate:8,circuit:6,engine:2},
};
const INS_TIER_COSTS={
  2:{iron_gear:2,circuit:1},
  3:{steel_plate:1,circuit:2},
};
const BELT_TIER_COSTS={ // per belt tile, splitter or tunnel
  2:{iron_gear:1},
  3:{steel_plate:1},
};
// Machines that take tier upgrades; module slots are only for the production machines
const MODULE_TYPES=['miner','blast_furnace','electric_smelter','assembler','lab'];
const BELT_TYPES=['belt','splitter','tunnel'];
const TIER_TYPES=[...MODULE_TYPES,'inserter','long_inserter',...BELT_TYPES];
const isInserter=t=>t==='inserter'||t==='long_inserter';
// Belt upgrades need Advanced Logistics (it used to give +50% belt speed instead)
function tierLocked(type){return BELT_TYPES.includes(type)&&!G.research.done.includes('logistics')?'Advanced Logistics':null;}
function tierCost(type,tier){return (isInserter(type)?INS_TIER_COSTS:BELT_TYPES.includes(type)?BELT_TIER_COSTS:TIER_COSTS)[tier];}
function tierBonus(type,tier){
  if(isInserter(type))return `${60*INS_TIER_SPEED[tier]} items/min`;
  if(BELT_TYPES.includes(type))return `${60*BELT_TIER_SPEED[tier]} items/min`;
  if(type==='miner')return `${60*MINER_TIER_SPEED[tier]} items/min`;
  return `${MACHINE_TIER_SPEED[tier]}× speed`;
}
function addCost(totals,cost){for(const[k,n]of Object.entries(cost))totals[k]=(totals[k]||0)+n;return totals;}
// Everything a machine is worth: build cost, each upgrade step up to its tier, installed modules.
// Demolish refunds this; paste, blueprints and undo rebuilds charge it.
function machineWorth(type,tier,modules){
  const t=addCost({},MDEFS[type]?.cost||{});
  for(let k=2;k<=Math.min(3,tier||1);k++)addCost(t,tierCost(type,k));
  for(const mod of modules||[])if(mod)t[mod]=(t[mod]||0)+1;
  return t;
}
function upgradeMachine(id){
  const m=G.machines[id]; if(!m)return;
  const tier=m.tier||1; if(tier>=3)return;
  const nextTier=tier+1;
  const cost=tierCost(m.type,nextTier);
  if(tierLocked(m.type)){toast(`Needs ${tierLocked(m.type)} research`,'wrn');sfx('error');return;}
  for(const[item,need]of Object.entries(cost)){
    if((G.inv[item]||0)<need){toast(`Need ${need}× ${ITEMS[item]?.name||item}`,'wrn');sfx('error');return;}
  }
  for(const[item,need]of Object.entries(cost)) G.inv[item]-=need;
  m.tier=nextTier;
  sfx('research');
  toast(`Upgraded to T${nextTier}!`,'ok');
  updateHUD(); renderMachPanel();
}

function installModule(machId,slot,modId){
  const m=G.machines[machId]; if(!m)return;
  if((G.inv[modId]||0)<1){toast('No modules available','wrn');return;}
  if(!m.modules)m.modules=[];
  G.inv[modId]--;
  m.modules[slot]=modId;
  sfx('craft'); toast(`${ITEMS[modId]?.name||modId} installed`,'ok');
  updateHUD(); renderMachPanel();
}

function removeModule(machId,slot){
  const m=G.machines[machId]; if(!m||!m.modules)return;
  const modId=m.modules[slot]; if(!modId)return;
  m.modules.splice(slot,1);
  G.inv[modId]=(G.inv[modId]||0)+1;
  sfx('craft'); toast('Module removed','ok');
  updateHUD(); renderMachPanel();
}

// ── Blueprint helpers ──────────────────────────────
function blueprintCost(data){
  const totals={};
  for(const e of data){
    const def=MDEFS[e.type]; if(!def||def.stub)continue;
    addCost(totals,machineWorth(e.type,e.tier)); // copies keep their tier, so they pay for it
  }
  return totals;
}
function blueprintCostStr(data){
  const c=blueprintCost(data);
  if(!Object.keys(c).length)return'Free';
  return Object.entries(c).map(([k,v])=>`${v}× ${ITEMS[k]?.name||k}`).join(', ');
}
function blueprintCanAfford(data){
  if(G.devFreeBuild)return true;
  const c=blueprintCost(data);
  return Object.entries(c).every(([k,v])=>(G.inv[k]||0)>=v);
}
function saveBlueprintFromModal(){
  const name=(document.getElementById('bpNameInput')?.value||'Blueprint').trim()||'Blueprint';
  if(!G.blueprints)G.blueprints=[];
  if(G.blueprints.length>=8){toast('Blueprint limit reached (8)','wrn');closeModal();return;}
  G.blueprints.push({name, data:[...blueprintState.data]});
  blueprintState={mode:'idle',x1:0,y1:0,x2:0,y2:0,data:[]};
  saveGame(); closeModal(); sfx('craft');
  toast('Blueprint saved!','ok');
  if(openPanel==='blueprint')renderBlueprintPanel();
}
function startPasteBlueprint(idx){
  const b=(G.blueprints||[])[idx]; if(!b)return;
  if(!blueprintCanAfford(b.data)){
    const missing=Object.entries(blueprintCost(b.data))
      .filter(([k,v])=>(G.inv[k]||0)<v)
      .map(([k,v])=>`${v-(G.inv[k]||0)}× ${ITEMS[k]?.name||k}`).join(', ');
    toast(`Need: ${missing}`,'bad'); sfx('error'); return;
  }
  blueprintState={mode:'holding',x1:0,y1:0,x2:0,y2:0,data:[...b.data]};
  closePanel('blueprint');
  setTool('blueprint');
  const lbl=document.getElementById('ghostBarLabel');
  if(lbl) lbl.textContent=`${b.data.length} machine${b.data.length!==1?'s':''}, position then ✓ PLACE`;
  document.getElementById('ghostBar')?.classList.remove('hidden');
}
// ── Rotate / flip a copied layout or blueprint before placing ──
// Every machine moves to its mirrored or rotated spot and its direction turns with it (belts, inserters,
// outputs), so a flipped line still works. Returns new entries: saved blueprints are never changed.
function layoutBounds(data){let W=0,H=0;for(const e of data){const[w,h]=machSize(e.type,e.dir||0);W=Math.max(W,e.rx+w);H=Math.max(H,e.ry+h);}return[W,H];}
function flipLayout(data,axis){
  const[W,H]=layoutBounds(data);
  return data.map(e=>{const d=e.dir||0,[w,h]=machSize(e.type,d),n={...e,dir:d};
    if(axis==='h'){n.rx=W-e.rx-w; if(d===0||d===2)n.dir=2-d;}   // right ↔ left
    else{n.ry=H-e.ry-h; if(d===1||d===3)n.dir=4-d;}            // down ↔ up
    return n;});
}
function rotateLayout(data){ // 90° clockwise
  const[,H]=layoutBounds(data);
  return data.map(e=>{const d=e.dir||0,[,h]=machSize(e.type,d);return{...e,dir:(d+1)%4,rx:H-e.ry-h,ry:e.rx};});
}
function transformGhost(kind){
  const f=d=>kind==='rot'?rotateLayout(d):flipLayout(d,kind);
  if(blueprintState.mode==='holding')blueprintState.data=f(blueprintState.data);
  else if(multiselState.mode==='pasting')multiselState.clipboard=f(multiselState.clipboard);
  else return;
  G.stats.flips=(G.stats.flips||0)+1;
  sfx('tap');
}
// Ghost of one layout entry: faint sprite plus which way it faces, so a flip is visible before placing
const DIR_TYPES=new Set(['belt','inserter','long_inserter','splitter','tunnel']);
function drawGhostEntry(e,def,px,py,pw,ph,ts){
  ctx.globalAlpha=.5; drawGhostIcon(def,px,py,pw,ph,e.dir||0); ctx.globalAlpha=1;
  if(DIR_TYPES.has(e.type)){const as=Math.floor(Math.min(pw,ph)*.5);ctx.drawImage(arrowSpr(e.dir||0,'#f5a623'),Math.floor(px+pw/2-as/2),Math.floor(py+ph/2-as/2),as,as);}
  else if(ts>20)drawPorts(ctx,e.type,px,py,pw,ph,ts,e.dir||0);
}
function pasteBlueprintAt(data,x,y){
  const canPlace2=stampFits(data,x,y);
  if(!canPlace2){toast('Cannot place here: blocked or wrong terrain','bad');sfx('error');return;}
  if(!blueprintCanAfford(data)){toast('Not enough materials','bad');sfx('error');return;}
  const costs=G.devFreeBuild?{}:blueprintCost(data);
  for(const[item,n]of Object.entries(costs)) G.inv[item]-=n;
  undoBegin(); for(const e of data)stampMachine(e,x+e.rx,y+e.ry); undoEnd();
  blueprintState={mode:'idle',x1:0,y1:0,x2:0,y2:0,data:[]};
  document.getElementById('ghostBar')?.classList.add('hidden');
  updateHUD(); saveGame(); sfx('place');
  G.stats.pastes=(G.stats.pastes||0)+1;
  toast(`Placed ${data.length} machine${data.length!==1?'s':''}!`,'ok');
}
function deleteBlueprint(idx){
  if(!G.blueprints)return;
  G.blueprints.splice(idx,1);
  saveGame(); renderBlueprintPanel();
  toast('Blueprint deleted','ok');
}

  } else {

function ejectBuf(id){
  const m=G.machines[id]; if(!m)return;
  const items=Object.entries(m.inBuf).filter(([,v])=>v>0);
  if(!items.length){toast('Nothing to return','wrn');return;}
  for(const[item,n]of items){G.inv[item]=(G.inv[item]||0)+n;m.inBuf[item]=0;}
  m.prog=0;
  sfx('craft'); toast('Inputs returned to inventory','ok');
  updateHUD(); renderMachPanel();
}

function loadGaskets(id){
  const m=G.machines[id]; if(!m)return;
  const n=Math.min(G.inv.gasket||0,MDEFS.relief_valve.bufCap-(m.inBuf.gasket||0));
  if(n<=0){toast((G.inv.gasket||0)?'Valve is full':'No Gaskets: craft them by hand or in an Assembler','wrn');sfx('error');return;}
  G.inv.gasket-=n; m.inBuf.gasket=(m.inBuf.gasket||0)+n; m._jamWarned=false;
  sfx('craft'); toast(`Loaded ${n} Gasket${n>1?'s':''}`,'ok'); updateHUD(); renderMachPanel();
}
function feedCoal(id,amount){
  const m=G.machines[id]; if(!m)return;
  const have=G.inv.coal||0;
  const n=Math.min(amount,have);
  if(n<=0){toast('No coal in inventory','wrn');return;}
  G.inv.coal-=n;
  m.inBuf.coal=(m.inBuf.coal||0)+n;
  sfx('craft'); toast(`Fed ${n} coal`,'ok');
  updateHUD(); renderMachPanel();
}

function emptyOutput(id){

  if(!items.length){toast('Output already empty','wrn');return;}
  for(const[item,n]of items){G.inv[item]=(G.inv[item]||0)+n;m.outBuf[item]=0;}

function chestCollectAll(id){

function chestTakeOne(itemId,id){

// ── Research ───────────────────────────────────────
function renderResPanel(){
  const el=document.getElementById('pResBody');
  const zd=zoneDef();
  const sciHtml=zd.sci.map(id=>`${iconHtml(id)} ${fmt(G.inv[id]||0)} ${ITEMS[id].name}`).join(' &nbsp;&nbsp; ');
  let html=`<div class="card" style="margin-bottom:12px">
    <span class="sec-label">SCIENCE PACKS</span>
    <div style="font-size:var(--f6);color:var(--text2);line-height:2">${sciHtml}</div>
  </div>`;

  // Show this zone's techs (Zone 5 merges every zone, so it shows all)
  const visible=([,t])=>G.zone===5||(t.zone||1)===G.zone;
  const eras=[...new Set(Object.values(TECHS).map(t=>t.era))];
  for(const era of eras){
    const techsInEra=Object.entries(TECHS).filter(([,t])=>t.era===era).filter(visible);
    if(!techsInEra.length)continue;
    html+=`<div style="font-size:var(--f5);color:var(--text3);letter-spacing:2px;margin:10px 0 6px">── ${era} ──</div>`;
    for(const[id,tech]of techsInEra){
      const done=G.research.done.includes(id);
      const reqMet=tech.req.every(r=>G.research.done.includes(r));
      const canAfford=reqMet&&!done&&Object.entries(tech.cost).every(([k,v])=>(G.inv[k]||0)>=v);
      const costStr=Object.entries(tech.cost).map(([k,v])=>`${v}×${ITEMS[k]?.name||k}`).join(', ');
      html+=`<div class="tech-card ${done?'done':reqMet?'avail':'locked'}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:var(--f6);color:${done?'var(--teal)':'var(--text)'}">${tech.icon} ${tech.name}</span>
          ${done?'<span style="color:var(--teal);font-size:var(--f9)">✓</span>':''}
          ${!reqMet&&!done?'<span style="color:var(--text3);font-size:var(--f9)">🔒</span>':''}
        </div>
        <div style="font-size:var(--f5);color:var(--text3);margin-bottom:5px">${tech.desc}</div>
        ${!done?`<div style="font-size:var(--f5);color:var(--amber);margin-bottom:5px">Cost: ${costStr} <span style="color:var(--text3)">· 1 Lab: ${fmtRate(labMinutes(tech.cost))} min</span></div>`:''}
        ${!done&&reqMet?`<button class="mini-btn ${canAfford?'amber':'dim'}" onclick="doResearch('${id}')" ${canAfford?'':'disabled'}>RESEARCH</button>`:''}
      </div>`;
    }
  }
  setHtml(el,html);
}

function doResearch(id){
  const tech=TECHS[id]; if(!tech||G.research.done.includes(id))return;
  if(!tech.req.every(r=>G.research.done.includes(r))){toast('Prerequisites not met','wrn');sfx('error');return;}
  for(const[k,v]of Object.entries(tech.cost)){
    if((G.inv[k]||0)<v){toast(`Need ${v}× ${ITEMS[k]?.name||k}`,'wrn');sfx('error');return;}
  }
  for(const[k,v]of Object.entries(tech.cost))G.inv[k]-=v;
  G.research.done.push(id);
  if(tech.onResearch)tech.onResearch();
  buildToolbar(); renderResPanel(); updateHUD(); updateRocketBtn(); saveGame(); sfx('research');
  toast(`✓ ${tech.name} researched!`,'ok');
}

  html+=hazardPanelHtml();

  html+=`<div style="border-top:1px solid var(--border);padding-top:10px;margin-top:10px">

function launchRocket(){
  const zd=zoneDef();
  if(!rocketUnlocked()){toast('Research required first','bad');sfx('error');return;}
  const miss=rocketReqs().find(r=>r.have<r.need);
  if(miss){toast(`Need ${miss.need}× ${miss.name}`,'bad');sfx('error');return;}
  for(const r of rocketReqs())G.inv[r.id]-=r.need;
  const award=awardLaunchPerks(G.zone);
  G.stats.launched=true;
  saveGame(); sfx('launch');
  const nz=nextZone();
  showModal('🚀 LAUNCH SEQUENCE',
    `<div style="text-align:center;font-size:var(--f6);color:var(--text2);line-height:2.5">
      <div style="font-size:28px;margin-bottom:10px;animation:bob 0.6s infinite">🚀</div>
      ${zd.launchText}<br><br>
      <span style="color:var(--amber);font-size:var(--f7)">ZONE ${G.zone} COMPLETE</span><br><br>
      ${launchPerkLine(award)}
      <span style="color:var(--text3);font-size:var(--f5)">${nz?zd.launchTease:'More zones coming soon...'}</span>
    </div>`,
    `<button class="btn btn-sm" onclick="closeModal();togglePanel('perks')">⭐ PERKS</button>
     ${nz?`<button class="btn btn-teal btn-sm" onclick="continueToNextZone()">CONTINUE →</button>`
         :`<button class="btn btn-sm" onclick="closeModal()">CLOSE</button>`}`
  );
}

// Fresh start in zone n, keeps research, perks, audio settings and dev mode
function transitionToZone(n){
  const zd=ZONES[n]; if(!zd)return;
  const researchDone=[...G.research.done];
  const sfxOn=G.sfx; const musicOn=G.music; const musicVol=G.musicVol;
  const dev={devMode:G.devMode,devTickSpeed:G.devTickSpeed,devFreeBuild:G.devFreeBuild,devFreeCraft:G.devFreeCraft};
  const perks=G.perks||{points:0,spent:{},awarded:{}};
  const achievements=[...(G.achievements||[])];
  G=defaultState();
  Object.assign(G,dev);
  G.zone=n;
  G.achievements=achievements;
  G.smog=0;
  G.sfx=sfxOn; G.music=musicOn; G.musicVol=musicVol;
  G.tutorial={step:-1};                     // Zone 1 tutorial never repeats
  G.zoneTut=TUTORIALS[n]?0:undefined;      // zone tutorial
  G.research.done=researchDone;
  G.perks=perks;
  const quickStart=applyQuickStart();
  applyRememberedTools();
  [MAP_W,MAP_H]=zd.mapSize;
  G.map=addFactoryFloor(zd.buildMap()); G.floorY=zd.mapSize[1];
  if(zd.onArrive)zd.onArrive();
  saveGame();
  initCanvas(); buildToolbar(); updateHUD(); updateRocketBtn();
  startTick(); updateSpeedBtn();
  const ts=TILE*G.cam.zoom;
  G.cam.x=26*ts-canvas.clientWidth/2+ts*3;
  G.cam.y=24*ts-canvas.clientHeight/2+ts*2;
  clampCam();
  updateZoneTabs();
  showModal(zd.arrivalTitle,
    `<div style="text-align:center;font-size:var(--f6);color:var(--text2);line-height:2.5">
      <div style="font-size:28px;margin-bottom:10px">${zd.icon}</div>
      ${zd.arrivalHtml}${FLOOR_NOTE}
      ${quickStart?'<br><span style="color:var(--teal);font-size:var(--f5)">⭐ Quick Start: +50 of each basic resource salvaged</span>':''}
    </div>`,
    `<button class="btn btn-teal btn-sm" onclick="closeModal()">${zd.arrivalBtn}</button>`
  );
}

// Zone milestones, each one met at launch adds +1 perk point
const LOGISTICS_TYPES=['belt','splitter','tunnel','inserter','long_inserter','chest'];
function productionMachineCount(){
  return Object.values(G.machines).filter(m=>!LOGISTICS_TYPES.includes(m.type)).length;
}
const ZONE_MILESTONES={
  1:[
    {id:'z1_industry', name:'Industrialist', desc:'25+ production machines placed', done:()=>productionMachineCount()>=25},

  ],

    {id:'z4_green',    name:'Green Thumb',   desc:'No machine withered this zone',  done:()=>!(G.stats.withered>0)},
    {id:'z4_cool',     name:'Cool Head',     desc:'No reactor SCRAMs this zone',    done:()=>!(G.stats.scrams>0)},
  ],
};
function zoneMilestones(zone){
  return (ZONE_MILESTONES[zone]||[]).map(ms=>({...ms,met:!!ms.done()}));
}

// Returns {pts, met:[names]}, milestones only count for the zone being played
function awardLaunchPerks(zone){
  if(!G.perks.awarded)G.perks.awarded={};
  if(G.perks.awarded[zone])return {pts:0,met:[]};
  const met=zone===G.zone?zoneMilestones(zone).filter(ms=>ms.met).map(ms=>ms.name):[];
  const pts=(LAUNCH_PERK_POINTS[zone]||0)+met.length+(PRESTIGE.owned.cosmic_perk?1:0);
  G.perks.awarded[zone]=true;
  G.perks.points=(G.perks.points||0)+pts;
  return {pts,met};
}

// Milestone checklist for the rocket views (hidden once this zone has launched)
function milestonesHtml(){
  if(G.perks?.awarded?.[G.zone])return '';
  const list=zoneMilestones(G.zone); if(!list.length)return '';
  let html=`<div style="border-top:1px solid var(--border);padding-top:8px;margin-top:8px">
    <div style="font-size:var(--f5);color:var(--text3);margin-bottom:5px">MILESTONES · +1 ⭐ EACH AT LAUNCH</div>`;
  for(const ms of list)
    html+=`<div style="font-size:var(--f5);line-height:2.2;color:${ms.met?'var(--teal)':'var(--text2)'}">${ms.met?'✓':'○'} ${ms.name} <span style="color:var(--text3)">- ${ms.desc}</span></div>`;
  return html+'</div>';
}

// Saves from before v1.1.8 launched without earning perks, award them retroactively
function backfillLaunchPerks(){
  let pts=0;
  for(let z=1;z<G.zone;z++)pts+=awardLaunchPerks(z).pts;
  if(G.stats?.launched)pts+=awardLaunchPerks(G.zone).pts;
  if(pts){saveGame();toast(`+${pts} ⭐ perk points from past launches`,'ok');}
}

function launchPerkLine({pts,met}){
  if(!pts)return '';
  return `<span style="color:var(--teal);font-size:var(--f6)">+${pts} ⭐ PERK POINT${pts!==1?'S':''}</span><br>
    ${met.length?`<span style="color:var(--text3);font-size:var(--f5)">Milestones: ${met.join(' · ')}</span><br>`:''}<br>`;
}

// Quick Start perk, called on arrival in a new zone
function applyQuickStart(){
  if(!G.perks.spent?.start1)return false;
  const n=G.perks.spent.start2?200:50;
  for(const r of ['iron_ore','copper_ore','coal','stone'])G.inv[r]=(G.inv[r]||0)+n;
  return true;
}

function continueToNextZone(){
  const nz=nextZone(); if(!nz)return;
  if(openPanel)closePanel(openPanel);
  closeModal();
  transitionToZone(nz);
}

// ── Statistics & Bottleneck Detector ──────────────
function statsSummaryHtml(){
  const cell=(k,v,span)=>`<div class="stat-cell"${span?' style="grid-column:span 2"':''}><div class="k">${k}</div><div class="v">${v}</div></div>`;
  return `<div class="stat-grid">${cell('ZONE',`${G.zone} · ${zoneDef().name}`)}${cell('POWER',`${fmtKW(G.power.out)} / ${fmtKW(G.power.in)}`)}
    ${cell('MACHINES',Object.keys(G.machines).length)}${cell('RESEARCH',`${G.research.done.length}/${Object.keys(TECHS).length}`)}
    ${zoneHas('smog')?cell('SMOG',`${Math.round(G.smog||0)}% · efficiency ${Math.round(100-(G.smog||0))}%`,true):''}</div>`;
}
function renderStatsPanel(){
  const el=document.getElementById('pStatsBody'); if(!el)return;
  const machines=Object.values(G.machines);
  const producers=machines.filter(m=>!['belt','inserter','chest'].includes(m.type));
  const active=producers.filter(m=>m.active);
  const paused=producers.filter(m=>!m.active);
  const typeCounts={};
  for(const m of machines) typeCounts[m.type]=(typeCounts[m.type]||0)+1;
  const pwrFree=G.power.out-G.power.in;
  const pwrRatio=G.power.in>0?Math.min(1,G.power.out/G.power.in):1;
  const pwrPct=Math.round(pwrRatio*100);
  const pwrCol2=pwrFree<0?'var(--red)':pwrFree<G.power.in*.2?'var(--amber)':'var(--green)';

  const allPaused=producers.length>0&&producers.every(m=>!m.active);
  const allActive=producers.length>0&&producers.every(m=>m.active);
  let html=`<div class="card" style="margin-bottom:10px">
    <span class="sec-label">OVERVIEW</span>
    ${irow('Machines placed',`<span style="color:var(--amber)">${machines.length}</span>`)}
    ${irow('Producers active',`<span style="color:var(--green)">${active.length}</span> / ${producers.length}`)}
    ${paused.length?irow('Paused',`<span style="color:var(--text3)">${paused.length}</span>`):''}
    ${irow('Taps',`<span style="color:var(--text2)">${G.stats.taps}</span>`)}
    ${irow('Research',`<span style="color:var(--text2)">${G.research.done.length}/${Object.keys(TECHS).length}</span>`)}
    <div style="display:flex;gap:5px;margin-top:8px">
      <button class="mini-btn ${allPaused?'dim':'amber'}" style="flex:1" onclick="pauseAllMachines()" ${allPaused?'disabled':''}>⏸ PAUSE ALL</button>
      <button class="mini-btn ${allActive?'dim':'teal'}" style="flex:1" onclick="resumeAllMachines()" ${allActive?'disabled':''}>▶ RESUME ALL</button>
    </div>
  </div>
  <div class="card" style="margin-bottom:10px">
    <span class="sec-label">⚡ POWER</span>
    ${irow('Generating',`<span style="color:var(--green)">${fmt(G.power.out)} kW</span>`)}
    ${irow('Consuming',`<span style="color:var(--amber)">${fmt(G.power.in)} kW</span>`)}
    ${irow('Free capacity',`<span style="color:${pwrCol2}">${pwrFree>=0?'+':''}${fmt(pwrFree)} kW</span>`)}
    ${G.power.in>0?irow('Load',`<span style="color:${pwrCol2}">${pwrPct}%</span>`):''}
    <div class="prog-wrap" style="margin-top:4px"><div class="prog-fill ${pwrFree<0?'amber':'green'}" style="width:${Math.min(100,pwrPct)}%"></div></div>
  </div>`;

  if(Object.keys(typeCounts).length){
    html+=`<div class="card" style="margin-bottom:10px"><span class="sec-label">MACHINE COUNT</span>`;
    for(const[type,count]of Object.entries(typeCounts)){
      const def=MDEFS[type];
      html+=`<div style="display:flex;justify-content:space-between;font-size:var(--f5);margin-bottom:4px">
        <span style="color:var(--text2)">${iconHtml(type)} ${def?.name||type}</span>
        <span style="color:var(--amber)">${count}</span>
      </div>`;
    }
    html+=`</div>`;
  }

  // Bottleneck analysis
  const issues=[];
  const gridRatio=powerRatio();
  for(const m of producers){
    if(!m.active) continue;
    const def=MDEFS[m.type];
    if(m.type==='generator'||m.type==='burner'){
      if((m.inBuf.coal||0)===0) issues.push({m,status:'nofuel'});
      continue;
    }
    if(m.type==='stone_furnace'||m.type==='blast_furnace'){
      // Coal-fuelled furnaces, warn if no coal in buf
      if((m.inBuf.coal||0)===0) issues.push({m,status:'nofuel'});
      if(Object.values(m.outBuf).reduce((a,b)=>a+b,0)>=50) issues.push({m,status:'stalled'});
      continue;
    }
    if(m.type==='miner'){
      if(def.power>0&&gridRatio===0){issues.push({m,status:'nopower'});continue;}
      if(Object.values(m.outBuf).reduce((a,b)=>a+b,0)>=50) issues.push({m,status:'stalled'});
      continue;
    }
    if(!def.recipes.length) continue;
    if(def.power>0&&gridRatio===0){issues.push({m,status:'nopower'});continue;}
    if(!m.recipe){issues.push({m,status:'norecipe'});continue;}
    const rec=RECIPES[m.recipe]; if(!rec) continue;
    if(Object.values(m.outBuf).reduce((a,b)=>a+b,0)>=50){issues.push({m,status:'stalled'});continue;}
    if(Object.keys(rec.in).every(k=>(m.inBuf[k]||0)===0)&&m.prog===0) issues.push({m,status:'starved'});
  }

  const statusMeta={
    stalled:  {label:'OUTPUT FULL', col:'var(--red)',   tip:'outBuf at cap, drain it or add an inserter'},
    starved:  {label:'INPUT EMPTY', col:'var(--amber)', tip:'No items arriving in inBuf'},
    norecipe: {label:'NO RECIPE',   col:'var(--text3)', tip:'Open machine panel to assign a recipe'},
    nopower:  {label:'NO POWER',    col:'var(--red)',   tip:'No generators running, place a Burner or Generator'},
    nofuel:   {label:'NO COAL',     col:'var(--amber)', tip:'No coal, feed coal via inserter or machine panel'},
  };

  html+=`<span class="sec-label" style="color:${issues.length?'var(--red)':'var(--teal)'}">`;
  html+=issues.length?`BOTTLENECKS (${issues.length} issue${issues.length>1?'s':''})` : 'BOTTLENECKS ✓ NONE';
  html+=`</span>`;

  if(!machines.length){

let upgState={mode:'idle',x1:0,y1:0,x2:0,y2:0,ids:[],off:new Set()};
function upgPlan(){
  const list=upgState.ids.map(id=>G.machines[id]).filter(m=>m&&TIER_TYPES.includes(m.type)&&(m.tier||1)<3&&!upgState.off.has(m.type)&&!tierLocked(m.type));

  }

  for(const m of all){const t=types[m.type]||(types[m.type]={n:0,max:0});t.n++;if((m.tier||1)>=3)t.max++;}
  const chips=Object.entries(types).map(([t,c])=>`<button class="ub-chip${us.off.has(t)?' off':''}" onclick="upgToggle('${t}')" title="${MDEFS[t].name}">${iconHtml(t)}×${c.n-c.max}${c.max?`<span style="color:var(--teal)">+${c.max} MAX</span>`:''}${tierLocked(t)?'<span style="color:var(--red)">LOCKED</span>':''}</button>`).join('');
  const {list,cost}=upgPlan(), ok=G.devFreeBuild||Object.entries(cost).every(([k,n])=>(G.inv[k]||0)>=n);

function upgToggle(t){const o=upgState.off;o.has(t)?o.delete(t):o.add(t);updateUpgradeBar();}
function upgradeSelected(){
  const {list}=upgPlan(); if(!list.length)return;
  let done=0, short=0;
  for(const m of list){
    const c=tierCost(m.type,(m.tier||1)+1);
    if(!G.devFreeBuild){
      if(!Object.entries(c).every(([k,n])=>(G.inv[k]||0)>=n)){short++;continue;}
      for(const[k,n]of Object.entries(c))G.inv[k]-=n;
    }
    m.tier=(m.tier||1)+1; done++;
  }
  if(done){sfx('research');saveGame();}else sfx('error');
  toast(done?`Upgraded ${done} machine${done>1?'s':''}${short?` · ${short} need more materials`:''}`:'Not enough materials',done?'ok':'bad');
  updateHUD(); updateUpgradeBar();
}

  const bp=blueprintState;

    if(!blueprintCanAfford(data)){
      const missing=Object.entries(blueprintCost(data))
        .filter(([k,v])=>(G.inv[k]||0)<v)
        .map(([k,v])=>`${v-(G.inv[k]||0)}× ${ITEMS[k]?.name||k}`).join(', ');
      toast(`Need: ${missing}`,'bad'); sfx('error'); return;

// ── Smog panel: tap the smog gauge. Every source, every Scrubber, and what to add ──
function smogReport(){
  const ms=Object.values(G.machines), pr=powerRatio()>0, smog=G.smog||0;
  const groups={}, scr={running:0,standby:0,nofuel:0,nopower:0,paused:0,list:[],idle:[]};
  let make=0, makeMax=0;
  for(const m of ms){
    if(SMOG_PER[m.type]){
      const g=groups[m.type]||(groups[m.type]={type:m.type,total:0,working:0,rate:0,max:0,idle:{},ids:[]});
      const each=machineSmog(m); g.total++; g.ids.push(m.id); g.max+=each; makeMax+=each;
      if(machineWorking(m)){g.working++;g.rate+=each;make+=each;}
      else {const r=smogIdleReason(m); g.idle[r]=(g.idle[r]||0)+1;}
    }
    if(m.type==='scrubber'){
      scr.list.push(m.id);
      const st=!m.active?'paused':!(m.inBuf.refined_fuel>0)?'nofuel':!pr?'nopower':smog>0?'running':'standby';
      scr[st]++; if(st!=='running'&&st!=='standby')scr.idle.push(m.id);
    }
  }
  const clear=SMOG_DECAY_MIN+SCRUBBER_SMOG_MIN*(scr.running+scr.standby);
  const need=n=>Math.ceil(Math.max(0,n-SMOG_DECAY_MIN)/SCRUBBER_SMOG_MIN);
  return {smog,groups:Object.values(groups),scr,make,makeMax,clear,net:make-clear,needNow:need(make),needMax:need(makeMax)};
}
function smogIdleReason(m){
  if(!m.active)return 'paused';
  if(m.type==='combustion_gen')return 'no fuel';
  if((MDEFS[m.type].power||0)>0&&powerRatio()===0)return 'no power';
  if(m.type==='oil_pump')return m.mineRes?'output full':'no oil';
  if(!m.recipe)return 'no recipe';
  if(Object.values(m.outBuf).reduce((a,b)=>a+b,0)>=50)return 'output full';
  return 'waiting for input';
}
function fmtMins(min){
  if(min<1)return `${Math.max(1,Math.round(min*60))}s`;
  if(min<60)return `${Math.floor(min)}m ${String(Math.round((min%1)*60)).padStart(2,'0')}s`;
  return `${Math.round(min/60*10)/10}h`;
}

function findMachines(ids){ // cycle the camera through a list of machines
  const list=String(ids).split(',').filter(id=>G.machines[id]); if(!list.length)return;
  const k=list.join(','), i=(findMachN[k]||0)%list.length; findMachN[k]=i+1;
  selectMachineById(+list[i]);
}

const GEN_FUEL={burner:['coal',BURNER_COAL_TICKS],generator:['coal',16],combustion_gen:['refined_fuel',32],reactor:['lum_rod',ROD_TICKS]};
function buildableHere(t){
  const cat=drawerCats('build').find(c=>c.items.some(i=>i.id===t)); if(!cat)return false;
  const done=u=>!u||G.research.done.includes(u);
  return done(cat.unlock)&&done(MDEFS[t].unlock);
}
function machineDraw(m){ // kW this machine asks for, the same sum as gameTick's pre-pass
  const def=MDEFS[m.type];
  if(!m.active||m.withered||!def||def.power<=0||m.type==='stone_furnace'||m.type==='blast_furnace')return 0;
  return def.power*perkMult().power*((m.modules||[]).some(x=>x==='eff_module')?0.7:1);
}
function genState(m){ // 'on', or why a generator gives nothing
  if(!m.active)return 'paused';
  if(m.type==='lumen_panel')return glowBright()?'on':'dark';
  if(m.type==='reactor'&&m.scram>0)return 'SCRAM';
  const f=GEN_FUEL[m.type]; if(f&&!((m.inBuf[f[0]]||0)>0))return 'no fuel';
  return 'on';
}

  for(const m of Object.values(G.machines)){

    if(def.power<0){

      if(st==='on'){g.on++;g.now+=kw;supply+=kw;
        const f=GEN_FUEL[m.type]; if(f){fuel[f[0]]=(fuel[f[0]]||0)+TICKS_PER_MIN/f[1]; if((m.inBuf[f[0]]||0)<5)lowFuel.push(m.id);}}
      else {g.idle[st]=(g.idle[st]||0)+1; if(st!=='dark')idleGen.push(m.id);}

      const d=machineDraw(m);
      const c=cons[m.type]||(cons[m.type]={type:m.type,total:0,on:0,kw:0,each:def.power,ids:[]});
      c.total++; c.ids.push(m.id); if(d>0){c.on++;c.kw+=d;demand+=d;}
    }
  }

  if(sing&&sing.complete&&!G.bigBang){demand+=SING_POWER;const c=cons.singularity||(cons.singularity={type:'singularity',total:1,on:1,kw:0,each:SING_POWER,ids:[sing.id]});c.kw+=SING_POWER;}

}
function renderPowerPanel(){
  const el=document.getElementById('pPowerBody'); if(!el)return;
  const r=powerReport(), free=r.supply-r.demand, short=r.demand>0&&free<0;
  const covering=short&&r.acc.stored>=-free*TICK_MS/1000;
  const small='font-size:var(--f4);color:var(--text3)';
  const load=r.supply>0?Math.round(r.demand/r.supply*100):r.demand>0?999:0;
  const col=short?(covering?'var(--amber)':'var(--red)'):load>80?'var(--amber)':'var(--green)';
  let status;
  if(!r.demand&&!r.supply)status=`<span style="color:var(--text3)">Nothing makes or uses power yet.</span>`;
  else if(!r.demand)status=`<span style="color:var(--green)">No machines need power right now.</span>`;
  else if(!short)status=`<span style="color:${col}">Running · ${load}% load · ${fmtKW(free)} spare</span>`;
  else if(covering)status=`<span style="color:var(--amber)">Accumulators covering ${fmtKW(-free)} · about ${fmtMins(r.acc.stored/(-free)/60)} left</span>`;
  else status=`<span style="color:var(--red)">SHORT ${fmtKW(-free)}: every powered machine has stopped.</span><br><span style="${small}">Power is all or nothing: below demand, nothing electric runs.</span>`;
  let html=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
      <span style="font-size:var(--f10);color:${col}">${r.demand?`${free>=0?'+':'-'}${fmtKW(Math.abs(free))}`:fmtKW(r.supply)}</span>
      <span style="font-size:var(--f5);color:var(--text2)">${fmtKW(r.supply)} made · ${fmtKW(r.demand)} used</span>
    </div>
    <div class="prog-wrap"><div class="prog-fill ${short?'amber':'green'}" style="width:${Math.min(100,load)}%"></div></div>
    <div style="font-size:var(--f5);margin-top:6px;line-height:1.8">${status}</div>
  </div>`;
  const findBtn=ids=>`<button class="mini-btn" style="min-height:28px;padding:4px 6px;color:var(--text2)" onclick="findMachines('${ids.join(',')}')">FIND</button>`;
  // Generators
  html+=`<div class="card"><span class="sec-label">MAKING POWER</span>`;
  if(!r.gens.length)html+=`<div style="${small};line-height:1.8">No generators yet. Build a Burner and feed it coal.</div>`;
  for(const g of r.gens.sort((a,b)=>b.now-a.now||b.total-a.total)){
    const idle=Object.entries(g.idle).map(([k,n])=>`${n} ${k}`).join(' · ');
    const f=GEN_FUEL[g.type];
    html+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
      <div style="flex:1;min-width:0">
        <div style="font-size:var(--f5);color:var(--text2)">${iconHtml(g.type)} ${MDEFS[g.type].name} <span style="color:var(--text3)">×${g.total}</span></div>
        <div style="${small};margin-top:3px;line-height:1.6">${g.on} running · ${fmtKW(g.kw)} each${f?` · ${fmtRate(TICKS_PER_MIN/f[1])} ${ITEMS[f[0]].name.toLowerCase()}/min each`:g.type==='lumen_panel'?' · glow tide only':''}${idle?`<br><span style="color:var(--red)">idle: ${idle}</span>`:''}</div>
      </div>
      <span style="font-size:var(--f6);color:${g.now?'var(--green)':'var(--text3)'}">${fmtKW(g.now)}</span>
      ${findBtn(g.ids)}
    </div>`;
  }
  const fuelTxt=Object.entries(r.fuel).map(([k,v])=>`${iconHtml(k)} ${fmtRate(v)} ${ITEMS[k].name.toLowerCase()}`).join(' · ');
  if(fuelTxt)html+=`<div style="${small};line-height:1.8">Burning ${fuelTxt} per minute</div>`;
  if(r.idleGen.length)html+=`<button class="mini-btn amber" style="width:100%;margin-top:6px" onclick="findMachines('${r.idleGen.join(',')}')">FIND IDLE GENERATORS (${r.idleGen.length})</button>`;
  if(r.lowFuel.length)html+=`<button class="mini-btn" style="width:100%;margin-top:6px;color:var(--text2)" onclick="findMachines('${r.lowFuel.join(',')}')">LOW ON FUEL (${r.lowFuel.length})</button>`;
  if(r.acc.n)html+=`<div style="margin-top:8px">${irow(`${iconHtml('accumulator')} Accumulators ×${r.acc.n}`,`<span style="color:var(--teal)">${Math.round(r.acc.stored)} / ${r.acc.n*ACC_CAP} kJ</span>`)}</div>`;
  html+=`<div style="margin-top:6px">${irow('Total',`<span style="color:var(--green)">${fmtKW(r.supply)}</span>${r.supplyMax>r.supply?` <span style="color:var(--text3)">of ${fmtKW(r.supplyMax)}</span>`:''}`)}</div></div>`;
  // Consumers
  html+=`<div class="card"><span class="sec-label">USING POWER</span>`;
  if(!r.cons.length)html+=`<div style="${small};line-height:1.8">Nothing here uses power yet. Stone and Blast Furnaces never do.</div>`;
  for(const c of r.cons.sort((a,b)=>b.kw-a.kw||b.total-a.total)){
    html+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
      <div style="flex:1;min-width:0">
        <div style="font-size:var(--f5);color:var(--text2)">${iconHtml(c.type)} ${MDEFS[c.type].name} <span style="color:var(--text3)">×${c.total}</span></div>
        <div style="${small};margin-top:3px;line-height:1.6">${fmtKW(c.each)} each${c.total>c.on?` · ${c.total-c.on} paused (draws nothing)`:''}</div>
      </div>
      <span style="font-size:var(--f6);color:${c.kw?'var(--amber)':'var(--text3)'}">${fmtKW(c.kw)}</span>
      ${findBtn(c.ids)}
    </div>`;
  }
  if(perkMult().power<1)html+=`<div style="${small};margin-bottom:6px">Power perks: machines draw ${Math.round((1-perkMult().power)*100)}% less (included)</div>`;
  html+=`${irow('Total',`<span style="color:var(--amber)">${fmtKW(r.demand)}</span>`)}</div>`;
  // Advice
  const opts=Object.keys(MDEFS).filter(t=>MDEFS[t].power<0&&t!=='lumen_panel'&&buildableHere(t));
  const idleKW=r.gens.reduce((a,g)=>a+(g.total-g.on-(g.idle.dark||0))*g.kw,0);
  let advice;
  if(short){
    const need=-free;
    advice=`<span style="color:var(--red)">Need ${fmtKW(need)} more.</span>`
      +(idleKW?` Refuelling the idle generators gives ${fmtKW(idleKW)}${idleKW>=need?', enough':''}.`:'')
      +(opts.length?`<br>Or build: ${opts.map(t=>`${Math.ceil(need/-MDEFS[t].power)} ${iconHtml(t)} ${MDEFS[t].name}`).join(' · ')}`:'');
  } else if(r.demand){
    const big=r.cons.filter(c=>c.each<=free).sort((a,b)=>b.each-a.each)[0];
    advice=load>80?`<span style="color:var(--amber)">Nearly full.</span> Add a generator before building more.`:`<span style="color:var(--green)">Room for ${fmtKW(free)} more</span>${big?`, e.g. ${Math.floor(free/big.each)} more ${MDEFS[big.type].name}${Math.floor(free/big.each)===1?'':'s'}`:''}.`;
  } else advice=r.supply?`Generators are ready.`:`Build a Burner and feed it coal to start.`;
  html+=`<div class="card"><span class="sec-label">BALANCE</span>
    <div style="font-size:var(--f5);color:var(--text2);line-height:1.8">${advice}</div>
    ${opts.length?`<div style="${small};line-height:1.8;margin-top:6px">${opts.map(t=>{const f=GEN_FUEL[t];return `${iconHtml(t)} ${MDEFS[t].name}: ${fmtKW(-MDEFS[t].power)}${f?`, ${fmtRate(TICKS_PER_MIN/f[1])} ${ITEMS[f[0]].name.toLowerCase()}/min`:''}`;}).join('<br>')}</div>`:''}
  </div>`;
  setHtml(el,html);
}
