// ═══════════════════════════════════════════════════
//  PLACEMENT
// ═══════════════════════════════════════════════════
// Returns effective [w,h] for a machine given its direction.
// Splitter base size is [1,2]. For D_DOWN/D_UP the flow is vertical so
// the two cells stack horizontally → swap to [2,1].
function machSize(typeOrM, dir){
  const type = typeof typeOrM==='string' ? typeOrM : typeOrM.type;
  const d = dir !== undefined ? dir : (typeof typeOrM==='object' ? (typeOrM.dir||0) : 0);
  const[mw,mh]=MDEFS[type].size;
  // Every non-square machine (Splitter, Scrubber) lies on its side when facing down or up
  if(mw!==mh&&(d===D_DOWN||d===D_UP)) return [mh,mw];
  return [mw,mh];
}

// Machines that may sit on resource tiles (logistics only)
const ON_RESOURCE_OK=new Set(['belt','inserter','long_inserter','chest','splitter','tunnel','pipe']);

// Refuse a pipe/tank that would join networks holding different fluids
function fluidsWouldMix(type,tx,ty,d){
  if(!MDEFS[type].fluidCap)return false;
  const[w,h]=machSize(type,d);
  const types=new Set();
  for(const nb of machineNeighbors({type,x:tx,y:ty,dir:d}))
    if(MDEFS[nb.type].fluidCap&&nb._net?.type)types.add(nb._net.type);
  if(types.size>1){if(!fluidsWouldMix._warned){fluidsWouldMix._warned=true;toast('Fluids would mix','wrn');setTimeout(()=>fluidsWouldMix._warned=false,2000);}return true;}
  return false;
}

// Terrain rule for one tile of a machine (occupancy checked separately)
function terrainOk(type,tile){
  if(type==='miner')return tile.type===T_RESOURCE&&!FLUID_RES[tile.res];
  if(type==='oil_pump')return tile.res==='oil';
  if(MDEFS[type].pumps)return tile.res===MDEFS[type].pumps;
  return ON_RESOURCE_OK.has(type)||tile.type!==T_RESOURCE;
}
// After a machine lands on new tiles, re-read what it extracts
function refreshMineRes(m){
  const d=MDEFS[m.type], r=G.map[m.y][m.x].res;
  if(m.type==='miner')m.mineRes=r&&!FLUID_RES[r]?r:null;
  else if(m.type==='oil_pump')m.mineRes=r==='oil'?'oil':null;
  else if(d.pumps)m.mineRes=r===d.pumps?d.pumps:null;
}
// Link a tunnel to the nearest free tunnel facing the same way, ahead or behind, within 5 tiles.
// Returns the distance linked, or 0. (Placing the exit before the entrance used to never link.)
function linkTunnel(m){
  if(m.type!=='tunnel'||m.tunnelId!==null)return 0;
  const[dvx,dvy]=D_VEC[m.dir];
  for(let dist=1;dist<=5;dist++)for(const sgn of[1,-1]){
    const lx=m.x+dvx*dist*sgn, ly=m.y+dvy*dist*sgn;
    if(lx<0||ly<0||lx>=MAP_W||ly>=MAP_H)continue;
    const mid=G.map[ly][lx].mid; if(mid===null)continue;
    const lm=G.machines[mid];
    if(lm&&lm.id!==m.id&&lm.type==='tunnel'&&lm.tunnelId===null&&lm.dir===m.dir){m.tunnelId=lm.id;lm.tunnelId=m.id;return dist;}
  }
  return 0;
}
function unlinkTunnel(m){
  if(m.type!=='tunnel'||m.tunnelId===null)return;
  const partner=G.machines[m.tunnelId]; if(partner)partner.tunnelId=null;
  m.tunnelId=null;
}
// ═══ UNDO ═══
// Build actions record how to reverse themselves. One entry can hold several ops
// (multi-select demolish, move, rotate, paste). Ops:
//   place  {id,src,tier}  undone by demolishing; the refund goes back where the cost came from
//   remove {snap}    undone by rebuilding (pays machineWorth again; contents stay in inventory)
//   pos    {list}    undone by putting machines back where and how they faced
// The stack lives outside G: it is per session and clears on load and zone change.
const UNDO_MAX=30;
let undoStack=[], undoGroup=null, undoBusy=false;
function undoRec(op){if(undoBusy)return; if(undoGroup)undoGroup.push(op); else pushUndo([op]);}
function undoBegin(){if(!undoBusy)undoGroup=[];}
function undoEnd(){const g=undoGroup;undoGroup=null;if(g&&g.length)pushUndo(g);}
function pushUndo(ops){undoStack.push(ops);if(undoStack.length>UNDO_MAX)undoStack.shift();updateUndoBtn();}
function clearUndo(){undoStack=[];undoGroup=null;updateUndoBtn();}
function posSnap(m){return{id:m.id,x:m.x,y:m.y,dir:m.dir};}
// Undo lives in the EDIT tab; its card shows how many steps are left
function updateUndoBtn(){if(activeTab==='tools')buildDrawer();}
// Put machines at recorded positions/directions, all or nothing
function relocate(list){
  const ms=list.map(e=>G.machines[e.id]).filter(Boolean);
  const before=ms.map(posSnap);
  const clear=()=>{for(const m of ms){const[w,h]=machSize(m);for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++)G.map[m.y+dy][m.x+dx].mid=null;}};
  const claim=()=>{for(const m of ms){const[w,h]=machSize(m);for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++)G.map[m.y+dy][m.x+dx].mid=m.id;}};
  clear();
  for(const m of ms){const e=list.find(q=>q.id===m.id); m.x=e.x; m.y=e.y; m.dir=e.dir;}
  const fits=ms.every(m=>{
    const[w,h]=machSize(m);
    for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++){
      const x=m.x+dx,y=m.y+dy;
      if(x<0||y<0||x>=MAP_W||y>=MAP_H||G.map[y][x].mid!==null||!terrainOk(m.type,G.map[y][x]))return false;
    }
    return true;
  });
  if(!fits){for(const m of ms){const b=before.find(q=>q.id===m.id);m.x=b.x;m.y=b.y;m.dir=b.dir;}claim();return false;}
  claim();
  for(const m of ms){refreshMineRes(m);unlinkTunnel(m);}
  for(const m of ms)linkTunnel(m);
  return true;
}
function undoLast(){
  const ops=undoStack[undoStack.length-1];
  if(!ops){toast('Nothing to undo','wrn');return;}
  // Rebuilds must fit and be affordable before anything changes
  const rebuilds=ops.filter(o=>o.op==='remove');
  if(rebuilds.length){
    if(!rebuilds.every(o=>canPlace(o.snap.type,o.snap.x,o.snap.y,o.snap.dir))){toast('Cannot undo: something is built there now','bad');sfx('error');return;}
    if(!G.devFreeBuild){
      const need={};
      for(const o of rebuilds)addCost(need,machineWorth(o.snap.type,o.snap.tier,o.snap.modules));
      const miss=Object.entries(need).find(([k,n])=>(G.inv[k]||0)<n);
      if(miss){toast(`Cannot undo: need ${miss[1]}× ${ITEMS[miss[0]]?.name||miss[0]}`,'bad');sfx('error');return;}
    }
  }
  undoBusy=true;
  try{
    for(let i=ops.length-1;i>=0;i--){
      const o=ops[i];
      if(o.op==='pos'){
        if(!relocate(o.list)){toast('Cannot undo: the old spot is taken','bad');sfx('error');return;}
      } else if(o.op==='place'){
        const m=G.machines[o.id]; if(!m)continue;
        const type=m.type; tryRemove(m.x,m.y,true);
        if(o.src!=='inv'){ // it was never paid for in materials: take back what demolish refunded for it
          for(const[k,n]of Object.entries(machineWorth(type,o.tier)))G.inv[k]=Math.max(0,(G.inv[k]||0)-n);
          if(o.src==='crafted')G.crafted[type]=(G.crafted[type]||0)+1;
        }
      } else if(o.op==='remove'){
        const sn=o.snap;
        if(!G.devFreeBuild)for(const[k,n]of Object.entries(machineWorth(sn.type,sn.tier,sn.modules)))G.inv[k]-=n;
        const m=stampMachine(sn,sn.x,sn.y);
        if(m){m.modules=[...(sn.modules||[])]; G.stats.placed--;}
      }
    }
  } finally {undoBusy=false;}
  undoStack.pop(); updateUndoBtn();
  updateHUD(); saveGame(); sfx('remove');
  G.stats.undos=(G.stats.undos||0)+1;
  toast('↶ Undone','ok');
}

// Can a copied layout (blueprint / clipboard) be stamped with its origin at x,y?
function stampFits(data,x,y){
  return data.every(e=>MDEFS[e.type]&&canPlace(e.type,x+e.rx,y+e.ry,e.dir));
}
// Create one machine from a layout entry: tiles, extraction, tunnels, stats
function stampMachine(e,x,y,src){
  const def=MDEFS[e.type]; if(!def||def.stub)return null;
  const m=mkMachine(e.type,x,y,e.dir);
  if(e.recipe!==undefined)m.recipe=e.recipe;
  m.tier=e.tier||1;
  G.machines[m.id]=m;
  const[mw,mh]=machSize(m);
  for(let dy=0;dy<mh;dy++)for(let dx=0;dx<mw;dx++)G.map[y+dy][x+dx].mid=m.id;
  refreshMineRes(m); linkTunnel(m);
  G.stats.placed++;
  undoRec({op:'place',id:m.id,src:src||(G.devFreeBuild?'free':'inv'),tier:m.tier});
  return m;
}

function canPlace(type,tx,ty,dir){
  if(!MDEFS[type])return false;
  const d=(dir!==undefined)?dir:placeDir;
  const[mw,mh]=machSize(type,d);
  for(let dy=0;dy<mh;dy++)for(let dx=0;dx<mw;dx++){
    const nx=tx+dx,ny=ty+dy;
    if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H)return false;
    if(G.map[ny][nx].mid!==null)return false;
    if(!terrainOk(type,G.map[ny][nx]))return false;
  }
  return !fluidsWouldMix(type,tx,ty,d);
}

function tryPlace(type,tx,ty){
  const def=MDEFS[type]; if(!def)return;
  if(def.stub){toast(`[FUTURE] ${def.name} is not active yet`,'wrn');hudSelect();return;}
  if(def.unlock&&!G.research.done.includes(def.unlock)){
    toast(`Requires: ${TECHS[def.unlock]?.name||def.unlock}`,'wrn'); sfx('error'); hudSelect(); return;
  }
  if(!canPlace(type,tx,ty)){toast('Cannot place here','bad'); sfx('error'); hudSelect(); return;}

  // Power warning, confirm if this machine will exceed available power
  if(def.power>0&&!G.devFreeBuild){
    const pwrFree=G.power.out-G.power.in;
    if(def.power>pwrFree&&G.power.out>0){
      const free=Math.max(0,Math.round(pwrFree));
      showModal('⚡ POWER WARNING',
        `<div style="font-size:var(--f7);color:var(--amber);margin-bottom:10px">Not enough power!</div>
         <div style="font-size:var(--f6);color:var(--text2);line-height:2.2">
           ${def.name} needs <span style="color:var(--amber)">${def.power}kW</span><br>
           Available: <span style="color:${free>0?'var(--green)':'var(--red)'}">${free}kW free</span><br>
           <span style="color:var(--text3)">Machines will slow or stop until you add more power.</span>
         </div>`,
        `<button class="btn btn-sm" onclick="closeModal();completePlacement('${type}',${tx},${ty})">PLACE ANYWAY</button>
         <button class="btn btn-sm btn-red" onclick="closeModal()">CANCEL</button>`
      );
      return; // defer, completePlacement will finish if confirmed
    }
  }

  // Check crafted pool first, then materials (skip cost if dev free build)
  const crafted=(G.crafted[type]||0)>0;
  if(G.devFreeBuild){
    // free placement, no cost deducted
  } else if(crafted){
    G.crafted[type]--;
  } else {
    for(const[item,need]of Object.entries(def.cost)){
      if((G.inv[item]||0)<need){toast(`Need ${need}× ${ITEMS[item]?.name||item}`,'wrn'); sfx('error'); flashDrawerItem(); hudSelect(); return;}
    }
    for(const[item,need]of Object.entries(def.cost)) G.inv[item]-=need;
  }

  const m=mkMachine(type,tx,ty,placeDir);
  undoRec({op:'place',id:m.id,src:G.devFreeBuild?'free':crafted?'crafted':'inv'});
  if(type==='miner')m.mineRes=G.map[ty][tx].res;
  if(type==='oil_pump')m.mineRes='oil';
  if(def.pumps)m.mineRes=def.pumps;
  G.machines[m.id]=m;

  const[mw,mh]=machSize(m);
  for(let dy=0;dy<mh;dy++)for(let dx=0;dx<mw;dx++)
    G.map[ty+dy][tx+dx].mid=m.id;
  const tl=linkTunnel(m); if(tl)toast(`Tunnel linked! (${tl} tiles)`,'ok');

  G.stats.placed++; updateHUD(); saveGame(); sfx('place');
  toast(`Placed ${def.name}`,'ok');
  document.getElementById('toolTip').classList.add('hidden');
  if(!LOGISTICS_TOOLS.has(type)) hudSelect();
}

function completePlacement(type,tx,ty){
  // Called after player confirms power warning, skip power check and place
  const def=MDEFS[type]; if(!def)return;
  if(!canPlace(type,tx,ty)){toast('Cannot place here','bad');sfx('error');hudSelect();return;}
  const crafted=(G.crafted[type]||0)>0;
  if(G.devFreeBuild){
    // free
  } else if(crafted){
    G.crafted[type]--;
  } else {
    for(const[item,need]of Object.entries(def.cost)){
      if((G.inv[item]||0)<need){toast(`Need ${need}× ${ITEMS[item]?.name||item}`,'wrn');sfx('error');flashDrawerItem();hudSelect();return;}
    }
    for(const[item,need]of Object.entries(def.cost)) G.inv[item]-=need;
  }
  const m=mkMachine(type,tx,ty,placeDir);
  undoRec({op:'place',id:m.id,src:G.devFreeBuild?'free':crafted?'crafted':'inv'});
  if(type==='miner')m.mineRes=G.map[ty][tx].res;
  if(type==='oil_pump')m.mineRes='oil';
  if(def.pumps)m.mineRes=def.pumps;
  G.machines[m.id]=m;
  const[mw,mh]=machSize(m);
  for(let dy=0;dy<mh;dy++)for(let dx=0;dx<mw;dx++) G.map[ty+dy][tx+dx].mid=m.id;
  const tl=linkTunnel(m); if(tl)toast(`Tunnel linked! (${tl} tiles)`,'ok');
  G.stats.placed++; updateHUD(); saveGame(); sfx('place');
  toast(`Placed ${def.name}`,'ok');
  document.getElementById('toolTip').classList.add('hidden');
  if(!LOGISTICS_TOOLS.has(type)) hudSelect();
}
function tryRemove(tx,ty,quiet){
  const mid=G.map[ty][tx].mid; if(mid===null)return;
  const m=G.machines[mid]; if(!m)return;
  const def=MDEFS[m.type];
  undoRec({op:'remove',snap:{type:m.type,x:m.x,y:m.y,dir:m.dir,recipe:m.recipe,tier:m.tier||1,modules:[...(m.modules||[])]}});
  const[mw,mh]=machSize(m);
  unlinkTunnel(m);
  for(let dy=0;dy<mh;dy++)for(let dx=0;dx<mw;dx++){
    const t=G.map[m.y+dy][m.x+dx];
    t.mid=null;
    for(const it of t.items)G.inv[it.id]=(G.inv[it.id]||0)+1; // items riding the belt come back
    t.items=[];
  }
  if(m._arm?.item)G.inv[m._arm.item]=(G.inv[m._arm.item]||0)+1;
  // Full refund: build cost, upgrade steps and installed modules
  addCost(G.inv,machineWorth(m.type,m.tier,m.modules));
  // Return input buffer to inventory
  for(const[item,n]of Object.entries(m.inBuf))
    if(n>0)G.inv[item]=(G.inv[item]||0)+n;
  // Return output buffer to inventory
  for(const[item,n]of Object.entries(m.outBuf))
    if(n>0)G.inv[item]=(G.inv[item]||0)+n;
  // Return chest inventory
  for(const[item,n]of Object.entries(m.chestInv))
    if(n>0)G.inv[item]=(G.inv[item]||0)+n;
  delete G.machines[mid];
  if(openPanel==='machine')closePanel('machine');
  if(quiet)return;
  updateHUD(); saveGame(); sfx('remove');
  toast(`Removed ${def.name}`,'ok');
}

// ═══════════════════════════════════════════════════
//  SIMULATION
// ═══════════════════════════════════════════════════
let tickId=null;
// Ticks run on a timer at the sim speed. Above ~16x the interval would drop
// under a frame, so each interval runs several ticks instead.
let lastUiMs=0, lastSaveMs=0;
let uiPress=false;
document.addEventListener('pointerdown',()=>{uiPress=true;},true);
for(const ev of['pointerup','pointercancel'])document.addEventListener(ev,()=>setTimeout(()=>{uiPress=false;},150),true);
const DEV_SPEEDS=[1,2,5,10,25,50];
function startTick(){
  if(tickId)clearInterval(tickId);
  const spd=G?.devTickSpeed||1;
  const interval=Math.max(16,TICK_MS/spd), perInterval=spd*interval/TICK_MS;
  let acc=0;
  tickId=setInterval(()=>{acc+=perInterval;let n=Math.min(8,Math.floor(acc));acc-=n;while(n-->0)gameTick();},interval);
}

function gameTick(){
  lastTickMs=performance.now();
  G.tick++;
  G.power.out=0; G.power.in=0;

  // Pre-pass: accumulate total power demand across ALL consumer machines
  const pm0=perkMult();
  for(const m of Object.values(G.machines)){
    if(!m.active||m.withered)continue;
    const def=MDEFS[m.type]; if(!def||def.power<=0)continue;
    if(m.type==='stone_furnace'||m.type==='blast_furnace')continue;
    const mods=m.modules||[];
    const modEff=mods.some(x=>x==='eff_module')?0.7:1;
    G.power.in+=def.power*pm0.power*modEff;
  }
  const sing=G.zone===5&&singularity();
  if(sing&&sing.complete&&!G.bigBang)G.power.in+=SING_POWER;

  buildFluidNets();
  // Pass 1: generators (negative power), establish power supply
  for(const m of Object.values(G.machines)){
    if(MDEFS[m.type]?.power<0)runMachine(m);
  }
  runAccumulators();
  // Pass 2: all other machines, powerRatio() now correct
  for(const m of Object.values(G.machines)){
    if(!(MDEFS[m.type]?.power<0))runMachine(m);
  }
  pushOutputsToBelts();
  runBelts();
  settleFluidNets();
  tickLiving();

  // Smog tick, natural decay + clamp
  if(zoneHas('smog')){
    if(G.smog===undefined)G.smog=0;
    G.smog=Math.max(0,Math.min(100,G.smog-SMOG_DECAY_MIN/TICKS_PER_MIN));
  }

  if(G.tick%4===0){checkAchievements();tickTutorial();}
  // UI refresh is throttled by real time so fast dev speeds don't drown the browser in DOM work
  const nowMs=performance.now();
  // Skipped while a finger/button is down: rebuilding a panel mid-tap swaps the
  // button under the finger and the tap is silently lost
  if(!uiPress&&nowMs-lastUiMs>=220){lastUiMs=nowMs;updateHUD();refreshOpenPanel();buildToolbar();updateRocketBtn();if(MDEFS[activeTool])updateBuildHUD();if(activeTool==='upgrade')updateUpgradeBar();}
  if(G.tick%120===0&&nowMs-lastSaveMs>=8000){lastSaveMs=nowMs;saveGame();}
}

function powerRatio(){
  if(G.power.out===0&&G.power.in===0)return 1; // nothing placed yet, free run
  if(G.power.out===0)return 0;                  // no generators at all
  if(G.power.in===0)return 1;                   // generators but no consumers
  if(G.power.out<G.power.in)return 0;           // hard cutoff, supply < demand
  return 1;                                      // supply meets demand
}

// Perk multipliers, reads G.perks.spent and returns composite modifiers
function perkMult(){
  const s=G.perks?.spent||{}, o=PRESTIGE.owned;
  return {
    // Tiers stack: I +10%, II +25% more, III +15% more; Stardust upgrades multiply on top
    yield: (s.yield3?1.50 : s.yield2?1.35 : s.yield1?1.10 : 1)*(o.cosmic_yield?1.15:1),
    speed: (s.speed3?1.35 : s.speed2?1.20 : s.speed1?1.10 : 1)*(o.cosmic_speed?1.15:1),
    belt:  s.belt2?1.40 : s.belt1?1.20 : 1,
    power: (s.power2?0.70 : s.power1?0.85 : 1)*(o.cosmic_power?0.8:1), // multiplier on power draw
  };
}

// Items-per-minute tracking, call once per completed output
// Stores timestamps of last 60 completions per machine in a ring buffer
const RATE_WINDOW_MS = 60000; // 1 minute window
function recordOutput(m, count){
  if(!m._times) m._times=[];
  const now=Date.now();
  m._times.push({t:now,n:count});
  m._times=m._times.filter(e=>now-e.t<RATE_WINDOW_MS);
  // Track total mined for achievements (miners and oil pumps only)
  if(m.type==='miner'||m.type==='oil_pump'){
    if(G&&G.stats) G.stats.mined=(G.stats.mined||0)+count;
  }
}
function itemsPerMin(m){
  if(!m._times||!m._times.length)return 0;
  const now=Date.now();
  const recent=m._times.filter(e=>now-e.t<RATE_WINDOW_MS);
  if(!recent.length)return 0;
  const total=recent.reduce((a,e)=>a+e.n,0);
  // Scale to full minute based on window actually elapsed
  const windowMs=Math.min(RATE_WINDOW_MS, now-recent[0].t+TICK_MS);
  return Math.round(total/(windowMs/60000));
}

function runMachine(m){
  const def=MDEFS[m.type]; if(!m.active)return;
  // Modules: compute bonuses
  const mods=m.modules||[];
  const modSpeed=1+mods.filter(x=>x==='speed_module').length*0.25;
  const modYield=1+mods.filter(x=>x==='prod_module').length*0.25;
  const modEff=mods.some(x=>x==='eff_module')?0.7:1;
  // NOTE: G.power.in is pre-calculated in gameTick pre-pass, do NOT add here

  if(m.type==='generator'){
    const hasFuel=(m.inBuf.coal||0)>0;
    if(hasFuel){
      G.power.out+=Math.abs(def.power);
      const hasPowerConsumers=Object.values(G.machines).some(mm=>mm.active&&MDEFS[mm.type]?.power>0);
      if(G.tick%16===0&&hasPowerConsumers) m.inBuf.coal--;
    }
    return;
  }
  if(m.type==='burner'){
    // 1 coal per 6s (10/min); one T1 coal Miner (60/min) keeps six Burners running
    const hasFuel=(m.inBuf.coal||0)>0;
    if(hasFuel){
      G.power.out+=Math.abs(def.power);
      const hasPowerConsumers=Object.values(G.machines).some(mm=>mm.active&&MDEFS[mm.type]?.power>0);
      if(G.tick%BURNER_COAL_TICKS===0&&hasPowerConsumers) m.inBuf.coal--;
    }
    return;
  }
  if(m.type==='combustion_gen'){
    // Burns 1 refined_fuel every 8s, only when consumers exist
    const hasFuel=(m.inBuf.refined_fuel||0)>0;
    if(hasFuel){
      G.power.out+=Math.abs(def.power);
      const hasPowerConsumers=Object.values(G.machines).some(mm=>mm.active&&MDEFS[mm.type]?.power>0&&mm.type!=='combustion_gen'&&mm.type!=='burner'&&mm.type!=='generator');
      if(G.tick%32===0&&hasPowerConsumers){m.inBuf.refined_fuel--; addSmog(SMOG_PER.combustion_gen*32/TICKS_PER_MIN);}
    }
    return;
  }
  if(m.type==='oil_pump'){
    // Auto-mines oil from deposit below, like miner but produces smog
    if(!m.mineRes||m.mineRes!=='oil')return;
    const ratio=powerRatio(); if(ratio===0)return;
    m.prog+=ratio*(MINER_TIER_SPEED[m.tier||1]||1); // like a Miner: 60 · 120 · 240 /min
    while(m.prog>=MINE_TICKS){
      if(Object.values(m.outBuf).reduce((a,b)=>a+b,0)>=50){m.prog=MINE_TICKS;break;}
      m.prog-=MINE_TICKS;
      m.outBuf.crude_oil=(m.outBuf.crude_oil||0)+1;
      m.produced++;
      recordOutput(m,1);
      addSmog(SMOG_PER.oil_pump/(TICKS_PER_MIN/MINE_TICKS)); // 20/min at 60 barrels/min
    }
    return;
  }
  if(m.type==='lumen_panel'){
    if(glowBright())G.power.out+=Math.abs(def.power);
    return;
  }
  if(m.type==='reactor'){runReactor(m,def);return;}
  if(m.type==='singularity'){runSingularity(m);return;}
  if(m.type==='heat_sink')return;
  if(def.living&&m.withered)return;
  if(def.pumps){runPump(m,def);return;}
  if(def.fluidCap||m.type==='accumulator')return; // pipes, tanks, valves: handled by settleFluidNets
  if(m.type==='scrubber'){
    // Burns refined_fuel to remove smog, every 4 ticks
    if(!zoneHas('smog')||G.tick%4!==0)return;
    if(powerRatio()===0)return;
    const hasFuel=(m.inBuf.refined_fuel||0)>0;
    if(hasFuel&&(G.smog||0)>0){
      G.smog=Math.max(0,(G.smog||0)-SCRUBBER_SMOG_MIN/(TICKS_PER_MIN/4));
      if(G.tick%SCRUBBER_FUEL_TICKS===0) m.inBuf.refined_fuel--;
    }
    return;
  }
  if(m.type==='miner'){
    if(!m.mineRes)return;
    const ratio=powerRatio();
    if(ratio===0)return;
    const pm=perkMult();
    // Smog reduces efficiency in Zone 2
    const smogMult=zoneHas('smog')?Math.max(0.1,(100-(G.smog||0))/100):1;
    const resMult=m.mineRes==='radiant_dust'?0.5:1; // radiant vents yield slowly
    // progress builds up by the speed multiplier, so any mix of tier, perks and modules gives its exact rate
    m.prog+=ratio*pm.speed*(MINER_TIER_SPEED[m.tier||1]||1)*modSpeed*smogMult*resMult;
    while(m.prog>=MINE_TICKS){
      if(Object.values(m.outBuf).reduce((a,b)=>a+b,0)>=50){m.prog=MINE_TICKS;break;} // full: wait
      m.prog-=MINE_TICKS;
      const n=Math.random()<(pm.yield*modYield-1)?2:1; // yield perks and Productivity Modules (tiers are speed)
      m.outBuf[m.mineRes]=(m.outBuf[m.mineRes]||0)+n;
      m.produced+=n;
      recordOutput(m,n);
    }
    return;
  }
  if(m.type==='chest'||m.type==='belt'||m.type==='splitter'||m.type==='tunnel'||m.type==='inserter'||m.type==='long_inserter'||m.type==='burner')return;

  if(!m.recipe)return;
  const rec=RECIPES[m.recipe]; if(!rec)return;
  if((rec.unlock&&!G.research.done.includes(rec.unlock))||!zoneRecipeOk(m.recipe)){m.recipe=null;m.prog=0;return;}
  const pm=perkMult();
  const powerImmune=(m.type==='stone_furnace'||m.type==='blast_furnace');
  const ratio=powerImmune?1:powerRatio();
  if(ratio===0)return;
  const tierMult=MACHINE_TIER_SPEED[m.tier||1]||1;
  // Smog reduces efficiency in Zone 2 for all powered machines
  const smogEff=zoneHas('smog')?Math.max(0.1,(100-(G.smog||0))/100):1;
  const lifeMult=def.living?lifeStage(m).mult:1;
  const speedMult=ratio*pm.speed*tierMult*modSpeed*smogEff*lifeMult;

  if(m.prog===0){
    if(canFill(m,rec)&&fluidReady(m,rec)){consumeInputs(m,rec);consumeFluid(m,rec);m.prog=1;}
  } else m.prog++;
  if(m.prog>0){ // checked on the start tick too, so a one-tick cycle (a 1s recipe at T3) isn't stretched to two
    m._dur=Math.ceil(rec.time/Math.max(.01,speedMult));
    if(m.prog>=m._dur){
      // Stall if output buffer full
      const bufTotal=Object.values(m.outBuf).reduce((a,b)=>a+b,0);
      if(bufTotal>=50)return;
      m.prog=0;
      if(SMOG_PER[m.type])addSmog(SMOG_PER[m.type]*rec.time/TICKS_PER_MIN); // a Cracker or Refinery: 15/min at T1
      for(const[item,n]of Object.entries(rec.out)){
        // prod module: chance of bonus output
        const bonus=modYield>1&&Math.random()<(modYield-1)?1:0;
        const total=n+bonus;
        m.outBuf[item]=(m.outBuf[item]||0)+total;
        m.produced+=total;
        recordOutput(m,total);
      }
    }
  }
}

function canFill(m,rec){
  for(const[item,need]of Object.entries(rec.in)){
    if((m.inBuf[item]||0)<need)return false;
  }
  return true;
}

function consumeInputs(m,rec){
  for(const[item,need]of Object.entries(rec.in)){
    m.inBuf[item]=(m.inBuf[item]||0)-need;
  }
}

// ═══════════════════════════════════════════════════
//  FLUIDS & PRESSURE
//  Pipes/tanks/valves (fluidCap) join into networks each tick. A network holds
//  one fluid; pressure = amount / capacity. Pumps push in, fluidPort machines
//  draw out at recipe start. ≥90% with inflow builds strain → a pipe bursts.
// ═══════════════════════════════════════════════════
const LOW_PRESSURE=20, OVER_PRESSURE=90, RELIEF_AT=80, BURST_STRAIN=80;
// Relief Valves (v2.0.17): each vents at most VALVE_VENT a tick (60 a minute, half of what a T1 pump pushes), and a
// Gasket seals VALVE_SEAL units of venting. A valve comes with one fitted; with none left in its buffer it jams shut.
const VALVE_VENT=0.25, VALVE_SEAL=60;
function valveJammed(m){return (m.seal===undefined?VALVE_SEAL:m.seal)<=0&&!(m.inBuf.gasket>0);}
function burstStrain(){return BURST_STRAIN*(G.perks?.spent?.pressure1?1.5:1);}
const FLUID_RES={oil:'🛢️ NEEDS OIL PUMP',brine:'💧 NEEDS BRINE PUMP',enzymes:'🧪 NEEDS ENZYME PUMP'};
let FLUID_NETS=[];
let burstFx=[];

function machineNeighbors(m){
  const[w,h]=machSize(m); const out=new Set();
  for(let dy=-1;dy<=h;dy++)for(let dx=-1;dx<=w;dx++){
    if((dx===-1||dx===w)&&(dy===-1||dy===h))continue; // orthogonal only
    if(dx>=0&&dx<w&&dy>=0&&dy<h)continue;
    const tx=m.x+dx,ty=m.y+dy;
    if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)continue;
    const mid=G.map[ty][tx].mid; if(mid!==null&&G.machines[mid])out.add(G.machines[mid]);
  }
  return [...out];
}
function pressureOf(net){return net&&net.cap>0?Math.min(100,net.amt/net.cap*100):0;}

function buildFluidNets(){
  FLUID_NETS=[];
  const seen=new Set();
  for(const m of Object.values(G.machines)){ if(MDEFS[m.type]?.fluidPort)m._nets=[]; }
  for(const start of Object.values(G.machines)){
    if(!MDEFS[start.type]?.fluidCap||seen.has(start.id))continue;
    const net={members:[],ports:new Set(),cap:0,amt:0,type:null,strain:0,inflow:0};
    const queue=[start]; seen.add(start.id);
    while(queue.length){
      const cur=queue.pop();
      net.members.push(cur); cur._net=net;
      net.cap+=MDEFS[cur.type].fluidCap;
      if(cur.fluid&&cur.fluid.amt>0){net.amt+=cur.fluid.amt; net.type=net.type||cur.fluid.type;}
      net.strain=Math.max(net.strain,cur.strain||0);
      for(const nb of machineNeighbors(cur)){
        const nd=MDEFS[nb.type];
        if(nd.fluidCap&&!seen.has(nb.id)){seen.add(nb.id);queue.push(nb);}
        else if(nd.fluidPort&&!net.ports.has(nb)){net.ports.add(nb);nb._nets.push(net);}
      }
    }
    FLUID_NETS.push(net);
  }
}

// Network a machine can use for a given fluid (or an empty one for pumps)
function portNet(m,fluid,allowEmpty){
  return (m._nets||[]).find(n=>n.type===fluid||(allowEmpty&&!n.type))||null;
}

function runPump(m,def){
  if(m.mineRes!==def.pumps){m._fluidStatus='nodeposit';return;}
  if(powerRatio()===0){m._fluidStatus='nopower';return;}
  if(++m.prog<2)return;
  m.prog=0;
  const net=portNet(m,def.pumps,true);
  if(!net){m._fluidStatus='nopipe';return;}
  m._fluidStatus='ok';
  net.type=def.pumps;
  net.amt=Math.min(net.cap,net.amt+(m.tier===3?2:m.tier===2?1.5:1));
  net.inflow++;
  m.produced++; recordOutput(m,1);
}

function fluidReady(m,rec){
  if(!rec.fluid){m._fluidStatus=null;return true;}
  const minP=Math.max(LOW_PRESSURE,rec.minPressure||0);
  for(const[f,n]of Object.entries(rec.fluid)){
    const net=portNet(m,f,false);
    if(!net){m._fluidStatus='nopipe';return false;}
    if(pressureOf(net)<minP||net.amt<n){m._fluidStatus='lowpressure';return false;}
  }
  m._fluidStatus='ok';
  return true;
}
function consumeFluid(m,rec){
  for(const[f,n]of Object.entries(rec.fluid||{})){
    const net=portNet(m,f,false); if(net)net.amt=Math.max(0,net.amt-n);
  }
}

function settleFluidNets(){
  for(const net of FLUID_NETS){
    if(!net.members.length)continue;
    const valves=net.members.filter(m=>m.type==='relief_valve'&&m.active);
    let excess=net.amt-net.cap*RELIEF_AT/100;
    for(const v of valves){
      if(v.seal===undefined)v.seal=VALVE_SEAL; // a new valve comes with one gasket fitted
      if(excess<=0)continue;
      if(v.seal<=0){
        if((v.inBuf.gasket||0)>0){v.inBuf.gasket--;v.seal+=VALVE_SEAL;}
        else{ if(!v._jamWarned){v._jamWarned=true;toast('Relief Valve jammed: out of Gaskets','bad');} continue; }
      }
      const d=Math.min(VALVE_VENT,excess,v.seal);
      v.seal-=d; excess-=d; net.amt-=d; v._jamWarned=false;
    }
    // Strain builds while pumps push into an over-pressured network (pumps push every
    // other tick, so +2 per push ≈ +1/tick), holds between pushes, eases off below 90%
    if(pressureOf(net)>=OVER_PRESSURE){if(net.inflow>0)net.strain+=2;}
    else net.strain=Math.max(0,net.strain-2);
    if(net.strain>=burstStrain())burstPipe(net);
    if(net.amt<0.01){net.amt=0;net.type=null;}
    for(const m of net.members){
      m.fluid={type:net.type,amt:net.cap?net.amt*MDEFS[m.type].fluidCap/net.cap:0};
      m.strain=net.strain;
    }
  }
}

// Over-pressure: one pipe in the network is destroyed and half the fluid is lost
function burstPipe(net){
  const pipes=net.members.filter(m=>m.type==='pipe');
  net.strain=0; net.amt*=0.5;
  if(!pipes.length)return;
  const p=pipes[Math.floor(Math.random()*pipes.length)];
  G.map[p.y][p.x].mid=null;
  delete G.machines[p.id];
  net.members.splice(net.members.indexOf(p),1);
  net.cap-=MDEFS.pipe.fluidCap;
  net.amt=Math.min(net.amt,net.cap);
  G.stats.bursts=(G.stats.bursts||0)+1;
  burstFx.push({x:p.x,y:p.y,t:performance.now()});
  if(inspectId===p.id&&openPanel==='machine')closePanel('machine');
  toast('💥 PIPE BURST! Over-pressure','bad'); sfx('error');
}

// Highest-pressure network, for the HUD
function worstNet(){
  let worst=null;
  for(const n of FLUID_NETS)if(n.type&&(!worst||n.strain>worst.strain||(n.strain===worst.strain&&pressureOf(n)>pressureOf(worst))))worst=n;
  return worst;
}

// ═══════════════════════════════════════════════════
//  LIVING MACHINES (Zone 4)
//  Vitality 0-100 decays every tick. A machine eats 1 Nutrient Paste from its
//  input buffer every FEED_EVERY ticks while below 100. Stage sets speed:
//  Sprout <30 ×0.5 · Mature ×1 · Bloom >80 ×1.5. At 0 it withers and stops
//  until replanted (5 biomass).
// ═══════════════════════════════════════════════════
const VIT_START=40, VIT_DECAY=0.06, FEED_EVERY=20, FEED_GAIN=12, REPLANT_COST=5;
function lifeStage(m){
  if(m.withered)return {name:'Withered',icon:'🥀',mult:0};
  const v=m.vit||0;
  if(v<30)return {name:'Sprout',icon:'🌱',mult:0.5};
  if(v>80)return {name:'Bloom',icon:'🌸',mult:1.5};
  return {name:'Mature',icon:'🌿',mult:1};
}
function tickLiving(){
  const decay=VIT_DECAY*(G.perks?.spent?.vital1?0.75:1);
  for(const m of Object.values(G.machines)){
    if(!MDEFS[m.type]?.living||m.withered)continue;
    if(m.vit===undefined)m.vit=VIT_START;
    m.vit=Math.max(0,m.vit-decay);
    if(m.vit<100&&G.tick%FEED_EVERY===0&&(m.inBuf.nutrient||0)>0){
      m.inBuf.nutrient--; m.vit=Math.min(100,m.vit+FEED_GAIN);
    }
    if(m.vit<=0){
      m.withered=true; G.stats.withered=(G.stats.withered||0)+1;
      toast(`🥀 ${MDEFS[m.type].name} withered. Replant it`,'bad');
    }
  }
}
function replantMachine(id){
  const m=G.machines[id]; if(!m||!m.withered)return;
  if((G.inv.biomass||0)<REPLANT_COST){toast(`Need ${REPLANT_COST}× Biomass`,'wrn');sfx('error');return;}
  G.inv.biomass-=REPLANT_COST; m.withered=false; m.vit=VIT_START; m.prog=0;
  sfx('craft'); toast(`🌱 ${MDEFS[m.type].name} replanted`,'ok'); renderMachPanel();
}
function feedMachine(id){
  const m=G.machines[id]; if(!m)return;
  if((G.inv.nutrient||0)<1){toast('No Nutrient Paste in inventory','wrn');sfx('error');return;}
  G.inv.nutrient--; m.inBuf.nutrient=(m.inBuf.nutrient||0)+1;
  sfx('craft'); renderMachPanel();
}

// ── Nuclear reactor + heat ──
// Running adds heat; passive cooling + each adjacent Heat Sink removes it.
// At 100 the reactor SCRAMs: offline for REACTOR_SCRAM ticks while it cools.
const REACTOR_HEAT=0.5, REACTOR_COOL=0.1, SINK_COOL=0.2, REACTOR_SCRAM=240, ROD_TICKS=240;
function runReactor(m,def){
  const sinks=machineNeighbors(m).filter(n=>n.type==='heat_sink').length;
  m.heat=Math.max(0,(m.heat||0)-REACTOR_COOL-sinks*SINK_COOL);
  if(m.scram>0){m.scram--;return;}
  if((m.inBuf.lum_rod||0)<=0)return;
  G.power.out+=Math.abs(def.power);
  m.heat+=REACTOR_HEAT*(G.perks?.spent?.cool1?0.8:1);
  m.burn=(m.burn||0)+1;
  if(m.burn>=ROD_TICKS){m.burn=0;m.inBuf.lum_rod--;}
  if(m.heat>=100){
    m.heat=100; m.scram=REACTOR_SCRAM; G.stats.scrams=(G.stats.scrams||0)+1;
    toast('☢️ REACTOR SCRAM! Overheated, add Heat Sinks','bad'); sfx('error');
  }
}

// ═══════════════════════════════════════════════════
//  THE SINGULARITY (Zone 5)
//  Inserters (any side) or the panel feed components into it. Once complete it
//  draws SING_POWER; holding full power for SING_SUSTAIN ticks → Big Bang.
// ═══════════════════════════════════════════════════
const SING_REQS={grav_lens:20,stellar_casing:40,void_engine:20,quantum_mind:20};
const SING_POWER=5000, SING_SUSTAIN=240;
function singularity(){return Object.values(G.machines).find(m=>m.type==='singularity')||null;}
function runSingularity(m){
  if(!m.built)m.built={};
  for(const[id,need]of Object.entries(SING_REQS)){
    const have=m.built[id]||0, inb=m.inBuf[id]||0;
    if(inb>0&&have<need){const take=Math.min(inb,need-have);m.built[id]=have+take;m.inBuf[id]-=take;}
  }
  m.complete=Object.entries(SING_REQS).every(([id,n])=>(m.built[id]||0)>=n);
  if(!m.complete||G.bigBang)return;
  m.sustain=(powerRatio()===1&&G.power.out>=G.power.in)?(m.sustain||0)+1:0;
  if(m.sustain>=SING_SUSTAIN)triggerBigBang();
}
function depositToSingularity(){
  const m=singularity(); if(!m)return;
  if(!m.built)m.built={};
  let moved=0;
  for(const[id,need]of Object.entries(SING_REQS)){
    const take=Math.min(G.inv[id]||0,need-(m.built[id]||0));
    if(take>0){G.inv[id]-=take;m.built[id]=(m.built[id]||0)+take;moved+=take;}
  }
  toast(moved?`Deposited ${moved} components`:'No components to deposit',moved?'ok':'wrn');
  sfx(moved?'craft':'error'); refreshOpenPanel();
}
function singularityStatusHtml(compact){
  if(G.bigBang)return `<div style="font-size:var(--f6);color:var(--purple);text-align:center;line-height:2.2">💥 The Big Bang has happened.<br>
    <button class="full-btn teal" style="margin-top:6px" onclick="openStardustShop()">✨ STARDUST SHOP</button>
    <button class="full-btn amber" style="margin-top:6px" onclick="beginNewUniverse()">BEGIN AGAIN →</button></div>`;
  if(!G.research.done.includes('singularity'))
    return `<div style="font-size:var(--f5);color:var(--text3);line-height:2.2">Research <span style="color:var(--amber)">Void Theory</span>, then
      <span style="color:var(--amber)">The Singularity</span>, to unlock the 10×10 structure.</div>`;
  const m=singularity();
  if(!m)return `<div style="font-size:var(--f5);color:var(--text3);line-height:2.2">Place the 🌌 Singularity (BUILD → Singularity). It needs a clear 10×10 area.</div>`;
  let html=`<span class="sec-label">CONSTRUCTION</span>`;
  for(const[id,need]of Object.entries(SING_REQS)){
    const have=(m.built||{})[id]||0, done=have>=need, pct=Math.round(have/need*100);
    html+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
      <span style="min-width:16px">${iconHtml(id)}</span>
      <div style="flex:1"><div style="font-size:var(--f5);color:${done?'var(--teal)':'var(--text2)'};margin-bottom:2px">${ITEMS[id].name}</div>
        <div class="prog-wrap" style="margin:0"><div class="prog-fill ${done?'green':'amber'}" style="width:${pct}%"></div></div></div>
      <span style="font-size:var(--f5);color:${done?'var(--teal)':'var(--text3)'};min-width:32px;text-align:right">${have}/${need}</span>
    </div>`;
  }
  if(!m.complete){
    html+=`<button class="full-btn teal" style="margin-top:6px" onclick="depositToSingularity()">⬇ DEPOSIT FROM INVENTORY</button>
      <div style="font-size:var(--f5);color:var(--text3);margin-top:6px;line-height:2">Inserters can feed it from any side.</div>`;
  } else {
    const pct=Math.round((m.sustain||0)/SING_SUSTAIN*100), ok=G.power.out>=SING_POWER&&powerRatio()===1;
    html+=`<span class="sec-label" style="margin-top:8px">SUSTAIN: ${fmtKW(SING_POWER)} FOR 60s</span>
      <div class="prog-wrap"><div class="prog-fill" style="width:${pct}%;background:var(--purple)"></div></div>
      <div style="font-size:var(--f5);color:${ok?'var(--green)':'var(--red)'};margin-top:4px">${ok?`Holding… ${Math.ceil((SING_SUSTAIN-(m.sustain||0))*TICK_MS/1000)}s`:`⚡ Power ${fmtKW(G.power.out)} / ${fmtKW(G.power.in)}, not enough`}</div>`;
  }
  return html;
}

// ── Big Bang + Stardust prestige (stored in its own key, never wiped) ──
const PRESTIGE_KEY='ebi_prestige';
const PRESTIGE_SHOP=[
  {id:'cosmic_yield',   name:'Cosmic Yield',     desc:'+15% resource yield, every run',            cost:5},
  {id:'cosmic_speed',   name:'Starlight Haste',  desc:'+15% machine speed, every run',             cost:5},
  {id:'cosmic_power',   name:'Dark Energy',      desc:'-20% power draw, every run',                cost:5},
  {id:'cosmic_perk',    name:'Starborn',         desc:'+1 perk point on every zone launch',        cost:8},
  {id:'cosmic_start',   name:'Remembered Tools', desc:'Start every zone with 5 Miners, 5 Furnaces, 2 Burners ready to place', cost:8},
  {id:'cosmic_research',name:'Echoes',           desc:'Start each run with Basic Automation + Advanced Logistics', cost:10},
];
const THEMES={
  default:{name:'Amber',   cost:0, amber:'#f5a623', teal:'#26c6a0'},
  violet: {name:'Nebula',  cost:3, amber:'#b388ff', teal:'#80deea'},
  crimson:{name:'Red Giant',cost:3,amber:'#ff5252', teal:'#ffd740'},
  mono:   {name:'Mono',    cost:3, amber:'#e0e0e0', teal:'#9e9e9e'},
};
function loadPrestige(){
  const base={stardust:0,total:0,bangs:0,owned:{},theme:'default'};
  try{return Object.assign(base,JSON.parse(localStorage.getItem(PRESTIGE_KEY)||'{}'));}catch(e){return base;}
}
let PRESTIGE=loadPrestige();
function savePrestige(){try{localStorage.setItem(PRESTIGE_KEY,JSON.stringify(PRESTIGE));}catch(e){}}
function applyTheme(){
  const t=THEMES[PRESTIGE.theme]||THEMES.default;
  document.documentElement.style.setProperty('--amber',t.amber);
  document.documentElement.style.setProperty('--teal',t.teal);
}
let bigBangAt=0;
function triggerBigBang(){
  if(G.bigBang)return;
  G.bigBang=true;
  const dust=achDust();
  PRESTIGE.stardust+=dust; PRESTIGE.total+=dust; PRESTIGE.bangs++; savePrestige();
  bigBangAt=performance.now();
  saveGame(); sfx('launch'); checkAchievements();
  setTimeout(()=>showModal('💥 BIG BANG',
    `<div style="text-align:center;font-size:var(--f6);color:var(--text2);line-height:2.5">
      <div style="font-size:30px;margin-bottom:10px">💥</div>
      The Singularity holds for sixty seconds.<br>Then everything, every belt, every world, collapses to a point.<br><br>
      <span style="color:var(--purple);font-size:var(--f7)">A NEW UNIVERSE BEGINS</span><br><br>
      <span style="color:var(--amber)">+${dust} ✨ Stardust</span> <span style="color:var(--text3)">(10 + 1 per 2 achievements, up to +${ACH_DUST_MAX})</span><br>
      <span style="color:var(--text3);font-size:var(--f5)">Big Bangs: ${PRESTIGE.bangs} · Stardust is permanent across runs</span>
    </div>`,
    `<button class="btn btn-sm" onclick="openStardustShop()">✨ SHOP</button>
     <button class="btn btn-teal btn-sm" onclick="beginNewUniverse()">BEGIN AGAIN →</button>`),1800);
}
function beginNewUniverse(){
  closeModal();
  if(openPanel)closePanel(openPanel);
  newGame();
}
function openStardustShop(){
  let html=`<div class="card" style="margin-bottom:8px;text-align:center">
    <div style="font-size:var(--f5);color:var(--text3)">STARDUST</div>
    <div style="font-size:var(--f10);color:var(--amber)">✨ ${PRESTIGE.stardust}</div>
    <div style="font-size:var(--f4);color:var(--text3);margin-top:3px">Big Bangs: ${PRESTIGE.bangs} · lifetime ${PRESTIGE.total}</div>
  </div><span class="sec-label">PERMANENT UPGRADES</span>`;
  for(const it of PRESTIGE_SHOP){
    const owned=!!PRESTIGE.owned[it.id], can=!owned&&PRESTIGE.stardust>=it.cost;
    html+=`<div style="border:1px solid ${owned?'var(--teal)':'var(--border)'};background:var(--bg3);padding:7px;margin-bottom:4px">
      <div style="display:flex;justify-content:space-between;font-size:var(--f6)"><span style="color:${owned?'var(--teal)':'var(--text)'}">${it.name}</span>
        <span style="color:var(--amber);font-size:var(--f5)">${owned?'✓':`✨${it.cost}`}</span></div>
      <div style="font-size:var(--f5);color:var(--text3);margin:3px 0">${it.desc}</div>
      ${can?`<button class="mini-btn amber" onclick="buyStardust('${it.id}')">BUY</button>`:''}
    </div>`;
  }
  html+=`<span class="sec-label" style="margin-top:8px">THEMES</span><div style="display:flex;flex-wrap:wrap;gap:4px">`;
  for(const[id,t]of Object.entries(THEMES)){
    const owned=id==='default'||PRESTIGE.owned['theme_'+id], active=PRESTIGE.theme===id;
    html+=`<button class="mini-btn ${active?'teal':owned?'':'amber'}" style="border-color:${t.amber};color:${t.amber}" onclick="${owned?`useTheme('${id}')`:`buyStardust('theme_${id}',${t.cost})`}">
      ${active?'● ':''}${t.name}${owned?'':` ✨${t.cost}`}</button>`;
  }
  html+='</div>';
  showModal('✨ STARDUST',html,`<button class="btn btn-sm" onclick="closeModal()">CLOSE</button>`);
}
function buyStardust(id,cost){
  const it=PRESTIGE_SHOP.find(x=>x.id===id); const price=it?it.cost:cost;
  if(PRESTIGE.owned[id]||PRESTIGE.stardust<price){toast('Not enough Stardust','wrn');sfx('error');return;}
  PRESTIGE.stardust-=price; PRESTIGE.owned[id]=true;

function useTheme(id){PRESTIGE.theme=id;savePrestige();applyTheme();openStardustShop();}
// Prestige effects applied when a run / zone starts
function applyRememberedTools(){
  if(!PRESTIGE.owned.cosmic_start)return;
  for(const[t,n]of [['miner',5],['stone_furnace',5],['burner',2]])G.crafted[t]=(G.crafted[t]||0)+n;
}
function applyPrestigeStart(){
  if(PRESTIGE.owned.cosmic_research)
    for(const id of ['automation','logistics'])if(!G.research.done.includes(id))G.research.done.push(id);
  applyRememberedTools();
}

// ── Glow tide (Zone 3 light cycle) ──
const GLOW_CYCLE=960, GLOW_BRIGHT=720; // ticks: 180s bright, 60s dim
function glowBright(){return (G.tick%GLOW_CYCLE)<GLOW_BRIGHT;}
function glowSecsLeft(){
  const t=G.tick%GLOW_CYCLE;
  return Math.ceil(((t<GLOW_BRIGHT?GLOW_BRIGHT:GLOW_CYCLE)-t)*TICK_MS/1000);
}

// ── Accumulators: soak up surplus, cover shortfalls they can fully cover ──
const ACC_CAP=2000; // kJ, 40kW for 50s
function runAccumulators(){
  const accs=Object.values(G.machines).filter(m=>m.type==='accumulator'&&m.active);
  if(!accs.length)return;
  const dt=TICK_MS/1000;
  const surplus=G.power.out-G.power.in;
  if(surplus<0){
    let need=-surplus*dt;
    const stored=accs.reduce((a,m)=>a+(m.charge||0),0);
    if(stored<need)return;
    for(const m of accs){const take=Math.min(m.charge||0,need);m.charge=(m.charge||0)-take;need-=take;}
    G.power.out=G.power.in;
  } else if(surplus>0){
    let give=surplus*dt;
    for(const m of accs){
      const g=Math.min(ACC_CAP-(m.charge||0),give);
      m.charge=(m.charge||0)+g; give-=g;
      if(give<=0)break;
    }
  }
}

const BELT_DONE=1-1e-6;
const END_HOLD=0.75; // where the front item waits at the end of a line: a half gap (BELT_GAP/2) short of the edge
// Gaps across tile edges too: the front item of a tile stays a gap behind the last item on the belt it feeds.
// Tiles are visited downstream first (memo), so a whole queue lines up in one pass.
function spaceBeltQueues(){
  const mins=new Map();
  const visit=(tx,ty,depth)=>{
    const key=ty*MAP_W+tx; if(mins.has(key))return mins.get(key);
    mins.set(key,Infinity); // loop guard
    const t=G.map[ty][tx]; if(!t.items.length||t.mid===null)return Infinity;
    const m=G.machines[t.mid]; if(!m||!beltLike(m.type))return Infinity;
    t.items.sort((a,b)=>b.prog-a.prog);
    let lim=Infinity;
    const entrance=m.type==='tunnel'&&m.tunnelId!==null&&G.machines[m.tunnelId]&&((G.machines[m.tunnelId].x-m.x)*D_VEC[m.dir][0]+(G.machines[m.tunnelId].y-m.y)*D_VEC[m.dir][1])>0;
    if(m.type!=='splitter'&&!entrance){
      const nx=tx+D_VEC[m.dir][0], ny=ty+D_VEC[m.dir][1], nt=G.map[ny]?.[nx], nm=nt&&nt.mid!==null?G.machines[nt.mid]:null;
      if(nm&&beltLike(nm.type)&&depth<400)lim=visit(nx,ny,depth+1)+1-BELT_GAP;
    }
    for(const it of t.items){if(it.prog>lim)it.prog=Math.max(0,lim); lim=it.prog-BELT_GAP;}
    const mn=t.items[t.items.length-1].prog; mins.set(key,mn); return mn;
  };
  for(let ty=0;ty<MAP_H;ty++)for(let tx=0;tx<MAP_W;tx++){const t=G.map[ty][tx]; if(t.items.length&&t.mid!==null)visit(tx,ty,0);}
}
function beltDeadEnd(m,tx,ty){ // nothing ahead can take items: they queue on this tile
  if(m.type==='splitter')return false; // a splitter's cells wait for their own side (see runBelts)
  if(m.type==='tunnel'){
    const p=m.tunnelId!==null&&G.machines[m.tunnelId]; if(!p)return true; // unlinked: stalls
    if((p.x-m.x)*D_VEC[m.dir][0]+(p.y-m.y)*D_VEC[m.dir][1]>0)return false; // entrance: items go underground
  }
  const nt=G.map[ty+D_VEC[m.dir][1]]?.[tx+D_VEC[m.dir][0]]; if(!nt||nt.mid===null)return true;
  const nm=G.machines[nt.mid]; return !nm||!(beltLike(nm.type)||nm.type==='chest');
}
const carryProg=p=>Math.max(0,Math.min(.99,p-1)); // what's left of this tick's move, on the next tile
function runBelts(){
  const pm=perkMult();
  const beltSpeed=beltBaseSpeed();

  // Advance items on belt/splitter/tunnel
  for(let ty=0;ty<MAP_H;ty++)for(let tx=0;tx<MAP_W;tx++){
    const tile=G.map[ty][tx]; if(tile.mid===null)continue;
    const m=G.machines[tile.mid]; if(!m)continue;
    if(m.type!=='belt'&&m.type!=='splitter'&&m.type!=='tunnel')continue;
    // No clamp at 1: the overshoot carries into the next tile (BELT_DONE absorbs float error, 10×0.1 < 1),
    // so each tile takes exactly its time and items never freeze at the edge for a tick
    const sp=beltSpeed*beltTierMult(m);
    // At a dead end (a machine, nothing, or an unlinked tunnel ahead) items stop a quarter tile short of the edge
    // instead of running into it, so the queue is drawn exactly where it is (v2.0.18)
    const cap=beltDeadEnd(m,tx,ty)?END_HOLD:1+sp;
    for(const it of tile.items)if(it.prog<cap)it.prog=Math.min(cap,it.prog+sp);
  }

  // Transfer completed items. A blocked item keeps its place (prog >= BELT_DONE) and retries after the tiles ahead
  // have moved: the first pass runs top-left to bottom-right, so a full belt flowing right or down only freed one
  // tile per tick (221 items/min on T3 against 240 flowing left or up). Whatever is still blocked after the retries
  // is marked queued (prog .99), which the renderer and inserters read.
  const moveTile=(tx,ty,final)=>{ // returns true if items are still waiting on this tile
    const tile=G.map[ty][tx]; if(tile.mid===null)return false;
    const m=G.machines[tile.mid]; if(!m)return false;
    if(m.type!=='belt'&&m.type!=='splitter'&&m.type!=='tunnel')return false;
    const hold=it=>{if(final)it.prog=0.99;tile.items.push(it);};
    const left=()=>!final&&tile.items.some(it=>it.prog>=BELT_DONE);

    // Tunnel: entrance teleports to exit; exit passes items forward like a belt
    if(m.type==='tunnel'){
      const[dvx,dvy]=D_VEC[m.dir];
      if(m.tunnelId!==null){
        const partner=G.machines[m.tunnelId];
        if(partner){
          const distForward=(partner.x-m.x)*dvx+(partner.y-m.y)*dvy;
          if(distForward>0){
            // ENTRANCE, teleport arrived items to exit tile
            const exTile=G.map[partner.y][partner.x];
            // the exit takes them like a belt tile (cap and gap); the rest wait at the mouth
            for(const it of tile.items.filter(i=>i.prog>=BELT_DONE).sort((a,b)=>b.prog-a.prog)){
              const c=carryProg(it.prog); if(!beltRoom(exTile,c))break;
              tile.items.splice(tile.items.indexOf(it),1); it.prog=c; exTile.items.push(it);
            }
            return left();
          }
          // EXIT, pass forward; back-pressure if blocked (so inserter can grab)
          const arr=tile.items.filter(it=>it.prog>=BELT_DONE).sort((a,b)=>b.prog-a.prog);
          if(!arr.length)return false;
          const nx=tx+dvx,ny=ty+dvy;
          tile.items=tile.items.filter(it=>it.prog<BELT_DONE); // same test as arr: an item just under 1 must not stay behind as well
          if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H){
            for(const it of arr)hold(it);
            return left();
          }
          const next=G.map[ny][nx];
          for(const it of arr){
            if(next.mid!==null){
              const nm=G.machines[next.mid];
              if((nm.type==='belt'||nm.type==='splitter'||nm.type==='tunnel')&&beltRoom(next,carryProg(it.prog))){
                it.prog=carryProg(it.prog);next.items.push(it);
              } else hold(it);
            } else hold(it);
          }
          return left();
        }
      }
      // UNLINKED, stall all items, never pass through
      return false;
    }

    const arrived=tile.items.filter(it=>it.prog>=BELT_DONE).sort((a,b)=>b.prog-a.prog); // front item first
    if(!arrived.length)return false;
    // Remove exactly what arrived (prog >= BELT_DONE). Filtering on prog<1 kept an item at 0.9999999 here AND moved it on,
    // so one item object sat on two tiles: a back-pressure reset on one froze the other (T2/T3 belt sums hit that often)
    tile.items=tile.items.filter(it=>it.prog<BELT_DONE);
    const[dvx,dvy]=D_VEC[m.dir];

    // Splitter: 1×2, second cell always at (m.x, m.y+1)
    if(m.type==='splitter'){
      // Both cells route (the second cell used to drop its items: anything fed into it vanished)
      // Secondary cell is perpendicular to flow direction
      const PERP=[[0,1],[1,0],[0,1],[1,0]]; // perpendicular offset per dir
      const[px,py]=PERP[m.dir];
      const outA={x:m.x+dvx,      y:m.y+dvy};
      const outB={x:m.x+dvx+px,   y:m.y+dvy+py};

      // Each item gets a side as it comes in (alternating) and keeps it. A belt on that side takes it; with an
      // inserter (or nothing) there, it moves onto that side's cell and waits, so the inserter on each side gets
      // half. If that cell is full the item tries the other side's belt, then waits where it is (no deadlock).
      const cells=[G.map[m.y][m.x],G.map[m.y+py]?.[m.x+px]], here=tile===cells[0]?0:1;
      const tryBelt=dest=>{
        if(dest.x<0||dest.y<0||dest.x>=MAP_W||dest.y>=MAP_H)return null;
        const nt=G.map[dest.y][dest.x]; if(nt.mid===null)return null;
        const nm=G.machines[nt.mid];
        return nm&&beltLike(nm.type)?nt:null;
      };
      for(const it of arrived){
        if(it.side===undefined){it.side=(m.splitSide||0)%2; m.splitSide=(m.splitSide||0)+1;}
        const mine=it.side, dests=[mine===0?outA:outB, mine===0?outB:outA];
        const own=tryBelt(dests[0]), c=carryProg(it.prog);
        if(own&&beltRoom(own,c)){it.prog=c;delete it.side;own.items.push(it);continue;}
        if(!own&&here!==mine&&cells[mine]&&cells[mine].items.length<BELT_CAP){it.prog=.99;cells[mine].items.push(it);continue;} // waits on its side
        if(!own&&here===mine){hold(it);continue;} // waiting on its own side for that side's inserter
        const other=tryBelt(dests[1]);
        if(other&&beltRoom(other,c)){it.prog=c;delete it.side;other.items.push(it);continue;}
        if(!own&&here!==mine)it.side=here; // its side is backed up: it goes to this side instead, so nothing jams
        hold(it);
      }
      return left();
    }

    // Normal belt
    const nx=tx+dvx,ny=ty+dvy;
    if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H){
      for(const it of arrived)hold(it);
      return left();
    }
    const next=G.map[ny][nx];
    for(const it of arrived){
      if(next.mid!==null){
        const nm=G.machines[next.mid];
        if((nm.type==='belt'||nm.type==='splitter')&&beltRoom(next,carryProg(it.prog))){
          it.prog=carryProg(it.prog);next.items.push(it);
        } else if(nm.type==='tunnel'&&beltRoom(next,carryProg(it.prog))){ // a tunnel mouth fills like a belt (it had no cap and swallowed thousands)
          it.prog=carryProg(it.prog);next.items.push(it);
        } else if(nm.type==='chest'){
          nm.chestInv[it.id]=(nm.chestInv[it.id]||0)+1;
        } else {
          // All other machines (assembler, furnace, etc), belts cannot feed directly, back-pressure
          hold(it);
        }
      } else hold(it);
    }
    return left();
  };
  let waiting=[];
  for(let ty=0;ty<MAP_H;ty++)for(let tx=0;tx<MAP_W;tx++)if(moveTile(tx,ty,false))waiting.push([tx,ty]);
  for(let pass=0;pass<4&&waiting.length;pass++){ // alternate direction: each pass clears a whole run of belt
    const n0=waiting.length;
    waiting=(pass%2===0?[...waiting].reverse():waiting).filter(([x,y])=>moveTile(x,y,false));
    if(pass%2===0)waiting.reverse();
    if(waiting.length===n0&&pass>0)break;
  }
  for(const[x,y]of waiting)moveTile(x,y,true);
  // A queue keeps its gaps (v2.0.18): a held item waits at the edge and each one behind stops a gap short of it.
  // They all used to stack at the edge (prog .99), so a released queue poured out two at a time and jumped on screen.
  // Moving items are a gap apart already, so this only changes queues, never throughput.
  spaceBeltQueues();


  // Inserters every tick. (Every 4 ticks made each arm phase wait for the next check,
  // so a 1.7s swing took 4s and an inserter moved 1 item per 4s.)
  buildTakers();
  for(const m of Object.values(G.machines)){
    if(m.type==='inserter'||m.type==='long_inserter')runInserter(m);
  }
  beltVisPass();
}

// Burner fuel use: 1 coal per this many ticks (24 = 6s). It used to be 8 (2s), the same as a
// Miner's output, so the Miner + Inserter + Burner loop the tutorial teaches always ran dry.
const BURNER_COAL_TICKS=24;
// Inserter arm state machine constants (real ms)
// ── Throughput: Satisfactory's numbers, one to one ──
// A T1 Miner makes 60 items/min, and one T1 inserter and one T1 belt carry exactly that.
//   Miner, Oil Pump        60 · 120 · 240 /min   (Satisfactory Miner Mk1-3 on a normal node)
//   Belt, Splitter, Tunnel 60 · 120 · 270 /min   (Conveyor Belt Mk1-3)
//   Inserter, Long Inserter 60 · 120 · 270 /min  (matched to the belt of the same tier)
// Coal Generators burn 15 coal/min, as in Satisfactory. Perks and modules add on top.
const INS_GRAB_MS   = 460;   // grab + deposit + return = 1s: 60 items/min at T1
const INS_DEPOSIT_MS= 80;
const INS_RETURN_MS = 460;
const INS_TIER_SPEED={1:1,2:2,3:4.5};
const MINE_TICKS=4;          // a T1 Miner or Oil Pump makes 1 item per 4 ticks (60/min)
const MINER_TIER_SPEED={1:1,2:2,3:4};
// Furnaces, smelters, assemblers and labs speed up by tier the same way: a T2 machine does the work of two T1s.
// Recipe times are whole seconds picked so every input and output is a clean rate (a Stone Furnace takes 30 ore/min,
// so one T1 Miner feeds two; an Electric Smelter takes 120 and puts out exactly one T1 belt of plates)
const MACHINE_TIER_SPEED=MINER_TIER_SPEED;
// Belts hold BELT_CAP items per tile, at least BELT_GAP apart, so a belt carries speed / gap items per tick
// with no rounding to whole ticks: T1 moves 0.5 tiles/s × 2 per tile = 1 item/s.
const BELT_CAP=2, BELT_GAP=1/BELT_CAP;
const BELT_T1_SPEED=.125;    // tiles per tick
const BELT_TIER_SPEED={1:1,2:2,3:4.5};
const BELT_TIER_COL={1:'#f5a623',2:'#e53935',3:'#42a5f5'};
function beltBaseSpeed(){return BELT_T1_SPEED*perkMult().belt;} // tiles per tick
// Room for an item entering a belt tile at progress p: under the cap, and nothing within a gap ahead of it
// Tiles that carry items: inserters take from and drop onto all of them (a drop onto a splitter used to land in
// its unused input buffer and vanish)
const beltLike=t=>t==='belt'||t==='tunnel'||t==='splitter';
function beltRoom(tile,p=0){return tile.items.length<BELT_CAP&&tile.items.every(i=>i.prog>=p+BELT_GAP-1e-6);}
// Where an inserter can drop onto a belt tile: the start if it's clear, otherwise into the gap behind or ahead of the
// item already there (-1 if none). Dropping only at the start made a belt fed from the side top out at 240 on T3
function beltDropPos(tile){
  if(tile.items.length>=BELT_CAP)return -1;
  const ps=tile.items.map(i=>i.prog);
  const fits=p=>p>=0&&p<=.99&&ps.every(q=>Math.abs(q-p)>=BELT_GAP-1e-6);
  if(fits(0))return 0;
  for(const q of ps){if(fits(q-BELT_GAP))return q-BELT_GAP; if(fits(q+BELT_GAP))return q+BELT_GAP;}
  return -1;
}
function beltTierMult(m){return BELT_TIER_SPEED[m?.tier||1]||1;}
function insMs(ms,m){return ms/(G?.devTickSpeed||1)/(m?INS_TIER_SPEED[m.tier||1]||1:1);}

// ── Shared outputs ──
// Several inserters on one machine's output side (or one chest) take turns: each item goes to the ready
// inserter that was served longest ago. Without this the first inserter in update order took every item
// whenever the machine was slower than an arm swing, and the others got nothing.
let INS_TAKERS={};
function insSource(m){ // the chest or machine output this inserter takes from, or null (belts don't count)
  const[dvx,dvy]=D_VEC[m.dir], r=m.type==='long_inserter'?2:1, t=G.map[m.y-dvy*r]?.[m.x-dvx*r];
  if(!t||t.mid===null)return null;
  const sm=G.machines[t.mid]; if(!sm||beltLike(sm.type)||sm.type==='inserter'||sm.type==='long_inserter')return null;
  return sm.type==='chest'||isOutputFacing(sm,-dvx,-dvy)?sm:null;
}
function buildTakers(){
  INS_TAKERS={};
  for(const m of Object.values(G.machines)){
    if(m.type!=='inserter'&&m.type!=='long_inserter')continue;
    const sm=insSource(m); if(sm){const k=takerKey(m,sm);(INS_TAKERS[k]||(INS_TAKERS[k]=[])).push(m.id);}
  }
}
function insReady(m){ // idle, with somewhere to put an item (the same gate the idle step uses)
  if(m._arm&&m._arm.state!=='idle')return false;
  const[dvx,dvy]=D_VEC[m.dir], r=m.type==='long_inserter'?2:1, dst=G.map[m.y+dvy*r]?.[m.x+dvx*r];
  if(!dst||dst.mid===null)return false;
  const dm=G.machines[dst.mid]; if(!dm||MDEFS[dm.type]?.noItems)return false;
  if(!beltLike(dm.type)&&dm.type!=='inserter'&&isOutputFacing(dm,dvx,dvy))return false;
  return true; // a belt drop waits at the belt (claw shows blocked), so the arm keeps its 1s rhythm
}
function myTurn(m,sm){
  const ids=INS_TAKERS[takerKey(m,sm)]; if(!ids||ids.length<2)return true;
  const served=sm._served||{}; let best=null,bestN=Infinity;
  for(const id of ids){
    const t=G.machines[id]; if(!t||(id!==m.id&&!insReady(t)))continue;
    const n=served[id]??-1; if(n<bestN||(n===bestN&&id<best)){bestN=n;best=id;}
  }
  return best===m.id;
}
function markServed(sm,m){(sm._served||(sm._served={}))[m.id]=sm._serveN=(sm._serveN||0)+1;}

// One tick can finish several phases (grab, drop, return, grab again); time left over
// from a finished phase carries into the next, so the arm keeps its real 1.7s cycle
function runInserter(m){
  if(powerRatio()===0)return;
  for(let k=0;k<10;k++){const st=m._arm?.state; stepInserter(m); if(!m._arm||m._arm.state===st)break;} // a T3 arm can finish two swings in a tick
}
function stepInserter(m){

  const[dvx,dvy]=D_VEC[m.dir];
  const reach=m.type==='long_inserter'?2:1;
  const sx=m.x-dvx*reach, sy=m.y-dvy*reach;
  const dx=m.x+dvx*reach, dy=m.y+dvy*reach;
  if(sx<0||sy<0||sx>=MAP_W||sy>=MAP_H)return;
  if(dx<0||dy<0||dx>=MAP_W||dy>=MAP_H)return;

  const src=G.map[sy][sx];
  const dst=G.map[dy][dx];
  const now=performance.now();

  if(!m._arm) m._arm={state:'idle',stateStart:now,item:null};
  const arm=m._arm;
  if(arm.stateStart>now)arm.stateStart=now; // never wait on a timestamp from another page load

  if(arm.state==='idle'){
    if(dst.mid===null)return;
    const dm=G.machines[dst.mid]; if(!dm)return;
    if(MDEFS[dm.type]?.noItems)return;
    if(!beltLike(dm.type)&&dm.type!=='chest'&&dm.type!=='inserter'&&isOutputFacing(dm,dvx,dvy))return;
    if(dm.type==='chest'&&isOutputFacing(dm,dvx,dvy))return;
    // Belts aren't checked here: the arm grabs and swings, and waits at the drop only if the belt has no room then.
    // Waiting for room before even grabbing lost most of a swing per item (a T1 chain ran at 34/min, not 60)

    let item=null;
    const acc=MDEFS[dm.type]?.accepts, want=k=>!acc||acc.includes(k);
    if(acc&&(dm.inBuf[acc[0]]||0)>=(MDEFS[dm.type].bufCap||50))return; // full: wait
    if(src.mid!==null){
      const sm=G.machines[src.mid];
      if(sm&&beltLike(sm.type)){ // belts, tunnel mouths and splitters
        // take the front item anywhere on the tile: a T3 belt moves over half a tile per tick, so waiting for an item
        // in the last tenth of the tile missed most of them and starved machines along a fast belt.
        // On a splitter it takes only items the splitter has handed to its side (not ones still coming in)
        let pool=src.items.filter(i=>want(i.id));
        if(sm.type==='splitter'){const mine=src===G.map[sm.y][sm.x]?0:1; pool=pool.filter(i=>i.side===mine);}
        if(pool.length){const it=pool.reduce((a,b)=>b.prog>a.prog?b:a);src.items.splice(src.items.indexOf(it),1);item=it.id;}
      } else if(sm&&sm.type==='chest'){
        const k=Object.keys(sm.chestInv).find(k=>sm.chestInv[k]>0&&want(k));
        if(k&&myTurn(m,sm)){item=k;sm.chestInv[k]--;markServed(sm,m);}
      } else if(sm&&sm.type!=='belt'&&sm.type!=='inserter'){
        const port=outputPortFacing(sm,-dvx,-dvy);
        if(port>=0){ // only what this arrow puts out
          const k=Object.keys(sm.outBuf).find(k=>sm.outBuf[k]>0&&portTakes(sm,port,k)&&want(k));
          if(k&&myTurn(m,sm)){item=k;sm.outBuf[k]--;markServed(sm,m);}
        }
      }
    }
    if(!item){arm.stateStart=now;return;} // waiting for an item: the next swing starts when one is there
    // An arm that just came back this tick carries its leftover time into the grab (exact 1s cycle at T1);
    // one that sat idle starts now (it used to get up to a tick of free swing)
    arm.state='grabbing'; arm.stateStart=arm.stateStart>now-insMs(TICK_MS)?arm.stateStart:now; arm.item=item;
    m.lastTransfer=G.tick;

  } else if(arm.state==='grabbing'){
    if(now-arm.stateStart>=insMs(INS_GRAB_MS,m)){arm.state='depositing';arm.stateStart+=insMs(INS_GRAB_MS,m);}

  } else if(arm.state==='depositing'){
    if(now-arm.stateStart<insMs(INS_DEPOSIT_MS,m))return;
    if(dst.mid!==null){
      const dm=G.machines[dst.mid];
      if(dm&&beltLike(dm.type)){
        const dp=beltDropPos(dst);
        if(dp>=0){dst.items.push({id:arm.item,prog:dp});arm.state='returning';arm.stateStart+=insMs(INS_DEPOSIT_MS,m);arm.item=null;m.lastTransferMs=now;}
        else{arm.state='waiting';arm.stateStart=now;}
      } else if(dm&&dm.type==='chest'){
        const total=Object.values(dm.chestInv).reduce((a,b)=>a+b,0);
        if(total<200){dm.chestInv[arm.item]=(dm.chestInv[arm.item]||0)+1;arm.state='returning';arm.stateStart+=insMs(INS_DEPOSIT_MS,m);arm.item=null;m.lastTransferMs=now;}
        else{arm.state='waiting';arm.stateStart=now;}
      } else if(dm&&dm.type!=='belt'&&dm.type!=='inserter'){
        if((dm.inBuf[arm.item]||0)<(MDEFS[dm.type].bufCap||50)){dm.inBuf[arm.item]=(dm.inBuf[arm.item]||0)+1;arm.state='returning';arm.stateStart+=insMs(INS_DEPOSIT_MS,m);arm.item=null;m.lastTransferMs=now;}
        else{arm.state='waiting';arm.stateStart=now;}
      } else {
        returnItem(src,arm.item);arm.state='returning';arm.stateStart=now;arm.item=null;
      }
    } else {
      returnItem(src,arm.item);arm.state='returning';arm.stateStart=now;arm.item=null;
    }

  } else if(arm.state==='waiting'){
    if(dst.mid!==null){
      const dm=G.machines[dst.mid]; let deposited=false;
      if(dm&&beltLike(dm.type)&&beltDropPos(dst)>=0){dst.items.push({id:arm.item,prog:beltDropPos(dst)});deposited=true;m.lastTransferMs=now;}
      else if(dm&&dm.type==='chest'){const total=Object.values(dm.chestInv).reduce((a,b)=>a+b,0);if(total<200){dm.chestInv[arm.item]=(dm.chestInv[arm.item]||0)+1;deposited=true;m.lastTransferMs=now;}}
      else if(dm&&dm.type!=='belt'&&dm.type!=='inserter'){if((dm.inBuf[arm.item]||0)<(MDEFS[dm.type].bufCap||50)){dm.inBuf[arm.item]=(dm.inBuf[arm.item]||0)+1;deposited=true;m.lastTransferMs=now;}}
      if(deposited){arm.state='returning';arm.stateStart=now;arm.item=null;}
    } else {
      returnItem(src,arm.item);arm.state='returning';arm.stateStart=now;arm.item=null;
    }

  } else if(arm.state==='returning'){
    if(now-arm.stateStart>=insMs(INS_RETURN_MS,m)){arm.state='idle';arm.stateStart+=insMs(INS_RETURN_MS,m);}
  }
}


// Returns true if the inserter is trying to deposit into the machine's output side.
// dvx,dvy = inserter direction vector (toward destination machine).
// The face being entered is the OPPOSITE: if inserter goes right (+1,0), it enters the LEFT face of the machine.
// ── Outputs straight onto belts ──
// A belt, splitter or tunnel touching a machine's output face (the side with its arrow) takes the output directly,
// one item per tile per tick when there's a gap, so inserters are only needed to feed machines (they can still take
// outputs too). A belt pointing back into the machine is skipped. Item types alternate (a Cracker makes two).
const SIDE_VEC={top:[0,-1],right:[1,0],bottom:[0,1],left:[-1,0]};
function outputTiles(m){
  const ports=PORTS[m.type]; if(!ports)return [];
  const SIDES=['top','right','bottom','left'], [w,h]=machSize(m), out=[];
  ports.outputs.forEach((p,port)=>{
    const side=SIDES[(SIDES.indexOf(p.side)+(m.dir||0))%4], [vx,vy]=SIDE_VEC[side];
    if(vx)for(let j=0;j<h;j++)out.push({x:vx>0?m.x+w:m.x-1,y:m.y+j,vx,vy,port});
    else for(let i=0;i<w;i++)out.push({x:m.x+i,y:vy>0?m.y+h:m.y-1,vx,vy,port});
  });
  return out;
}
function pushOutputsToBelts(){
  for(const m of Object.values(G.machines)){
    if(!PORTS[m.type]||beltLike(m.type))continue;
    if(!Object.keys(m.outBuf).some(k=>m.outBuf[k]>0))continue;
    for(const{x,y,vx,vy,port}of outputTiles(m)){
      const keys=Object.keys(m.outBuf).filter(k=>m.outBuf[k]>0&&portTakes(m,port,k)); if(!keys.length)continue;
      const t=G.map[y]?.[x]; if(!t||t.mid===null)continue;
      const b=G.machines[t.mid]; if(!b||!beltLike(b.type))continue;
      if(b.type==='belt'&&D_VEC[b.dir][0]===-vx&&D_VEC[b.dir][1]===-vy)continue; // points back into the machine
      const p=beltDropPos(t); if(p<0)continue;
      const k=keys[(m._outN=(m._outN||0)+1)%keys.length];
      m.outBuf[k]--; t.items.push({id:k,prog:p}); m.lastTransferMs=performance.now();
    }
  }
}
function isOutputFacing(dm,dvx,dvy){return outputPortFacing(dm,dvx,dvy)>=0;}
// Two-output recipes on a machine with two output arrows put one item out of each (outputs in recipe order:
// the Cracker's raw fuel right, plastic bottom). Otherwise every arrow carries anything. An item the current
// recipe doesn't make (left over from a recipe change) may leave by any arrow.
function portItems(m,i){
  const ports=PORTS[m.type]?.outputs||[], rec=m.recipe&&RECIPES[m.recipe], outs=rec?Object.keys(rec.out):[];
  return outs.length>1&&ports.length>=outs.length?outs[i]||null:null;
}
function portTakes(m,i,k){const want=portItems(m,i); return !want||want===k||!(k in (RECIPES[m.recipe]?.out||{}));}
// The turn group an inserter belongs to: one per chest, one per output arrow of a machine
function takerKey(m,sm){
  if(sm.type==='chest')return sm.id;
  const[dvx,dvy]=D_VEC[m.dir]; return sm.id+':'+outputPortFacing(sm,-dvx,-dvy);
}
function outputPortFacing(dm,dvx,dvy){ // which output arrow of dm an inserter moving (dvx,dvy) into it would face, or -1
  const ports=PORTS[dm.type]; if(!ports||!ports.outputs.length)return -1;
  const SIDES=['top','right','bottom','left'];
  const rot=dm.dir||0;
  // Entry face = side of the machine the inserter is entering from
  // Inserter moves right (+1,0) → enters the LEFT face of destination
  let entryFace;
  if(dvx===1  &&dvy===0) entryFace='left';
  if(dvx===-1 &&dvy===0) entryFace='right';
  if(dvx===0  &&dvy===1) entryFace='top';
  if(dvx===0  &&dvy===-1)entryFace='bottom';
  for(let i=0;i<ports.outputs.length;i++){
    const rSide=SIDES[(SIDES.indexOf(ports.outputs[i].side)+rot)%4];
    if(rSide===entryFace)return i;
  }
  return -1;
}

// Delete the now-unused side-checking helpers
function isOutputSide(){ return true; }
function isInputSide(){ return true; }
function sideVec(side){ return side==='right'?[1,0]:side==='left'?[-1,0]:side==='bottom'?[0,1]:[0,-1]; }
function outputTile(m,side){
  const[mw,mh]=machSize(m);
  switch(side){
    case 'right':  return [m.x+mw, m.y+Math.floor(mh/2)];
    case 'left':   return [m.x-1,  m.y+Math.floor(mh/2)];
    case 'bottom': return [m.x+Math.floor(mw/2), m.y+mh];
    case 'top':    return [m.x+Math.floor(mw/2), m.y-1];
  }
}
function inputTile(m,side){ return outputTile(m,side); }

function returnItem(srcTile,item){
  if(srcTile.mid!==null){
    const sm=G.machines[srcTile.mid];
    if(sm&&sm.type==='belt')srcTile.items.unshift({id:item,prog:.9});
    else if(sm&&sm.type==='chest')sm.chestInv[item]=(sm.chestInv[item]||0)+1;
    else G.inv[item]=(G.inv[item]||0)+1;
  } else {
    G.inv[item]=(G.inv[item]||0)+1;
  }
}

const HUD_ITEMS=['iron_ore','iron_plate','copper_plate','iron_gear','circuit','sci_red','coal'];

// Rewrite an element only when its markup changed (the UI refreshes 4-5×/s;
// identical rewrites cost layout and battery, and reset scroll and focus)
function setHtml(el,html){
  if(!el)return;
  html=pixEmoji(html);
  if(el._html===html&&el.firstChild===el._first)return;
  el.innerHTML=html; el._html=html; el._first=el.firstChild;
}
// Cost as icon + have/need chips (green enough, red short); a machine already built in
// CRAFT shows READY instead, since placing it uses that first
function costChips(cost,type){
  if(type&&(G.crafted[type]||0)>0)return `<span class="cc ok">✓ ${G.crafted[type]} READY</span>`;
  const e=Object.entries(cost||{});
  if(!e.length)return `<span class="cc ok">FREE</span>`;
  return e.map(([k,n])=>{const h=G.inv[k]||0;return `<span class="cc ${h>=n?'ok':'bad'}">${iconHtml(k)}${fmt(h)}/${n}</span>`;}).join('');
}
// Resource strip under the top bar: everything you hold, so plates and gears are always in view.
// Items the selected build needs are outlined (red when short). Tap → inventory.
const STRIP_CATS=new Set(['raw','smelted','processed','parts','science']);
function updateInvStrip(){
  const el=document.getElementById('invStrip'); if(!el||!G)return;
  const need=MDEFS[activeTool]&&!(G.crafted[activeTool]>0)?MDEFS[activeTool].cost:{};
  const zc=zoneDef().partsCat;
  const ids=Object.keys(ITEMS).filter(id=>(G.inv[id]||0)>0&&(STRIP_CATS.has(ITEMS[id].cat)||ITEMS[id].cat===zc)||need[id]);
  const html=ids.length?ids.map(id=>{
    const h=G.inv[id]||0, n=need[id];
    return `<span class="is-chip${n?(h>=n?' need':' short'):''}">${iconHtml(id)}<b>${fmt(h)}</b></span>`;}).join('')
    :`<span class="is-empty">Inventory empty. Tap an ore tile to mine.</span>`;
  setHtml(el,html);
}
function updateHUD(){
  const el=document.getElementById('hudRes');
  const free=G.power.out-G.power.in;
  const hasConsumers=G.power.in>0;
  const pwrLabel=hasConsumers?(free>=0?`+${fmtKW(free)}`:`-${fmtKW(-free)}`):fmtKW(G.power.out);
  let html=`<div class="hres hres-tap" onclick="togglePanel('power')" role="button" aria-label="Power details"><span class="hres-icon">${uiIcon('power')}</span><span class="hres-val" style="color:${pwrCol()}">${pwrLabel}</span></div>`;
  html+=hudHazardsHtml();
  setHtml(el,html);
  updateInvStrip();
}

// Zone hazard gauges shown next to power in the HUD
function hudHazardsHtml(){
  let html='';
  const gauge=(icon,val,col,tap)=>`<div class="hres${tap?' hres-tap':''}" style="margin-left:4px"${tap?` onclick="${tap}" role="button" aria-label="Smog details"`:''}><span class="hres-icon">${UI_ART[icon]?uiIcon(icon):icon}</span><span class="hres-val" style="color:${col}">${val}</span></div>`;
  if(zoneHas('smog')){
    const smog=Math.round(G.smog||0);
    html+=gauge('smog',`${smog}%`,smog>70?'var(--red)':smog>40?'var(--amber)':'var(--teal)',"togglePanel('smog')");
  }
  if(zoneHas('pressure')){
    const n=worstNet();
    if(n){const pr=Math.round(pressureOf(n));html+=gauge('pressure',`${pr}%`,n.strain>0?'var(--red)':pr>=RELIEF_AT?'var(--amber)':'var(--teal)');}
  }
  if(zoneHas('decay')){
    const living=Object.values(G.machines).filter(m=>MDEFS[m.type]?.living);
    const sick=living.filter(m=>m.withered||(m.vit||0)<25).length;
    if(living.length)html+=gauge(sick?'wilt':'sprout',sick?`${sick}`:`${living.length}`,sick?'var(--red)':'var(--green)');
  }
  if(zoneHas('heat')){
    const reactors=Object.values(G.machines).filter(m=>m.type==='reactor');
    if(reactors.length){
      const hot=Math.round(Math.max(...reactors.map(m=>m.heat||0)));
      const scram=reactors.some(m=>m.scram>0);
      html+=gauge('heat',scram?'SCRAM':`${hot}%`,scram||hot>80?'var(--red)':hot>50?'var(--amber)':'var(--teal)');
    }
  }
  if(zoneHas('glow')){
    const secs=glowSecsLeft();
    html+=gauge(glowBright()?'sun':'moon',`${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`,glowBright()?'var(--amber)':'var(--text3)');
  }
  return html;
}

function pwrCol(){
  if(G.power.in===0)return'var(--green)'; // no consumers, all good
  const free=G.power.out-G.power.in;
  if(free<0)return'var(--red)';
  if(free<G.power.in*.2)return'var(--amber)'; // less than 20% headroom
  return'var(--green)';
}
function fmtKW(n){return n>=1000?`${(n/1000).toFixed(1)}MW`:`${Math.floor(n)}kW`;}
function fmt(n){
  if(n>=1e6)return(n/1e6).toFixed(1)+'M';
  if(n>=1000)return(n/1000).toFixed(1)+'k';
  return Math.floor(n)+'';
}

// Tabs that open a panel instead of the drawer
const TAB_PANELS={craft:'craft',research:'research',goal:'rocket'};
const EDIT_TOOLS=new Set(['multisel','upgrade','demolish','rotate','move','blueprint']);
function switchTab(tab){
  closeResInfo(); // any tab or menu closes the manual mining popup
  // Closing EDIT (or leaving it for another tab) drops back to Select, cancelling a half-done move or selection
  if(activeTab==='tools'&&EDIT_TOOLS.has(activeTool))setTool('select');
  const drawer=document.getElementById('tabDrawer');
  if(activeTab===tab){
    // Toggle off, close drawer, clear active tab
    activeTab=null;
    drawer.classList.remove('open');
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    if(TAB_PANELS[tab]) closePanel(TAB_PANELS[tab]);
    return;
  }
  // Close any panel the previous tab opened
  if(TAB_PANELS[activeTab]) closePanel(TAB_PANELS[activeTab]);
  activeTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab)?.classList.add('active');
  if(TAB_PANELS[tab]){
    drawer.classList.remove('open');
    if(openPanel!==TAB_PANELS[tab])togglePanel(TAB_PANELS[tab]);
    activeTab=tab; document.getElementById('tab-'+tab)?.classList.add('active');
  } else {
    if(openPanel)closePanel(openPanel);
    drawer.classList.add('open');
    buildDrawer();
  }
}

// The drawer groups for this zone: zone-only machines show in their zones, empty groups are hidden
function drawerCats(tab){
  return (DRAWER_DEFS[tab]||[]).filter(c=>(!c.zones||c.zones.includes(G.zone))&&(!c.unlock||G.research.done.includes(c.unlock)))
    .map(c=>({...c,items:c.items.filter(i=>!i.zones||i.zones.includes(G.zone))})).filter(c=>c.items.length);
}
function buildDrawer(){
  const tab=activeTab;
  if(tab!=='build'&&tab!=='tools') return;
  let cats=drawerCats(tab);
  const catIdx=activeDrawerCat[tab]||0;
  const safeCatIdx=Math.min(catIdx,cats.length-1);

  // Render category sub-tabs
  const catsEl=document.getElementById('drawerCats');
  if(catsEl){
    const catsHtml=cats.map((c,i)=>`<button class="dcat-btn${i===safeCatIdx?' active':''}" onclick="setDrawerCat(${i})">${c.label}</button>`).join('');
    if(catsEl._html===catsHtml&&catsEl.querySelector('.dcat-btn'))return buildDrawerItems(cats,safeCatIdx);
    catsEl.innerHTML=catsHtml; catsEl._html=catsHtml;
    // keep the selected group in view (Zone 5 has eleven, more than fit across a phone)
    const act=catsEl.querySelector('.dcat-btn.active');
    if(act){const l=act.offsetLeft, r=l+act.offsetWidth; if(l<catsEl.scrollLeft)catsEl.scrollLeft=l-8; else if(r>catsEl.scrollLeft+catsEl.clientWidth)catsEl.scrollLeft=r-catsEl.clientWidth+8;}
    // One-time hint: pulse the second category tab to show it's tappable
    if(!localStorage.getItem('ebi_drawerHintSeen')&&cats.length>1){
      const hint=document.createElement('span');
      hint.id='drawerHintArrow';
      hint.textContent='←';
      hint.style.cssText='font-size:var(--f9);color:var(--amber);padding:0 4px;animation:blink 1s infinite;flex-shrink:0;align-self:center;pointer-events:none';
      catsEl.appendChild(hint);
    }
  }

  buildDrawerItems(cats,safeCatIdx);
}
// Item cards; only touched when their markup changes
function buildDrawerItems(cats,safeCatIdx){
  const itemsEl=document.getElementById('drawerItems');
  if(!itemsEl) return;
  const cat=cats[safeCatIdx];
  if(!cat){itemsEl.innerHTML='';itemsEl._html='';return;}
  const html=cat.items.map(item=>{
    const def=MDEFS[item.id];
    const locked=def?.unlock&&!G.research.done.includes(def.unlock)&&!def.stub;
    const unaffordable=!locked&&def&&Object.keys(def.cost).length>0&&
      !Object.entries(def.cost).every(([k,v])=>(G.inv[k]||0)>=v);
    const sel=activeTool===item.id?'sel':'';
    const lk=locked?'locked':'';
    const ua=unaffordable&&!locked&&!def?.stub?'unaffordable':'';
    const sub=!def?'':locked?`<span class="dc lock">🔒 ${TECHS[def.unlock]?.name||''}</span>`
      :`<span class="dc">${costChips(def.cost,item.id)}</span>`;
    if(item.action){ // one-tap actions (Undo) rather than tools
      const n=item.id==='undo'?undoStack.length:1;
      return `<div class="ditem${n?'':' off'}" onclick="${item.action}">
      <span class="di">${uiIcon(item.id)}</span>
      <span class="dn">${item.name}</span><span class="dc">${n?`${n} step${n>1?'s':''}`:'nothing yet'}</span>
    </div>`;
    }
    return `<div class="ditem ${sel} ${lk} ${ua}" onclick="setTool('${item.id}')">
      <span class="di">${UI_ART[item.id]&&!MDEFS[item.id]?uiIcon(item.id):iconHtml(item.id,item.icon)}</span>
      <span class="dn">${item.name}</span>${sub}

  }).join('');
  if(itemsEl._html!==html){itemsEl.innerHTML=html;itemsEl._html=html;}
}

function updateBuildHUD(){

    activeTool='blueprint';
    if(blueprintState.mode!=='holding') blueprintState={mode:'idle',x1:0,y1:0,x2:0,y2:0,data:[]};
    closeResInfo(); buildDrawer(); updateSelectBtn(); updateBuildHUD(); return;
  }
  // Switching away from move tool, restore any held machine
  if(activeTool==='move'&&moveState.active){
    const m=G.machines[moveState.machineId];
    if(m){
      const[mw,mh]=machSize(m);
      m.x=moveState.origX; m.y=moveState.origY;
      for(let dy=0;dy<mh;dy++)for(let dx=0;dx<mw;dx++)
        G.map[moveState.origY+dy][moveState.origX+dx].mid=m.id;
    }
    moveState={active:false,machineId:null,origX:0,origY:0};
  }
  const def=MDEFS[id];
  if(def?.stub){toast('[FUTURE] Not yet active in Zone 1','wrn');return;}
  if(def?.unlock&&!G.research.done.includes(def.unlock)){
    toast(`Requires: ${TECHS[def.unlock]?.name||def.unlock}`,'wrn'); sfx('error'); return;
  }
  activeTool=id; buildInfoOpen=false; closeResInfo(); buildDrawer(); updateToolTip(); updateSelectBtn(); updateBuildHUD();
  if(id==='upgrade'){upgState={mode:'idle',x1:0,y1:0,x2:0,y2:0,ids:[],off:new Set()};updateUpgradeBar();}
  if(def&&canvas){const ts=TILE*G.cam.zoom;hov={x:Math.floor((G.cam.x+canvas.clientWidth/2)/ts),y:Math.floor((G.cam.y+canvas.clientHeight*.45)/ts)};}
}

    <div class="tt-head">
